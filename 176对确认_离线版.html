. In the  accompanying article, Rotem et al. (Am J Epidemiol. 2018;187(4):656-663) describe  how they conducted a comprehensive analysis focusing on the shared risk of ASD  with hypospadias or cryptorchidism, using existing data from a large Israeli  health services system, which afforded several advantages because of the large  sample size and low attrition of the patient population. The authors conducted a  careful analysis, including sensitivity analyses, to account for risk factor and  case misclassifications that might have occurred had they relied solely on  preexisting diagnostic codes to define exposures and outcome. They observed  positive associations between both hypospadias and cryptorchidism and ASD that  were independent of numerous sociodemographic and pregnancy health factors. This  study advances our understanding of ASD etiology and illustrates how existing  data might be used to assess some ASD risk factors.","doi":"10.1093/aje/kwx369","pmid":"","date":"2018","journal":"American Journal of Epidemiology","authors":"Schieve Laura A.; Shapira Stuart K.","item_type":"journalArticle","volume":"187","issue":"4","pages":"664-667","issn":"0002-9262","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGM1NmM5ODNlMWQ1NWIxNTkyNWVmNTZmMGJiMTg2NzY4GghyYjZ4MmE0YQ%3D%3D"},"C35G9QGF":{"key":"C35G9QGF","record_id":"R-C35G9QGF","title":"Can Grafted Tubularized Incised Plate Urethroplasty be Used to Repair Narrow Urethral Plate Hypospadias? Its Functional Evaluation Using Uroflowmetry.","abstract":"Using uroflowmetry, the aim of this study is to determine the functional results of the grafted tubularized incised plate (GTIP) urethroplasty used to repair poor urethral plate hypospadias.Seventy-one patients (mean age: 5.7 years, follow-up: 1-5.5 years) were selected from those who underwent surgery using the GTIP technique from 2013 to 2015 at our institution.Patients included were able to void voluntarily and had no fistula. The flow pattern, maximum urinary flow rate (Q\u003csub>max\u003c/sub>), voided volume (vv), average flow rate, and voiding time were measured. The results were expressed as percentiles and interpreted according to Siroky nomogram. The Q\u003csub>max\u003c/sub> was considered normal if >25\u003csup>th\u003c/sup> percentile, as equivocally obstructed when in the 5\u003csup>th\u003c/sup>-25\u003csup>th\u003c/sup> percentile, and obstructed if th\u003c/sup> percentile.Hypospadias was distal in 45, mid penile in 17 and proximal penile in 9. The uroflow curve was bell-shaped in 24 (30%), interrupted in 9 (14%), slightly flattened in 31 (46%), and a plateau in 7 (10%). Flow rate nomograms revealed that 49 (68%) were above the 25\u003csup>th\u003c/sup> percentile, 9 (17%) were below the 5\u003csup>th\u003c/sup> percentile, and 13 (15%) were between these ranges. Eleven patients showed improvement in the flow curve and maximum urinary flow rate (Q\u003csub>max\u003c/sub>) in follow-up uroflowmetry.GTIP repair provides satisfactory functional results. A long-term follow-up is needed to confirm these results.","doi":"10.4103/jiaps.JIAPS_151_18","pmid":"","date":"2019","journal":"Journal of Indian Association of Pediatric Surgeons","authors":"Pradyumna Pan","item_type":"journalArticle","volume":"24","issue":"4","pages":"247-251","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISFlB1Ym1lZDIwMjAxMDIwMzgzNjkzNTgaCHJiNngyYTRh"},"C3V54IDR":{"key":"C3V54IDR","record_id":"R-C3V54IDR","title":"Human exposure to endocrine-disrupting chemicals and prenatal risk factors for cryptorchidism and hypospadias: A nested case-control study","abstract":"BACKGROUND: Exposure to xenoestrogens during pregnancy may disturb the development and function of male sexual organs.\n   OBJECTIVE: In this study we aimed to determine whether the combined effect of environmental estrogens measured as total effective xenoestrogen burden (TEXB) is a risk factor for male urogenital malformations.\n   METHODS: In a case-control study, nested in a mother-child cohort (n = 702) established at Granada University Hospital, we compared 50 newborns with diagnosis of cryptorchidism and/or hypospadias with 114 boys without malformations matched by gestational age, date of birth, and parity. Controls did not differ from the total cohort in confounding variables. TEXB and levels of 16 organochlorine pesticides were measured in placenta tissues. Characteristics of parents, pregnancy, and birth were gathered by questionnaire. We used conditional and unconditional regression models to estimate odds ratios (ORs) and 95% confidence intervals (CIs).\n   RESULTS: TEXB from organohalogenated compounds was detectable in 72% and 54% of case and control placentas, respectively. Compared with controls, cases had ail OR for detectable versus non-detectable TEXB of 2.82 (95% CI, 1.10-7.24). More pesticides were detected in cases than in controls (9-34 +/- 3.19 vs. 6.97 +/- 3.93). ORs for cases with detectable levels of pesticides, after adjusting for potential confounders in the conditional regression analysis, were o,p'-DDT (OR = 2.25; 95% CI, 1.03-4.89), p,p'-DDT (OR = 2.63; 95% CI, 1.21-5.72), lindane (OR = 3.38; 95% CI, 1.36-8.38), mirex (OR = 2.85; 95% CI, 1.22-6.66), and endosulfan alpha (OR = 2.19; 95% CI, 0.99-4.82). Engagement of mothers in agriculture (OR = 3.47; 95% CI, 1.33-9.03), fathers' occupational exposure to xenoestrogens (OR = 2.98; 95% CI, 1.11-8.01), and history of previous stillbirths (OR = 4.20; 95% CI, 1.11-16.66) were also associated with risk of malformations.\n   CONCLUSIONS; We found an increased risk for male urogenital malformations related to the combined effect of environmental estrogens in placenta.","doi":"10.1289/ehp.9351","pmid":"","date":"2007","journal":"Environmental Health Perspectives","authors":"Fernandez M.F.; Olmos B.; Granada A.; López-Espinosa M.J.; Molina-Molina J.; Fernandez J.M.; Cruz M.; Olea-Serrano F.; Olea N.","item_type":"journalArticle","volume":"115","issue":"SUPPL1","pages":"8-14","issn":"15529924 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/40349091790?origin=resultslist"},"C4D39PIG":{"key":"C4D39PIG","record_id":"R-C4D39PIG","title":"Associations of TGFBR1 and TGFBR2 gene polymorphisms with the risk of hypospadias: a case-control study in a Chinese population.","abstract":"This case–control study investigated the association of transforming growth factor-β (TGF-β) receptor type I and II (TGFBR1 and TGFBR2) gene polymorphisms with the risk of hypospadias in a Chinese population. One hundred and sixty two patients suffering from hypospadias were enrolled as case group and 165 children who underwent circumcision were recruited as control group. Single nucleotide polymorphisms (SNPs) in TGFBR1 and TGFBR2 genes were selected on the basis of genetic data obtained from HapMap. PCR-restriction fragment length polymorphism (PCR-RFLP) was performed to identify TGFBR1 and TGFBR2 gene polymorphisms and analyze genotype distribution and allele frequency. Logistic regression analysis was conducted to estimate the risk factors for hypospadias. No significant difference was found concerning the genotype and allele frequencies of TGFBR1 rs4743325 polymorphism between the case and control groups. However, genotype and allele frequencies of TGFBR2 rs6785358 in the case group were significantly different in contrast with those in the control group. Patients carrying the G allele of TGFBR2 rs6785358 polymorphism exhibited a higher risk of hypospadias compared with the patients carrying the A allele (P\u003c0.05). The TGFBR2 rs6785358 genotype was found to be significantly related to abnormal pregnancy and preterm birth (both P\u003c0.05). The frequency of TGFBR2 rs6785358 GG genotype exhibited significant differences amongst patients suffering from four different pathological types of hypospadias. Logistic regression analysis revealed that preterm birth, abnormal pregnancy, and TGFBR2 rs6785358 were the independent risk factors for hypospadias. Our study provides evidence that TGFBR2 rs6785358 polymorphism might be associated with the risk of hypospadias. © 2017 The Author(s).","doi":"10.1042/BSR20170713","pmid":"28894026","date":"2017 Oct 31","journal":"Bioscience reports","authors":"Han Xin-Rui; Wen Xin; Wang Shan; Hong Xiao-Wu; Fan Shao-Hua; Zhuang Juan; Wang Yong-Jian; Zhang Zi-Feng; Li Meng-Qiu; Hu Bin; Shan Qun; Sun Chun-Hui; Bao Ya-Xing; Lin Meng; He Tan; Wu Dong-Mei; Lu Jun; Zheng Yuan-Lin","item_type":"journalArticle","volume":"37","issue":"5","pages":"BSR20170713","issn":"1573-4935 0144-8463","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISGlB1Ym1lZDIwMTcyMDE4MDEwMjAwMTEwNTgzGghyYjZ4MmE0YQ%3D%3D"},"C57M26Y4":{"key":"C57M26Y4","record_id":"R-C57M26Y4","title":"尿道板纵切卷管尿道成形术后阴茎头裂开的相关危险因素分析","abstract":"目的 探讨影响尿道下裂行尿道板纵切卷管尿道成形术(T IP)术后阴茎头裂开的相关危险因素.方法 收集2017年11月至2018年9月77例行T IP术式的尿道下裂患儿的临床资料,均为初次接受手术治疗.术后随访6～15个月,统计阴茎头裂开的发生率,分析阴茎头裂开的发生与患儿年龄、阴茎头直径、尿道板宽度、修复尿道长度、是否行背侧白膜折叠、成形后冠状沟至尿道外口距离、尿管型号的关系.结果 77例T IP术后患儿共出现阴茎头裂开10例(13.0％).统计学分析显示阴茎头裂开的发生与阴茎头直径、成形后冠状沟至尿道外口距离、尿管型号显著相关(均P\u003c0.05).结论 阴茎头裂开是T IP尿道成形术后的主要并发症,处理具有一定难度,阴茎头直径、成形后冠状沟至尿道外口距离、尿管型号是影响阴茎头裂开发生的危险因素.因此T IP术中成形阴茎头时除了要注意充分游离阴茎头翼瓣,还要注意成形的冠口距大于4.5 mm更安全,留置6Fr尿管也能有效减少阴茎头裂开的发生.","doi":"10.3760/cma.j.issn.0253-3006.2019.11.002","pmid":"","date":"2019","journal":"中华小儿外科杂志","authors":"刘伟; 武翔宇; 王晓庆; 吴荣德","item_type":"journalArticle","volume":"40","issue":"11","pages":"963-966","issn":"0253-3006","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORINeHJ3azIwMTkxMTAwMhoIcmI2eDJhNGE%3D"},"C67K9J3P":{"key":"C67K9J3P","record_id":"R-C67K9J3P","title":"Testicular dysgenesis syndrome and the development and occurrence of male reproductive disorders.","abstract":"Patients with 45,X0/46XY karyotype often present with intersex phenotype and testicular dysgenesis. These patients may also have undescended testes  (cryptorchidism), hypospadias and their spermatogenesis is severely disrupted.  They have a high risk for testicular cancer. These patients have the most severe  form of testicular dysgenesis syndrome (TDS). We have hypothesized that  testicular cancer, cryptorchidism, hypospadias and poor spermatogenesis are all  signs of a developmental disturbance that was named as testicular dysgenesis  syndrome. The hypothesis is based on clinical and epidemiological findings and on  biological and experimental evidence. Signs of TDS share several risk factors,  such as small birth weight (particularly being small for gestational age), and  they are risk factors for each other. All of them have background in fetal  development. They show strong epidemiological links so that countries with high  incidence of testicular cancer, such as Denmark, tend to also have high  prevalence rates of cryptorchidism and hypospadias and poor semen quality. Vice  versa, in countries with good male reproductive health, e.g., in Finland, all  these aspects are better than in Denmark. Although genetic abnormalities can  cause these disorders, in the majority of cases, the reasons remain unclear.  Adverse trends in the incidence of male reproductive disorders suggest that  environmental and life style factors contribute to the problem. Endocrine  disrupters are considered as prime candidates for environmental influence. Fetal  exposure to high doses of dibutyl phthalate was shown to cause a TDS-like  phenotype in the rats. Studies are underway to assess whether there is any  exposure-outcome relation with selected chemicals (persistent organic pollutants,  pesticides, phthalates) and cryptorchidism.","doi":"10.1016/j.taap.2005.01.058","pmid":"16005920","date":"2005 Sep 1","journal":"Toxicology and applied pharmacology","authors":"Virtanen H. E.; Rajpert-De Meyts E.; Main K. M.; Skakkebaek N. E.; Toppari J.","item_type":"journalArticle","volume":"207","issue":"2 Suppl","pages":"501-505","issn":"1096-0333 0041-008X","isbn":"","url":""},"C6AS7JZW":{"key":"C6AS7JZW","record_id":"R-C6AS7JZW","title":"Increasing Prevalence of Hypospadias Associated With Various Perinatal Risk Factors in Chinese Newborns COMMENT","abstract":"","doi":"10.1016/j.urology.2009.02.020","pmid":"","date":"2009 JUN","journal":"UROLOGY","authors":"Carr MC","item_type":"journalArticle","volume":"73","issue":"6","pages":"1245-1245","issn":"0090-4295 1527-9995","isbn":"","url":""},"C9BF4WR8":{"key":"C9BF4WR8","record_id":"R-C9BF4WR8","title":"Association of reproductive disorders and male congenital anomalies with environmental exposure to endocrine active pesticides","abstract":"Highlights ? Data on environmental exposure to pesticides and gestational disorders are scarce. ? A population-based case–control study estimated the risk of maternal-infant disorders. ? Prevalence and risk of reproductive disorders and congenital anomalies were estimated. ? Higher prevalences and risk were observed in areas of high exposure to pesticides. ? Environmental pesticides can be risk factors for developing maternal-infant disorders. Abstract There is growing evidence that environmental exposure to pesticides may increase the risk of developing reproductive and developmental disorders. This study determined the prevalence and risk of developing gestational disorders and male congenital genitourinary malformations in areas with distinct exposure to pesticides, many of them with potential endocrine disrupting properties. A population-based case–control study was carried out on pregnant women and male children living in ten health districts of Andalusia classified as areas of high and low environmental exposure to pesticides according to agronomic criteria. The study population included 45,050 cases and 950,620 controls matched for age and health district. Data were collected from computerized hospital records between 1998 and 2005. Prevalence rates and risk of miscarriage, low birth weight, hypospadias, cryptorchidism and micropenis were significantly greater in areas with higher use of pesticides in relation to those with lower use, thus supporting and extending previous information. ]]>","doi":"10.1016/j.reprotox.2017.04.011","pmid":"","date":"2017","journal":"Reproductive toxicology","authors":"Jessica García; María I. Ventura; Mar Requena; Antonio F. Hernández; Tesifón Parrón; Raquel Alarcón","item_type":"journalArticle","volume":"71","issue":"","pages":"95-100","issn":"0890-6238","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDVjYTZlNTI2Mzg4NDUzYjUxN2I4Y2JkODZlMzU5YmIxGghyYjZ4MmE0YQ%3D%3D"},"C9DFJNQ6":{"key":"C9DFJNQ6","record_id":"R-C9DFJNQ6","title":"IDENTIFYING RISK FACTORS FOR MULTIPLE RE-DO REPAIRS IN HYPOSPADIAS PATIENTS WITH COMPLICATION: A SINGLE INSTITUTION REVIEW OF 806 PATIENTS","abstract":"INTRODUCTION AND OBJECTIVE: Despite surgeons best efforts complications are an inevitable consequence in hypospadias surgery. We sought to review our institution's management of hypospadias complications over the last 30 years. We hypothesize that certain complications or initial repair types put patients at greater risk of having multiple reoperative surgical procedures. METHODS: We performed a retrospective review of a prospectively collected hypospadias database to identify patients that had either been referred for hypospadias complication or developed a complication after repair at our institution. We collected information on initial meatal location, initial procedure type, whether initial procedure was single or multistage, complication type, total number and number of re-do procedures. A logistic regression determined the odd ratio of having more than one re-do procedure based on the complication or initial procedure type. RESULTS: 806 patients underwent repair of hypospadias complication, mean follow-up of 6.7 years e 347 distal, 135 midshaft, 324 proximal (188 single stage repairs, 136 multistage repairs). 203 patients had their initial surgery at an outside institution, 603 were initially repaired at our institution. Phenotypic and surgical characteristics are detailed. The mean number of redo surgeries for single stage proximal repair was 1.99, multistage proximal 1.73, midshaft 1.52, and distal 1.3. On logistic regression urethral stricture was a significant risk factor for more than one re-do hypospadias surgery, odds ratio of 4.07 (p\u003c0.001) overall and 2.59, 14.22, and 4.5 respectively for proximal, midshaft and distal. Chordee and diverticulum were also significant risk factors in proximal repairs OR 1.91 p[0.007 and 1.84 p[0.014 respectively. Initial procedure type was not associated with need for >1 hypospadias repair. Single stage proximal repair had increased odds (OR 1.47) for more than one re-do surgery, however this was not significant p[0.092. CONCLUSIONS: In this large cohort of hypospadias complication repairs, urethral stricture and recurrent curvature led to a significantly higher number of reoperative surgeries. No single initial surgical repair type was associated with an increased risk for more than one corrective hypospadias surgery.","doi":"10.1097/01","pmid":"","date":"2024","journal":"Journal of Urology","authors":"Godlewski K.F.; Mittal S.; Hyacinthe N.; Fischer K.; Johnson M.; Van Batavia J.; Weiss D.; Srinivasan A.; Shukla A.; Kolon T.; Zaontz M.; Long C.","item_type":"journalArticle","volume":"211","issue":"5","pages":"e1051-e1052","issn":"0022-5347","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L644293297&from=export"},"CA3J2M7M":{"key":"CA3J2M7M","record_id":"R-CA3J2M7M","title":"Analysis of Risk Factors for Glans Dehiscence After Tubularized Incised Plate Hypospadias Repair EDITORIAL COMMENT","abstract":"","doi":"10.1016/j.juro.2010.12.110","pmid":"","date":"2011 MAY","journal":"JOURNAL OF UROLOGY","authors":"Braga LH","item_type":"journalArticle","volume":"185","issue":"5","pages":"1850-1851","issn":"0022-5347 1527-3792","isbn":"","url":""},"CABQBGFM":{"key":"CABQBGFM","record_id":"R-CABQBGFM","title":"Medium-and long-term outcomes of tunneled labial mucosa tube grafts for the repair of primary severe hypospadias and failed hypospadias","abstract":"Objective This study aimed to evaluate the medium and long-term outcomes of tunneled labial mucosa tube graft urethroplasty in the treatment of primary severe hypospadias and failed hypospadias. Methods We retrospectively reviewed the medical records of the patients who underwent tunneled labial mucosa tube graft urethroplasty at a single center between 2007 and 2020. Data collected included patient demographic, operative and post-operative characteristics. The surgical procedure was performed in two stages. Binary logistic regression model was used to identify risk factors for postoperative complication. Results A total of 82 patients who were followed for at least 12 months were included in this study. Among these, 56 patients received primary repair, while 26 had previously undergone failed reconstruction. The mean age at surgery was 5.0 years. Postoperative urinary fistula occurred in 36 patients, with 24 requiring surgical repair and 12 resolving spontaneously. Urethral stricture developed in 26 patients, with 20 undergoing surgical intervention and 6 managed with urethral dilation. Preoperative surgical history was identified as an independent risk factor for postoperative complications (p=0.015). Conclusions Although the complication rate associated with tunneled labial mucosa tube graft urethroplasty is relatively high compared with other techniques, it remains a viable option for patients with insufficient replacement materials, particularly for primary severe hypospadias. For cases of failed hypospadias repair, this procedure should be considered selectively based on patient-specific factors.  © Author(s) (or their employer(s)) 2025.","doi":"10.1136/wjps-2024-000976","pmid":"","date":"2025","journal":"世界小儿外科杂志（英文）","authors":"Hengyou Wang; Xiang Yan; Guangjie Chen; Chang Tao; Dehua Wu; Wei Ru; Daxing Tang","item_type":"journalArticle","volume":"8","issue":"1","pages":"28-32","issn":"2096-6938","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORITc2p4ZXdrenotZTIwMjUwMTAwNRoIcmI2eDJhNGE%3D"},"CAK3CTJW":{"key":"CAK3CTJW","record_id":"R-CAK3CTJW","title":"Molecular and clinical analyses of two UPD(16)mat patients detected by screening of 94 silver-russell syndrome patients without known etiology","abstract":"Background: Maternal uniparental disomy of chromosome 16 (UPD(16)mat) is defined as the presence of two homologous chromosomes 16 inherited from only the mother. To our knowledge, 49 live-born UPD(16)mat patients without chromosomal abnormalities other than that in chromosome 16 have been reported. UPD(16)mat patients presented with non-specific clinical features such as preterm birth, growth retardation, congenital heart diseases (CHDs) and hypospadias. Silver-Russell syndrome (SRS) is characterized by growth failure and dysmorphic features. Hypomethylation of the H19/IGF2:IG-differentially methylated region (DMR) at the 11p15 imprinted region (H19-hypo) and maternal uniparental disomy of chromosome 7 (UPD(7)mat) are major genetic causes of SRS. Recently, a patient with UPD(16)mat presenting SRS phenotype was reported. However, the prevalence of UPD(16)mat in SRS patients and the phenotypic difference between UPD(16)mat and SRS have been poorly documented. Methods: We studied 94 SRS patients without known etiology. Sixty-three out of 94 patients satisfied Netchine-Harbison clinical scoring system (NH-CSS) criteria (SRS-compatible) and the remaining 31 patients met three NH-CSS criteria together with triangular face, fifth finger clinodactyly and/or brachydactyly. To detect UPD(16)mat, we performed methylation analysis for the ZNF597:TSS-DMR and subsequently performed microsatellite, single-nucleotide polymorphism array and exome analyses in patients with a hypo-methylated ZNF597:TSS-DMR. Results: We identified two patients (3.2%) with a mixture of maternal iso-and heterodisomy of chromosome 16 in the SRScompatible group. Both patients exhibited preterm birth, growth failure, and mild intellectual disability. The male patient had ventricular septal defect and hypospadias. Whole exome sequencing detected no gene mutations related to their phenotypes. Discussion: Our study suggests that UPD(16)mat constitutes a rare but important underlying factor for SRS. We compared the clinical findings between patients with UPD(16)mat in the literature and this report and previously reported patients with H19-hypo or UPD(7)mat. The median of gestational ages in UPD(16) mat was earlier than in H19-hypo and UPD(7)mat. The frequent cy of SGA was significantly lower in UPD(16)mat than in both H19-hypo and UPD(7)mat, and that of CHDs was significantly higher in UPD(16)mat than in both H19-hypo and UPD(7)mat. Genetic testing of UPD(16)mat should be considered for etiologyunknown SRS cases with preterm birth and CHDs, even if they are not born SGA.","doi":"10.1159/000492307","pmid":"","date":"2018","journal":"Hormone Research in Paediatrics","authors":"Inoue T.; Yagasaki H.; Nishioka J.; Nakamura A.; Matsubara K.; Narumi S.; Nakabayashi K.; Yamazawa K.; Fuke T.; Oka A.; Ogata T.; Fukami M.; Kagami M.","item_type":"journalArticle","volume":"90","issue":"(Inoue T.; Nakamura A.; Matsubara K.; Narumi S.; Yamazawa K.; Fuke T.; Ogata T.; Fukami M.; Kagami M.) Department of Molecular Endocrinology, National Research Institute for Child Health and Development, Tokyo, Japan","pages":"122-123","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630602829&from=export"},"CAP9K87H":{"key":"CAP9K87H","record_id":"R-CAP9K87H","title":"Pollutants with androgen-disrupting potency","abstract":"In the 1980s observations of impaired fertility of animals living in aquatic ecosystems of highly industrialized regions were reported for the first time. In vivo and in vitro studies revealed that a chemical that impairs normal embryonic development and disrupts normal reproductive functions in adulthood is an \"endocrine disruptor\" (ED). First systematic data revealed that some EDs act through mimicking or antagonizing the physiological functions of estrogens. Later endocrine disrupting pathways were described which affect the signal cascade of the androgen receptor. We have learnt in the mean time that it is not always possible to attach each ED to a specific mode of action (estrogenic, anti-estrogenic, androgenic, antiandrogenic, or others). Today the ED discussion has reached man, whose genital tract possibly is affected by EDs (e.g. declining sperm counts, hypospadias, cryptorchism, testicular, and prostate cancer). The list of androgen-disrupting chemicals identified to date comprises chlorinated hydrocarbon insecticides like DDT, DDE, dieldrin, methoxychlor and lindan, fungicides currently used like vinclozolin and benomyl, and widely used herbicides like linuron, diuron and atrazin. Many EDs are industrial chemicals or pesticides of aromatic structure, but it is still not possible to predict their binding to the androgen receptor based on their chemical structure. The substances have low solubility in water and avidly bind to soils and sediments. If no degradation is possible, accumulation and long persistence in the environment is observed. Due to their lipophilic character persistent chemicals are accumulated in the adipose tissue of vertebrates. The risk evaluation of putative EDs has to regard the endocrine-disrupting activity as well as the fate in the environment (e.g. accumulation, chemical and microbial stability).","doi":"10.1002/1438-9312(200202)104:2\u003c124::AID-EJLT124>3.0.CO;2-T","pmid":"","date":"2002","journal":"European Journal of Lipid Science and Technology","authors":"Daxenberger A.","item_type":"journalArticle","volume":"104","issue":"2","pages":"124-130","issn":"14387697 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0036002236?origin=resultslist"},"CE6XK25A":{"key":"CE6XK25A","record_id":"R-CE6XK25A","title":"Reply","abstract":"","doi":"10.1016/j.urology.2009.02.019","pmid":"","date":"2009","journal":"Urology","authors":"Sun G.","item_type":"journalArticle","volume":"73","issue":"6","pages":"1246","issn":"15279995 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/65849336227?origin=resultslist"},"CFY9QPAF":{"key":"CFY9QPAF","record_id":"R-CFY9QPAF","title":"Do vaginal spermicides cause birth defects?","abstract":"Vaginal spermicides are a widely used form of contraception either alone or in combination with other techniques. H. Jick and coworkers studied the records of a health maintenance organization (HMO) in Seattle and identified 763 infants born to women who filled a prescription for spermicide within about 20 months before delivery. They also identified records of 3902 infants whose mothers had not filled such a prescription. Among infants whose mothers had a possible spermicide exposure before or during pregnancy, 17 (2.2%) had malformations, compared to 39 (1.0%) among the women with no record of spermicide purchase. The excess in malformations in the spermicide group was attributed to infants with limb deformities, neoplasms, Down syndrome, and hypospadias. The authors noted that \"the absence of a single, well defined syndrome among the infants whose mothers used spermicides raises doubt about a causal connection between these agents and the disorders noted.\" According to Dr. Howard W. Ory, several major shortcomings make the results of this study unpersuasive. Complete monitoring of congenital defects at birth usually identifies defects in 3% of children. The Jick study identified defects in 1.6% of children, suggesting that either the Seattle HMO is composed of a very select group of women or that there was substantial (50%) underascertainment of children with defects. If the \"missing\" children with defects were included in the study, the results would be impossible to predict. The 2nd major shortcoming relates to the vagueness of defining use, as opposed to purchase. No evidence is provided that the spermicides were actually used during pregnancy. The 3rd major shortcoming relates to the diversity of defects. One is asked to accept that merely filling a prescription for a topically applied detergent can result in 3 completely separate types of major congenital problems: malignancy, chromosomal errors, and defects of early embryogenesis. Based on the results of 1 study such conclusions are unwarranted.","doi":"","pmid":"","date":"1981","journal":"Pediatric alert","authors":"","item_type":"journalArticle","volume":"6","issue":"8","pages":"1","issn":"01600184 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0019882496?origin=resultslist"},"CGPUP8J2":{"key":"CGPUP8J2","record_id":"R-CGPUP8J2","title":"Low dose mixture effects of endocrine disrupters: Implications for risk assessment and epidemiology","abstract":"During the last years, a series of studies on combinations of oestrogenic, thyroid-disrupting and anti-androgenic chemicals at low doses have been published. The available experimental evidence shows that combination effects may result from endocrine disrupters that each produces very small effects, if they are present in sufficiently large numbers. This review examines the implications of these findings for chemicals risk assessment and epidemiology. It is concluded that a lack of knowledge about relevant exposure scenarios presents serious obstacles for better human risk assessment. Epidemiology needs to abandon its focus on single endocrine disrupters and has to embrace the reality of endocrine disrupter mixture effects by developing biomarkers that capture cumulative exposure to endocrine disrupters. © 2008 The Author.","doi":"10.1111/j.1365-2605.2007.00862.x","pmid":"","date":"2008","journal":"","authors":"Kortenkamp A.","item_type":"conferencePaper","volume":"31","issue":"2","pages":"233-240","issn":"","isbn":"01056263 (ISSN)","url":"https://www.scopus.com/pages/publications/40349094571?origin=resultslist"},"CKUFHP3A":{"key":"CKUFHP3A","record_id":"R-CKUFHP3A","title":"Maternal and Paternal Risk Factors for Cryptorchidism and Hypospadias: A Case--Control Study in Newborn Boys.","abstract":"Little is known on environmental risk factors for cryptorchidism and hypospadias, which are among the most frequent congenital abnormalities. The aim of our study was to identify risk factors for cryptorchidism and hypospadias, with a focus on potential endocrine disruptors in parental diet and occupation. In a case-control study nested within a cohort of 8,698 male births, we compared 78 cryptorchidism cases and 56 hypospadias cases with 313 controls. The participation rate was 85% for cases and 68% for controls. Through interviews, information was collected on pregnancy aspects and personal characteristics, lifestyle, occupation, and dietary phytoestrogen intake of both parents. Occupational exposure to potential endocrine disruptors was classified based on self-reported exposure and ratings of occupational hygienists based on job descriptions. Our findings indicate that paternal pesticide exposure was associated with cryptorchidism [odds ratio (OR) = 3.8; 95% confidence interval (95% CI), 1.1-13.4]. Smoking of the father was associated with hypospadias (OR = 3.8; 95% CI, 1.8-8.2). Maternal occupational, dietary, and lifestyle exposures were not associated with either abnormality. Both abnormalities were associated with suboptimal maternal health, a lower maternal education, and a Turkish origin of the parents. Being small for gestational age was a risk factor for hypospadias, and preterm birth was a risk factor for cryptorchidism. Because paternal pesticide exposure was significantly associated with cryptorchidism and paternal smoking was associated with hypospadias in male offspring, paternal exposure should be included in further studies on cryptorchidism and hypospadias risk factors.","doi":"","pmid":"","date":"2004","journal":"Environmental Health Perspectives","authors":"Pierik Frank H.; Burdorf Alex; Deddens James A.; Juttmann Rikard E.","item_type":"journalArticle","volume":"112","issue":"15","pages":"1570-1576","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISFUVCU0NPX0FzcDAwMDAwNTUxMzk2MBoIcmI2eDJhNGE%3D"},"CKYMTV9P":{"key":"CKYMTV9P","record_id":"R-CKYMTV9P","title":"Congenital malformations co-occurring with hypospadias in California, 1983-1997","abstract":"Investigations for co-occurring malformations can serve as a first step to discover new risk factors and provide insights into malformation etiologies. Our objective was to explore the risks of occurrence of structural congenital malformation phenotypes in 5,481 infants with hypospadias, using data from a population-based active surveillance system. Ascertainment was performed among 1,816,258 liveborn and 12,203 stillborn male offspring of women who were residents of registry counties during 1983-1997. Malformations other than hypospadias were grouped according to the 3- and 4-digit BPA malformation codes. Prevalences of each malformation grouping were calculated among all births with hypospadias and their three subgroups and all births without hypospadias but with another structural malformation. Relative risks were estimated based on the ratio of two prevalences, and the corresponding 95% confidence intervals were computed using Poisson regression models. Observed relative risks indicated that all malformation groupings were less likely to co-occur with hypospadias and their three subgroups than with other types of malformations, with relative risks ranging from 0.04 to 0.93. For most malformations, risks were relatively similar among all births with hypospadias and the three subgroups of hypospadias. The observed relative risks were not substantially changed in analyses that adjusted for maternal age, race/ethnicity, and parity. Computations were extended to 4-digit level BPA codes. Almost all observed relative risks for malformations co-occurring with hypospadias overall and three subgroups were less than 1. © 2007 Wiley-Liss, Inc.","doi":"10.1002/ajmg.a.32001","pmid":"","date":"2007","journal":"American Journal of Medical Genetics, Part A","authors":"Yang W.; Carmichael S.L.; Shaw G.M.","item_type":"journalArticle","volume":"143","issue":"22","pages":"2627-2634","issn":"15524833 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/35948972778?origin=resultslist"},"CR4DPFSX":{"key":"CR4DPFSX","record_id":"R-CR4DPFSX","title":"尿道下裂再手术后并发症的危险因素分析","abstract":"目的探讨尿道下裂再手术后并发症的危险因素。方法回顾性分析2019年12月至2021年12月上海交通大学医学院附属新华医院既往行1次及以上尿道下裂手术患儿的临床资料, 根据末次手术后是否发生并发症, 分为并发症组和无并发症组。收集两组既往手术情况、入院时症状、年龄、体重、术中所见、手术方式、手术时间、导尿管拔除时间、住院时长以及泌尿系统合并症情况, 分析末次手术后出现并发症的危险因素。结果本研究共纳入106例患儿, 按入院时症状分类:尿道瘘口93例, 尿道狭窄8例, 尿道憩室5例。末次手术后共36例出现并发症, 其中尿道瘘口28例、尿道狭窄6例、尿道憩室2例。单因素分析结果显示, 患儿年龄、手术病因(包括尿道瘘口位置)、手术次数与再手术后出现并发症有关(P0.05), 而手术类型、手术时长、是否存在其他泌尿系原发性疾病、总住院时长与再手术后出现并发症无关(P0.05);多因素Logistic回归分析结果显示, 患儿年龄偏大(OR=1.165, 95%CI:1.023～1.321)、尿道狭窄(OR=3.825, 95%CI:1.072～13.645)、根部瘘口(OR=0.411, 95%CI:0.184～0.917)、既往手术次数2次(OR=3.434, 95%CI:1.153～10.214)和既往手术次数3次及以上(OR=10.435, 95%CI:1.474～12.451)是再手术后出现并发症的独立危险因素。结论对非首次手术的尿道下裂患儿, 应根据患儿具体情况选择个体化手术方案, 确保术中更精细的手术操作, 加强术后高危患儿的护理, 以减少并发症的发生。","doi":"10.3760/cma.j.cn101785-202207006-009","pmid":"","date":"2025","journal":"临床小儿外科杂志","authors":"潘永东; 方晓亮; 徐国锋","item_type":"journalArticle","volume":"24","issue":"3","pages":"250-254","issn":"1671-6353","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRbGN4ZXdrenoyMDI1MDMwMDkaCHJiNngyYTRh"},"CWTBBC5M":{"key":"CWTBBC5M","record_id":"R-CWTBBC5M","title":"Risk factor analysis of urethral obstruction after tubularized incised plate urethroplasty for hypospadias","abstract":"Objective To explore the risk factors associated with urethral obstruction after Uibularized incised plate urethroplasty (HP) for hypospadias. Methods This was a retrospective case-control study. Clinical data of 253 children with hypospadias who underwent primary TIP surgery in the Department of Pediatric Urology, Shandong Provincial Hospital Affiliated to Shandong First Medical University between January 2019 and December 2022 were collected. The data included preoperative meatal location, glans width, urethral plate width at the glans, degree of penile curvature, length of the reconstructed urethra, size of the indwelling catheter, coro-nal-meatal distance and meatal length at follow-up, as well as postoperative voiding status and management after the occurrence of urethral obstruction. According to whether urethral obstruction occurred, patients were divided into a urethral obstruction group and a nonurethral obstruction group. Differences in clinical indicators between the two groups were compared, and univariate and multivariate logistic regression analyses were performed to identify independent risk factors for urethral obstruction. Results There were 185 cases in the non-urethral obstruction group and 68 cases in the urethral obstruction group, including 39 cases of true obstruction and 29 cases with no symptoms of voiding difficulty but a thin urinary stream. Univariate analysis showed that urethral plate width at the glans (P=0.005), degree of penile curvature after degloving (P=0.004), length of the reconstructed urethra (P\u003c0.001), as well as coronal-meatal distance (P=0.012) and meatal length at followup (P \u003c0.001) differed significantly between the two groups (P \u003c0. 05). Multivaiiable analysis showed that urethral plate width at the glans (P=0. 015), length of the reconstructed urethra (P=0. 037), and meatal length at follow-up (P \u003c0. 001) were independent risk factors for urethral obstruction after IIP surgery. Receiver operating characteristic analysis showed that the optimal cutoff values of urethral plate width at the glans, length of the reconstructed urethra, and meatal length at follow-up for predicting urethral obstruction after TIP surgery were 6.5 mm, 15.5 mm, and 3.5 mm, respectively. Conclusions Urethral plate width at the glans \u003c 6. 5 mm, length of the reconstructed urethra > 15.5 mm, and meatal length at follow-up \u003c3.5 mm are independent risk factors for urethral obstruction after TIP surgery for hypospadias. TIP should be selected with caution in patients with poorly developed urethral plates at the glans and proximal hypospadias, and attention should be paid during surgery to ensuring patency of the glanular urethra and an adequate wide urethral meatus. © 2026, Science and Technology Association of Hunan Province. All rights reserved.","doi":"10.3760/cma.j.cn101785-202509031","pmid":"","date":"2026","journal":"Journal of Clinical Pediatric Surgery","authors":"Jie L.; Yanze W.; Guoqiang D.; Rongde W.; Wei L.","item_type":"journalArticle","volume":"25","issue":"2","pages":"153-158","issn":"16716353 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/105032547885?origin=resultslist"},"D3I3LB73":{"key":"D3I3LB73","record_id":"R-D3I3LB73","title":"Analysis of Risk Factors for Complications Following Reoperation for Hypospadias","abstract":"Objective To investigate the risk factors for complications following recurrence for hypospadias. Methods A retrospective analysis was conducted on the clinical data of children who underwent reoperation for hypospadias at Xinhua Hospital Affiliated to Shanghai Jiao Tong University School of Medicine between December 2019 and December 2021. Patients were divided into two groups based on whether they experienced complications after the final surgery: the complication group and the non-complication group. Data collected previously included surgical history, symptoms at admission, age, weight, intraoperative findings, surgical method, duration of surgery, catheter removal time, length of hospital stay, and urinary system comorbidities.The risk factors for complications after the final surgery were analyzed. Results A total of 106 children were included in this study. Symptoms at admission were classified as: urethral fistula (93 cases), urethral stenosis (8 cases), and urethral diverticulum (5 cases). Complications occurred in 36 cases after the final surgery, including 28 cases of urinary fistula, 6 cases of urethral stricture, and 2 cases of urethral stricture. diverticulum.Univariate analysis indicated that age, surgical etiology (including the location of the fistula), and the number of previous surgeries were risk factors for complications after reoperation (P \u003c0.05), while surgical type, duration of surgery, presence of other primary urinary tract diseases, and total length of hospital stay were not associated with complications (P >0.05).Multivariate logistic regression analysis showed that age (OR =1.165, 95% CI: 1.023-1.321), urethral stenosis (OR =3.825, 95% CI: 1.072-13.645), root fistula (OR =0.411, 95% CI: 0.184-0.917), having undergone 2 previous surgeries (OR =3.434, 95% CI: 1.153-10.214), and having undergone 3 or more previous surgeries (OR =10.435, 95% CI: 1.474-12.451) were independent risk factors for complications following recurrence. Conclusions For children with hypospadias who are undergoing reoperation, individualized surgical plans should be chosen based on the child's specific situation, ensuring more precise surgical techniques and enhanced postoperative care for high-risk patients to reduce the incidence of complications. © 2025, Science and Technology Association of Hunan Province. All rights reserved.","doi":"10.3760/cma.j.cn101785-202207006-009","pmid":"","date":"2025","journal":"Journal of Clinical Pediatric Surgery","authors":"Pan Y.; Fang X.; Xu G.","item_type":"journalArticle","volume":"24","issue":"3","pages":"250-254","issn":"16716353 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/105033983940?origin=resultslist"},"D5KEAWDJ":{"key":"D5KEAWDJ","record_id":"R-D5KEAWDJ","title":"[Relation between some techniques of hypospadias repair and complications: Universitary San Vicente de Paul Hospital 1986-2005].","abstract":"OBJECTIVE: The incidence of hypospadias has been increasing in the last decades. Successful hypospadias repair depends on patient factors and surgical technique,  a factor closely related to the surgeon's experience. The aim of this  descriptive, retrospective study was to determine the preferred technique and its  association with postoperative complications. METHODS: Charts of 207 patients who  had had hypospadias repair performed between January 1986 and December 2005, in  the San Vicente de Paul University Hospital, were reviewed. RESULTS: Hypospadias  repair was performed in patients between 1 and 14 years of age. Duckett technique  was performed in 38.7%, Mathiew technique in 30% MAGPI technique in 11.6%,  Snodgrass in 6.3% and other techniques in 14% of the patients. Postoperative  complications included hemorrhagic complications (1.9%), infectious complications  (1.9%), urethral diverticular dilatation (3.9%), residual ventral chordee (5.8%),  failure of urethroplasty, (8.7%), strictures (23%), and fistulas (41%).  Strictures was the most important risk factor for postoperative fistulas  (p>0.05). Patients with hypospadias repair with PDS sutures had a lower incidence  of postoperative fistulas (p\u003c0.05). Tissue layer over the suture line, age of  patient, and number of days with urethral stent was not related to the presence  of postoperative complications. CONCLUSION: The importance of known and accepted  protective factors in hypospadias repair, like tissue layer over the suture line,  age of patient and more or less days with urethral stent, in terms of avoidance  of postoperative complications after hypospadias repair, may have to be  re-evaluated.","doi":"10.1016/s0210-4806(08)73839-7","pmid":"18512391","date":"2008 Mar","journal":"Actas urologicas espanolas","authors":"Montoya Martinez J. A.; Anturi Chams A. A.; Pérez Contreras D. F.","item_type":"journalArticle","volume":"32","issue":"3","pages":"332-340","issn":"0210-4806","isbn":"","url":""},"D6GZREPN":{"key":"D6GZREPN","record_id":"R-D6GZREPN","title":"Male reproductive health: cause for concern?","abstract":"A substantial body of evidence has accumulated in recent years that human semen quality may be deteriorating. This has been associated with evidence of other changes in male reproductive health, including increases in congenital malformations and testicular cancer in humans, and similar problems in wildlife. Unfortunately, the evidence remains inconclusive. It has been suggested that these changes may be due to environmental xeno-oestrogens acting during development. Although there is now a large quantity of data indicating that this is a plausible hypothesis, evidence of causality, rather than association, remains to be provided. The potential importance of these changes for human health is considerable and urgent research is required to clarify the situation.","doi":"10.1046/j.1439-0272.2000.00388.x","pmid":"","date":"2000 SEP","journal":"ANDROLOGIA","authors":"Irvine DS","item_type":"journalArticle","volume":"32","issue":"4-5","pages":"195-208","issn":"0303-4569 1439-0272","isbn":"","url":""},"D7568IVI":{"key":"D7568IVI","record_id":"R-D7568IVI","title":"Human exposure to endocrine-disrupting chemicals and prenatal risk factors for cryptorchidism and hypospadias: a nested case-control study.","abstract":"Exposure to xenoestrogens during pregnancy may disturb the development and function of male sexual organs.In this study we aimed to determine whether the combined effect of environmental estrogens measured as total effective xenoestrogen burden (TEXB) is a risk factor for male urogenital malformations.In a case-control study, nested in a mother-child cohort (n = 702) established at Granada University Hospital, we compared 50 newborns with diagnosis of cryptorchidism and/or hypospadias with 114 boys without malformations matched by gestational age, date of birth, and parity. Controls did not differ from the total cohort in confounding variables. TEXB and levels of 16 organochlorine pesticides were measured in placenta tissues. Characteristics of parents, pregnancy, and birth were gathered by questionnaire. We used conditional and unconditional regression models to estimate odds ratios (ORs) and 95% confidence intervals (CIs).TEXB from organohalogenated compounds was detectable in 72% and 54% of case and control placentas, respectively. Compared with controls, cases had an OR for detectable versus non-detectable TEXB of 2.82 (95% CI, 1.10-7.24). More pesticides were detected in cases than in controls (9.34 +/- 3.19 vs. 6.97 +/- 3.93). ORs for cases with detectable levels of pesticides, after adjusting for potential confounders in the conditional regression analysis, were o,p'-DDT (OR = 2.25; 95% CI, 1.03-4.89), p,p'-DDT (OR = 2.63; 95% CI, 1.21-5.72), lindane (OR = 3.38; 95% CI, 1.36-8.38), mirex (OR = 2.85; 95% CI, 1.22-6.66), and endosulfan alpha (OR = 2.19; 95% CI, 0.99-4.82). Engagement of mothers in agriculture (OR = 3.47; 95% CI, 1.33-9.03), fathers' occupational exposure to xenoestrogens (OR = 2.98; 95% CI, 1.11-8.01), and history of previous stillbirths (OR = 4.20; 95% CI, 1.11-16.66) were also associated with risk of malformations.We found an increased risk for male urogenital malformations related to the combined effect of environmental estrogens in placenta.","doi":"10.1289/ehp.9351","pmid":"","date":"2007","journal":"Environmental health perspectives","authors":"Mariana F Fernandez","item_type":"journalArticle","volume":"115","issue":"","pages":"8-14","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISElB1Yk1lZDAwMDAyMTI3NTk2NxoIcmI2eDJhNGE%3D"},"D8DQA93L":{"key":"D8DQA93L","record_id":"R-D8DQA93L","title":"Cryptorchidism: a prospective study of 7500 consecutive male births, 1984-8. John Radcliffe Hospital Cryptorchidism Study Group.","abstract":"A total of 7441 boys were examined for cryptorchidism at birth and, if present, again at 3 months of age. After excluding boys with severe congenital  malformations noted at birth, the cryptorchidism rates at 3 months in babies  weighing less than 2000 g, 2000-2499 g, and greater than or equal to 2500 g were  7.7%, 2.5%, and 1.41% respectively. The overall rate was 1.55%. The  cryptorchidism rate at birth had increased by 35.1% and at 3 months by 92.7%,  over Scorer's rates in the 1950s. Part of these increases may be attributable to  differences in neonatal mortality, but the increases in babies weighing 2500 g or  more of 50.2% at birth and 77.4% at 3 months are unlikely to be overestimates. At  birth 1.92% of boys had bilateral cryptorchidism and 3.0% unilateral  cryptorchidism. Boys with cryptorchidism at 3 months were more likely to have  hypospadias, a small scrotum, and poor scrotal rugation compared with boys having  normally descended testes at birth. Factors predicting descent by 3 months in  babies cryptorchid at birth are birth weight, laterality and scrotal size, babies  with low birth weight, bilateral cryptorchidism, and normal scrotal size being  more likely to have normally descended testes by 3 months. Descent by 3 months  was more likely the lower the testis along the normal pathway of descent. The  orchidopexy rate at an average age of 3 years was 1.24%. This is substantially  lower than in other series and lower than our estimated rate of 2.9% using  Hospital In-Patient Enquiry data for England and Wales.","doi":"10.1136/adc.67.7.892","pmid":"1355643","date":"1992 Jul","journal":"Archives of disease in childhood","authors":"","item_type":"journalArticle","volume":"67","issue":"7","pages":"892-899","issn":"1468-2044 0003-9888","isbn":"","url":""},"DF3GHBA8":{"key":"DF3GHBA8","record_id":"R-DF3GHBA8","title":"Urban–rural residence and birth defects prevalence in Texas: a phenome-wide association study","abstract":"Background: Some assessments indicate the prevalence of certain birth defects varies by urban–rural status. We evaluated associations between urban–rural residence and a spectrum of birth defects, using a phenome-wide association study approach in Texas, a state with large urban centers and expansive rural areas. Methods: Data for birth defects and livebirths during 1999–2015 were obtained from the Texas Birth Defects Registry and the Center for Health Statistics. Maternal residence was classified as urban or rural, and prevalence ratios (PR) and 95% confidence intervals (CI) were calculated for any defect and 140 specific defects by Poisson regression. Results: Overall, birth defects were less frequent in rural compared to urban counties (PR = 0.88, 95% CI: 0.87–0.89). Twelve specific defects were less prevalent in rural counties, including ventricular septal defects (VSDs; PR = 0.76, 95% CI: 0.73–0.79) and hypospadias (PR = 0.86, 95% CI: 0.82–0.89). For some birth defects, including VSDs, there was evidence of decreasing prevalence with decreasing population size. Conclusions: In our large population-based assessment, we demonstrated that several birth defects were less prevalent in rural counties, suggesting that characteristics of urban settings may be relevant to their etiologies, diagnosis, or surveillance. Further research is needed to identify specific exposures underlying these associations. Impact: There are few studies of birth defects prevalence in urban versus rural settings. To address this, we investigated a comprehensive range of birth defects, including several rare defects that have not been previously studied, in a large and diverse population.We identified 12 structural birth defects that were less prevalent in rural areas.Findings suggest possible differential exposures among urban and rural women, and/or possible underdiagnosis of certain birth defects in rural areas.Findings highlight the need for further study of geographically referenced risk factors for birth defects, and of the completeness of birth defects ascertainment in rural areas. © 2021, The Author(s), under exclusive licence to the International Pediatric Research Foundation, Inc.","doi":"10.1038/s41390-021-01700-6","pmid":"","date":"2022","journal":"Pediatric Research","authors":"Benavides E.; Lupo P.J.; Sosa M.; Whitworth K.W.; Canfield M.A.; Langlois P.H.; Schraw J.M.","item_type":"journalArticle","volume":"91","issue":"6","pages":"1587-1594","issn":"00313998 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85112698067?origin=resultslist"},"DISMGU4A":{"key":"DISMGU4A","record_id":"R-DISMGU4A","title":"Editorial comment","abstract":"","doi":"10.1016/j.juro.2010.08.099","pmid":"","date":"2010","journal":"Journal of Urology","authors":"Snodgrass W.T.","item_type":"journalArticle","volume":"184","issue":"6","pages":"2515","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/78349305893?origin=resultslist"},"DLEWQU5Z":{"key":"DLEWQU5Z","record_id":"R-DLEWQU5Z","title":"Genotype-phenotype analysis of NR5A1/SF1 mutations by functional in vitro studies","abstract":"Background: The steroidogenic Factor 1 (SF1, NR5A1) is one of the key factors involved in gonadal and adrenal development and steroidogenesis. Until now, over 50 mutations were described in different phenotypes of XY disorders of sex development (DSD) such as complete gonadal dysgenesis, severe and mild partial gonadal dysgenesis, hypospadias, infertility and bilateral anorchia. So far, no genotype-phenotype correlation could be demonstrated. Objective and hypotheses: To investigate genotype-phenotype correlation SFl-mutations by functional in-vitro studies. Method: Investigation of the transcriptional activity of different SF1 missense mutations on central promoters of gonadal development in a homogeneous experimental set up by Dual-Glo luciferase assays in HEK and Sertoli cells. Mutations of different structural region from patients with phenotypes ranging from infertility to complete gonadal dysgenesis were chosen. TESCO, the initiator of testis determination and the promoters of CYP11A1, reflecting steroidogenesis and Leydig cell function and AMH representing Sertoli cell function were used as reporter. Results: SF1 missense mutations in the DNA-binding (p.E35G, p.R62C) and ligand-binding domain (p.L376F) leading to partial and complete gonadal dysgenesis showed a significant reduced ability to activate TESCO and the CYP11A1 promoter. SF1 mutations in the hinge-region (p.P131L, p.P191C) leading to infertility showed only moderate reduced ability to activate TESCO and minor reduced activation of the CYP11A1 promoter. None of the mutations did show significant reduction of transcriptional activity of the AMH promoter. Conclusion: The transcriptional activity of the different SF1 mutations on the TESCO and CYP11A1 promoter reflect the severity of clinical expression of gonadal dysgenesis and steroidogenic function in-vitro. Functional studies of SF1 mutations using TESCO and the CYP11A1 promoter can be helpful predictive models for phenotypes in-vitro.","doi":"10.1159/000449142","pmid":"","date":"2016","journal":"Hormone Research in Paediatrics","authors":"Astudillo R.; Bashamboo A.; Kleinau G.; Biebermann H.; Krude H.; Köhler B.","item_type":"journalArticle","volume":"86","issue":"(Astudillo R.; Kleinau G.; Biebermann H.; Krude H.; Köhler B.) Institut of Experimental Pediatric Endocrinology, Charité - Universitätsmedizin Berlin, Berlin, Germany","pages":"258","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L615915022&from=export"},"DM32B7V3":{"key":"DM32B7V3","record_id":"R-DM32B7V3","title":"Incidence of Birth Defects among Neonates and Influencing Factors in Xi'an, 2010-2013","abstract":"Background: Shaanxi province has high incidence of birth defects in neonates, but information about the incidence of birth defects in each area in the province is not well recorded. Differences are present in the economic level among these areas. Thus, it is helpful to explain the incidence characteristics of birth defects in Xi'an and to provide some targeted suggestions by studying the incidence of birth defects. Objective: To analyze the incidence of birth defects among single live birth neonates in Xi'an from 2010 to 2013 and to discuss the influencing factors of birth defects in neonates. Methods: From June to November 2013, women of childbearing age (15-49 years old) in Xi'an who became pregnant from 2010 to 2013 were selected as objects of study through multistage random sampling method according to the population density and fertility level. A self-designed questionnaire survey was conducted to collect the social demographic information, marital and fertile history, life style during pregnancy, history of drugs and nutrients during pregnancy, disease history of families and eugenics counseling of subjects, age, nationality, education years, disease history of families of spouses, and gender and birth season of neonates. Results: We collected the complete information of 4 679 women. The study found 74 cases of birth defects. The incidence of birth defects was 158.2/10 000 from 2010 to 2013, the incidences of birth defects among neonates were 68.7/10 000 in 2010, 160.2/10 000 in 2011, 115.3/10 000 in 2012 and 214.5/10 000 in 2013.Compared with the annual incidence of birth defects, no significant difference was found (χ2=7.355, P=0.061). Among the 74 cases of birth defects, 44 cases of congenital heart disease, 4 cases of hemangioma, 3 cases of indirect inguinal hernia, 3 cases of laryngeal cartilages dysplasia, 2 cases of omphalocele, 2 cases of upper eyelid ptosis, 2 cases of ankyloglossia, 2 cases of preauricular fistula, 1 case of melanocytic nevi, 1 case of congenital torticollis, 1 case of left renal displacement, 1 case of cerebral palsy, 1 case of cleft lip, 1 case of hypospadias, 1 case of ankylodactylia, 1 case of Down syndrome, 1 case of G6PD deficiency, 1 case of congenital jaundice, and 1 case of cryptorchidism and 1 case of congenital spinal meningocele. Results: of multivariable Logistic regression analysis suggested that premature delivery, drinking history during pregnancy, smoking history during pregnancy, antibiotic use during pregnancy and mother's family history of maternal diabetes were significant risk factors of birth defects(P\u003c0.05). Conclusion: The incidence of birth defects among single live birth neonates in Xi'an from 2010 to 2013 was high. Congenital heart disease is the dominant type of birth defects. Premature delivery, drinking and smoking history during pregnancy, antibiotic use during pregnancy, and mother's family history of maternal diabetes may increase the risk of birth defects in neonates. Copyright © 2016 by the Chinese General Practice.","doi":"10.3969/j.issn.1007-9572.2016.26.005","pmid":"","date":"2016","journal":"Chinese General Practice","authors":"Bai R.-H.; Zhang Q.; Wang L.-L.; Qu P.-F.; Li J.-M.; Yan H.","item_type":"journalArticle","volume":"19","issue":"26","pages":"3149-3152","issn":"10079572 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85049032363?origin=resultslist"},"DQ9VPR8E":{"key":"DQ9VPR8E","record_id":"R-DQ9VPR8E","title":"Description of a new variant in the MAMLD1 gene in an infant with microphallus and hypospadias","abstract":"Introduction: The MAMLD1 gene is expressed in fetal and adult testes. It contributes to the development and formation of the male external genitalia in late stages of fetal organogenesis (week 8-12) and to testosterone biosynthesis. The pathogenic genetic variants of this gene determine a significant reduction in plasma testosterone concentrations, although they are not undetectable. Its most common phenotypic manifestation is hypospadias, also described in patients with microphallus with or without cryptorchidism. Patient Description: 40 weeks gestation newborn with a microphallus of 1.5cm in length (nv:3.5cm ± 0.4) and terminal hypospadias with 3ml testes located in the scrotal bag. Normal anthropometry. At 6 days of life, a hormonal study was carried out with the following result: LH: 4.4IU/L (nv: 0.40-10.1IU/L), FSH: 3.8IU/L (nv: 0,6-7IU/L), Testosterone: 69ng/dl (nv:288- 300ng/dl), IGF-I: 61ng/ml, and IGFBP3: 1.8g/dl. Normal thyroid and adrenal hormone profile. Karyotype 46, XY. Normal hypothalamic- pituitary magnetic resonance and testicular ultrasound with homogeneous echostructure and normal size testicles. At 1 month of age a 25mg dose of testosterone IM is administered. At 2 months of age the length of the penis is 2 cm with following hormonal profile: LH: 4.8U/L, FSH: 3U/L, testosterone: 49ng/dl, dihydrotestosterone (DHT): 0,1ng/ml (nv:0.25-0.99ng/ml), antimullerian hormone (AMH): 77.2 ng/ml (nv: 97.9 ± 34.4ng/ml), inhibin B: 192pg/ml (nv: 209-321pg/ml). At the age of 4 months, a stimulation test with hCG 1000IU/dose is performed 3 times/ week for 2 weeks without observing a significant increase in the concentrations of testosterone (111.1ng/dL), DHT (0.05ng/ml) or the length of the penis. The DSD massive gene sequencing panel identifies a hemizygosity pathogenic variant in the MAMLD1 gene (c.1738C>T:p.Gln580Ter)in exon3). Treatment with intramuscular testosterone 50mg every 3 weeks (2 doses) was started, showing a favorable response to treatment with an increase in penis length to 3.5cm. Conclusions: Our patient presents a pathogenic variant in MAMDL1 not previously described in the literature that predicts in silico a truncated protein that could justify his genital phenotype. The existence of low testosterone concentrations during the infant's minipuberty stage and the absence of a significant increase in plasma concentrations of testosterone and DHT in the hCG test highlights the potential role of this gene in the biosynthesis of testosterone during the fetal stage and minipuberty of the infant. This case would be the first time that a decrease in DHT has been described in a patient with an abnormal MAMLD1. IM testosterone treatment is effective in these patients.","doi":"10.1159/000518849","pmid":"","date":"2021","journal":"Hormone Research in Paediatrics","authors":"Riera C.A.; Egusquiza D.P.T.; Canestrino G.; Fernández P.; Camats N.; Clemente M.; Yeste D.","item_type":"journalArticle","volume":"94","issue":"SUPPL 1","pages":"379","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L637189209&from=export"},"DVKSFABU":{"key":"DVKSFABU","record_id":"R-DVKSFABU","title":"Teratogenic effects of antiepileptic drugs: implications for the management of epilepsy in women of childbearing age.","abstract":"Exposure to antiepileptic drug (AED) treatment in utero occurs in 1 of every 250 newborns. The absolute risk of major malformations in these infants is about  7-10%, approximately 3-5% higher than in the general population. Specific risk  factors include high maternal daily dosage or serum concentrations of AED, low  folate levels, polytherapy, and generalized seizures during pregnancy. Adverse  pregnancy outcomes, including congenital heart malformations, facial clefts,  spina bifida aperta, hypospadias, growth retardation, and psychomotor and mental  retardation, are associated with, although not necessarily caused by, AED  exposure. Specific cognitive defects, hypertelorism, and nail hypoplasia can be  causally related to specific AED exposures. To prevent teratogenic side effects,  the prospective mother should be treated with AEDs only when absolutely  necessary. Monotherapy with the AED that is most effective in the lowest possible  daily dose (divided into at least two or three administrations) should be  prescribed. High-dose folate supplementation (4-5 mg/day) reduces the risk of a  neural tube defect in a child whose sibling had such a defect, but its impact on  the specific teratogenic risks of AEDs is unknown. A substantial proportion of  fetal malformations may be secondarily prevented by prenatal diagnosis,  consisting of a fetal structural ultrasound examination at weeks 18 and 20 of  gestation and, with VPA or CBZ administration, an alpha 1-fetoprotein analysis of  amniotic fluid at week 16. Determination of a specific defect prevention strategy  depends largely on parental attitudes toward prenatal diagnosis and termination  of pregnancy, which should be discussed before conception.(ABSTRACT TRUNCATED AT  250 WORDS)","doi":"10.1111/j.1528-1157.1994.tb05952.x","pmid":"8174516","date":"1994","journal":"Epilepsia","authors":"Lindhout D.; Omtzigt J. G.","item_type":"journalArticle","volume":"35 Suppl 4","issue":"","pages":"S19-28","issn":"0013-9580","isbn":"","url":""},"DYQDNAJC":{"key":"DYQDNAJC","record_id":"R-DYQDNAJC","title":"RETRACTED: Associations of TGFBR1 and TGFBR2 gene polymorphisms with the risk of hypospadias: a case-control study in a Chinese population (Retracted article. See vol. 42, 2022)","abstract":"This case-control study investigated the association of transforming growth factor-beta (TGF-beta) receptor type I and II (TGFBR1 and TGFBR2) gene polymorphisms with the risk of hypospadias in a Chinese population. One hundred and sixty two patients suffering from hypospadias were enrolled as case group and 165 children who underwent circumcision were recruited as control group. Single nucleotide polymorphisms (SNPs) in TGFBR1 and TGFBR2 genes were selected on the basis of genetic data obtained from HapMap. PCR-restriction fragment length polymorphism (PCR-RFLP) was performed to identify TGFBR1 and TGFBR2 gene polymorphisms and analyze genotype distribution and allele frequency. Logistic regression analysis was conducted to estimate the risk factors for hypospadias. No significant difference was found concerning the genotype and allele frequencies of TGFBR1 rs4743325 polymorphism between the case and control groups. However, genotype and allele frequencies of TGFBR2 rs6785358 in the case group were significantly different in contrast with those in the control group. Patients carrying the G allele of TGFBR2 rs6785358 polymorphism exhibited a higher risk of hypospadias compared with the patients carrying the A allele (P\u003c0.05). The TGFBR2 rs6785358 genotype was found to be significantly related to abnormal pregnancy and preterm birth (both P\u003c0.05). The frequency of TGFBR2 rs6785358 GG genotype exhibited significant differences amongst patients suffering from four different pathological types of hypospadias. Logistic regression analysis revealed that preterm birth, abnormal pregnancy, and TGFBR2 rs6785358 were the independent risk factors for hypospadias. Our study provides evidence that TGFBR2 rs6785358 polymorphism might be associated with the risk of hypospadias.","doi":"10.1042/BSR20170713","pmid":"","date":"2017 OCT 31","journal":"BIOSCIENCE REPORTS","authors":"Han XR; Wen X; Wang S; Hong XW; Fan SH; Zhuang J; Wang YJ; Zhang ZF; Li MQ; Hu B; Shan Q; Sun CH; Bao YX; Lin M; He T; Wu DM; Lu J; Zheng YL","item_type":"journalArticle","volume":"37","issue":"","pages":"","issn":"0144-8463 1573-4935","isbn":"","url":""},"E3ZBCTJH":{"key":"E3ZBCTJH","record_id":"R-E3ZBCTJH","title":"Cryptorchidism: A prospective study of 7500 consecutive male births, 1984-8","abstract":"A total of 7441 boys were examined for cryptorchidism at birth and, if present, again at 3 months of age. After excluding boys with severe congenital malformations noted at birth, the cryptorchidism rates at 3 months in babies weighing \u003c2000 g, 2000-2499 g, and ≥2500 g were 7.7%, 2.5%, and 1.41% respectively. The overall rate was 1.55%. The cryptorchidism rate at birth had increased by 35.1% and at 3 months by 92.7%, over Scorer's rates in the 1950s. Part of these increases may be attributable to differences in neonatal mortality, but the increases in babies weighing 2500 g or more of 50.2% at birth and 77.4% at 3 months are unlikely to be overestimates. At birth 1.92% of boys had bilateral cryptorchidism and 3.0% unilateral cryptorchidism. Boys with cryptorchidism at 3 months were more likely to have hypospadias, a small scrotum, and poor scrotal rugation compared with boys having normally descended testes at birth. Factors predicting descent by 3 months in babies cryptorchid at birth are birth weight, laterality and scrotal size, babies with low birth weight, bilateral cryptorchidism, and normal scrotal size being more likely to have normally descended testes by 3 months. Descent by 3 months was more likely the lower the testis along the normal pathway of descent. The orchidopexy rate at an average age of 3 years was 1.24%. This is substantially lower than in other series and lower than our estimated rate of 2.9% using Hospital In-Patient Enquiry data for England and Wales.","doi":"10.1136/adc.67.7.892","pmid":"","date":"1992","journal":"Archives of Disease in Childhood","authors":"Ansell P.E.; Bennet V.; Bull D.; Jackson M.B.; Pike L.A.; Pike M.C.; Chilvers C.E.D.; Dudley N.E.; Gough M.H.; Griffiths D.M.; Redman C.; Wilkinson A.R.; Macfarlane A.; Coupland C.A.C.","item_type":"journalArticle","volume":"67","issue":"7","pages":"892-899","issn":"00039888 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0026652317?origin=resultslist"},"E47MJHTQ":{"key":"E47MJHTQ","record_id":"R-E47MJHTQ","title":"Diagnostic performance of uroflowmetry for urethral strictures following hypospadias repairs: A comparison with urethral calibration","abstract":"Introduction & Objectives: Urethral stricture is a common complication following hypospadias repairs, posing significant management challenges and the risk of multiple reoperations. The current study aims to evaluate the diagnostic accuracy of uroflowmetry in detecting urethral strictures following hypospadias repairs and to compare it with urethral calibration. Materials & Methods: A retrospective cohort study was conducted on children who underwent primary hypospadias repairs from 2016 to 2023 at our institution. Urethral calibration and uroflowmetry were used to evaluate urethral patency after hypospadias repairs. We analyzed the relationship between these two assessments and evaluated the diagnostic value of uroflowmetry in detecting urethral strictures. Patients were categorized into Tubularized Incised-Plate (TIP) urethroplasty and non-TIP groups. This study complied with all principles and regulations of the Helsinki Declaration and was approved by the Ethics Committee of the author's Hospital (2024-IRB-0262-P-01). Results: A total of 62 cases were included, with 38 in the TIP group and 24 in the non-TIP group. Ten patients were diagnosed with urethral strictures. In the non-TIP group, the area under the curve (AUC) for maximum urinary flow rate (Qmax) was 0.94 (Cut-off = 6.65, sensitivity = 100%, specificity = 81.0%), higher than that of average urinary flow rate (Qave) with 0.91 (Cut-off = 4.95, sensitivity = 100%, specificity = 71.4%). In the TIP group, the AUC for Qmax was 0.80 (Cut-off = 5.75, sensitivity = 100%, specificity = 58.1%), higher than that of Qave with 0.70 (Cut-off = 3.20, sensitivity = 71.4%, specificity = 67.7%). In the non-TIP group, the Qmax nomogram interval ≤ -3 Standard Deviation (SD) showed good consistency for the diagnosis of urethral stricture (Kappa = 0.70), with the ROC curve showing an AUC of 0.95 (Cut-off = 0.5, sensitivity = 100%, specificity = 91.0%). In the non-TIP group, a strong quadratic correlation was found between urethral calibration and Qmax (C2 = 14.72*Qmax, R2 = 0.96, P \u003c 0.001), which was superior to the correlation in the TIP group (C2 = 14.76*Qmax, R2 = 0.88, P \u003c 0.001). Conclusions: Qmax outperforms Qave in both sensitivity and specificity for stricture detection. The presence of a Qmax value below 6.65 ml/s or ≤ -3SD is indicative of urethral strictures in the non-TIP cohort. Uroflowmetry emerges as an effective screening tool for urethral strictures in the TIP cohort. The formula C2 = 14.72*Qmax facilitates the non-invasive derivation of urethral calibration measurements.","doi":"10.1016/j.eururo.2025.09.2482","pmid":"","date":"2025","journal":"European Urology","authors":"Ru W.; Liu H.; Zhou J.; Hu Q.; Yang W.; Hu L.; Chen G.; Yan X.","item_type":"journalArticle","volume":"87","issue":"(Ru W.; Liu H.; Zhou J.; Hu Q.; Yang W.; Hu L.; Chen G.; Yan X.) Children's Hospital, Zhejiang University, School of Medicine, Dept. of Urology, Hangzhou, China","pages":"S22","issn":"0302-2838","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L652151898&from=export"},"E627BKFZ":{"key":"E627BKFZ","record_id":"R-E627BKFZ","title":"The risk factors of Urethrocutaneous fistula after hypospadias surgery in the youth population.","abstract":"Background: The current research aims to evaluate the risk factors of urethrocutaneous fistula after hypospadias surgery among the youth in China. Methods: One hundred twenty hypospadias patients were enrolled in our study. All of them were defined as Tanner 4 or 5. The information collected from the participants include age, urethral operation history, urinary comorbidities before operation, urine test before operation, body temperature before and after operation, type of surgical repair, chordee degree, urethral defect length and whether received vesicostomy after surgery or not. Independent t test, chi-square test and multivariate logistic regression were performed to evaluate the risk factor of urethrocutaneous fistula. Results: Among the enrolled patients, 39 patients (32.5%) developed urethrocutaneous fistula after hypospadias repair. Our result showed significant association between the group with urethrocutaneous fistula and the group without urethrocutaneous fistula with respect to age, pyuria before operation, urethral defect length and the urethral operation history. The following logistic regression showed that urethral defect length and the urethral operation history were the risk factors of urethrocutaneous fistula. Conclusions: Urethral defect length and urethral operation history should be taken into consideration before undergoing hypospadias surgery since our study discovered that the risk of developing urethrocutaneous fistula after hypospadias repair is associated with urethral defect length and urethral operation history. Age, surgical procedure, type of surgical repair, chordee degree and other factors were not obviously related to the development of urethrocutaneous fistula. © 2018 The Author(s).","doi":"10.1186/s12894-018-0366-z","pmid":"30041630","date":"2018 Jul 24","journal":"BMC urology","authors":"Sheng Xujun; Xu Ding; Wu Yu; Yu Yongjiang; Chen Jianhua; Qi Jun","item_type":"journalArticle","volume":"18","issue":"1","pages":"64","issn":"1471-2490","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L623158928&from=export"},"E9EMEZEC":{"key":"E9EMEZEC","record_id":"R-E9EMEZEC","title":"EDCs and male urogenital cancers.","abstract":"Male sex determination and sexual differentiation occur between 6-12 weeks of gestation. During the \"male programming window\" the fetal testes start to produce  testosterone that initiates the development of the male reproductive tract.  Exposure to endocrine disrupting chemicals (EDCs) able to mimic or disrupt  steroid hormone actions may disrupt testicular development and adversely impact  reproductive health at birth, during puberty and adulthood. The testicular  dysgenesis syndrome (TDS) occurs as a result inhibition of androgen action on  fetal development preceding Sertoli and Leydig cell dysfunction and may result  from direct or epigenetic effects. Hypospadias, cryptorchidism and poor semen  quality are elements of TDS, which may be considered a risk factor for testicular  germ cell cancer (TGCC). Exposure to estrogen or estrogenic EDCs results in  developmental estrogenization/estrogen imprinting in the rodent for prostate  cancer (PCa). This can disrupt prostate histology by disorganization of the  epithelium, prostatic intraepithelial neoplasia (PIN) lesions, in particular  high-grade PIN (HGPIN) lesions which are precursors of prostatic adenocarcinoma.  These defects persist throughout the lifespan of the animal and later in life  estrogen exposure predispose development of cancer. Exposure of pregnant dams to  vinclozolin, a competitive anti-androgen, and results in prominent, focal regions  of inflammation in all exposed animals. The inflammation closely resembles human  nonbacterial prostatitis that occurs in young men and evidence indicates that  inflammation plays a central role in the development of PCa. In conclusion, in  utero exposure to endocrine disrupters may predispose to the development of TDS,  testicular cancer (TCa) and PCa and are illustrations of Developmental Origins of  Health and Disease (DOHaD).","doi":"10.1016/bs.apha.2021.05.004","pmid":"","date":"2021","journal":"Advances in Pharmacology","authors":"Bornman M. S.; Aneck-Hahn N. H.","item_type":"journalArticle","volume":"92","issue":"(Bornman M.S., riana.bornman@up.ac.za; Aneck-Hahn N.H.) Environmental Chemical Pollution and Health Research Unit, Faculty of Health Sciences, School of Health Systems and Public Health, University of Pretoria, Pretoria, South Africa","pages":"521-553","issn":"1557-8925","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2013245949&from=export"},"EDIBZS7Q":{"key":"EDIBZS7Q","record_id":"R-EDIBZS7Q","title":"Evaluation of external genital anomalies and the underlying factors in male newborns","abstract":"Background: External genital anomalies are the most common congenital disorders in male infants with unknown etiology in the majority of cases. According to recent reports, incidence rate of these anomalies is rising in different countries. This study aimed to evaluate the prevalence of external genital anomalies and possible underlying factors in male newborns. Methods: This cross-sectional study was conducted on all the male neonates born in Motahari Hospital of Urmia during October 2009-June 2010. Neonatal screening results and demographic data were recorded separately in a questionnaire for each neonate. Data analysis was performed in SPSS V.20 using descriptive statistics (mean, frequency, percentage, and standard deviation) and Chi-square test to evaluate the correlations between quantitative variables. Results: In this study, external genital anomalies were identified in 83 male neonates (8.3%). Moreover, 59 infants (5.9%) had cryptorchidism, 18 (1.8%) had hypospadias and 12 infants (1.2%) had microphallus. Moreover, a significant correlation was observed between the incidence of cryptorchidism and maternal comorbidities, low birth weight, prematurity, maternal gestational hypertension, and diabetes mellitus. Conclusion: According to the results of this study, cryptorchidism is the most prevalent external genital anomaly in male newborns, followed by hypospadias. Occurrence of these anomalies is associated with several risk factors, such as prematurity, low birth weight, maternal diseases (e.g., diabetes and hypertension), and use of medications during pregnancy. In addition, cryptorchidism had a significant correlation with smoking habits, and further studies with larger sample sizes are required in this regard.","doi":"","pmid":"","date":"2016","journal":"Iranian Journal of Neonatology","authors":"Pakniyat A.; Fallah M.R.; Fakour Z.; Moloudi F.; Khezri S.; Masou
