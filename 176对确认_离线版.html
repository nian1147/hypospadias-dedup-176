.027","pmid":"","date":"2026","journal":"国际精神病学杂志","authors":"张颖; 张大鹏; 么爽","item_type":"journalArticle","volume":"53","issue":"3","pages":"934-936+951","issn":"1673-2952","isbn":"","url":"https://link.cnki.net/doi/10.13479/j.cnki.jip.2026.03.027"},"ZMYBMQZ6":{"key":"ZMYBMQZ6","record_id":"R-ZMYBMQZ6","title":"Endocrine disruptors and congenital anomalies.","abstract":"The specialized literature was reviewed concerning the suspected increasing secular trends in the frequency of female births, male genital congenital  anomalies, abnormal sperm counts, and testicular cancer. Although no risk factors  could be identified yet, the observed sex ratio decline during the last decades  has been considered to be an effect of certain pollutants on normal hormone  activity, and human reproductive development. Reported increasing trends in the  frequencies of hypospadias and cryptorchidism are very difficult to be  interpreted due to the large variability in the registered frequency of these  malformations due to operational as well as biological reasons.","doi":"10.1590/S0102-311X2002000200006","pmid":"","date":"2002","journal":"Cadernos de saúde pública / Ministério da Saúde, Fundação Oswaldo Cruz, Escola Nacional de Saúde Pública","authors":"Rittler Mônica; Castilla Eduardo E.","item_type":"journalArticle","volume":"18","issue":"2","pages":"421-428","issn":"0102311X (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0036516293?origin=resultslist"},"ZPTSKEKN":{"key":"ZPTSKEKN","record_id":"R-ZPTSKEKN","title":"Analysis in the influence factors of urethroplasty in DSD.","abstract":"BACKGROUND: At present, there is no specific research on the factors affecting the success rate of urethroplasty in patients with DSD. The purpose of this study  is to explore the factors affecting the success of urethroplasty in DSD patients,  and to provide some reference for the surgical treatment of DSD patients  undergoing urethroplasty. METHOD: We reviewed patients with DSD who underwent  urethroplasty from January 2016 to December 2019 retrospectively. Patients were  divided into four groups: the successful group, the urethrocutaneous fistula  group, the urethral diverticulum group, and the urethral stricture group. Risk  factors were determined from the following data included the DSD classification,  the age of first operation, length of urethral defect, degree of hypospadias,  cryptorchidism, micropenis, gonad type, hormone therapy before operation,  transposition of penis and scrotum, surgical strategy, urethral covering  material, and postoperative catheter removal time. We explored the difference of  each factor between four groups through the comparative study of single factor  and multifactor logistic regression analysis of related factors. RESULT: 122  cases were enrolled in this group (n = 122), 12 cases were lost to follow-up.  Median follow-up was 28 months (12-55 months).We found the success rate of  operation decreased with longer urethral defect (B = - 0.473, P = 0.005). The  success rate of operation was higher in staged operation and TPIT  (TPIT = Transverse Preputial Island Tube operation)-related operation than  primary operation (B = 1.238, P = 0.006) and TPIT-nonrelated operation  (B = 2.293, P = 0.001). Although there was a significant difference between the  age of the first operation and the occurrence of urethrocutaneous fistula  (P = 0.006 \u003c 0.05), there was no significant difference in logistic regression  analysis (P = 0.161 > 0.05). The incidence of urethrocutaneous fistula was lower  in TPIT-related operation than in TPIT-nonrelated operation (B = - 2.507,  P = 0.000). The incidence of postoperative urethral diverticulum was lower in  staged operation than in primary operation (B = - 1.737, P = 0.015). CONCLUSION:  For patients with disorder of sex development undergoing urethroplasty, the  length of urethral defect is an independent risk factor affecting both the  success rate of operation and the urethrocutaneous fistula. The age of the first  operation has a statistically significant effect on the occurrence of  postoperative urethrocutaneous fistula, but it is not an independent factor.  Urethrocutaneous fistula is less found in TPIT-related operation in the study.  Staged operation is an independent protective factor for postoperative urethral  diverticulum compared with one-stage operation but isn't related to  urethrocutaneous fistula.","doi":"10.1186/s12894-022-01080-x","pmid":"","date":"2022","journal":"BMC Urology","authors":"Yu Jing; Sun Ning; Song Hongcheng; Li Minglei; Li Lele; Gong Chunxiu; Zhang Weiping","item_type":"journalArticle","volume":"22","issue":"1","pages":"124","issn":"1471-2490","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDI5NTMyOTY2GghyYjZ4MmE0YQ%3D%3D"},"ZR28ZB5W":{"key":"ZR28ZB5W","record_id":"R-ZR28ZB5W","title":"Clinical trials of associations between environmental particulate matter and hypospadias: a scoping review","abstract":"Objective To conduct a scoping review of the relationship between environmental particu-late matter and hypospadias, identify gaps in the current field and provide references for further researches. Methods Seven major literature databases, including CNKI (China National Knowledge Irtfrastructure),Wan-fang Medical Database,VIP (Chinese Science & Technology Periodical Database),PubMed,Web of Science, Embase and Cochrane Library,were searched for identifying and downloading clinical studies examining the correlation between environmental particulate matter and hypospadias. A scoping review methodology was em-ployed,utilizing Microsoft Excel software for collating such research profiles as country of origin, publication year, study type,characteristics of particulate matter and the relationship between particulate matter and hypospadias. The search period spanned from January 1,1930 to November 3,2023. Results A total of 3,582 nicies were retrieved. After initial and secondary screening,19 nicies were ultimately included (4 from CNKI,3 from Wanfang Medical Database,3 from PubMed and 9 from Web of Science,0 from VII’, 0 from Embase and 0 from Cochrane Library) with China contributing the largest number of publications (n = 11). The year 2021 saw the highest publication volume with 6 nicies accounting for 31.6% (6/19) of total. These studies comprised 9 retrospective cohort studies,9 case-control studies (including one case-crossover study) and 1 cross-sectional survey. The covariates of 19 studies encompassed maternal profiles (age, education level, ethnicity & parity, Hr.),pregnancy status (season of conception, gestational folate dosing, smoking/alcohol consumption during pregnancy, etc.),infant status (types of birth defect^, socioeconomic indices,other pollutants and meteorological factors,etc. The prima^ statistical method was Logistic regression with 4 studies utilizing time-series analysis. Among 19 included studies, PM exposure windows were ffiverse and data primarily collected through fixed monitoring stations, with some studies using models for adjusting exposure concentrations. Particulate matter concentrations reported from multiple locations were often higher than national air quality standards. Some studies revealed that seasons and human activities i^uenced PM concentrations. Four studies focused upon the correlations between meteorological factors and air pollutants. 10 studies (including 6 retrospective cohort studies, 3 case-control studies,and 1 cross-sectional survey) explored the association between arr pollution and birth defects, with hypospadias included as part of the outcome indicators. Ji total of 9 studies (including 3 retrospective cohort studies and 6 case-control studies) explored the correlation between environmental particulate matter and hypospadias with 4 studies hinting at an association b«ween exposure to PM2. 5 during pregnancy and the occurrence of hypospadias. The remaining studies addressed a.Mon-significant positive correlation, no correlation and a non-significant negative correlation,respectively. Furthermore,a comparison of PM concentrations and hypospadias incidence rates in different studies indicated that areas with higher PM concentrations tended to have higher incidence rates of h^ospadias. Conclusions Exposure to particulate matter during pregnancy, especially in the first trimester,may elevate the risk of hypospadias. Even in studies not explicitly exploring this correlation, a trend was observed where higher particulate matter concentration was associated with a higher incidence of hypospadias. Future researches should include larger cohort studies, incorporating such the relevant factors as meteorological factors, hypospadias subtypes and biological parameters. © 2026, Science and Technology Association of Hunan Province. All rights reserved.","doi":"10.3760/cma.j.cn101785-202312064","pmid":"","date":"2026","journal":"Journal of Clinical Pediatric Surgery","authors":"Liu Y.; Han R.; Wu S.","item_type":"journalArticle","volume":"25","issue":"1","pages":"43-48","issn":"16716353 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/105034282988?origin=resultslist"},"ZRSRP9EH":{"key":"ZRSRP9EH","record_id":"R-ZRSRP9EH","title":"Combined exposure to endocrine disrupting pesticides impairs parturition, causes pup mortality and affects sexual differentiation in rats","abstract":"Risk assessment is currently based on the no observed adverse effect levels (NOAELs) for single compounds. Humans are exposed to a mixture of chemicals and recent studies in our laboratory have shown that combined exposure to endocrine disrupters can cause adverse effects on male sexual development, even though the doses of the single compounds are below their individual NOAELs for anti-androgenic effects. Consequently, we have initiated a large project where the purpose is to study mixture effects of endocrine disrupting pesticides at low doses. In the initial range-finding mixture studies, rats were gavaged during gestation and lactation with five doses of a mixture of the fungicides procymidone, mancozeb, epoxyconazole, tebuconazole and prochloraz. The mixture ratio was chosen according to the doses of each individual pesticide that produced no observable effects on pregnancy length and pup survival in our laboratory and the dose levels used ranged from 25 to 100% of this mixture. All dose levels caused increased gestation length and dose levels above 25% caused impaired parturition leading to markedly decreased number of live born offspring and high pup perinatal mortality. The sexual differentiation of the pups was affected at 25% and higher as anogenital distance was affected in both male and female offspring at birth and the male offspring exhibited malformations of the genital tubercle, increased nipple retention, and decreased prostate and epididymis weights at pup day 13. The results show that doses of endocrine disrupting pesticides, which appear to induce no effects on gestation length, parturition and pup mortality when judged on their own, induced marked adverse effects on these endpoints in concert with other pesticides. In addition, the sexual differentiation of the offspring was affected. This as well as the predictability of the combination effects based on dose-additivity modelling will be studied further in a large dose-response study. © 2010 European Academy of Andrology.","doi":"10.1111/j.1365-2605.2009.01046.x","pmid":"","date":"2010","journal":"","authors":"Jacobsen P.R.; Christiansen S.; Boberg J.; Nellemann C.; Hass U.","item_type":"conferencePaper","volume":"33","issue":"2","pages":"434-442","issn":"","isbn":"01056263 (ISSN)","url":"https://www.scopus.com/pages/publications/77949621618?origin=resultslist"}},"groups":[{"group_id":"G-D0002","keys":["276KRJLX","J49667R6"],"pair_ids":["D0002"]},{"group_id":"G-D0003","keys":["297RZUWU","SZCQVC5D"],"pair_ids":["D0 function groupCard(g){return `<section class="card group-card"><div class="card-head"><div><h2>${g.keys.length} 条关联题录</h2><p class="section-desc">${g.pair_ids.map(pairLink).join(' ')}</p></div><span class="tag ${g.ready?'include':'pending'}">${g.ready?'草案关系通过':'需要复核'}</span></div><div class="card-body">${g.problems.length?`<ul class="problem-list">${g.problems.map(x=>`<li>${e(x.message)}${x.pair_id?' '+pairLink(x.pair_id):''}</li>`).join('')}</ul>`:`<p class="small">最终拟保留 <strong class="mono">${g.canonical}</strong>，其余 ${g.keys.length-1} 条列入待执行映射。${g.explicit?'使用单列的组级保留决定。':'保留方向自然汇集到同一条。'}</p>`}<ul class="group-items">${g.keys.map(k=>`<li><span class="mono">${k}</span> ${e(records[k].title)}</li>`).join('')}</ul>${g.keys.length>2||g.problems.some(x=>['survivor','stale'].includes(x.kind))?`<details class="group-resolve" ${g.problems.some(x=>['survivor','stale'].includes(x.kind))?'open':''}><summary>单列组级最终保留决定</summary><p class="small muted">此选择用于统一执行草案，逐对原票与历史仍保留。判为不同或待定的关系必须先回到对应原票复核。</p><form data-group="${e(g.signature)}"><div class="field-row"><label class="field">最终拟保留条目<select name="canonical" required><option value="">请选择</option>${g.keys.map(k=>`<option value="${k}" ${g.explicit&&g.canonical===k?'selected':''}>${k} · ${e(records[k].title.slice(0,55))}</option>`).join('')}</select></label><label class="field">组级依据<textarea name="reason" maxlength="4000" required placeholder="为什么选择这条作为全组最终保留？">${e(state.group_plans[g.signature]?.reason||'')}</textarea></label></div><button type="submit" class="secondary">保存组级决定</button></form></details>`:''}</div></section>`;}
function groupsView(){const a=analyze(DATA,state);return heading('RELATIONSHIP CHECK','让多对决定，汇集成一致关系。','重复对数与拟移除条目数分别统计；不按对数直接扣减分母。')+
 `<div class="stats four"><div class="stat"><div><strong>${a.merge_pairs}</strong><span>确认重复的对数</span></div></div><div class="stat"><div><strong>${a.planned_removals}</strong><span>关系通过的拟移除条目</span></div></div><div class="stat"><div><strong>${a.problem_groups.length}</strong><span>需要复核的组</span></div></div><div class="stat"><div><strong>${a.remaining}</strong><span>尚待明确的对</span></div></div></div>
 <div class="notice ${a.ready_for_handoff?'info':''}">${a.ready_for_handoff?'176对均有明确决定，当前已确认同组的关系通过检查。可导出原票与待执行草案，实际合并后再核实题录分母。':'只有176对均明确、组内不同/待定冲突和保留方向问题均闭合，才标记为可交接。CSV草案可分批导出，但不代表全批已完成或Zotero已合并。'}</div>
 ${a.groups.length?`<h2 class="space-top">已确认同组的关系</h2>${[...a.groups].sort((x,y)=>Number(y.problems.length>0)-Number(x.problems.length>0)||y.keys.length-x.keys.length).map(groupCard).join('')}`:'<section class="card empty-state space-top"><span class="empty-icon">'+icons.compare+'</span><h2>还没有提交确认重复的判断。</h2><p>逐对确认后，这里会检查保留方向、组内冲突，并生成不重复计数的拟合并关系。</p><button class="primary" data-action="resume">开始逐对确认</button></section>'}
 <details class="card static-groups space-top"><summary>查看原批次的12组多条目关系</summary><div class="card-body">${DATA.groups.filter(g=>g.keys.length>2).map(g=>`<div class="static-group"><h3>${e(g.group_id)} · ${g.keys.length}条 / ${g.pair_ids.length}对</h3><p class="small">${g.pair_ids.map(pairLink).join(' ')}</p><p class="small muted">${g.keys.map(e).join(' · ')}</p></div>`).join('')}</div></details>`;}
function exportsView(){const a=analyze(DATA,state);return heading('RESULTS & BACKUPS','保留决定，也保留追溯链。',`本机已有 ${a.submitted} 对原票、${Object.keys(state.drafts).length} 对草稿、${state.audit.length} 条操作历史。`)+
 `<div class="export-grid"><section class="card export-card"><span class="export-icon">${icons.export}</span><h2>逐对人工确认表 · CSV</h2><p>保留原358复核表的pair_id、A/B原始方向和字段，附人工四列、选定保留键及版本。未提交行的人工字段留空；可按pair_id回填原表。</p><button class="primary" data-action="export-csv">导出176对人工确认CSV</button></section><section class="card export-card"><span class="export-icon">${icons.save}</span><h2>完整备份 · JSON</h2><p>保存原票、草稿、组级决定及全部修改历史。建议每次结束都下载一份；换设备或从在线转离线时用它恢复。</p><button class="primary" data-action="export-json">下载JSON备份</button></section><section class="card export-card"><span class="export-icon">${icons.compare}</span><h2>待执行合并草案 · CSV</h2><p>当前 ${a.planned_removals} 条唯一题录的映射已通过组内检查。按最终保留键逐条列出拟并入关系；含全批未决数，实际执行仍需在Zotero复核。</p><button class="secondary" data-action="export-plan" ${a.mappings.length?'':'disabled'}>导出待执行合并草案</button></section><section class="card export-card"><span class="export-icon">${icons.restore}</span><h2>恢复与离线使用</h2><p>恢复你本人从本批工作台导出的JSON；恢复前先备份本机记录。网页、其他设备和离线版各自保存，进度通过JSON转移。</p><div class="actions"><button class="secondary" data-action="restore">恢复个人备份</button><a class="secondary" href="./176对确认_离线版.html" download>下载离线版</a></div></section></div>
 <div class="notice">这些导出都是判断记录或待执行草案。本网页不回写原CSV、不修改Zotero、不自动冻结分母；完成实际合并并核验保留条目及附件后，另行更新真实题录数量。</div><section class="card space-top"><div class="card-body"><dl class="info-list"><dt>本批版本</dt><dd class="mono">${VERSION}</dd><dt>题录与关系指纹 · SHA-256</dt><dd class="mono">${e(digest)}</dd><dt>保留数量口径</dt><dd>176对涉及298条，构成140组原始关系；仅按本批已列关系，若全部确认为重复，对应158条拟移除记录。实际数量取决于人工决定、组级关系及真实合并核验。</dd></dl></div></section>`;}
function rulesView(){return heading('CONFIRMATION RULES','确认同一报告，保全题录与来源。','依据2026-11-18作者选择的B3分层处置：确认级176对由主筛者冻结前单人确认。')+
 `<div class="rules-layout"><section class="card"><div class="card-head"><h2>逐对核对规则</h2></div><div class="card-body"><div class="rule"><h3>先核对原始证据</h3><p>同DOI是强线索；同时核查题名、作者、期刊、卷期页和出版类型。原始年份、页码、类型或作者有冲突时查出版商页面或原文；机检分层与完整度评分仅供参考。</p></div><div class="rule"><h3>同一报告的重复题录</h3><p>确认两条指向同一出版报告时，选择合并保留A或B，并勾选实际核对依据。保留侧应兼顾准确书目信息、全文附件、笔记、标签和来源集合；网页未读取这些本地附件与笔记。</p></div><div class="rule"><h3>同一研究的不同报告</h3><p>会议摘要与完整论文、同队列的新随访、不同结局报告、系列文章、勘误及评论，不能仅凭题名或作者相近合成同一篇。确认是不同报告则保留双条，并在后续研究层面建立关联。</p></div><div class="rule"><h3>无法确定，保留双条待核</h3><p>选择“不确定保留双条”，填写具体信息缺口。待定已记录但仍未闭合，不计入已明确完成。冻结时仍未决的条目按实际保留情况如实报告。</p></div><div class="rule"><h3>检查同一题录出现在多对中的情况</h3><p>本批12组含3条以上题录。系统检查保留方向循环、多个最终保留候选及“已判不同却被其他合并关系连成同组”的冲突。组级最终保留决定单列，原逐对判断不覆盖。</p></div><div class="rule"><h3>判断、执行和分母分别留痕</h3><p>本网页导出原票和待执行合并草案。实际在Zotero合并前应保留完整备份，逐组核附件、笔记与来源；合并后核对实际减少条目数。正式分母冻结还需其他前置条件完成，本批判断不自动等于分母已冻结。</p></div></div></section><aside><section class="card"><div class="card-head"><h2>四种选择</h2></div><div class="card-body"><ul class="steps">${Object.entries(LABELS).map(([k,v])=>`<li><div><strong>${e(v)}</strong><p>${k==='keep_a'?'同一报告；以A为本对拟保留侧。':k==='keep_b'?'同一报告；以B为本对拟保留侧。':k==='distinct'?'不同报告，保留双条并说明区别。':'证据不足，记录缺口并继续保留双条。'}</p></div></li>`).join('')}</ul></div></section><div class="notice">本轮只核同一报告的重复题录。儿科年龄、模型与结局纳排标准仍在文献筛选阶段另行执行。</div><section class="card space-top"><div class="card-body"><h3>材料时间与边界</h3><p class="section-desc">书目信息来自2026-10-08原生去重后快照；分层与原存续核查来自2026-11-18。当前页面不与Zotero实时同步，未声称已核实今天所有条目仍在库。</p></div></section></aside></div>`;}
function render(){const a=analyze(DATA,state);document.querySelectorAll('nav [data-view]').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#nav-progress').textContent=a.resolved+'/176';$('#main').innerHTML=({overview,review,groups:groupsView,exports:exportsView,rules:rulesView}[view])();
 $('#reviewer-name')?.addEventListener('input',ev=>{state.reviewer=ev.target.value.trim();persist();});
 function updateList(){$('#pairs-list').innerHTML=listMarkup();$('#list-count').textContent='显示 '+filtered().length+' 对 · 原始顺序';}
 $('#pair-search')?.addEventListener('input',ev=>{query=ev.target.value;updateList();});$('#status-filter')?.addEventListener('change',ev=>{statusFilter=ev.target.value;updateList();});$('#bucket-filter')?.addEventListener('change',ev=>{bucketFilter=ev.target.value;updateList();});$('#only-555')?.addEventListener('change',ev=>{only555=ev.target.checked;updateList();});
 $('#vote-form')?.addEventListener('input',saveDraft);$('#vote-form')?.addEventListener('submit',ev=>{ev.preventDefault();submit(true);});
 document.querySelectorAll('[data-group]').forEach(form=>form.addEventListener('submit',ev=>{ev.preventDefault();try{const g=analyze(DATA,state).groups.find(g=>g.signature===form.dataset.group),canonical=form.elements.canonical.value,reason=form.elements.reason.value.trim();if(!g||!g.keys.includes(canonical)||!reason||!state.reviewer.trim())throw new Error('请先填写姓名、组级保留条目及具体依据。');const plan={canonical,reason,reviewer:state.reviewer,date:chinaDate(),saved_at:new Date().toISOString(),basis:g.basis};state.audit.push({type:'group_plan',signature:g.signature,before:state.group_plans[g.signature]||null,after:plan,at:plan.saved_at});state.group_plans[g.signature]=plan;const ok=persist();render();toast(ok?'组级决定已保存，逐对原票仍保留。':'组级决定仅在内存中，请导出JSON。',!ok);}catch(error){toast(error.message,true);}}));
}
function formDraft(){const f=$('#vote-form');return {choice:f.elements.choice.value,note:f.elements.note.value,evidence:[...f.querySelectorAll('input[name="evidence"]:checked')].map(x=>x.value),date:f.elements.date.value,minutes:f.elements.minutes.value};}
function saveDraft(){state.reviewer=$('#screen-reviewer').value.trim();state.drafts[selected]=formDraft();const ok=persist();$('#draft-status').textContent=ok?'草稿已保存；待提交。':'草稿仅在内存中，请导出JSON。';$('#draft-status').dataset.error=String(!ok);$('#vote-error').hidden=true;}
function submit(advance){try{const d=formDraft();state.reviewer=$('#screen-reviewer').value.trim();if(['distinct','unsure'].includes(d.choice)&&!d.note.trim())throw new Error('确认不同或不确定时，请填写具体说明。');const reason=(d.evidence.length?'已核对：'+d.evidence.map(k=>EVIDENCE[k]).join('、')+'。':'')+(d.note.trim()?' '+d.note.trim():''),v={...d,note:d.note.trim(),reason,reviewer:state.reviewer,minutes:d.minutes===''?'':Number(d.minutes),saved_at:new Date().toISOString()};validVote(v);state.audit.push({type:'pair_decision',pair_id:selected,before:state.votes[selected]||null,after:v,at:v.saved_at});state.votes[selected]=v;delete state.drafts[selected];if(advance)selected=pending();state.last_id=selected;const ok=persist();if(advance&&Object.keys(state.votes).length===176)go('groups');else render();toast(ok?'本对决定已保存。实际合并另行核验。':'记录仅在内存中，请立即导出JSON。',!ok);}catch(error){$('#vote-error').textContent=error.message;$('#vote-error').hidden=false;$('#vote-error').scrollIntoView({block:'center'});}}
function navigate(id){if(!ids.includes(id))return;selected=id;state.last_id=id;persist();if(view!=='review')go('review');else render();$('.reading-area')?.scrollIntoView({block:'start',behavior:'instant'});}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
function exportJson(prefix='176对确认'){download(JSON.stringify(pack(state,digest),null,2),'application/json;charset=utf-8',prefix+'_'+chinaDate()+'.json');}
document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-view]');if(nav){go(nav.dataset.view);return;}const pair=ev.target.closest('[data-pair]');if(pair){navigate(pair.dataset.pair);return;}const b=ev.target.closest('[data-action]');if(!b)return;try{switch(b.dataset.action){case 'resume':if(analyze(DATA,state).ready_for_handoff)go('exports');else navigate(pending());break;case 'prev':navigate(ids[Math.max(0,ids.indexOf(selected)-1)]);break;case 'next':navigate(ids[Math.min(175,ids.indexOf(selected)+1)]);break;case 'save':submit(false);break;case 'export-csv':download(reviewCsv(DATA,state),'text/csv;charset=utf-8','176对_人工确认_'+chinaDate()+'.csv');break;case 'export-json':exportJson();break;case 'export-plan':download(planCsv(DATA,state),'text/csv;charset=utf-8','176对_待执行合并草案_'+chinaDate()+'.csv');break;case 'restore':$('#restore-file').click();break;}}catch(error){toast(error.message,true);}});
$('#restore-file').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;try{if(file.size>8*1024*1024)throw new Error('文件超过8MB，请选择本批导出的JSON。');pendingImport=validPackage(JSON.parse(await file.text()),DATA,digest);const a=analyze(DATA,pendingImport);$('#import-summary').textContent=`研究者：${pendingImport.reviewer||'未填写'}；已提交 ${a.submitted}/176 对，其中明确 ${a.resolved} 对、待定 ${a.unsure} 对。`;$('#import-dialog').showModal();}catch(error){pendingImport=null;toast('未导入：'+error.message,true);}});
$('#cancel-import').addEventListener('click',()=>{pendingImport=null;$('#import-dialog').close();});$('#confirm-import').addEventListener('click',()=>{if(!pendingImport)return;exportJson('恢复前备份_176对');state=pendingImport;pendingImport=null;selected=state.last_id||ids[0];const ok=persist();$('#import-dialog').close();go('overview');toast(ok?'个人确认备份已恢复。':'已读入内存，请立即导出保存。',!ok);});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(['overview','review','groups','exports','rules'].includes(next))go(next,false);});window.addEventListener('storage',ev=>{if(ev.key===STORAGE)warn('同一浏览器的另一页面已更新记录，本页暂停写入。请先导出本页备份，再刷新读取最新进度。');});render();
</script></body></html>
