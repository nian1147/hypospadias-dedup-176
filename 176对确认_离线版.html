oi":"10.1159/000449142","pmid":"","date":"2016","journal":"Hormone Research in Paediatrics","authors":"Valleron A.-J.; Esterle L.; Mouriquand P.; Meurisse S.; Valtat S.; Bougnères P.","item_type":"journalArticle","volume":"86","issue":"(Valleron A.-J.; Meurisse S.; Valtat S.; Bougnères P.) U1169INSERM, Bicêtre, France","pages":"260","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L615915105&from=export"},"7CNVRQJL":{"key":"7CNVRQJL","record_id":"R-7CNVRQJL","title":"Measurement and correlates of ano-genital distance in healthy, newborn infants.","abstract":"Ano-genital distance (AGD) is a sexually dimorphic trait that is a well established reproductive toxicity endpoint in animals. In male animals, a shortened AGD is associated with a variety of genital abnormalities including hypospadias and cryptorchidism. Consensus on the anatomical definition of AGD in humans remains to be established and few data exist on the determinants and normal variance in the general population. We implemented a standardized anthropometric protocol to measure AGD, ano-scrotal distance (ASD), and ano-fourchette distance (AFD) in 169 (82 male, 87 female) infants in the University of Washington newborn nursery in 2008. We collected data on the following characteristics: weight, length, and occipital head circumference, race and relevant gestational complications. Using linear regression modelling, we examined AGD/ASD/AFD for sexual dimorphism, normal population variance and predictors of the measurement in infants. The mean male and female AGD measurements were 52.0 mm (SD ± 5.5) and 37.2 mm (SD ± 3.7). The mean ASD and AFD were 23.0 mm (SD ± 3.8) and 15.1 mm (SD ± 2.9). Weight, length, occipital head circumference and gestational age were associated with AGD (p \u003c 0.05). Weight and length were the most important correlates to AGD. We confirmed previous findings that AGD is a sexually dimorphic measurement that is most strongly predicted by infant weight. The application of this measurement to clinically relevant outcomes remains to be explored in further depth. © 2010 European Academy of Andrology.","doi":"10.1111/j.1365-2605.2009.01044.x","pmid":"","date":"2010","journal":"International Journal of Andrology","authors":"Sathyanarayana S.; Beard L.; Zhou C.; Grady R.","item_type":"journalArticle","volume":"33","issue":"2","pages":"317-323","issn":"0105-6263","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L358484159&from=export"},"7DIALCY6":{"key":"7DIALCY6","record_id":"R-7DIALCY6","title":"Letter to the editore re “Plate Objective Scoring Tool (POST) in distal hypospadias: Correlation with POST-repair complications\"","abstract":"","doi":"10.1016/j.jpurol.2024.02.031","pmid":"","date":"2024","journal":"Journal of Pediatric Urology","authors":"Snodgrass W.T.; Bush N.C.","item_type":"journalArticle","volume":"20","issue":"3","pages":"549-550","issn":"14775131 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85189012228?origin=resultslist"},"7HWJ5MAE":{"key":"7HWJ5MAE","record_id":"R-7HWJ5MAE","title":"Genital anomalies and risk for testicular cancer in Danish men","abstract":"In a cohort of Danish boys characterized by (1) being born between 1941 and 1957, (2) having attended schools in a defined area of Denmark, and (3) having a school health record available, 183 were registered in the Danish Cancer Registry with testicular cancer diagnosed before January 1, 1985. We selected 366 age- and sex-matched controls from the same cohort. Using information recorded by school physicians, we performed logistic regression analyses to estimate the relative risks (RR) associated with various genital anomalies. We found the risk for testicular cancer to be raised for men with a history of cryptorchidism [RR = 5.2; 95% confidence interval (CI) = 2.1- 13.0], inguinal hernia (RR = 1.8; 95% CI = 0.9-3.7), hypospadias (RR = 4.2; 95% CI = 0.4-42.7), and hydrocele (RR = 2.4; 95% CI = 0.6-9.0). We observed no decrease in the risk associated with cryptorchidism after correction of the maldescent in early childhood. The RR of testicular cancer in the contralateral, normally descended testis in unilateral cryptorchid men was increased to 3.6. The results add to the growing evidence for a common causal factor for both testicular cancer and cryptorchidism and support the findings from other studies of associations between other genital anomalies involving the closure of the processus vaginalis and the risk of testicular cancer.","doi":"10.1097/00001648-199601000-00004","pmid":"","date":"1996","journal":"Epidemiology","authors":"Prener A.; Engholm G.; Jensen O.M.","item_type":"journalArticle","volume":"7","issue":"1","pages":"14-19","issn":"10443983 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0030064242?origin=resultslist"},"7RG5KS3S":{"key":"7RG5KS3S","record_id":"R-7RG5KS3S","title":"Endocrine disruptors and hypospadias in Gran Canaria island (2012-2015)","abstract":"OBJECTIVE: Hypospadias represents the most frequent male congenital malformation in children, with a prevalence of 1 in 200-300 new born or 4-6 in 1000 male new born. Genetic and environmental factors play a strong role on developing this virilization defect acting as endocrinal disruptors (ED). The objective of the present study was to evaluate the environmental factors that may have influenced the development oh hypospadias in children treated at the Maternal and Child University Hospital od Las Palmas of Gran Canaria Island during the years 2012-2015. METHODS: The present study represents a retrospective analysis of patients treated for hypospadias in the Maternal-Paediatric University Hospital of Las Palmas of Gran Canaria during 4 years (2012 -2015) by the use of medical records and telephone survey to families' patients. To perform the statistical analysis of the data, the SPSS program was used in version 15.0. The level of statistical significance was established for an error α = 0.05. The chi-square test and Fisher's correction were applied if necessary to test the associations between the qualitative variables. RESULTS: From 2012 to 2015, 128 patients were treated; we could only follow 116 patients. If we analyse patients' distribution throught those years we can resume that 33% of them were treated in 2012, 23% in 2013, 24% in 2014 and 20% in 2015. We analyse the study background of both parents: 45.5% of mothers had primary studies, 37.5% had secundary studies, 15.2% had university studies and 1.8% were students; 54.3% of fathers had primary studies, 32.4% had secundary studies and 13.3% had university studies. We did not found any statistically significant diference between the place of residence and the study background both in mothers (p=0,262) and fathers (p=0,052). Within all the patients followed, 78 had a clinical history of exposition to ED as a direct family background. CONCLUSIONS: The chronical exposure to ED, very frequent in our society, is a very important risk factor in the development of urologic pathologies as hypospadias; for this reason, awareness measures and prevention in social areas and workplace must be carried out to avoid unnecessary exposures.; OBJETIVO: El hipospadias es la malformación congénita genital masculina más frecuente en niños, con una prevalencia de 1 cada 250 recién nacidos de sexo masculino. Se especula que pueden existir factores genéticos y/o medioambientales que predisponen a este defecto de virilización actuando como disruptores endocrinos (DE). El objetivo del presente estudio fue evaluar los factores medio ambientales que puedan haber influido en el desarrollo del hipospadias en los niños tratados en el Hospital Universitario Materno Infantil de Las Palmas de Gran Canarias en los años 2012-2015. METODOS: El presente estudio representa un análisis retrospectivo de los casos de hipospadias tratados en el Hospital Universitario Materno Infantil de Las Palmas de Gran Canaria entre el 2012 y el 2015, tras la revisión de las historias clínicas y la realización de una encuesta telefónica a los padres de los pacientes tratados. Para realizar el análisis estadístico de los datos, se utilizó el programa SPSS en la versión 15.0. El nivel de significación estadística se estableció para un error α=0.05. Se aplicó el test de chi cuadrado y la corrección de Fisher en caso de que fuera necesario para testar las asociaciones entre las variables cualitativas. RESULTADOS: Durante el periodo de estudio se trataron a 128 pacientes de los cuales se siguieron a 116. Si analizamos su distribución por años, el 33% de los pacientes fueron tratados en el año 2012, el 23% en el 2013, el 24% en el 2014 y el 20% en el 2015. En relación al nivel de estudio de la familia, el 45.5% de las madres tenían estudios primarios, el 37.5% estudios secundarios, el 15.2% estudios universitarios y el 1.8% eran estudiantes. En relación a los padres, el 54.3% tenían estudios primarios, el 32.4% estudios secundarios y el 13.3% estudios universitarios. No se encontraron diferencias estadísticamente significativas entre el municipio de residencia y el nivel de estudio de las madres (p=0,262) y de los padres (p=0,052). De los 116 pacientes analizados, 78 tenían antecedentes familiares directos con exposición a disruptores endocrinos. CONCLUSIONES: La exposición a agentes químicos nocivos y pesticidas, cada vez más habitual en nuestra sociedad, constituye un factor de riesgo para el padecimiento de enfermedades del tracto urológico inferior como el hipospadias, por lo que se deberían tomar medidas de concienciación y prevención en el ámbito social y laboral frente a la exposición a dichos agentes.","doi":"","pmid":"","date":"2018","journal":"Revista espanola de salud publica","authors":"Germani M.; Fiuza Pérez M.D.; Sánchis Solera L.; Hernández González L.; García Hernández J.Á.","item_type":"journalArticle","volume":"92","issue":"","pages":"","issn":"21739110 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85056388116?origin=resultslist"},"7SXM78RW":{"key":"7SXM78RW","record_id":"R-7SXM78RW","title":"This month in pediatric urology","abstract":"","doi":"10.1016/j.juro.2014.05.029","pmid":"","date":"2014","journal":"Journal of Urology","authors":"Ritchey M.L.","item_type":"journalArticle","volume":"192","issue":"2","pages":"293-294","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84923080036?origin=resultslist"},"7VQ9WTFP":{"key":"7VQ9WTFP","record_id":"R-7VQ9WTFP","title":"尿道下裂尿道板纵切卷管尿道成形术后尿道狭窄危险因素分析","abstract":"目的探讨尿道下裂尿道板纵切卷管尿道成形术(tubularized incised plat urethroplasty, TIP)后发生尿道狭窄的危险因素, 以期提高尿道下裂的治疗效果。方法回顾性分析2019年1月至2022年1月安徽医科大学附属省儿童医院收治的首诊为尿道下裂且手术方式为TIP术式患儿的临床资料, 并收集术后并发症情况及随访结果。符合纳入标准的患儿共190例, 157例获完整随访, 排除相关病例后最终纳入研究患儿共122例, 患儿中位年龄为31个月;术前尿道开口于冠状沟处63例, 阴茎体处38例, 阴茎阴囊交界处21例;采用二分类logistic回归分析TIP术后尿道狭窄的潜在影响因素。结果所有患儿中, 85例阴茎下弯≤35°, 尿道板平整81例, 矫正下弯后尿道缺损长度2 cm有70例, 83例阴茎头直径1.4 cm;40例舟状窝宽度4.25 mm;留置尿管时长14 d有21例, 21 d有101例。患儿随访时间为7～43个月, 随访成功率82.6%(157/190)。发生并发症59例(37.6%, 59/157), 其中尿道皮肤瘘32例(20.4%, 32/157)、尿道狭窄28例(17.8%, 28/157)、阴茎头裂开4例(2.5%, 4/157)。对122例尿道下裂患儿TIP术后发生尿道狭窄的相关变量进行单因素分析发现, 矫正阴茎下弯后尿道缺损长度2 cm的患儿中8例发生术后狭窄, 而≥2 cm的患儿中有16例, 差异具有统计学意义(P=0.008);尿道板平整与欠光滑的患儿发生尿道狭窄分别为11例和13例(P=0.017);此外阴茎下弯程度(P=0.019)和舟状窝宽度(P=0.013)也是TIP术后尿道狭窄的危险因素。而手术时年龄、阴茎头直径、尿道开口位置及术后留置尿管时长与术后尿道狭窄无关(P0.05)。多因素logistic回归分析结果显示, 矫正阴茎下弯后尿道缺损长度(OR=0.333, 95%CI:0.121～0.914)是TIP术后发生尿道狭窄的独立危险因素(P=0.033)。结论矫正阴茎下弯后尿道缺损长度是TIP术后发生尿道狭窄的重要影响因素, 对于尿道缺损较大者需谨慎选择TIP术式。","doi":"10.3760/cma.j.cn421158-20220913-00570","pmid":"","date":"2023","journal":"中华小儿外科杂志","authors":"孙起航; 张晔; 张殷; 蒋加斌; 方向; 李道龙; 潮敏","item_type":"journalArticle","volume":"44","issue":"6","pages":"545-550","issn":"0253-3006","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORINeHJ3azIwMjMwNjAxMhoIcmI2eDJhNGE%3D"},"827JRQZ7":{"key":"827JRQZ7","record_id":"R-827JRQZ7","title":"The Impact of Perioperative and Operative Variables on Early Postoperative Complications Following Primary Hypospadias Repair.","abstract":"OBJECTIVE: To evaluate possible risk factors for complications following primary hypospadias repair relative to factors associated with timing of hypospadias  repair in terms of case order, morning or afternoon scheduling, perioperative  delays, and surgeon's daily work schedule as well as individual operative  techniques. METHODS: We retrospectively reviewed charts of 422 boys undergoing  primary hypospadias repair with a sutured urethroplasty by 1 of 3 surgeons over a  10-year period and the surgeon's daily schedule. RESULTS: The median age and IQR  of the patients at time of operation was 0.79 (0.57) years, and median follow-up  was 259 (664) days. A significant increase in the rate of any complication was  noted with morning vs afternoon cases for the group overall with morning cases  having a hazard 2.3 times higher than afternoon cases (P =.012). Additionally,  there was a significant increase in hazard of complication with increasing  difference in time between actual procedure duration vs scheduled duration, with  hazard of complication increasing 5% for each increase of 15 minutes of surgical  time (P =.043). CONCLUSION: A variety of previously identified potential risk  factors for hypospadias complications were identified. Our analysis also  demonstrated variability in level of risk of different factors between surgeons,  reinforcing the utility of surgeons monitoring their own results in response to  changes in technique. Novel potential risk factors for some surgeons identified  in our study included an increased risk of complications when the hypospadias was  done in the morning rather than the afternoon and when the procedure lasted  longer than scheduled.","doi":"10.1016/j.urology.2022.08.002","pmid":"35970358","date":"2022 Dec","journal":"Urology","authors":"Storm Douglas W.; Lockwood Gina M.; Bonnett Megan A.; Cooper Benjamin J.; Harris Logan M.; Cooper Christopher S.","item_type":"journalArticle","volume":"170","issue":"","pages":"184-188","issn":"1527-9995 0090-4295","isbn":"","url":""},"84S3YLJJ":{"key":"84S3YLJJ","record_id":"R-84S3YLJJ","title":"Adulthood cosmetic and sexual outcomes of the patients who underwent hypospadias repair in childhood","abstract":"This study aimed to assess the cosmetic and sexual outcomes of childhood hypospadias repair after puberty. Among 672 patients who underwent hypospadias repair between 2001 and 2017, 243 sexually active patients were included in the study. At their last visit, cosmetic and sexual evaluation were done through the Penile Perception Score, the Hypospadias Objective Scoring Evaluation, IIEF, MSHQ-EjD. The levels of erectile dysfunction(ED) severity were determined according to erectile function domain of IIEF. The median follow-up after the last surgery was 16 [IQR (13–18)] years, and median patient age at the time of study was 19.67 [IQR(18–22)] years. Patients were divided into two subgroups as follows: Group I; Repairs using grafts (n = 120, 49.4%) and Group II; Graft-free repairs (n = 123, 50.6%). The rate of dissatisfaction with penile appearance was higher in Group I (16.7% vs. 4.9%, p = 0.003). Mild ED was more frequent in Group I (14.2% vs. 3.3%, p = 0.007); while none of the patients had either moderate or severe ED. Other domains of sexual function were observed to be similar in both groups. The need for unwanted interventions due to complications, and surgeries requiring grafts were found to be risk factors for ED development and dissatisfaction with penile appearance in adulthood. Those who underwent graft-free hypospadias repair experience better cosmetic and sexual outcomes when compared to grafted repairs, yet, satisfactory results were achieved in almost 90% of the grafted repairs. © The Author(s), under exclusive licence to Springer Nature Limited 2024.","doi":"10.1038/s41443-024-00971-x","pmid":"","date":"2025","journal":"International Journal of Impotence Research","authors":"Selvi I.; Dönmez M.İ.; Aydın A.B.; Oktar T.; Ziylan O.","item_type":"journalArticle","volume":"37","issue":"7","pages":"527-535","issn":"09559930 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85202152779?origin=resultslist"},"8EMPLB7I":{"key":"8EMPLB7I","record_id":"R-8EMPLB7I","title":"Birth prevalence of hypospadias and hypospadias risk factors in newborn males in the United States from 1997 to 2012","abstract":"","doi":"10.1016/j.jpurol.2018.11.010","pmid":"","date":"2019","journal":"Journal of pediatric urology","authors":"Routh J. C.","item_type":"journalArticle","volume":"15","issue":"1","pages":"103-104","issn":"1477-5131","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGEyYzdkZDdlM2I1MTMzN2UxNWNhZjA5MjFlODA1YTAxGghyYjZ4MmE0YQ%3D%3D"},"8EVBE84U":{"key":"8EVBE84U","record_id":"R-8EVBE84U","title":"Prevalence and risk factors for penile lesions/anomalies in a cohort of Brazilian men ≥ 40 years of age.","abstract":"PURPOSE: To report the prevalence and risk factors of penile lesions/anomalies in a Metropolitan Brazilian city. MATERIALS AND METHODS: All participants undergoing  prostate cancer screening in the city of Curitiba were systematically examined to  identify penile lesions including cutaneous mycosis, sexually transmitted  diseases, penile cancer, meatal stenosis, hypospadias, and Peyronie's disease.  Outcomes of interest included the prevalence and the relative risk and 95%  confidence intervals of the lesions/anomalies according to age, school level,  race, personal history of diabetes, arterial hypertension, nonspecific  urethritis, and vasectomy. RESULTS: Balanoposthitis occurred in 11.8% of all  participants, with an increased risk in those with diabetes (RR = 1.73), or past  history of nonspecific urethritis (RR = 1.58); tinea of the penis was present in  0.2% ; condyloma acuminata in 0.5% ; herpes virus infection in 0.4% ; urethral  discharge in 0.2% ; genital vitiligo in 0.7%, with an increased prevalence in  non-white men (RR = 4.43), and in subjects with lower school level (RR = 7.24);  phimosis in 0.5%, with a nearly 7-fold increased risk in diabetics; lichen  sclerosus in 0.3%; stenosis of the external urethral meatus in 0.7%, with a  higher prevalence in subjects with lichen sclerosus (RR = 214.9), and in those  older than 60 years of age (RR = 3.57); hypospadia in 0.6%; fibrosis suggestive  of Peyronie's disease in 0.9%, especially in men older than 60 years (RR = 4.59)  and with diabetes (RR = 3.91); and penile cancer in 0.06%. CONCLUSION: We  estimated the prevalence and risk factors of commonly seen penile diseases in an  adult cohort of Brazilian men.","doi":"10.1590/S1677-5538.IBJU.2013.01.08","pmid":"","date":"2013","journal":"International Braz J Urol","authors":"Romero Frederico R.; Romero Antonio W.; Almeida Rui Manuel S. de; Oliveira Fernando Cesar de Jr; Filho Renato Tambara Jr","item_type":"journalArticle","volume":"39","issue":"1","pages":"55-62","issn":"16775538 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84878437309?origin=resultslist"},"8G3E3SIN":{"key":"8G3E3SIN","record_id":"R-8G3E3SIN","title":"Environmental antiandrogens: Low doses of the fungicide vinclozolin alter sexual differentiation of the male rat","abstract":"In humans and rodents, exposure to antiandrogenic chemicals during sexual differentiation can produce malformations of the reproductive tract. Perinatal administration of 100 or 200 mg vinclozolin (V) kg−1day−1during sexual differentiation in rats induces female-like anogenital distance (AGD), retained nipples, cleft phallus with hypospadias, suprainguinal ectopic scrota/testes, a vaginal pouch, epididymal granulomas, and small to absent sex accessory glands in male offspring. Vinclozolin is metabolized to at least two active forms, M1 and M2, that display antiandrogenic activity by binding the androgen receptor (AR). Here, we present information on the reproductive effects of oral treatment with low dosage levels of V during sexual differentiation of the male rat. Vinclozolin was administered to the dam at 0, 3.125, 6.25, 12.5, 25, 50, or 100 mg kg−1day−1from gestational day 14 to postnatal day 3 (the period of fetal/neonatal testicular testosterone synthesis and sexual differentiation). At doses of 3.125 mg V kg−1and above, AGD was significantly reduced in newborn male offspring and the incidence of areolas was increased. These effects were associated with permanent alterations in other androgen-dependent tissues. Ventral prostate weight in one year old male offspring was reduced in all treatment groups (significant at 6.25, 25, 50, and 100 mg kg−1day−1), and permanent nipples were detected in males at 3.125 (1.4%), 6.25 (3.6%), 12.5 (3.9%), 25 (8.5%), 50 (91%), and 100 (100%) mg V kg−1day−1. To date, permanent nipples have not been observed in a control male from any study in our laboratory. Vinclozolin treatment at 50 and 100 mg kg−1day−1induced reproductive tract malformations and reduced ejaculated sperm numbers and fertility. Even though all of the effects of V likely result from the same initial event (AR binding), the different endpoints displayed a wide variety of dose-response curves and ED50's. The dose-response data for several of the functional endpoints failed to display an obvious threshold. These data demonstrate that V produces subtle alterations in sexual differentiation of the external genitalia, ventral prostate, and nipple tissue in male rat offspring at dosage levels below the previously described no-observed-effect-level (NOEL). These effects occur at a dosage level an order of magnitude below that required to induce malformations and reduce fertility. Hence, multigenerational reproduction studies of antiandrogenic chemicals that were not conducted under the Environmental Protection Agency's new Harmonized Multigenerational Test Guidelines, which include endpoints sensitive to antiandrogens at low dosage levels, could yield a NOEL that is at least an order of magnitude too high. © 1999, Sage Publications. All rights reserved.","doi":"10.1177/074823379901500106","pmid":"","date":"1999","journal":"Toxicology and Industrial Health","authors":"Gray Jr. L.E.; Ostby J.; Monosson E.; Kelce W.R.","item_type":"journalArticle","volume":"15","issue":"2","pages":"48-64","issn":"07482337 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0343962125?origin=resultslist"},"8MEKQJHK":{"key":"8MEKQJHK","record_id":"R-8MEKQJHK","title":"Letter to the Editor","abstract":"in distal hypospadias: correlation with post25 online ahead of print. There is obvious interest in identifying factors that might affect outcomes in distal pose their POST score of urethral plate configuration and report it accurately predicted complications after distal TIP repair. Given that their primary outcome was complications, it is curious that the most common complication after hypospadias repair - fistulas - was not reported. Adding in those could very well change their results. Furthermore, their title mentions outcomes in distal hypospadias, yet nearly 25% of their patients actually had a midshaft meatus and these patients had more than double the","doi":"10.1016/j.jpurol.2024.02.031","pmid":"","date":"2024 JUN","journal":"JOURNAL OF PEDIATRIC UROLOGY","authors":"Snodgrass WT; Bush NC","item_type":"journalArticle","volume":"20","issue":"3","pages":"549-550","issn":"1477-5131 1873-4898","isbn":"","url":""},"8P7VR273":{"key":"8P7VR273","record_id":"R-8P7VR273","title":"NR5A1 gene mutation: Variable phenotypes, new variants, different outcomes","abstract":"Introduction: NR5A1 (nuclear receptor subfamily 5 group A member 1) is a transcriptional regulator of adrenal and gonadal development and function. Heterozygous and homozygous NR5A1 mutations have been described in 46, XY disorders of sex development (DSD). The clinical, endocrine and genetic features of three 46, XY children from two unrelated families (A and B) with NR5A1 genetic variants are reported. Patients and Methods: Two sisters from family A and a boy from family B were studied. Endocrine parameters were assessed by standard laboratory methods. NGS analysis was performed using Sure Select (Agilent) customized DSD panel and captured products were sequenced by Miseq (Illumina) Results: Two sisters (14.5 years; 13.9 years) were referred for evaluation of absent pubertal development. On clinical examination, they showed breast development Tanner Stage 1, pubic hair Tanner Stage V. Genital examination demonstrated clitoromegaly, and presence of a single orifice compatible with persistence of the urogenital sinus. Endocrine assessment demonstrated low estradiol levels with elevated gonadotrophins in both the sisters (basal FSH 87.49 IU/L and 135.10 UI/L respectively, basal LH 20 IU/L and 30 IU/L, respectively). Increased testosterone for females normative values were also found. Karyotype was 46, XY. Pelvic ultrasound did not shown any Müllerian structures; gonads were not individuated. According with parents, female sex was confirmed in both sisters after deep psychological investigation and gonads removed. The boy presented at the age 18 months for bilateral undescended testes and severe peno-scrotal hypospadias. At puberty, he showed slow pubertal progression with low testicular volume. His endocrine data demonstrated hypergonadotropic hypogonadism (FSH 63 IU/l; LH 14.4 IU/l; testosterone 2.5 ng/ml and normal adrenal function. Using a DSD 14-gene next generation sequencing (NGS) panel, we identified two heterozygous missense NR5A1 variants in the patients: c.248T>A, p. Val83Glu in the sister; c.937C>T, p. Arg313Cys in the boy. The former was predicted pathogenetic by in silico analysis, the latter was reported in HGMD database (CM118686) and previously identified in 46, XY DSD italian patient. Sex related hormonal substitutive therapy was started. All the children presented good psycho-social outcome according to assigned sex. Conclusions: Present data confirmed that NR5A1 gene mutations may present with variable genital phenotypes. Anyway, reproductive function was impaired. Any clinical or endocrine data seem to be unable to differentiate these patients from other 46, XY DSD. In persons with NR5A1 mutations, different decisions in sex assignment may permit good somatic and psychological outcome, but any option requires optimal substitutive therapy.","doi":"10.1159/000501868","pmid":"","date":"2019","journal":"Hormone Research in Paediatrics","authors":"Faienza M.F.; Wasniewska M.G.; Chiarito M.; Corica D.; Carilo M.A.; Baldinotti F.; Bertelloni S.","item_type":"journalArticle","volume":"91","issue":"(Faienza M.F.) Department of Biomedical Sciences and Human Oncology, Pediatric Section, University of Bari A. Moro, Bari, Italy","pages":"602-603","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630603937&from=export"},"8PFMDC4J":{"key":"8PFMDC4J","record_id":"R-8PFMDC4J","title":"早产、低出生体重与尿道下裂发生风险关系的meta分析","abstract":"目的:探讨早产、低出生体重与尿道下裂发生风险的相关性。方法:参照Cochrance协作网检索策略，检索自数据库建立至2022年4月中国知网、维普网、万方数据库、Pubmed、Cochrance、Embase等中英文数据库，纳入有关早产、低出生体重与尿道下裂发生风险之间关系的文献，对早产、低出生体重与尿道下裂发生风险之间的关系进行meta分析。结果:检索筛选共纳入13篇文献，病例来自亚洲、欧洲、澳洲、美洲，采用Newcastle-Ottawa Scale评价，均为>6分。其中早产与尿道下裂发生风险之间关系的文献10篇，均为病例对照研究，异质性检验 I2＝46%， P＝0.05，病例组3 521例，对照组95 816例，与对照组比较，早产为尿道下裂发生的危险因素( OR：2.13，95% CI：1.89~2.41)，差异有统计学意义( Z＝12.21， P\u003c0.01)。低出生体重与尿道下裂发生风险之间关系的文献11篇，均为病例对照研究，异质性检验 I2＝47%， P＝0.04，病例组2 460例，对照组94 260例，与对照组比较，低出生体重为尿道下裂发生的危险因素( OR：3.29，95% CI：2.57~4.22)，差异有统计学意义( Z＝9.40， P\u003c0.01)。 结论:现有发表文献的meta分析结果显示，早产、低出生体重会增加尿道下裂的发生风险。","doi":"10.3760/cma.j.cn431274-20220601-00526","pmid":"","date":"2023","journal":"中国医师杂志","authors":"胡建军; 赵夭望; 陈毅夫; 祖建成; 王智; 彭柳成","item_type":"journalArticle","volume":"25","issue":"1","pages":"16-22,27","issn":"1008-1372","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemd5c3p6MjAyMzAxMDA0GghyYjZ4MmE0YQ%3D%3D"},"8PN4LLSC":{"key":"8PN4LLSC","record_id":"R-8PN4LLSC","title":"Children's health and the environment: A new agenda for prevention research","abstract":"Patterns of illness in American children have changed dramatically in this century. The ancient infectious diseases have largely been controlled. The major diseases confronting children now are chronic and disabling conditions termed the \"new pediatric morbidity\" - asthma mortality has doubled; leukemia and brain cancer have increased in incidence; neurodevelopmental dysfunction is widespread; hypospadias incidence has doubled. Chemical toxicants in the environment as well as poverty, racism, and inequitable access to medical care are factors known and suspected to contribute to causation of these pediatric diseases. Children are at risk of exposure to over 15,000 high-production-volume synthetic chemicals, nearly all of them developed in the past 50 years. These chemicals are used widely in consumer products and are dispersed in the environment. More than half are untested for toxicity. Children appear uniquely vulnerable to chemical toxicants because of their disproportionately heavy exposures and their inherent biological susceptibility. To prevent disease of environmental origin in America's children, the Children's Environmental Health Network (CEHN) calls for a comprehensive, national, child-centered agenda. This agenda must recognize children's vulnerabilities to environmental toxicants. It must encompass a) a new prevention-oriented research focus, b) a new child-centered paradigm for health risk assessment and policy formulation; and c) a campaign to educate the public, health professionals, and policy makers that environmental disease is caused by preventable exposures and is therefore avoidable. To anchor the agenda, CEHN calls for longterm, stable investment and for creation of a national network of pediatric environmental health research and prevention centers.","doi":"10.2307/3434190","pmid":"","date":"1998 JUN","journal":"ENVIRONMENTAL HEALTH PERSPECTIVES","authors":"Landrigan PJ; Carlson JE; Bearer CF; Cranmer JS; Bullard RD; Etzel RA; Groopman J; McLachlan JA; Perera FP; Reigart JR; Robison L; Schell L; Suk WA","item_type":"journalArticle","volume":"106","issue":"","pages":"787-794","issn":"0091-6765","isbn":"","url":""},"8PYU2N2L":{"key":"8PYU2N2L","record_id":"R-8PYU2N2L","title":"Mutations in the DEAH-box RNA Helicase DHX 37 are a frequent cause of 46,XY gonadal dysgenesis and 46,XY testicular regression syndrome","abstract":"XY individuals with Disorders/Differences of Sex development (DSD) are characterized by reduced androgenization caused, in some children, by gonadal dysgenesis or, more rarely, testis regression during early fetal development. The genetic etiology for most patients with 46,XY gonadal dysgenesis and for all patients with testicular regression syndrome (TRS) is unknown. Identification of novel genes involved in DSD is crucial for providing an accurate clinical diagnosis, aiding patient management and understanding the biological processes involved. We performed exome and/or Sanger sequencing in 145 individuals with 46,XY DSD of unknown etiology gonadal dysgenesis (n=81), TRS (n=16), boys with penoscrotal hypospadias (n=33) or anorchia (n=15). Thirteen children carried heterozygous missense mutations involving the RNA helicase DHX37, which is essential for ribosome biogenesis in yeast. Enrichment of rare/novel DHX37 missense mutations in 46,XY DSD is highly significant compared to controls (P value = 5.8x10-10). Five mutations are de novo (P value = 1.5x10-5). Twelve mutations are grouped in two highly conserved functional domains and are predicted to disrupt biological function. Mutations were specifically associated with gonadal dysgenesis (9/81, 11%) and TRS (4/16, 25%). Consistent with a role in early testis development, DHX37 is expressed specifically in somatic cells of the developing human and mouse testis. DHX37 mutations are a relatively common cause of an autosomal dominant form of 46,XY DSD, which includes both gonadal dysgenesis and TRS, showing that these conditions are part of a clinical spectrum. This raises the possibility that some forms of DSD may be a ribosomopathy.","doi":"10.1159/000501868","pmid":"","date":"2019","journal":"Hormone Research in Paediatrics","authors":"McElreavey K.; Jorgensen A.; Eozenou C.; Merel T.; Bignon-Topalovic J.; Tan D.; Houzelstein D.; Buonocore F.; Warr N.; Kay R.; Peycelon M.; Siffroi J.-P.; Mazen I.; Achermann J.; Shcherbak Y.; Leger J.; Sallai A.; Carel J.-C.; Martinerie L.; Le Ru R.; Conway G.; Mignot B.; Van Maldergem L.; Bertalan R.; Globa E.; Brauner R.; Jauch R.; Nef S.; Greenfield A.; Bashamboo A.","item_type":"journalArticle","volume":"91","issue":"(McElreavey K.; Eozenou C.; Merel T.; Bignon-Topalovic J.; Houzelstein D.; Bashamboo A.) Institut Pasteur, Paris, France","pages":"51","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630603848&from=export"},"8QL3RMTJ":{"key":"8QL3RMTJ","record_id":"R-8QL3RMTJ","title":"尿道下裂行尿道板纵切卷管尿道成形术后尿道梗阻的危险因素分析","abstract":"目的:探讨尿道下裂行尿道板纵切卷管尿道成形术(tubularized incised plate urethroplasty，TIP)后发生尿道梗阻的相关危险因素。方法:本研究为病例对照研究，收集2019年1月至2022年12月在山东第一医科大学附属省立医院小儿泌尿外科初次接受TIP手术治疗的253例尿道下裂患儿临床资料，包括术前尿道外口位置、阴茎头宽度、阴茎头处尿道板宽度、阴茎下弯角度、切开后尿道板宽度、成形尿道长度、留置尿管型号、随访时冠口距和尿道外口长度，以及术后排尿情况及发生尿道梗阻后处理情况。根据是否发生尿道梗阻分成尿道梗阻组和无尿道梗阻组，比较两组临床指标差异，并通过单因素及多因素Logistic回归分析筛选发生尿道梗阻的独立危险因素。结果:无尿道梗阻组185例；尿道梗阻组68例，其中真性梗阻39例，无排尿费力症状但尿线细29例。单因素分析显示，两组阴茎头处尿道板宽度( P＝0.005)、脱套后阴茎下弯角度( P＝0.004)、成形尿道长度( P\u003c0.001)，以及随访时冠口距( P＝0.012)和尿道外口长度( P\u003c0.001)差异均具有统计学意义( P\u003c0.05)。多因素分析显示，阴茎头处尿道板宽度( P＝0.015)、成形尿道长度( P＝0.037)及随访时尿道外口长度( P\u003c0.001)是TIP手术后发生尿道梗阻的独立危险因素。受试者操作特征曲线分析显示，阴茎头处尿道板宽度、成形尿道长度及随访时尿道外口长度预测TIP手术后发生尿道梗阻的最佳截断值分别为6.5 mm、15.5 mm和3.5 mm。 结论:阴茎头处尿道板宽度\u003c6.5 mm、成形尿道长度>15.5 mm及随访时尿道外口长度\u003c3.5 mm是尿道下裂TIP手术后发生尿道梗阻的独立危险因素，对于阴茎头处尿道板发育较差及近端型尿道下裂应慎重选择TIP术式，手术时应注意确保阴茎头段尿道通畅和尿道外口的适度宽大。","doi":"10.3760/cma.j.cn101785-202509031","pmid":"","date":"2026","journal":"临床小儿外科杂志","authors":"李洁; 王衍泽; 杜国强; 吴荣德; 刘伟","item_type":"journalArticle","volume":"25","issue":"2","pages":"153-158","issn":"1671-6353","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRbGN4ZXdrenoyMDI2MDIwMTAaCHJiNngyYTRh"},"8VCE5VHC":{"key":"8VCE5VHC","record_id":"R-8VCE5VHC","title":"Research Status of Epidemiology and Risk Factors of Hypospadias","abstract":"Hypospadias is the second most common malformation of the male genitalia. In recent 20 to 40 years, there are conflicting reports about the overall morbidity of hypospadias worldwide, and the etiology and pathogenesis are not fully clear. Moreover, there are geographical, regional and ethnic differences in the prevalence of hypospadias. At present, most of the research data are from abroad. In contrast, the investigation of epidemiology and risk factors is lacking domestically. In this article, the research status of epidemiology and risk factors of hypospadias were reviewed, in order to provide an assistance for future research in this field. Copyright © 2017 by the Chinese General Practice.","doi":"10.3969/j.issn.1007-9572.2017.06.y38","pmid":"","date":"2017","journal":"Chinese General Practice","authors":"Xu G.-S.; Ni J.-X.; Xue Q.; Yu L.","item_type":"journalArticle","volume":"20","issue":"30","pages":"3827-3834","issn":"10079572 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85050480512?origin=resultslist"},"8ZQ5VMZK":{"key":"8ZQ5VMZK","record_id":"R-8ZQ5VMZK","title":"Impact of three urethral stent types on outcomes following one-stage hypospadias repair: a multi-center retrospective controlled study","abstract":"PurposeTo evaluate whether the double cannula urethral stents (DCUS) are superior to traditional silicone Foley catheters (FC) or gastric tubes (GT) in hypospadias repair to decrease complications.Patients and methodsThis retrospective cohort study included 224 patients with hypospadias who underwent placement with DCUS (group DCUS), FC (group FC), and GT (group GT) after hypospadias repair between August 2019 and June 2023. The occurrence of early and late complications was assessed. The occurrence of complications in the three groups was compared, and the important contributing factors of urinary fistula and glans dehiscence were determined.ResultsA total of 224 patients, 86 in FC, 59 in GT, and 79 in the DCUS group, met the inclusion criteria. Postoperative early complications in the DCUS group were significantly lower than those in the FC group (P = 0.002), but there was no significant difference between the GT and FC group (P = 0.390), or between the GT and DCUS group (P = 0.065). Postoperative late complications in the DCUS group were significantly lower than those in the FC group (P = 0.040), and there was no significant difference between the GT and FC group (P = 0.422), or between the GT and DCUS group (P = 0.325). Logistic regression showed that age (p = 0.030) and stent type (p = 0.048) were important risk factors for urethral fistula, while glans width (p = 0.016) was an important risk factor for glans dehiscence.ConclusionsDCUS reduced the occurrence of complications compare to FC and GT after hypospadias repair, offering practical value for clinical application.","doi":"10.1007/s00345-025-05724-z","pmid":"","date":"2025","journal":"World journal of urology","authors":"Cao Hualin; Li Pin; Tao Yuandong; Yi Xiaoyu; Liu Honghong; Chen Xiaoye; Liao Songbai; Jia Hongshuai; Zhang Xiaowei; Jiang Xincheng; Ye Weijing; Zhou Huixia","item_type":"journalArticle","volume":"43","issue":"","pages":"Article: 334","issn":"0724-4983","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDAyMDc5YzFhOGY4Zjc1OTk5MjE2OWVmOTAxMDcwYmM0GghyYjZ4MmE0YQ%3D%3D"},"97JVV8PR":{"key":"97JVV8PR","record_id":"R-97JVV8PR","title":"Proximal Hypospadias and Acquired Cryptorchidism: Incidence, Morphology and Potential Clinical Implications","abstract":"Purpose:We identified the incidence of acquired cryptorchidism among patients with proximal and mid shaft hypospadias, predictors of acquired cryptorchidism, and the prevalence of testis-epididymis nonfusion with ascended testes. We hypothesized that proximal hypospadias would be associated with higher incidence of acquired cryptorchidism than mid shaft hypospadias, and that ascended testes would exhibit increased prevalence of testis-epididymis nonfusion similar to anatomical findings in an undescended testis.Materials and Methods:A retrospective cohort study of patients who underwent primary proximal and mid shaft hypospadias repair from 2010 to 2016 was conducted. Clinical and operative notes were reviewed. Patients with congenitally undescended testes or differences of sex development were excluded.Results:A total of 175 patients were identified. Those with proximal hypospadias (14/104, 13%) were more likely than those with mid shaft hypospadias (1/71, 1%) to develop acquired cryptorchidism (p=0.04). Among proximal hypospadias patients, increased risk of acquired cryptorchidism was associated with pre-Term birth (p \u003c0.01) and penoscrotal transposition (p=0.01) but not with testis position on initial examination (p >0.99). In the 14 proximal hypospadias patients with acquired cryptorchidism, 21 ascended testes underwent orchiopexy. Operative notes adequately described testis-epididymis anatomy for 8/21 ascended testes. Testis-epididymis nonfusion was described in 6/8 ascended testes.Conclusions:Risk of acquired cryptorchidism is increased among patients with proximal hypospadias. Operative notes revealed a high rate of epididymal nonfusion with ascended testes, suggesting these testes morphologically resemble undescended testes. Close followup of testis position is needed in these patients, and the threshold to perform orchiopexy may need to be lower in select patients. © 2021 Lippincott Williams and Wilkins. All rights reserved.","doi":"10.1097/JU.0000000000001944","pmid":"","date":"2021","journal":"Journal of Urology","authors":"D'Oro A.; Rosoklija I.; Yerkes E.B.; Lindgren B.W.; Rychlik K.; Cheng E.Y.","item_type":"journalArticle","volume":"206","issue":"5","pages":"1292-1298","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85118283380?origin=resultslist"},"984BZKIM":{"key":"984BZKIM","record_id":"R-984BZKIM","title":"Analysis in the influence factors of urethroplasty in DSD","abstract":"Background: At present, there is no specific research on the factors affecting the success rate of urethroplasty in patients with DSD. The purpose of this study is to explore the factors affecting the success of urethroplasty in DSD patients, and to provide some reference for the surgical treatment of DSD patients undergoing urethroplasty. Method: We reviewed patients with DSD who underwent urethroplasty from January 2016 to December 2019 retrospectively. Patients were divided into four groups: the successful group, the urethrocutaneous fistula group, the urethral diverticulum group, and the urethral stricture group. Risk factors were determined from the following data included the DSD classification, the age of first operation, length of urethral defect, degree of hypospadias, cryptorchidism, micropenis, gonad type, hormone therapy before operation, transposition of penis and scrotum, surgical strategy, urethral covering material, and postoperative catheter removal time. We explored the difference of each factor between four groups through the comparative study of single factor and multifactor logistic regression analysis of related factors. Result: 122 cases were enrolled in this group (n = 122), 12 cases were lost to follow-up. Median follow-up was 28 months (12–55 months).We found the success rate of operation decreased with longer urethral defect (B = − 0.473, P = 0.005). The success rate of operation was higher in staged operation and TPIT (TPIT = Transverse Preputial Island Tube operation)-related operation than primary operation (B = 1.238, P = 0.006) and TPIT-nonrelated operation (B = 2.293, P = 0.001). Although there was a significant difference between the age of the first operation and the occurrence of urethrocutaneous fistula (P = 0.006 \u003c 0.05), there was no significant difference in logistic regression analysis (P = 0.161 > 0.05). The incidence of urethrocutaneous fistula was lower in TPIT-related operation than in TPIT-nonrelated operation (B = − 2.507, P = 0.000). The incidence of postoperative urethral diverticulum was lower in staged operation than in primary operation (B = − 1.737, P = 0.015). Conclusion: For patients with disorder of sex development undergoing urethroplasty, the length of urethral defect is an independent risk factor affecting both the success rate of operation and the urethrocutaneous fistula. The age of the first operation has a statistically significant effect on the occurrence of postoperative urethrocutaneous fistula, but it is not an independent factor. Urethrocutaneous fistula is less found in TPIT-related operation in the study. Staged operation is an independent protective factor for postoperative urethral diverticulum compared with one-stage operation but isn’t related to urethrocutaneous fistula. © 2022, The Author(s).","doi":"10.1186/s12894-022-01080-x","pmid":"","date":"2022","journal":"BMC Urology","authors":"Yu J.; Sun N.; Song H.; Li M.; Li L.; Gong C.; Zhang W.","item_type":"journalArticle","volume":"22","issue":"1","pages":"","issn":"14712490 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85135631749?origin=resultslist"},"99D3XX5W":{"key":"99D3XX5W","record_id":"R-99D3XX5W","title":"Pregnancy and the risk of teratogenicity.","abstract":"One in every 250 newborns is exposed to antiepileptic drugs (AEDs) in utero. Various studies have attributed a teratogenic effect to these AEDs, mainly  consisting of major malformations, minor anomalies, intrauterine or postnatal  growth failure, and psychomotor retardation. Prospective studies confirm the  increased risk of major malformations. The absolute risk of 7-10% is about 3-5%  higher than that in the general population. Barbiturates and phenytoin (PHT) are  particularly associated with congenital heart malformations, facial clefts, and  some other malformations. Valproate (VPA) and carbamazepine (CBZ) are associated  predominantly with spina bifida aperta (1-2 and 0.5-1.0% risk, respectively) and  hypospadias. Bilateral radial aplasia is a rare but specific effect of VPA.  Several studies identified additional risk factors, i.e., high daily AED dosage,  high maternal serum AED concentrations, low folate levels, or polytherapy  [phenobarbital (PB) plus primidone (PRM) plus PHT or CBZ plus VPA plus PB with or  without PHT]. The few prospective studies controlled for socioeconomic factors or  that considered parental findings indicate that risk of specific cognitive  defects rather than risk of overall mental retardation may be increased, that  early growth retardation is followed by a catch-up growth to normal, and that  ocular hypertelorism and nail hypoplasia are the only minor anomalies causally  related to PHT exposure. However, no final conclusions can be made. Genetic  predisposition to the teratogenic side effects of AEDs plays a role,  codetermining the recurrence risk if the woman has previously given birth to a  child with a major malformation. The molecular genetic basis of this  predisposition is unclear.(ABSTRACT TRUNCATED AT 250 WORDS)","doi":"10.1111/j.1528-1157.1992.tb06226.x","pmid":"1425493","date":"1992","journal":"Epilepsia","authors":"Lindhout D.; Omtzigt J. G.","item_type":"journalArticle","volume":"33 Suppl 4","issue":"","pages":"S41-48","issn":"0013-9580","isbn":"","url":""},"9LD9CH2D":{"key":"9LD9CH2D","record_id":"R-9LD9CH2D","title":"影响尿道下裂术后并发症危险因素的多中心研究","abstract":"目的通过分析多中心尿道下裂解剖学数据及术后随访结果, 了解我国尿道下裂诊治现状, 探讨影响尿道下裂术后并发症的危险因素。方法回顾性分析2018年12月至2019年12月首都医科大学附属北京儿童医院、中国医科大学附属盛京医院等15家儿童医学中心首诊收治的包括随访在内数据完整的尿道下裂患儿的临床资料, 分析患儿术式选择依据及不同术式并发症影响因素。单因素分析中不服从正态分布的计量资料组间比较采用Mann-WhitneyU检验, 计数资料组间比较采用卡方检验;选取单因素分析中P0.05的影响因素纳入多因素logistic分析, 计算OR值以及95%CI。采用受试者操作特征曲线(receiver operating characteristic curve, ROC)下的面积(area under the curve, AUC)来检验尿道缺损长度对尿道下裂术后并发症的分辨能力, 并根据约登指数来确定最佳临界值。结果符合纳入排除标准的患儿共1 011例, 按Barcat分型分为远端型248例、中间型214例、近侧型549例。其中尿道板纵切卷管尿道成形术(tubularized incised plate urethroplasty, TIP)组336例, 并发症84例, 并发症发生率为25.0%(84/336), 包括尿道瘘53例(15.8%, 53/336)、尿道狭窄29例(8.6%, 29/336)、尿道憩室3例(0.9%, 3/336)。单因素分析结果显示阴茎头宽度、尿道板舟状窝宽度、尿道板纵切后宽度是TIP术式术后并发症的危险因素, 而手术时年龄、阴茎长度、阴茎头长度、尿道缺损长度、尿道板平整度及弹性不是TIP术式术后并发症危险因素。多因素logistic分析结果显示尿道板纵切后宽度(OR=0.836, 95%CI:0.742～0.942, P=0.003)及阴茎头宽度(OR=0.851, 95%CI:0.749～0.965, P=0.012)是TIP术式术后并发症的独立危险因素。根据尿道板纵切后宽度的ROC曲线图(AUC=0.649, P0.001), 计算出约登指数最大时获得临界值为11.5 mm。根据阴茎头宽度的ROC曲线图(AUC=0.630, P0.001), 计算出约登指数最大时获得临界值为15.5 mm。横裁包皮岛状皮瓣卷管尿道成形术(transverse preputial island flap urethroplasty, Duckett)组375例, 并发症192例, 并发症发生率为51.2%(192/375), 尿道瘘130例(34.7%, 130/375)、尿道狭窄52例(13.9%, 52/375)、尿道憩室样扩张54例(14.4%, 54/375)。单因素分析结果显示尿道缺损长度、包皮岛状皮瓣长度、阴茎下弯度数、包皮皮瓣弹性及平整度是Duckett术式术后并发症的危险因素。而手术时年龄、阴茎长度、阴茎头长度及阴茎头宽度、包皮形态、包皮浅层血管分布不是Duckett术式术后并发症危险因素。多因素logistic分析结果显示包皮岛状皮瓣长度(OR=3.506, 95%CI:2.258～5.442, P0.001)是Duckett术式术后并发症的独立危险因素。根据包皮岛状皮瓣长度的ROC曲线图(AUC=0.709, P0.001), 计算出约登指数最大时获得临界值为3.35 cm。结论尿道下裂不同分型应采用的手术方式不同。尿道板纵切后宽度、阴茎头宽度是TIP术式术后并发症的危险因素。包皮岛状皮瓣长度是Duckett术式术后并发症的危险因素。","doi":"10.3760/cma.j.cn421158-20211108-00540","pmid":"","date":"2023","journal":"中华小儿外科杂志","authors":"方一圩; 宋宏程; 孙宁; 张潍平; 唐耘熳; 王学军; 黄鲁刚; 曾莉; 杨屹; 刘鑫; 潮敏; 张晔; 马洪; 刘红; 张敬悌; 康磊; 张旭辉; 孟庆明; 李守林; 谢谨谨; 周学锋; 李宁; 陈超; 苏成; 何大维; 刘星; 吴文波; 唐静; 谢华; 吴旻; 关勇; 王欣","item_type":"journalArticle","volume":"44","issue":"4","pages":"329-337","issn":"0253-3006","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORINeHJ3azIwMjMwNDAwOBoIcmI2eDJhNGE%3D"},"9WN7TSR5":{"key":"9WN7TSR5","record_id":"R-9WN7TSR5","title":"双胞胎尿道下裂与低出生体重的相关性分析","abstract":"目的:初步探讨双胞胎尿道下裂与低出生体重的关系。方法:回顾性分析2013年1月至2020年1月首都医科大学附属北京儿童医院泌尿外科收治的42对双胞胎尿道下裂患儿临床资料，记录双胞胎出生体重。根据尿道开口位置，将尿道下裂分为4型：Ⅰ型为阴茎头和冠状沟型，Ⅱ型为阴茎体型，Ⅲ型为阴茎阴囊型，Ⅳ型为会阴型。应用全外显子测序技术和生物信息学分析技术检测所有双胞胎的全血标本，证实同卵双胞胎23对、异卵双胞胎19对。记录母孕期黄体酮应用情况、怀孕年龄、妊娠期高血压、吸烟史、饮酒史等资料。结果:42对双胞胎中共有尿道下裂54例，其中I型6例，Ⅱ型20例，Ⅲ型22例，Ⅳ型6例。相对于异卵双胞胎而言，同卵双胞胎更易同时患尿道下裂( OR＝6.500，95% CI：1.217~35.124)。双胞胎尿道下裂与出生体重的相关性分析显示，低出生体重是尿道下裂的危险因素( OR＝4.124，95% CI：1.588~10.710， P＝0.004)。与正常出生体重儿相比，低出生体重儿患尿道下裂的风险是正常出生体重儿的5.885倍( OR＝5.885，95% CI：1.082~32.014， P＝0.040)；极低出生体重儿患尿道下裂的风险是正常出生体重儿的3.804倍( OR＝3.804，95% CI：1.406~10.293， P＝0.009)。在只有其一患尿道下裂的13对同卵双生双胞胎中，患尿道下裂和未患尿道下裂者出生体重分别为(1 805±437)g和(2 598±582)g，差异有统计学意义( t＝3.929， P＝0.001)；低出生体重( OR＝25.955，95% CI：2.069~325.556， P＝0.012)是发生尿道下裂的危险因素。双胞胎中只有其一患尿道下裂的17对异卵双生双胞胎中，患尿道下裂和未患尿道下裂者出生体重分别为(2 077±677)g和(2 527±478)g，差异有统计学意义( t＝2.242， P＝0.032)；低出生体重( OR＝3.929，95% CI：1.041~13.837， P＝0.044)是发生尿道下裂的危险因素。孕期应用黄体酮不会增加双胞胎患尿道下裂的风险( OR＝1.458，95% CI：0.572~3.853， P＝0.416)。 结论:同卵和异卵双胞胎中出生体重较低者更易患尿道下裂。","doi":"10.3760/cma.j.cn.101785-202010025-002","pmid":"","date":"2022","journal":"临床小儿外科杂志","authors":"林德富; 黄洋阅; 孙宁; 张潍平; 宋宏程","item_type":"journalArticle","volume":"21","issue":"1","pages":"7-12","issn":"1671-6353","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRbGN4ZXdrenoyMDIyMDEwMDIaCHJiNngyYTRh"},"9Y4GNLF4":{"key":"9Y4GNLF4","record_id":"R-9Y4GNLF4","title":"Diagnostic performance of uroflowmetry for urethral strictures following hypospadias repairs: A comparison with urethral calibration","abstract":"Introduction & Objectives: Urethral stricture is a common complication following hypospadias repairs, posing significant management challenges and the risk of multiple reoperations. The current study aims to evaluate the diagnostic accuracy of uroflowmetry in detecting urethral strictures following hypospadias repairs and to compare it with urethral calibration. Materials & Methods: A retrospective cohort study was conducted on children who underwent primary hypospadias repairs from 2016 to 2023 at our institution. Urethral calibration and uroflowmetry were used to evaluate urethral patency after hypospadias repairs. We analyzed the relationship between these two assessments and evaluated the diagnostic value of uroflowmetry in detecting urethral strictures. Patients were categorized into Tubularized Incised-Plate (TIP) urethroplasty and non-TIP groups. This study complied with all principles and regulations of the Helsinki Declaration and was approved by the Ethics Committee of the author's Hospital (2024-IRB-0262-P-01). Results: A total of 62 cases were included, with 38 in the TIP group and 24 in the non-TIP group. Ten patients were diagnosed with urethral strictures. In the non-TIP group, the area under the curve (AUC) for maximum urinary flow rate (Qmax) was 0.94 (Cut-off = 6.65, sensitivity = 100%, specificity = 81.0%), higher than that of average urinary flow rate (Qave) with 0.91 (Cut-off = 4.95, sensitivity = 100%, specificity = 71.4%). In the TIP group, the AUC for Qmax was 0.80 (Cut-off = 5.75, sensitivity = 100%, specificity = 58.1%), higher than that of Qave with 0.70 (Cut-off = 3.20, sensitivity = 71.4%, specificity = 67.7%). In the non-TIP group, the Qmax nomogram interval s -3 Standard Deviation (SD) showed good consistency for the diagnosis of urethral stricture (Kappa = 0.70), with the ROC curve showing an AUC of 0.95 (Cut-off = 0.5, sensitivity = 100%, specificity = 91.0%). In the non-TIP group, a strong quadratic correlation was found between urethral calibration and Qmax (C2 = 14.72*Qmax, R2 = 0.96, P \u003c 0.001), which was superior to the correlation in the TIP group (C2 = 14.76*Qmax, R2 = 0.88, P \u003c 0.001). Conclusions: Qmax outperforms Qave in both sensitivity and specificity for stricture detection. The presence of a Qmax value below 6.65 ml/s or s -3SD is indicative of urethral strictures in the non-TIP cohort. Uroflowmetry emerges as an effective screening tool for urethral strictures in the TIP cohort. The formula C2 = 14.72*Qmax facilitates the non-invasive derivation of urethral calibration measurements.","doi":"10.1016/S0302-2838(25)00085-5","pmid":"","date":"2025","journal":"European Urology","authors":"Ru W.; Liu H.; Zhou J.; Hu Q.; Yang W.; Hu L.; Chen G.; Yan X.","item_type":"journalArticle","volume":"87","issue":"(Ru W.; Liu H.; Zhou J.; Hu Q.; Yang W.; Hu L.; Chen G.; Yan X.) Children's Hospital, Zhejiang University School of Medicine, Dept. of Urology, Hangzhou, China","pages":"25-25","issn":"1873-7560","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2039698762&from=export"},"ABRTTWHY":{"key":"ABRTTWHY","record_id":"R-ABRTTWHY","title":"Editorial comments","abstract":"","doi":"10.1016/j.juro.2010.12.109","pmid":"","date":"2011","journal":"Journal of Urology","authors":"Baskin L.S.","item_type":"journalArticle","volume":"185","issue":"5","pages":"1850","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/79953777235?origin=resultslist"},"AH3UG5IA":{"key":"AH3UG5IA","record_id":"R-AH3UG5IA","title":"Long term complications of hypospadias repair: A ten-year experience from northern zone of Tanzania","abstract":"Background Hypospadias is one of the commonest congenital penile abnormalities in new born males. The external urethral opening can be located anywhere from the glans penis along the ventral aspect of the shaft of the penis up to the scrotum or the perineum in extreme cases. The condition has a huge impact on the patient’s psychological, emotional and sexual well-being. Aim To determine the proportion of patient who develop long term complications after hypospadias repair and its associated risk factors. Materials and Methods This was a hospital based analytical cross-sectional study, conducted at KCMC Urology Institute from January 2009 to December 2018.The structural data sheet was used to collect information from patient le. Study parameters include age, location of hypospadias, surgical technique, surgeon experience, chordee, suture size, materials to assess the association with long-term complications. Results: A total of 254 patients were included in the study, majority were aged more than two years (71.83%) with mean age at operation (SD) of 4.74 ± 2.99 years) . Distal types were the most common type of hypospadias 125(50%), where by 51(20%) of patients had severe chordee. TIP repair was most common technique in 130(51.59%). The proportion of long-term complications among patients who underwent hypospadias repair was 156(61.60%) and UCF accounted for 40.5%, the surgeon experience, location of hypospadias, surgical technique and associate chordee were signi cant predictors of long-term complications of hypospadias repair. Conclusion TIP urethroplasty is a safe and reliable method of hypospadias repair. Proximal hypospadias with severe chordee still remain a challenge. © 2020, Dove Medical Press Ltd. All rights reserved.","doi":"10.21203/RS.3.RS-37958/V1","pmid":"","date":"2020","journal":"Research and Reports in Urology","authors":"Mohd M.S.; Bright F.B.; Mteta A.K.; Mbwambo J.S.; Ngowi B.N.; Mbwambo O.J.; Yongolo S.; Mganga A.M.","item_type":"journalArticle","volume":"12","issue":"(Mohd M.S., doctormbarouk@yahoo.co.uk; Bright F.B.; Mbwambo J.S.; Ngowi B.N.; Mbwambo O.J.; Mganga A.M.) Kilimanjaro Christian Medical University College, Tanzania","pages":"","issn":"2253-2447","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2013615265&from=export"},"AISS5GBZ":{"key":"AISS5GBZ","record_id":"R-AISS5GBZ","title":"Endocrine abnormalities in boys with hypospadias.","abstract":"The multifactorial etiology of hypospadias is becoming more clearly defined with ongoing investigation. Endogenous endocrine abnormalities identified so far  include testosterone biosynthesis defects, 5alpha-reductase type 2 mutations, and  androgen receptor mutations (the rarest cause, even in cases of severe  hypospadias). Other significant risk factors include IVF (because of progesterone  administration or endocrine abnormalities associated with infertility) and  environmental agents that can potentially cause testicular dysgenesis, disrupt  the male androgen axis, and disturb normal male genital embryology (Table 6).  [table; see text] It also seems that the incidence of hypospadias is increasing,  both in the United States and in Europe--which may be due to better medical care  for those with genital abnormalities and/or infertility problems, as well as  environmental endocrine disruptors. Hypospadias is a physical manifestation that  may be a consequence of numerous physiological aberrations, and our ability to  understand and to potentially prevent this congenital malformation will require a  significant amount of additional work. Our challenge for the future remains to  identify the various etiologies, provide prenatal counseling for affected  families with a history of hypospadias, and minimize or eliminate exposure to  environmental agents that may contribute to this problem. Perhaps one day we will  be able to offer prenatal therapy to prevent hypospadias when the risk for this  birth defect seems high. How might this be possible? Consider the modern  management of a family with a child born with the adrenogenital syndrome, another  endocrine derangement that can cause abnormal genital development. In this  situation, dexamethasone can be administered to the mother in subsequent  pregnancies to prevent fetal virilization until the sex of the fetus can be  determined or adrenal enzyme mutations can be excluded. Perhaps in the future a  similar approach will be taken for those families with strong risk factors for  hypospadias.","doi":"10.1007/978-1-4419-8995-6_4","pmid":"15086020","date":"2004","journal":"Advances in experimental medicine and biology","authors":"Silver Richard I.","item_type":"journalArticle","volume":"545","issue":"","pages":"45-72","issn":"0065-2598","isbn":"","url":""},"AJU76N64":{"key":"AJU76N64","record_id":"R-AJU76N64","title":"Response to Letter to the Editor RE: Introducing the HOPE (Hypospadias Objective Penile Evaluation)-score: A validation study of an objective scoring system for evaluating cosmetic appearance in hypospadias patients.","abstract":"","doi":"10.1016/j.jpurol.2013.07.023","pmid":"","date":"2013","journal":"Journal of Pediatric Urology","authors":"Van Der Toorn F.","item_type":"journalArticle","volume":"9","issue":"6 PART B","pages":"1017","issn":"14775131 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84888438821?origin=resultslist"},"AUGMT2BY":{"key":"AUGMT2BY","record_id":"R-AUGMT2BY","title":"Epidemiologic features of male genital malformations and subtypes in Texas","abstract":"Although distinct categories of male genital malformations share some common risk factors, few studies have systematically compared epidemiologic features across phenotypes. We evaluated the relationship between several maternal and infant characteristics and five categories of male genital malformations: second- or third-degree hypospadias, hypospadias (regardless of degree), small penis, cryptorchidism, and any male genital malformation. Data for 16,813 cases with isolated male genital malformations and 1,945,841 male live births delivered from 1999 to 2008 were obtained from the Texas Birth Defects Registry. For each phenotype category, 13 maternal and infant variables were assessed, and adjusted prevalence ratios were estimated based on the same multivariable Poisson regression model. A significant negative association was observed between previous live births versus no previous live births and four phenotypes (e.g., adjusted prevalence ratio [aPR] for any male genital malformation: 0.78, 95% confidence interval [CI]: 0.75-0.81). The prevalence of 4 of the phenotypes was significantly higher among multiple versus singleton pregnancies (e.g., aPR for any male genital malformation: 1.35, 95% CI: 1.25-1.47). We also observed significant associations between multiple phenotypes and residential region at delivery, delivery year, month of conception, and maternal age, race/ethnicity, education, and birthplace, including significant associations for trends (maternal age, maternal education, and birth year modeled ordinally). Our results allow for comparison of characteristics across phenotypes and suggest that there may be some common risk factors for multiple male genital malformations (e.g., characteristics related to maternal estrogen levels), while other risk factors may be unique to specific defects. (c) 2014 Wiley Periodicals, Inc.","doi":"10.1002/ajmg.a.36389","pmid":"","date":"2014","journal":"American Journal of Medical Genetics, Part A","authors":"Agopian A.J.; Langlois P.H.; Ramakrishnan A.; Canfield M.A.","item_type":"journalArticle","volume":"164","issue":"4","pages":"943-949","issn":"15524825 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84896315400?origin=resultslist"},"AVJGLL7E":{"key":"AVJGLL7E","record_id":"R-AVJGLL7E","title":"Endocrine abnormalities in boys with hypospadias","abstract":"The multifactorial etiology of hypospadias is becoming more clearly defined with ongoing investigation. Endogenous endocrine abnormalities identified so far include testosterone biosynthesis defects, 5α-reductase type 2 mutations, and androgen receptor mutations (the rarest cause, even in cases of severe hypospadias). Other significant risk factors include IVF (because of progesterone administration or endocrine abnormalities associated with infertility) and environmental agents that can potentially cause testicular dysgenesis, disrupt the male androgen axis, and disturb normal male genital embryology (Table 6). Table 6 Risk Factors for Isolated Hypospadias Endocrine Abnormalities Hypogonadism 5α-reductase mutations Androgen receptor mutations Assisted Reproduction In Vitro Fertilization (IVF) Progesterone administration Infertility Family History Genetics vs. environment (Nature vs. nurture) Environmental Factors Environmental estrogens Pesticides (DDT) Toxic substances (PCBs) Plant estrogens (soy) Environmental anti-androgens Fungicides (Vinclozolin, Procymidone) Non-Risk Factors for Isolated Hypospadias Tobacco Alcohol Birth Control Pills/Spermicides It also seems that the incidence of hypospadias is increasing, both in the United States and in Europe - which may be due to better medical care for those with genital abnormalities and/or infertility problems, as well as environmental endocrine disruptors. Hypospadias is a physical manifestation that may be a consequence of numerous physiological aberrations, and our ability to understand and to potentially prevent this congenital malformation will require a significant amount of additional work. Our challenge for the future remains to identify the various etiologies, provide prenatal counseling for affected families with a history of hypospadias, and minimize or eliminate exposure to environmental agents that may contribute to this problem. Perhaps one day we will be able to offer prenatal therapy to prevent hypospadias when the risk for this birth defect seems high. How might this be possible? Consider the modern management of a family with a child born with the adrenogenital syndrome, another endocrine derangement that can cause abnormal genital development. In this situation, dexamethasone can be administered to the mother in subsequent pregnancies to prevent fetal virilization until the sex of the fetus can be determined or adrenal enzyme mutations can be excluded. Perhaps in the future a similar approach will be taken for those families with strong risk factors for hypospadias.","doi":"10.1007/978-1-4419-8995-6_4","pmid":"","date":"2004","journal":"","authors":"Silver R.I.","item_type":"conferencePaper","volume":"545","issue":"","pages":"45-72","issn":"","isbn":"00652598 (ISSN)","url":"https://www.scopus.com/pages/publications/2342633806?origin=resultslist"},"AZRVPKC9":{"key":"AZRVPKC9","record_id":"R-AZRVPKC9","title":"2010-2013年西安市新生儿出生缺陷发生状况及其影响因素研究","abstract":"背景:陕西省是新生儿出生缺陷的高发地区,各个地区新生儿出生缺陷的资料尚不完整。由于陕西省各个地区经济水平等方面存在较大差异,故研究西安市新生儿出生缺陷发生状况有助于阐释该地区出生缺陷发生的特点,从而更有针对性地提供信息参考。目的:分析2010-2013年西安市活产单胎新生儿出生缺陷的发生状况,并探讨新生儿出生缺陷的影响因素。方法:于2013年6-11月,根据人口密集程度和生育水平,采用多阶段随机抽样方法,于陕西省西安市选取2010-2013年期间曾经妊娠的15－49岁育龄妇女为调查对象。采用自行设计的调查问卷,面对面调查妇女的社会人口学信息、婚育史、妊娠期生活方式、妊娠期疾病史、妊娠期药物及营养素服用史、家族疾病史及优生优育咨询情况,配偶年龄、民族、受教育年限、家族疾病史,以及新生儿性别、出生季节。结果:本研究共完整调查4679例妇女,发现出生缺陷新生儿74例,出生缺陷发生率为158.2/万。2010-2013年西安市新生儿出生缺陷发生率分别为68.7/万、160.2/万、115.3/万、214.5/万,各年度出生缺陷发生率比较,差异无统计学意义(χ^2=7.355,P=0.061)。74例新生儿出生缺陷分别为先天性心脏病44例,血管瘤4例,腹股沟斜疝3例,喉软骨发育不良3例,脐膨出、上睑下垂、舌系带过短、耳前瘘管各2例,黑色素痣、先天性斜颈、左肾偏移、脑性瘫痪、上唇畸形、尿道下裂、并指、唐氏综合征、葡萄糖-6-磷酸脱氢酶( G6PD)缺乏症、先天性黄疸、隐睾、先天性脊膜膨出各1例。多因素Logistic回归分析显示,早产、妊娠期饮酒史、妊娠期吸烟史、妊娠期服用抗生素、母系糖尿病家族史是新生儿出生缺陷的危险因素( P﹤0.05)。结论:2010-2013年西安市活产单胎新生儿出生缺陷发生率处于较高水平,先天性心脏病为主要的出生缺陷类型。早产、妊娠期饮酒史、妊娠期吸烟史、妊娠期服用抗生素、母系糖尿病家族史可能增加新生儿出生缺陷的罹患风险。","doi":"10.3969/j.issn.1007-9572.2016.26.005","pmid":"","date":"2016","journal":"中国全科医学","authors":"柏如海; 章琦; 王玲玲; 屈鹏飞; 李佳媚; 颜虹","item_type":"journalArticle","volume":"19","issue":"26","pages":"3149-3152","issn":"1007-9572","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemdxa3l4MjAxNjI2MDA1GghyYjZ4MmE0YQ%3D%3D"},"BCJ5864Z":{"key":"BCJ5864Z","record_id":"R-BCJ5864Z","title":"Single Nucleotide Polymorphisms of HAAO and IRX6 Genes as Risk Factors for Hypospadias","abstract":"Purpose: We evaluated the association of hypospadias and 17 susceptibility loci previously identified by a European genome-wide association study in a cohort of Japanese patients. We also examined the expression of candidate genes in male mouse embryos to determine the possible underlying mechanisms of this disease.\n   Materials and Methods: We enrolled 169 Japanese patients (mean age at surgery 3.7 years) who underwent repair of hypospadias. Genotyping of 17 single nucleotide polymorphisms was performed using a multiplex polymerase chain reaction invader assay. We also performed in situ hybridization to determine whether candidate genes were expressed in the male genital tubercle during embryonic development of the external genitalia in mice.\n   Results: Single nucleotide polymorphism rs3816183 of HAAO was significantly associated with susceptibility to hypospadias in general (p = 0.0019) and to anterior/middle hypospadias (p = 0.0283) and posterior hypospadias (p + 0.0226), while single nucleotide polymorphism rs6499755 of IRX6 showed an association with susceptibility to anterior/middle hypospadias (p = 0.0472). In mouse embryos there was no significant upregulation of Haao expression in the developing male external genitalia. Irx3 and Irx5, which are linked to Irx6 within the IrxB cluster, were expressed in the mesenchyme remote from the urethral plate epithelium during the critical embryonic period for masculinization. Irx6 was expressed in the ectodermal epithelium, demonstrating prominent dorsal ectodermal expression without expression in the ventral ectoderm adjacent to the urethral plate during the same period.\n   Conclusions: Genetic variations of HAAO and IRX6 influence susceptibility to hypospadias in the Japanese population. Further research is needed to clarify the mechanism by which variations in these genes contribute to the pathogenesis of hypospadias.","doi":"10.1016/j.juro.2018.07.050","pmid":"","date":"2019","journal":"The Journal of Urology","authors":"Kojima Yoshiyuki; Koguchi Tomoyuki; Mizuno Kentaro; Sato Yuichi; Hoshi Seiji; Hata Junya; Nishio Hidenori; Hashimoto Daiki; Matsushita Shoko; Suzuki Kentaro; Miyagawa Shinichi; Hui Chi Chung; Tanikawa Chizu; Murakami Yoshimori; Yamada Gen; Hayashi Yutaro; Matsuda Koichi","item_type":"journalArticle","volume":"201","issue":"2","pages":"385-391","issn":"0022-5347","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGFkMzk0NGM4M2I3Y2JkYzRhMmRlOGQ0NmRmYmNhMjNjGghyYjZ4MmE0YQ%3D%3D"},"BHT5EN7B":{"key":"BHT5EN7B","record_id":"R-BHT5EN7B","title":"Genetic etiologies and gender outcomes of patients with disorders of sex development presenting with asymmetric gonads","abstract":"Purpose: Patients with mixed gonadal dysgenesis (MGD) and ovotesticular disorders of sex development (DSD) usually present with asymmetric gonads. Differential diagnosis of these conditions is based on karyotype and pathological findings of gonads. However, it is difficult to determine sex of rearing and to predict long-term outcomes. This study investigated the clinical features, karyotype, sex of rearing, and pubertal outcomes of patients with MGD and ovotesticular DSD. Methods: This study included 17 patients with DSD who presented with asymmetric gonads. Presenting features, karyotype, sex of rearing, and pubertal outcomes were reviewed retrospectively. Results: All 17 patients presented with asymmetric gonads in the neonatal period. They manifested labioscrotal deformity (58.8%), hypospadias (52.9%), clitoromegaly (23.5%), and micropenis (11.8%). Eight patients with a dysgenetic gonad and a testis were diagnosed with MGD; karyotype was 45,X/46,XY in 7 (87.5%) and 45,X/47,XYY in one patient (12.5%). Nine patients with a coexistence of testicular and ovarian tissues were diagnosed with ovotesticular DSD; karyotype was 46,XX in 6 (66.7%), 45,X/46,XY in 2 (22.2%) patients, and 46,XY in one patient (11.1%). Mullerian duct remnants were found in 15 of 17 patients (88.2%). Fifteen patients underwent unilateral gonadectomy; 11 of them raised as males and 4 patients were reared as females. The remaining 2 patients underwent bilateral gonadectomy and raised as females. Six of 8 patients with MGD (75%) were raised as males, while 5 of 9 patients with ovotesticular DSD (55.6%) were assigned as males. Two patients with MGD and two with ovotesticular DSD reached pubertal age. Among them, one phenotypic male with MGD and two with ovotesticular DSD showed spontaneous puberty. The remaining one female with MGD showed hypergonadotropic hypogonadism and have been treated with estrogen replacement therapy. One male-assigned patient with ovotesticular DSD was confused about sexual identity at age 20 years and changed gender as a female, despite her karyotype of 46,XX. Conclusions: DSD with asymmetric gonads could manifest wide phenotype of external genitalia and karyotypes. Pathological findings of gonads are necessary for differential diagnosis of MGD and ovotesticular DSD. Further studies are needed to establish appropriate treatment strategies and gender outcomes.","doi":"10.1159/000492307","pmid":"","date":"2018","journal":"Hormone Research in Paediatrics","authors":"Oh A.; Kim Y.-M.; Seo G.H.; Kim G.-H.; Choi J.-H.; Yoo H.-W.","item_type":"journalArticle","volume":"90","issue":"(Oh A.; Kim Y.-M.; Seo G.H.; Choi J.-H.; Yoo H.-W.) Department of Pediatrics, Asan Medical Center, University of Ulsan, Seoul, South Korea","pages":"571-572","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630605458&from=export"},"BNQIV7PW":{"key":"BNQIV7PW","record_id":"R-BNQIV7PW","title":"Prevalence oh hypospadias in Italy according to severity, gestational age and birthweight: An epidemiological study","abstract":"Background: Hypospadias is a congenital displacement of the urethral meatus in male newborns, being either an isolated defect at birth or a sign of sexual development disorders. The aim of this study was to assess the prevalence rate of hypospadias in different Districts of Italy, in order to make a comparison with other countries all over the world. Methods: We reviewed all the newborns file records (years 2001-2004) in 15 Italian Hospitals. Results: We found an overall hypospadias prevalence rate of 3.066±0.99 per 1000 live births (82.48% mild hypospadias, 17.52% moderate-severe). In newborns Small for Gestational Age (birthweight \u003c 10 th percentile) of any gestational age the prevalence rate of hypospadias was 6.25 per 1000 live births. Performing multivariate logistic regression analysis for different degrees of hypospadias according to severity, being born SGA remained the only risk factor for moderate-severe hypospadias (p=0.00898) but not for mild forms (p>0.1). Conclusions: In our sample the prevalence of hypospadias results as high as reported in previous European and American studies (3-4 per 1000 live births). Pathogenesis of isolated hypospadias is multifactorial (genetic, endocrine and environmental factors): however, the prevalence rate of hypospadias is higher in infants born small for gestational age than in newborns with normal birth weight.","doi":"10.1186/1824-7288-35-18","pmid":"","date":"2009","journal":"Italian Journal of Pediatrics","authors":"Ghirri P.; Scaramuzzo R.T.; Bertelloni S.; Pardi D.; Celandroni A.; Cocchi G.; Danieli R.; De Santis L.; Di Stefano M.C.; Gerola O.; Giuffrè M.; Gragnani G.S.; Magnani C.; Meossi C.; Merusi I.; Sabatino G.; Tumini S.; Corsello G.; Boldrini A.","item_type":"journalArticle","volume":"35","issue":"18","pages":"","issn":"18247288 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/67649655754?origin=resultslist"},"BV7JRDAW":{"key":"BV7JRDAW","record_id":"R-BV7JRDAW","title":"Quality of information on hypospadias from artificial intelligence chatbots: are artificial intelligence large language models effective tools for patient-centred care?","abstract":"Introduction & Objectives: Hypospadias is the most prevalent congenital anomaly of the penis, with an estimated incidence of 0.4-8.2 cases per 1000 live births. However, most of the parents of those with hypospadias experience anxiety and uncertainty regarding the information about hypospadias, leading many families to conduct their own independent internet search to better understand the diagnosis and treatments. The reliability and quality of information from AI chatbots on hypospadias for patients has not previously been formally assessed. The objective of this study is to assess the ability of AI chatbots to provide accurate and readable information on hypospadias to patients and their families. Methods: AI chatbot inputs were sourced from google trends and healthcare organisations. Google trends was used to identify the top 10 google search terms relating to 'Hypospadias' based on search volume. Royal Children Hospital in Melbourne (RCH) and the Urology Care Foundation American Urology Association - Hypospadias (AUA) headers were used as healthcare related hypospadias inputs for four different AI chatbot programs ChatGPT, Perplexity, Chat Sonic, and Bing AI. Two trained investigators, blinded to AI chatbot type and each other's evaluation scores, assessed AI chatbot responses using various evaluation instruments including PEMAT, DISCERN, misinformation and Flesch-Kincaid readability formula as well as word count and citation. Results: The four AI chatbots assessed contained high quality health consumer information median DISCERN 4 (IQR 3-5). The degree of misinformation was low overall and across all AI chatbot responses, with a median of 1 (IQR 1-1). The PEMAT Understandability scores was high overall with a median of 91.7% (IQR 80-92.3). However, all AIs performed poorly in the actionability of their responses with an overall median of 40% (20-80). The median word count per AI chatbot response was 213 (IQR 141-273). Conclusions: AI chatbots provided understandable, high level and accurate health information relating to hypospadias. However, the information was delivered at a reading level which may limit its use in a paediatric or general public setting, and only one chatbot gave clearly actionable interventions or direction. Overall, AI chatbots are a clinically safe and appropriate adjunct to face consultation for healthcare information delivery and will likely take a more prominent role as technology advances.","doi":"10.1111/bju.70141","pmid":"","date":"2026","journal":"BJU International","authors":"Santucci J.; Stapleton P.; Thet M.; Lawrentschuk N.; Dodds L.; Cundy T.; Sathianathen N.","item_type":"journalArticle","volume":"137","issue":"(Santucci J.; Stapleton P.; Dodds L.) Grampians Health, Ballarat, Australia","pages":"S147-S148","issn":"1464-4096","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L650561256&from=export"},"BVZYYPH7":{"key":"BVZYYPH7","record_id":"R-BVZYYPH7","title":"An unusual phenotype of Frasier syndrome due to IVS9 +4C>T mutation in the WT1 gene: predominantly male ambiguous genitalia and absence of gonadal dysgenesis.","abstract":"The Wilms' tumor gene (WT1) encodes a zinc-finger transcription factor involved in the development of the kidneys and gonads and their subsequent normal  function. Mutations in the WT1 gene were identified in patients with WAGR (Wilms'  tumor, aniridria, genitourinary abnormalities, and mental retardation),  Denys-Drash syndrome, and Frasier syndrome (FS). Constitutional heterozygous  mutations of the WT1 gene, almost all located at intron 9, are found in patients  with FS. This syndrome is characterized by female external genitalia in 46,XY  patients, late renal failure, streak gonads, and high risk of gonadoblastoma  development. We report a male with FS with an unusual phenotype characterized by  normal penis size with perineal hypospadias, end-stage renal failure at the age  of 19 yr, normal adult male serum T levels, extremely elevated gonadotropin  levels, para-testicular leiomyoma, unilateral testicular germ cell tumor,  bilateral gonadoblastoma, and absence of gonadal dysgenesis. Automatic sequencing  identified the IVS9 +4C>T mutation in the WT1 gene, which predicts a change in  splice site utilization. WT1 transcript analysis showed reversal of the normal  positive/negative KTS (lysine, threonine, and serine) isoform ratio, confirming  the diagnosis of FS. This patient with FS presents an external genitalia of  Denys-Drash syndrome, suggesting that these two syndromes are not distinct  diseases but may represent two ends of a spectrum of disorders caused by  alterations in WT1 gene. This case expands the spectrum of phenotypes associated  with WT1 mutations, by including predominantly male ambiguous genitalia and  absence of gonadal dysgenesis, extremely high gonadotropin levels, and delayed  adrenarche, and presence of a para-testicular leiomyoma, bilateral  gonadoblastoma, and germ cell neoplasia.","doi":"10.1210/jcem.87.6.8521","pmid":"","date":"2002","journal":"Journal of Clinical Endocrinology and Metabolism","authors":"Melo Karla F. S.; Martin Regina M.; Costa Elaine M. F.; Carvalho Filomena M.; Jorge Alexander A.; Arnhold Ivo J. P.; Mendonca Berenice B.","item_type":"journalArticle","volume":"87","issue":"6","pages":"2500-2505","issn":"0021972X (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0036086228?origin=resultslist"},"BZUL8C45":{"key":"BZUL8C45","record_id":"R-BZUL8C45","title":"Invited Commentary: Male Reproductive System Congenital Malformations and the Risk of Autism Spectrum Disorder.","abstract":"Autism spectrum disorder (ASD) is a prevalent developmental disorder. Studies indicate that while ASD etiology has a genetic component, the risk is polygenic,  with gene-environment interactions being likely. The prenatal period is a  critical exposure window for nongenetic risk factors. Previous studies have found  positive associations between congenital malformations (all types) and ASD; a few  also found specific associations between genitourinary system malformations and  ASD; and one study found an association between hypospadias and ASD
