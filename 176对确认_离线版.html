判定","abstract":"目的:探讨尿道缺损长度对于一期横裁包皮岛状皮瓣管状尿道成形术（Duckett术）后并发症发生的预测价值及分期手术时机判定。方法:回顾性分析2021年1月至2023年1月于郑州大学第一附属医院小儿外科行一期Duckett术的80例患儿的临床资料，患儿手术年龄范围为12~116个月。根据不同尿道缺损长度，将患儿分为A组（尿道缺损长度为2.0~3.0 cm，30例）、B组（尿道缺损长度为3.1~4.0 cm，29例）、C组（尿道缺损长度为4.1~5.0 cm，21例），收集3组患儿年龄、尿管留置天数、手术时间、术中出血量、阴茎头直径及术后并发症发生情况，探索尿道缺损长度对于术后并发症发生的临界值。结果:3组患儿在年龄、尿管留置天数、手术时间、术中出血量、阴茎头直径等方面的差异均无统计学意义（均 P>0.05）。3组患儿术后总并发症发生率分别为10.0%（3/30）、37.9%（11/29）、71.4%（15/21），差异有统计学意义（ χ2=20.226， P\u003c0.001）；术后尿道瘘发生率分别为6.7%（2/30）、31.0%（9/29）、33.3%（7/21），差异有统计学意义（ χ2=6.938， P=0.031）；术后阴茎复弯发生率分别为0、3.4%（1/29）、19.0%（4/21），差异有统计学意义（ P=0.019）；术后尿道狭窄发生率、阴茎头裂开发生率差异均无统计学意义（均 P>0.05）。二元logistic回归分析结果显示，尿道缺损长度是尿道下裂一期Duckett尿道成形术后发生并发症的独立危险因素（ OR=4.734，95% CI：2.223~10.084， P=0.001）。ROC曲线结果显示，尿道缺损长度>3.5 cm时，尿道下裂一期Duckett术后发生并发症概率大，其敏感度为88.9%，特异度为73.6%，阳性预测值为63.2%，阴性预测值为92.9%。 结论:尿道缺损长度对于尿道下裂一期Duckett术后并发症的发生具有较高的判定价值，横断尿道板完全矫正阴茎下弯后尿道缺损长度>3.5 cm可作为术中选择分期修复的一个简单量化标准。","doi":"10.3760/cma.j.cn421158-20240617-00284","pmid":"","date":"2026","journal":"中华小儿外科杂志","authors":"刘鹏鹏; 张胜利; 赵祥; 于彬; 李诺贤; 陈春雨; 刘御宸; 范应中","item_type":"journalArticle","volume":"47","issue":"3","pages":"244-249","issn":"0253-3006","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORINeHJ3azIwMjYwMzAwOBoIcmI2eDJhNGE%3D"},"W65Z6DUJ":{"key":"W65Z6DUJ","record_id":"R-W65Z6DUJ","title":"A multi-center study on the development of clinical prediction model for complications after transverse preputial island flap urethroplasty","abstract":"Objective To explore the risk factors for postoperative complications in children with hypospadias undergoing transverse preputial island flap（TPIF）urethroplasty and to construct a clinical prediction model for postoperative complications. Methods A retrospective analysis was conducted on the clinical data of 543 children with hypospadias treated with the TPIF procedure at 17 hospitals，including Beijing Children’s Hospital Affiliated to Capital Medical University，Sichuan Provincial People’s Hospital，and 15 other hospitals，from December 2018 to September 2021. The patients’ age at surgery was 26（19，36）months，with penile length of 3.5（3.0，4.0）cm，glans length of 10.0（9.0，12.5）mm，glans width of 13.5（12.5，14.0）mm，urethral plate width of 4（3，5）mm，urethral defect length of 3.5（3，3.8）cm，and penile curvature degree of 60（50，80）°. Follow-up was conducted to identify postoperative complications such as urethral fistula，urethral stricture，and urethral diverticulum. Patients were divided into groups based on the presence or absence of complications after TPIF，and differences in clinical characteristics between the two groups were compared. Univariate and multivariate logistic regression analyses were used to identify risk factors for postoperative complications after the TPIF procedure，and a nomogram model was developed to predict postoperative complications. Internal validation was performed using 1 000 Bootstrap resampling，calibration curves were plotted，the area under the receiver operating characteristic（ROC）curve（AUC）was used to assess the discriminative ability of the model，and the Hosmer-Lemeshow goodness-of-fit test was used to evaluate the calibration of the prediction model. Results Among 543 patients with a postoperative follow-up time of 42（29，61）months，the overall complication rate was 42.9%（233/543），including urethral fistula in 155 cases（28.5%），urethral stricture in 88 cases（16.2%），urethral diverticulum-like dilation in 48 cases（8.8%），and residual/recurrent penile curvature in 1 case（1.4%）. The urethral defect length[3.5（3.0，4.0）cm vs. 3.2（3.0，3.5）cm]，urethral defect ratio（UDR）[1.00（0.82，1.17）vs. 0.91（0.75，1.09）]，and penile curvature degree[70（60，80）° vs. 60（40，70）°]in the complication group were significantly greater than those in the non-complication group（all P \u003c 0.001）. Univariate logistic regression analysis identified preoperative urethral meatus location before chordee correction，degree of penile curvature，UDR ratio，and urethral defect length as risk factors for postoperative complications of the TPIF procedure（P \u003c 0.05）. Multivariate logistic analysis showed that the degree of penile curvature（OR = 1.02，95%CI 1.01‒1.03）and urethral defect length（OR = 1.56，95%CI 1.08‒2.24）were independent risk factors for postoperative complications of the TPIF procedure. A nomogram model constructed based on these independent risk factors achieved an AUC of 0.672（95%CI 0.626‒0.717），and the Hosmer-Lemeshow goodness-of-fit test yielded a P value of 0.880，indicating good model fit. Conclusions This multi-center study on hypospadias showed that the degree of penile curvature and the length of urethral defect were independent risk factors for postoperative complications after TPIF surgery. The clinical prediction model for postoperative complications constructed based on the above indexes has a certain degree of differentiation and calibration，providing an evaluation basis for predicting the incidence of postoperative complications. 2026, Chinese Medical Association","doi":"10.3760/cma.j.cn112330-20250104-00009","pmid":"","date":"2026","journal":"Chinese Journal of Urology","authors":"Fang Y.; Song H.; Sun N.; Zhang W.; Tang Y.; Wang X.; Huang L.; Zeng L.; Yang Y.; Liu X.; Chao M.; Zhang Y.; Ma H.; Liu H.; Zhang J.; Kang L.; Zhang X.; Meng Q.; Li S.; Xie J.; Zhou X.; Li N.; Chen C.; Su C.; He D.; Liu X.; Wu W.; Tang J.; Xie H.; Wu M.; Guan Y.; Wang X.; Yang Y.; Zhang J.","item_type":"journalArticle","volume":"47","issue":"3","pages":"227-233","issn":"10006702 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/105039969795?origin=resultslist"},"WDLXYRY3":{"key":"WDLXYRY3","record_id":"R-WDLXYRY3","title":"Clinical features and pathogenic risk factors of hypospadias in children.","abstract":"Objective To understand the composition profile of children with hypospadias and explore the pathogenic risk factors of hypospadias so as to provide rationales for its etiological researches and early in- tervention and treatment of highrisk groups. Methods From January 2004 to June 2018, clinical data were retrospectively analyzed. There were 481 cases of congenital hypospadias without complication and during the same period 500 hospitalized cases of congenital hypospadias were surveyed through their parents. Results The admission age was (3.75-2.78). There were 297 cases (43.55%) in cities, towns and villages and 385 cases (56.45%) in rural areas. There were penile glans (n = 20, 2.93%), coronary sulcus (n = 119, 17.45%), penile corpus (n = 316, 46.33%), penile scrotum (n = 190, 27.86%), scrotal type (n = 30, 4. 40%) and perineal type (n = 7, 1.03%). There were simple hypospadias (n=481, 70.53%) and other malformations (n = 210, 29.47%). The number of deformity was single (n = 180, 89. 55%), double (n = 15, 7.46%) and triple (n = 3, 2.99%). There were urogenital malformation (n = 170, 84. 58%), cryptorchidism (n = 150, 88. 24%), cardiovascular malformation (n = 21, 10.45%), musculoskeletal malformation (n = 5, 2.49%) and other malformations (n = 9, 4.48%). Premature birth (OR = 10.60), low birth weight (OR = 3.94), maternal hypertension during pregnancy (OR = 10.15), maternal dietary fish deficiency during pregnan- cy (OR = 2.53) and paternal exposure to chemical pollutants (OR = 2.79) were risk factors for hypospadias. Conclusion Among children with congenital hypospadias, penile corpus is the most common and few are com- plicated with congenital genitourinary malformations, especially cryptorchidism. Premature birth, low birth weight, hypertension during pregnancy, maternal dietary fish deficiency during pregnancy and chemical contami- nation during paternal daily life are the risk factors for hypospadias. © 2019, Science and Technology Association of Hunan Province. All rights reserved.","doi":"10.3969/j.issn.1671-6353.2019.10.011","pmid":"","date":"2019","journal":"Journal of Clinical Pediatric Surgery","authors":"Liu Q.; Shan Z.; Liang R.; Su Z.; Zhou X.","item_type":"journalArticle","volume":"18","issue":"10","pages":"854-858","issn":"16716353 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85114408941?origin=resultslist"},"WHWTRFPW":{"key":"WHWTRFPW","record_id":"R-WHWTRFPW","title":"Pregnancy and the Risk of Teratogenicity","abstract":"Summary:  One in every 250 newborns is exposed to antiepileptic drugs (AEDs) in utero. Various studies have attributed a teratogenic effect to these AEDs, mainly consisting of major malformations, minor anomalies, intrauterine or postnatal growth failure, and psychomotor retardation. Prospective studies confirm the increased risk of major malformations. The absolute risk of 7–10% is about 3–5% higher than that in the general population. Barbiturates and phe‐nytoin (PHT) are particularly associated with congenital heart malformations, facial clefts, and some other malformations. Valproate (VPA) and carbamazepine (CBZ) are associated predominantly with spina bifida aperta (1–2 and 0.5–1.0% risk, respectively) and hypospadias. Bilateral radial aplasia is a rare but specific effect of VPA. Several studies identified additional risk factors, i.e., high daily AED dosage, high maternal serum AED concentrations, low folate levels, or po‐lytherapy [phenobarbital (PB) plus primidone (PRM) plus PHT or CBZ plus VPA plus PB with or without PHT]. The few prospective studies controlled for socioeconomic factors or that considered parental findings indicate that risk of specific cognitive defects rather than risk of overall mental retardation may be increased, that early growth retardation is followed by a catch‐up growth to normal, and that ocular hypertelorism and nail hypoplasia are the only minor anomalies causally related to PHT exposure. However, no final conclusions can be made. Genetic predisposition to the teratogenic side effects of AEDs plays a role, codetermining the recurrence risk if the woman has previously given birth to a child with a major malformation. The molecular genetic basis of this predisposition is unclear. No tests are yet available for identifying parents or fetuses at particularly high risk. Prevention of teratogenic AED side effects is possible by critical evaluation, before pregnancy, of the woman's need for AED therapy. If AED therapy cannot be avoided, it should be monotherapy with the lowest possible dosage. High peak levels should be avoided by dividing the daily dosage into at least two or three doses. The efficacy of folate supplementation alone in reducing teratogenic risks is unclear. In cases of obvious folate deficiency, treatment is required, but concomitant vitamin B12 deficiency should first be excluded or treated. Prenatal diagnosis should be offered. It may consist of fetal ultrasound examination during Week 18–20, and of afetoprotein analysis of amniotic fluid obtained during Week 16 if the mother is receiving VPA or CBZ. This should be discussed with the parents before the pregnancy. The choice of medication is made not only by balancing the therapeutic advantages and teratogenic risks of each AED or AED combination but also by considering the parental attitudes toward prenatal diagnosis and termination of pregnancy. © International League Against Epilepsy","doi":"10.1111/j.1528-1157.1992.tb06226.x","pmid":"","date":"1992","journal":"Epilepsia","authors":"Dick Lindhout; J. G. C. Omtzigt","item_type":"journalArticle","volume":"33","issue":"1","pages":"41-48","issn":"0013-9580","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDhmOGEzNDIxYzU4YmUxYmU3ZTViNjk2ZTExNDA4NWUzGghyYjZ4MmE0YQ%3D%3D"},"WJPGTZVY":{"key":"WJPGTZVY","record_id":"R-WJPGTZVY","title":"Impact of Two Urethral Stent Types on Complications after One-Stage Hypospadias Repair Using the Duckett Procedure.","abstract":"BACKGROUND: The authors evaluated whether the new nickel-titanium alloy stent (NTAS) is superior to the traditional silicone stent used in hypospadias repair  surgery in preventing complications such as urinary fistula. METHODS: This  retrospective cohort study included 576 patients with hypospadias who underwent  NTAS or traditional silicone stent placement after hypospadias surgery between  March of 2002 and August of 2019. The primary outcome was the rate of urinary  fistula occurrence at 4 weeks (stent removal time), and the secondary outcomes  were the rate of other complications, such as urethral stricture, urethral  diverticulum, infection, and so on. The occurrence of complications in both  groups was compared, and the important contributing factors of urinary fistula  and urethral stricture were determined. RESULTS: Among 576 patients, 398 were  assigned to the NTAS group, and 178 were assigned to the silicone group.  Thirty-five patients in the NTAS group and 30 in the silicone group developed  urinary fistula, with a rate of 8.8% and 16.9%, respectively ( P = 0.005).  Subgroup analysis showed that the differences were mainly in preschool patients  (6 years or younger) ( P = 0.004) and those with the penile type of hypospadias (  P = 0.008). In addition, urethral stricture complicated five patients in the NTAS  group and two in the silicone group, with a rate of 1.3% and 1.1%, respectively (  P = 1.000). Logistic regression showed that hypospadias type ( P = 0.001) and  stent type ( P = 0.001) are the important risk factors for urethral fistula.  CONCLUSION: The NTAS reduced the occurrence of urinary fistula complications  after hypospadias repair in preschool patients, and can be presented as a better  choice for hypospadias surgery. CLINICAL QUESTION/LEVEL OF EVIDENCE: Therapeutic,  III.","doi":"10.1097/PRS.0000000000010783","pmid":"","date":"2023","journal":"Plastic and Reconstructive Surgery","authors":"Shiying Zhou; Jian Zhang; Jiaqi Zhang; Xiaolian Xiao; Zheng Su; Meng Liu; Zhaolun Huang; Dongjun Tian; Weiqiang Liang; Jinming Zhang","item_type":"journalArticle","volume":"153","issue":"5","pages":"1123-1131","issn":"0032-1052","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDMxMzcyMTcyGghyYjZ4MmE0YQ%3D%3D"},"WKZAVEQ3":{"key":"WKZAVEQ3","record_id":"R-WKZAVEQ3","title":"Children's health and the environment: A new agenda for prevention research","abstract":"Patterns of illness in American children have changed dramatically in this century. The ancient infectious diseases have largely been controlled. The major diseases confronting children now are chronic and disabling conditions termed the 'new pediatric morbidity' - asthma mortality has doubled; leukemia and brain cancer have increased in incidence; neurodevelopmental dysfunction is widespread; hypospadias incidence has doubled. Chemical toxicants in the environment as well as poverty, racism, and inequitable access to medical care are factors known and suspected to contribute to causation of these pediatric diseases. Children are at risk of exposure to over 15,000 high-production-volume synthetic chemicals, nearly all of them developed in the past 50 years. These chemicals are used widely in consumer products and are dispersed in the environment. More than half are untested for toxicity. Children appear uniquely vulnerable to chemical toxicants because of their disproportionately heavy exposures and their inherent biological susceptibility. To prevent disease of environmental origin in America's children, the Children's Environmental Health Network (CEHN) calls for a comprehensive, national, child-centered agenda. This agenda must recognize children's vulnerabilities to environmental toxicants. It must encompass a) a new prevention-oriented research focus; b) a new child-centered paradigm for health risk assessment and policy formulation; and c) a campaign to educate the public, health professionals, and policy makers that environmental disease is caused by preventable exposures and is therefore avoidable. To anchor the agenda, CEHN calls for long-term, stable investment and for creation of a national network of pediatric environmental health research and prevention centers.","doi":"10.1289/ehp.98106787","pmid":"","date":"1998","journal":"","authors":"Landrigan P.J.; Carlson J.E.; Bearer C.F.; Cranmer J.S.; Bullard R.D.; Etzel R.A.; Groopman J.; McLachlan J.A.; Perera F.P.; Routt Reigart J.; Robison L.; Schell L.; Suk W.A.","item_type":"conferencePaper","volume":"106","issue":"SUPPL. 3","pages":"787-794","issn":"","isbn":"00916765 (ISSN)","url":"https://www.scopus.com/pages/publications/17444438712?origin=resultslist"},"WL2ZESBY":{"key":"WL2ZESBY","record_id":"R-WL2ZESBY","title":"Human exposure to endocrine-disrupting chemicals and prenatal risk factors for cryptorchidism and hypospadias: a nested case-control study.","abstract":"BACKGROUND: Exposure to xenoestrogens during pregnancy may disturb the development and function of male sexual organs. OBJECTIVE: In this study we aimed  to determine whether the combined effect of environmental estrogens measured as  total effective xenoestrogen burden (TEXB) is a risk factor for male urogenital  malformations. METHODS: In a case-control study, nested in a mother-child cohort  (n = 702) established at Granada University Hospital, we compared 50 newborns  with diagnosis of cryptorchidism and/or hypospadias with 114 boys without  malformations matched by gestational age, date of birth, and parity. Controls did  not differ from the total cohort in confounding variables. TEXB and levels of 16  organochlorine pesticides were measured in placenta tissues. Characteristics of  parents, pregnancy, and birth were gathered by questionnaire. We used conditional  and unconditional regression models to estimate odds ratios (ORs) and 95%  confidence intervals (CIs). RESULTS: TEXB from organohalogenated compounds was  detectable in 72% and 54% of case and control placentas, respectively. Compared  with controls, cases had an OR for detectable versus non-detectable TEXB of 2.82  (95% CI, 1.10-7.24). More pesticides were detected in cases than in controls  (9.34 +/- 3.19 vs. 6.97 +/- 3.93). ORs for cases with detectable levels of  pesticides, after adjusting for potential confounders in the conditional  regression analysis, were o,p'-DDT (OR = 2.25; 95% CI, 1.03-4.89), p,p'-DDT (OR =  2.63; 95% CI, 1.21-5.72), lindane (OR = 3.38; 95% CI, 1.36-8.38), mirex (OR =  2.85; 95% CI, 1.22-6.66), and endosulfan alpha (OR = 2.19; 95% CI, 0.99-4.82).  Engagement of mothers in agriculture (OR = 3.47; 95% CI, 1.33-9.03), fathers'  occupational exposure to xenoestrogens (OR = 2.98; 95% CI, 1.11-8.01), and  history of previous stillbirths (OR = 4.20; 95% CI, 1.11-16.66) were also  associated with risk of malformations. CONCLUSIONS: We found an increased risk  for male urogenital malformations related to the combined effect of environmental  estrogens in placenta.","doi":"10.1289/ehp.9351","pmid":"18174944","date":"2007 Dec","journal":"Environmental health perspectives","authors":"Fernandez Mariana F.; Olmos Begoña; Granada Alicia; López-Espinosa Maria José; Molina-Molina José-Manuel; Fernandez Juan Manuel; Cruz Milagros; Olea-Serrano Fátima; Olea Nicolás","item_type":"journalArticle","volume":"115 Suppl 1","issue":"Suppl 1","pages":"8-14","issn":"0091-6765 1552-9924","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L351401851&from=export"},"WLGIZT4K":{"key":"WLGIZT4K","record_id":"R-WLGIZT4K","title":"孕妇围孕期风险因素暴露与子代发生尿道下裂或隐睾的关联","abstract":"目的:探讨孕妇围孕期风险因素暴露与子代尿道下裂或隐睾发生的关联。方法:前瞻性选取2018年2月至2020年12月在首都医科大学附属北京妇产医院研究中心参加“中国出生人口队列”研究且分娩男性新生儿的孕妇为研究对象。所有研究对象于孕6~13 +6周入组，采用问卷调查收集围孕期危险因素信息，通过超声检查和出生时临床查体获取尿道下裂或隐睾结局信息。采用多因素logistic回归模型分析发生尿道下裂或隐睾的相关因素。 结果:共纳入15 833例孕妇，年龄为（31.81±3.84）岁，其子代诊断为尿道下裂或隐睾为113例（尿道下裂42例，隐睾69例，尿道下裂及隐睾2例），发生率为7.14‰。多因素logistic回归分析结果显示，既往出生缺陷孕育史（ OR=3.01，95% CI：1.09~8.35）、孕前患乙型肝炎（ OR=4.74，95% CI：1.10~20.42）、胎儿生长受限（ OR=4.02，95% CI：2.10~7.68）、孕前开始服用复合维生素（ OR=1.98，95% CI：1.12~3.52）和很少在家烹饪（ OR=2.17，95% CI：1.23~3.82）是子代发生尿道下裂或隐睾的相关因素（均 P\u003c0.05）。 结论:孕妇围孕期BMI≥28 kg/m 2、患乙型肝炎、既往出生缺陷孕育史、胎儿生长受限、孕前开始服用复合维生素和很少在家烹饪与子代尿道下裂或隐睾发生相关。","doi":"10.3760/cma.j.cn112137-20231215-01387","pmid":"","date":"2024","journal":"中华医学杂志","authors":"谢双华; 岳文涛; 张恩婕; 高屾; 苏少飞; 郝永秀; 张玥; 刘建辉; 阴赪宏; 刘瑞霞","item_type":"journalArticle","volume":"104","issue":"26","pages":"2424-2430","issn":"0376-2491","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORINemh5eDIwMjQyNjAwOBoIcmI2eDJhNGE%3D"},"WMV4K7QV":{"key":"WMV4K7QV","record_id":"R-WMV4K7QV","title":"横裁带蒂包皮岛状皮瓣尿道成形术后中期并发症临床预测模型构建的多中心研究","abstract":"目的探讨采用横裁带蒂包皮岛状皮瓣尿道成形术(TPIF)治疗尿道下裂患儿术后发生并发症的危险因素, 并构建术后并发症的临床预测模型。方法回顾性分析2018年12月至2021年9月首都医科大学附属北京儿童医院、四川省人民医院等17家医院采用TPIF治疗543例尿道下裂患儿的临床资料。患儿手术时年龄26(19, 36)月, 阴茎长度3.5(3.0, 4.0)cm, 阴茎头长度10.0(9.0, 12.5)mm, 阴茎头宽度13.5(12.5, 14.0)mm, 尿道板宽度4.0(3.0, 5.0)mm, 尿道缺损长度3.5(3.0, 3.8)cm, 阴茎下弯度数60(50, 80)°。对患儿进行随访, 了解术后有无尿道瘘、尿道狭窄、尿道憩室等并发症。根据TPIF术后有无并发症进行分组, 比较两组间患儿临床资料的差异。采用单因素、多因素logistic回归分析TPIF术后并发症的危险因素, 并建立预测术后并发症的列线图模型。通过1 000次Bootstrap自抽样法进行内部验证, 绘制校准曲线, 采用受试者操作特征(ROC)曲线下面积(AUC)验证模型的区分度, 采用Hosmer-Lemeshow拟合优度检验预测模型的校准度。结果 543例术后随访时间42(29, 61)个月, 并发症发生率为42.9%(233/543), 其中尿道瘘155例(28.5%), 尿道狭窄88例(16.2%), 尿道憩室样扩张48例(8.8%), 阴茎下弯复发/残留1例(1.4%)。有并发症组较无并发症组的尿道缺损长度[3.5(3.0, 4.0)cm 与3.2(3.0, 3.5)cm]、尿道缺损比率(UDR)[1.00(0.82, 1.17)与0.91(0.75, 1.09)]及阴茎下弯度数[70(60, 80)°与60(40, 70)°]均更大(P  0.001)。单因素logistic回归分析结果显示, 矫正阴茎下弯前尿道开口位置、阴茎下弯度数、UDR、尿道缺损长度是TPIF术后并发症的危险因素(P  0.05);多因素logistic分析结果显示, 阴茎下弯度数(OR = 1.02, 95%CI 1.01 ～ 1.03)及尿道缺损长度(OR = 1.56, 95%CI 1.08 ～ 2.24)是TPIF术后并发症的独立危险因素。基于上述独立危险因素构建列线图模型的AUC为0.672(95%CI 0.626 ～ 0.717), Hosmer-Lemeshow拟合优度检验提示模型拟合较好(P = 0.880)。结论多中心研究结果显示尿道下裂阴茎下弯角度及尿道缺损长度是TPIF术后出现并发症的独立危险因素, 基于上述指标构建的术后并发症临床预测模型具有一定的区分度及校准度, 可为预测术后并发症发生率提供评估依据。","doi":"10.3760/cma.j.cn112330-20250104-00009","pmid":"","date":"2026","journal":"中华泌尿外科杂志","authors":"方一圩; 宋宏程; 孙宁; 张潍平; 唐耘熳; 王学军; 黄鲁刚; 曾莉; 杨屹; 刘鑫; 潮敏; 张晔; 马洪; 刘红; 张敬悌; 康磊; 张旭辉; 孟庆明; 李守林; 谢谨谨; 周学锋; 李宁; 陈超; 苏成; 何大维; 刘星; 吴文波; 唐静; 谢华; 吴旻; 关勇; 王欣; 杨艳芳; 张建国","item_type":"journalArticle","volume":"47","issue":"3","pages":"227-233","issn":"1000-6702","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemhtbndrMjAyNjAzMDExGghyYjZ4MmE0YQ%3D%3D"},"WT67A8ZV":{"key":"WT67A8ZV","record_id":"R-WT67A8ZV","title":"The risk factors of Urethrocutaneous fistula after hypospadias surgery in the youth population","abstract":"Abstract Background The current research aims to evaluate the risk factors of urethrocutaneous fistula after hypospadias surgery among the youth in China. Methods One hundred twenty hypospadias patients were enrolled in our study. All of them were defined as Tanner 4 or 5. The information collected from the participants include age, urethral operation history, urinary comorbidities before operation, urine test before operation, body temperature before and after operation, type of surgical repair, chordee degree, urethral defect length and whether received vesicostomy after surgery or not. Independent t test, chi-square test and multivariate logistic regression were performed to evaluate the risk factor of urethrocutaneous fistula. Results Among the enrolled patients, 39 patients (32.5%) developed urethrocutaneous fistula after hypospadias repair. Our result showed significant association between the group with urethrocutaneous fistula and the group without urethrocutaneous fistula with respect to age, pyuria before operation, urethral defect length and the urethral operation history. The following logistic regression showed that urethral defect length and the urethral operation history were the risk factors of urethrocutaneous fistula. Conclusions Urethral defect length and urethral operation history should be taken into consideration before undergoing hypospadias surgery since our study discovered that the risk of developing urethrocutaneous fistula after hypospadias repair is associated with urethral defect length and urethral operation history. Age, surgical procedure, type of surgical repair, chordee degree and other factors were not obviously related to the development of urethrocutaneous fistula.","doi":"10.1186/s12894-018-0366-z","pmid":"","date":"2018","journal":"BMC Urology","authors":"","item_type":"journalArticle","volume":"18","issue":"1","pages":"1-6","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEERvYWowMDAwMDYyOTY3NzgaCHJiNngyYTRh"},"WZT6V4IK":{"key":"WZT6V4IK","record_id":"R-WZT6V4IK","title":"Exposición a disruptores endocrinos y alteraciones del tracto urogenital masculino (criptorquidia e hipospadias)","abstract":"ResumenAntecedentes Se ha sugerido que la exposición maternoinfantil a compuestos hormonalmente activos (disruptores endocrinos) tiene en la etapa intrauterina una de sus fases más comprometidas. Objetivo Revisar los estudios epidemiológicos, nacionales e internacionales, publicados entre 1990 y el primer trimestre de 2006, que tuvieran como hipótesis la asociación entre la exposición humana a disruptores endocrinos y el riesgo de criptorquidia e hipospadias. Métodos Se han buscado artículos en MEDLINE/PubMed mediante las palabras clave: disruptores endocrinos, xenoestrógenos, pesticidas organoclorados y criptorquidia e hipospadias. La selección de los 16 trabajos incluidos se hizo atendiendo al diseño y la población de estudio, las medidas de exposición empleadas, los criterios de exclusión e inclusión establecidos y el análisis estadístico utilizado. Resultados y conclusiones Aunque los estudios aquí revisados no son concluyentes para confirmar la asociación entre disruptores endocrinos y riesgo de malformación del tracto genitourinario, tampoco demuestran la falta de tal asociación. Por este motivo parece razonable sugerir que este aspecto de la patología hormonal debería investigarse más en profundidad, resolviendo, al menos, el diagnóstico adecuado de los individuos y la estimación de la exposición a múltiples compuestos químicos, contaminantes ambientales, que actúan conjuntamente a través de mecanismos similares a las hormonas endógenas. Background It has been proposed that the intrauterine period of child-mother exposure to hormonally active compounds (endocrine disruptors) is of critical importance. Objective We reviewed all Spanish and English-language epidemiological studies published between 1990 and the first trimester of 2006 that studied the possible association between human exposure to chemical compounds and the risk of cryptorchidism and/or hypospadias. Methods The MEDLINE (PubMed) database was searched using the following key words: endocrine disruptors, organochlorine pesticides, xenoestrogens, cryptorchidism and hypospadias. Selection of the 16 studies included was based on the following criteria: study design and population, the measures of exposure used, inclusion and exclusion criteria, and the statistical analysis used. Results and conclusions Although the studies reviewed do not conclusively confirm the association between exposure to endocrine disruptors and the risk of male genital malformation, this association cannot be ruled out. Further in-depth investigation of this association is required. Issues that remain to be resolved are the diagnostic classification to be used and appropriate measurement of exposure to multiple chemical compounds and environmental contaminants that act conjointly through mechanisms similar to endogenous hormones.","doi":"10.1157/13112246","pmid":"","date":"2007","journal":"Gaceta Sanitaria","authors":"","item_type":"journalArticle","volume":"21","issue":"6","pages":"500-514","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEFNET1MwMDAwMDg3NDAyNTQaCHJiNngyYTRh"},"X3K9JESW":{"key":"X3K9JESW","record_id":"R-X3K9JESW","title":"PREOPERATIVE NARROW MEATUS AS A PREDICTOR OF COMPLICATIONS AFTER HYPOSPADIAS REPAIR: A PROSPECTIVE STUDY","abstract":"","doi":"10.1097/01.JU.0001191704.13236.7f.26","pmid":"","date":"2026 MAY","journal":"JOURNAL OF UROLOGY","authors":"Itshak A; Visman Y; Neheman A; Gildor OS","item_type":"journalArticle","volume":"215","issue":"5S","pages":"","issn":"0022-5347 1527-3792","isbn":"","url":""},"X65WNHGL":{"key":"X65WNHGL","record_id":"R-X65WNHGL","title":"Editorial Comment","abstract":"","doi":"10.1097/01.JU.0000553005.19337.6d","pmid":"","date":"2019","journal":"Journal of Urology","authors":"Weiss D.A.; Pyle L.C.","item_type":"journalArticle","volume":"201","issue":"2","pages":"392","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85059902552?origin=resultslist"},"XFN74ZCL":{"key":"XFN74ZCL","record_id":"R-XFN74ZCL","title":"An unusual phenotype of Frasier syndrome due to IVS9 +4C>T mutation in the WT1 gene: Predominantly male ambiguous genitalia and absence of gonadal dysgenesis","abstract":"The Wilms' tumor gene (WT1) encodes a zinc-finger transcription factor involved in the development of the kidneys and gonads and their subsequent normal function. Mutations in the WT1 gene were identified in patients with WAGR (Wilms' tumor, aniridria, genitourinary abnormalities, and mental retardation), Denys-Drash syndrome, and Frasier syndrome (FS). Constitutional heterozygous mutations of the WT1 gene, almost all located at intron 9, are found in patients with FS. This syndrome is characterized by female external genitalia in 46,XY patients, late renal failure, streak gonads, and high risk of gonadoblastoma development. We report a male with FS with an unusual phenotype characterized by normal penis size with perineal hypospadias, end-stage renal failure at the age of 19 yr, normal adult male serum T levels, extremely elevated gonadotropin levels, para-testicular leiomyoma, unilateral testicular germ cell tumor, bilateral gonadoblastoma, and absence of gonadal dysgenesis. Automatic sequencing identified the IVS9 +4C>T mutation in the WT1 gene, which predicts a change in splice site utilization. WT1 transcript analysis showed reversal of the normal positive/negative KTS (lysine, threonine, and serine) isoform ratio, confirming the diagnosis of FS. This patient with FS presents an external genitalia of Denys-Drash syndrome, suggesting that these two syndromes are not distinct diseases but may represent two ends of a spectrum of disorders caused by alterations in WT1 gene.\n   This case expands the spectrum of phenotypes associated with WT1 mutations, by including predominantly male ambiguous genitalia and absence of gonadal dysgenesis, extremely high gonadotropin levels, and delayed adrenarche, and presence of a para-testicular leiomyoma, bilateral gonadoblastoma, and germ cell neoplasia.","doi":"10.1210/jc.87.6.2500","pmid":"","date":"2002","journal":"Journal of Clinical Endocrinology and Metabolism","authors":"Melo K.F.S.; Martin R.M.; Costa E.M.F.; Carvalho F.M.; Jorge A.A.; Arnhold I.J.P.; Mendonca B.B.","item_type":"journalArticle","volume":"87","issue":"6","pages":"2500-2505","issn":"0021-972X","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L34657261&from=export"},"XLAU2JFJ":{"key":"XLAU2JFJ","record_id":"R-XLAU2JFJ","title":"Editorial comment. An increased incidence of hypospadias in the past 10 years.","abstract":"The authors in their retrospective cohort study identified an increased incidence of hypospadias in the past 10 years but not a statistically significant increased difference between the incidence in 1999 and that in 2007. A number of reports from different areas worldwide have demonstrated the various risk factors associated with hypospadias, and this report lends additional support to this trend. A genetic predisposition, exposure to environmental factors, and the local hormonal milieu have all been implicated. Teasing out which of these factors contributes to an individual's hypospadias will continue to be a matter of ongoing research, because it is clearly multifactorial.","doi":"10.1016/j.urology.2009.02.020","pmid":"","date":"2009","journal":"Urology","authors":"Carr MC","item_type":"journalArticle","volume":"73","issue":"6","pages":"1245; author reply 1246","issn":"0090-4295","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDhhZTRkMzg2YWE5ODgyNmJiYTk3ZTI2YWYxZmM2NzY2GghyYjZ4MmE0YQ%3D%3D"},"XLZZW457":{"key":"XLZZW457","record_id":"R-XLZZW457","title":"Catheter-associated meatal pressure injury in hospitalized males","abstract":"Aims: To assess the prevalence of catheter-associated meatal pressure injury in acute hospitalized males, to determine risk factors for its formation and to propose a grading system for meatal pressure injury severity. Methods: In this cross-sectional study, we screened all adult males concurrently hospitalized at a tertiary medical center for indwelling urethral catheters and for meatal pressure injury. We proposed a system to grade meatal pressure injury severity and used logistic-regression modeling to calculate odds ratios (ORs) of possible risk factors. Results: A number of 168/751 (22.4%) hospitalized males with indwelling urethral catheters were included. Median age was 70.5 (inter-quartile range [IQR]: 57.0-80.3) years, median time from catheterization 5.5 (IQR: 2-11) days. A total of 61 (36%) had meatal pressure injury, as early as the first day after catheterization. Grade III injuries (\u003c2 cm ulcer) developed in 22 (13%) patients, earliest noted on the second catheter day, and grade IV injuries (≥2 cm) in 7 (4%) patients, as early as 5 days post catheterization. In a multivariable analysis, catheter fixation (OR: 0.26 [95% CI: 0.10-0.70]; P =.008) was associated with reduced risk of meatal pressure injury, while catheter presence over 14 days (OR: 1.46 [95% CI: 1.01-1.08]; P =.005) and other skin ulcers (OR: 2.45 [95% CI: 1.05-5.71]; P =.038) were associated with a higher risk of meatal pressure injury. Conclusions: Meatal pressure injury is a common complication of indwelling catheters in hospitalized males, beginning days after catheterization. Meatal pressure injury was associated with prolonged catheter presence, other pressure injuries, and lack of catheter fixation. Prospective studies are needed to establish evidence-based guidelines. © 2020 Wiley Periodicals, Inc.","doi":"10.1002/nau.24372","pmid":"","date":"2020","journal":"Neurourology and Urodynamics","authors":"Shenhar C.; Mansvetov M.; Baniel J.; Golan S.; Aharony S.","item_type":"journalArticle","volume":"39","issue":"5","pages":"1456-1463","issn":"07332467 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85084137482?origin=resultslist"},"XVWTS472":{"key":"XVWTS472","record_id":"R-XVWTS472","title":"Repair of proximal hypospadias with single‑stage (Duckett’s method) or Bracka two‑stage: a retrospective comparative cohort study","abstract":"Background: Surgical correction of proximal hypospadias is challenging. The complication rate of proximal hypospadias is still high, and the debate over its optimal treatment is ongoing. Duckett’s method is a classic non-staging operation, and two-stage Bracka repair is an attractive alternative procedure. Herein, we retrospectively analyzed the effects of two surgical techniques on proximal hypospadias in order to reduce the complication rates of proximal hypospadias, and analyzed the various risk factors that cause complications. Methods: This study retrospectively evaluated 94 consecutive patients who underwent repair of penoscrotal or proximal defects between 2015 and 2019. Patients were assigned to two groups: 46 patients were treated with Bracka and 48 with Duckett. Patient age at surgery, urethral meatus location, and postoperative complications were recorded. One-way analysis of variance (ANOVA) was used to analyze the length and curvature of the penis and the length of the urethral defect. Results: There was no significant difference between the two groups in terms of age and type of hypospadias. In the Bracka group, there was 1 case (2.2%) of meatal stenosis after the first stage, which was restored with ureteral dilatation. After second-stage repair, a urethral fistula was noted in 4 cases (8.7%) and strictures in 2 cases (4.3%). In the Duckett group, urethral fistulas were noted in 8 cases (16.7%), strictures in 4 cases (8.3%), partial glans dehiscence in 4 cases (8.3%), and diverticulum in 1 case (2.1%) postoperatively. Compared with the Duckett group, the overall complication rate for Bracka repair was lower (35.4% vs. 13%, P=0.016). In addition, compared with the Duckett group, children with perineal hypospadias who were treated with the Bracka operation had fewer postoperative complications (100% vs. 13%, P=0.015). Risk factor analysis showed that the initial curvature of the penis, initial urethral defect, and degree of penile curvature after skin degloving were not correlated with complications. There was a significant correlation between urethral defects after correction of the chordee and urethral fistulas (P=0.019). Conclusions: Compared with the Duckett procedure, the Bracka two-stage repair may be a safer and more reliable approach for proximal hypospadias in children. The Bracka two-stage repair should be used for perineal hypospadias. The larger the urethral defect after chordee correction, the greater the possibility of a postoperative urethral fistula. © Translational Pediatrics. All rights reserved.","doi":"10.21037/TP-23-75","pmid":"","date":"2023","journal":"Translational Pediatrics","authors":"Wu Y.; Guan Y.; Wang X.; Wang C.; Ma X.; Guan H.","item_type":"journalArticle","volume":"13","issue":"3","pages":"387-395","issn":"22244336 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85159314348?origin=resultslist"},"Y2Q62W5G":{"key":"Y2Q62W5G","record_id":"R-Y2Q62W5G","title":"Cumulative effects of in utero administration of mixtures of reproductive toxicants that disrupt common target tissues via diverse mechanisms of toxicity.","abstract":"Although risk assessments are typically conducted on a chemical-by-chemical basis, the 1996 Food Quality Protection Act required the US Environmental Protection Agency to consider cumulative risk of chemicals that act via a common mechanism of toxicity. To this end, we are conducting studies with mixtures of chemicals to elucidate mechanisms of joint action at the systemic level with the goal of providing a framework for assessing the cumulative effects of reproductive toxicants. Previous mixture studies conducted with antiandrogenic chemicals are reviewed briefly and two new studies are described. In all binary mixture studies, rats were dosed during pregnancy with chemicals, singly or in pairs, at dosage levels equivalent to approximately one-half of the ED50 for hypospadias or epididymal agenesis. The binary mixtures included androgen receptor (AR) antagonists (vinclozolin plus procymidone), phthalate esters [di(n-butyl) phthalate (DBP) plus benzyl n-butyl phthalate (BBP) and diethyl hexyl phthalate (DEHP) plus DBP], a phthalate ester plus an AR antagonist (DBP plus procymidone), a mixed mechanism androgen signalling disruptor (linuron) plus BBP, and two chemicals which disrupt epididymal differentiation through entirely different toxicity pathways: DBP (AR pathway) plus 2,3,7,8 TCDD (AhR pathway). We also conducted multi-component mixture studies combining several 'antiandrogens'. In the first study, seven chemicals (four pesticides and three phthalates) that elicit antiandrogenic effects at two different sites in the androgen signalling pathway (i.e. AR antagonist or inhibition of androgen synthesis) were combined. In the second study, three additional phthalates were added to make a 10 chemical mixture. In both the binary mixture studies and the multi-component mixture studies, chemicals that targeted male reproductive tract development displayed cumulative effects that exceeded predictions based on a response-addition model and most often were in accordance with predictions based on dose-addition models. In summary, our results indicate that compounds that act by disparate mechanisms of toxicity to disrupt the dynamic interactions among the interconnected signalling pathways in differentiating tissues produce cumulative dose-additive effects, regardless of the mechanism or mode of action of the individual mixture component. © 2010 European Academy of Andrology.","doi":"10.1111/j.1365-2605.2009.01049.x","pmid":"","date":"2010","journal":"International Journal of Andrology","authors":"Rider C. V.; Furr J. R.; Wilson V. S.; Gray L. E. Jr","item_type":"journalArticle","volume":"33","issue":"2","pages":"443-462","issn":"0105-6263","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L358484167&from=export"},"Y4ME3HZY":{"key":"Y4ME3HZY","record_id":"R-Y4ME3HZY","title":"Can Grafted Tubularized Incised Plate Urethroplasty be Used to Repair Narrow Urethral Plate Hypospadias? Its Functional Evaluation Using Uroflowmetry.","abstract":"Aim: Using uroflowmetry, the aim of this study is to determine the functional results of the grafted tubularized incised plate (GTIP) urethroplasty used to repair poor urethral plate hypospadias. Settings and Design: Seventy-one patients (mean age: 5.7 years, follow-up: 1-5.5 years) were selected from those who underwent surgery using the GTIP technique from 2013 to 2015 at our institution. Methods: Patients included were able to void voluntarily and had no fistula. The flow pattern, maximum urinary flow rate (Qmax), voided volume (vv), average flow rate, and voiding time were measured. The results were expressed as percentiles and interpreted according to Siroky nomogram. The Qmaxwas considered normal if >25th percentile, as equivocally obstructed when in the 5th-25th percentile, and obstructed if \u003c5th percentile. Results: Hypospadias was distal in 45, mid penile in 17 and proximal penile in 9. The uroflow curve was bell-shaped in 24 (30%), interrupted in 9 (14%), slightly flattened in 31 (46%), and a plateau in 7 (10%). Flow rate nomograms revealed that 49 (68%) were above the 25th percentile, 9 (17%) were below the 5th percentile, and 13 (15%) were between these ranges. Eleven patients showed improvement in the flow curve and maximum urinary flow rate (Qmax) in follow-up uroflowmetry. Conclusion: GTIP repair provides satisfactory functional results. A long-term follow-up is needed to confirm these results. © 2019 Journal of Indian Association of Pediatric Surgeons Published by Wolters Kluwer-Medknow.","doi":"10.4103/jiaps.JIAPS_151_18","pmid":"","date":"2019","journal":"Journal of Indian Association of Pediatric Surgeons","authors":"Pan Pradyumna","item_type":"journalArticle","volume":"24","issue":"4","pages":"247-251","issn":"09719261 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85072078246?origin=resultslist"},"YA4BREGI":{"key":"YA4BREGI","record_id":"R-YA4BREGI","title":"Relation between some techniques of hypospadias repair and complications: Universitary San Vicente de Paul Hospital 1986-2005","abstract":"Objective: The incidence of hypospadias has been increasing in the last decades. Successful hypospadias repair depends on patient factors and surgical technique, a factor closely related to the surgeon's experience. The aim of this descriptive, retrospective was to determine the preferred technique and its association with postoperative complications. Methods: Charts of 207 patients who had had hypospadias repair performed between January 1986 and December 2005, in the San Vicente de Paul University Hospital, were reviewed. Results: Hypospadias repair was performed in patients between 1 and 14 years of age. Duckett technique was performed in 38.7%, Mathiew technique in 30% MAGPI technique in 11.6%, Snodgrass in 6.3% and other techniques in 14% of the patients. Postoperative complication included hemorrhagic complications (1.9%), infectious complications (1.9%). urethral diverticular dilatation (3.90%), residual ventral chordee (5.8%), failure of urethroplasty, (8.7%), strictures (23%), and fistulas (41%). Strictures was the most important risk factor for postoperative fistulas (p>0.05). Patients with hypospadias repair with PDS sutures had a lower incidence of postoperative fistulas (p\u003c0.05) Tissue layer over the suture line, age of patient and number of days with urethral stent was not related to the presence of postoperative complications. Conclusion: The Importance of known and accepted protective factors in hypospadias repair like tissue layer over the suture line, age of patient and more or less days with urethral stent, in terms of avoidance of postoperative complications after hypospadias repair, may have to be re-evaluated.","doi":"10.1016/S0210-4806(08)73839-7","pmid":"","date":"2008","journal":"Actas Urologicas Espanolas","authors":"Martinez Montoya J.A.; Charns Anturi A.A.; Contreras Pérez D.F.","item_type":"journalArticle","volume":"32","issue":"3","pages":"332-340","issn":"0210-4806","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L351606554&from=export"},"YCHJ8X9N":{"key":"YCHJ8X9N","record_id":"R-YCHJ8X9N","title":"Endocrine assessment of prepubertal boys with a history of cryptorchidism and/or hypospadias: A pilot study","abstract":"Purpose: Four disorders, including poor semen quality, testicular cancer, cryptorchidism and hypospadias, are thought to represent testicular dysgenesis syndrome and have been hypothesized to share a common etiology. We predicted testicular function in prepubertal boys with a history of cryptorchidism and/or hypospadias by measuring serum hormone levels. Materials and Methods: A total of 82 prepubertal boys who underwent orchiopexy and/or hypospadias repair in childhood were enrolled in the study. Patients were surgically treated for cryptorchidism (23 in group 1), hypospadias (49 in group 2), cryptorchidism and hypospadias (10 in group 3), and hydrocele testis (7 in control group 4). Serum hormones, including luteinizing hormone, follicle-stimulating hormone and total testosterone, were measured separately by age less than 12.5, 12.5 to 13.5 and greater than 13.5 years, and by Tanner pubertal stage. Results: Follicle-stimulating hormone in group 3 was significantly higher than in groups 1, 2 and 4 at ages 12.5 to 13.5 and greater than 13.5 years, and for Tanner stages 2 and 3 (p \u003c0.05). However, luteinizing hormone and testosterone did not differ among the groups regardless of age or Tanner stage. Group 3 patients had significantly higher follicle-stimulating hormone regardless of the severity of cryptorchidism or hypospadias. Conclusions: Data suggest that testicular function in patients with cryptorchidism plus hypospadias is more severely impaired than that in patients with cryptorchidism or hypospadias, lending clinical support to the testicular dysgenesis syndrome hypothesis of a common origin. © 2011 by AMERICAN UROLOGICAL ASSOCIATION EDUCATION AND RESEARCH, INC.","doi":"10.1016/j.juro.2011.01.018","pmid":"","date":"2011","journal":"","authors":"Iwatsuki S.; Kojima Y.; Mizuno K.; Kamisawa H.; Umemoto Y.; Sasaki S.; Kohri K.; Hayashi Y.","item_type":"conferencePaper","volume":"185","issue":"6 SUPPL.","pages":"2444-2450","issn":"","isbn":"00225347 (ISSN)","url":"https://www.scopus.com/pages/publications/79955826866?origin=resultslist"},"YDD7RNTG":{"key":"YDD7RNTG","record_id":"R-YDD7RNTG","title":"Two brothers with ATRX mutation having micropenis without other features of ATR-X syndrome","abstract":"Background: Mutations in the ATRX gene cause X-linked alphathalassemia/ mental retardation (ATR-X) syndrome. Typically ATR-X syndrome is characterized by severe mental retardation (>95%), alpha thalassemia (90%), facial abnormalities during infant (>90%), genital abnormalities (80%), microcephaly (75%) and short stature (65%). These genital abnormalities extend from hypospadias with microphallus to ambiguous female external genitalia. ATRX mutations cluster mainly in the ATRX-DNMT3-DNMT3L (ADD) domain ( '50%) and helicase domain ( '20%). The patient of ATRX mutation who has micropenis without other features such as mental retardation and facial abnormality was unreported previously. Cases: Two of three brothers having micropenis visited our hospital. The characteristic data of three brothers were described in Table. We sequenced 26 genes implicated in 46XY disorders of sex development using MiSeq instrument. We found an ATRX sequence variation (c.3063G>C, p.Glu1021Asp), which is located outside ADD and helicase domains in all three brothers, confirmed by PCR-direct sequencing. This variation was not registered on the databases of SNPs. Glu1021 was conserved in rhesus, mouse, dog, elephant, chicken and Xenopus tropicalis. The sequence-based mutation prediction for c.3063G>C was damaging by Polyphen-2, and tolerated by SIFT. The brilliant cresyl blue stain for red blood cells is underway, being the most sensitive for detection of alpha thalassemia. Discussion: A c.3063G>C (p.Glu1021Asp) must be a novel mutation, because of no registration of databases of SNPs, conservation of Glu1021 evolutionarily, and in silico analyses. Two of three brothers had micropenis while another didn't. The phenotypic variation may be caused by other genetic and/or environmental factors. Intriguingly two brothers who had micropenis didn't have other feature of ATR-X syndrome. ATRX gene analysis for patients with micropenis is warranted to find similar cases. Conclusion: We identified a novel mutation of ATRX gene, c.3063G>C (p.Glu1021Asp), in two brothers who had only micropenis. (Table Presented).","doi":"10.1186/s13633-017-0054-x","pmid":"","date":"2017","journal":"International Journal of Pediatric Endocrinology","authors":"Eguchi M.; Yamamoto Y.; Saito R.; Goto M.; Araki S.; Kubo K.; Kawagoe R.; Kawada Y.; Kusuhara K.; Sato T.; Narumi S.; Hasegawa T.","item_type":"journalArticle","volume":"2017","issue":"(Eguchi M.; Yamamoto Y.; Saito R.; Goto M.; Araki S.; Kubo K.; Kawagoe R.; Kawada Y.; Kusuhara K.) Department of Pediatrics, University of Occupational and Environmental Health, Japan","pages":"","issn":"1687-9856","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L620748784&from=export"},"YDL4BGID":{"key":"YDL4BGID","record_id":"R-YDL4BGID","title":"Prevalence and surgical management of pubic hypertrophy in hypospadias patients: Results from a high-volume surgeon","abstract":"Introduction & Objectives: Pubic hypertrophy (PH), defined as an abnormal and abundant round mass of fatty tissue located over the pubic symphysis that mimics the mons veneris, is frequently underestimated in hypospadias patients. We examined the prevalence of this condition, as well as the outcomes associated with its surgical treatment. Materials & Methods: Between Jan 2014 and Apr 2018, 266 patients were referred for hypospadias repair at our center. We treated all patients presenting PH with pubic lipectomy following precise steps. After penile degloving, suspensory ligament was divided, releasing the pubic skin and the Scarpa fascia from the body of the penis: such was made in order to get access to the suprapubic fat. The Scarpa fascia was carefully preserved in order to avoid any damage of the blood vessels and the nerves directed to the penile skin. The abundant underlying fat was detached from the aponeurosis of the external oblique muscle and then resected. The procedure was completed with the drainage and fixation of the tunica albuginea to the periosteum of the symphysis pubis and with the fixation of the penile skin to the Buck's fascia (Fig). Urethroplasty was subsequently performed using tailored surgical techniques. Multivariable logistic regression (MLR)tested for predictors of PH. Finally, separate MLRs tested for predictors of fistula or any other complications after pubic lipectomy. [Figure presented]Results: Of 266 hypospadias patients, 100 (37.6%)presented PH and underwent pubic lipectomy. Overall, we found that patients with PH more frequently had proximal hypospadias (44 vs. 7.8%), disorders of sex development (10 vs. 0.6%), cryptorchidism (12 vs. 2.4%), and moderate (30°-60°)or severe (>60°)penile curvature (33 vs. 4.2%). In MLR, the location of urethral meatus (proximal, Odds ratio [OR]: 10.1, p \u003c 0.001)was the only significant predictor of PH. Finally, pubic lipectomy was not associated with increased risk of fistula (OR: 1.12, p = 0.7)or any complications (OR: 1.37, 95% CI: 0.64-2.88, p = 0.4)after multivariable adjustment. Conclusions: One out of 3 hypospadias patients, referred to our center, presented PH and received pubic lipectomy. This rate was higher in patients with proximal hypospadias suggesting a correlation between PH and severity of hypospadias. Noteworthy, pubic lipectomy was not associated with increased risk of fistula or any complications.","doi":"10.1016/S1569-9056(19)30554-8","pmid":"","date":"2019","journal":"European Urology, Supplements","authors":"Bandini M.; Sekulović S.; Stanojevic N.; Spiridonescu B.; Dangi A.D.; Krishnappa P.; Pesic V.; Slavkovic M.; Briganti A.; Salonia A.; Montorsi F.; Djinovic R.","item_type":"journalArticle","volume":"18","issue":"1","pages":"e754-e755","issn":"1878-1500","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2001680802&from=export"},"YGU6J5K8":{"key":"YGU6J5K8","record_id":"R-YGU6J5K8","title":"产前滴滴涕或多氯联苯暴露与出生缺陷风险相关性的Meta分析","abstract":"目的 系统评价孕妇产前暴露于滴滴涕(DDT)或多氯联苯(PCBs)与新生儿出生缺陷风险之间的关系.方法 计算机检索PubMed、EMbase、WanFang Data、VIP和CNKI数据库,搜集有关产前DDT或PCBs暴露与出生缺陷关系的病例-对照研究,检索时限均从建库至2017年2月.由2名研究者独立筛选文献、提取资料并评价纳入研究的偏倚风险后,采用Stata 13.0软件进行Meta分析.结果 共纳入14个研究,包括2 238例出生缺陷新生儿和2 355例对照新生儿.Meta分析结果显示:产前暴露于高水平的DDT会导致新生儿隐睾发生率增加[OR=l.12,95％CI (1.09,1.15),P＜0.001].而DDT暴露与尿道下裂和神经管畸形发生没有相关性.产前暴露于高水平的PCBs与隐睾、尿道下裂、神经管畸形发生也没有相关性.结论 孕妇产前暴露于高水平的DDT可能是隐睾发生的危险因素.受纳入研究数量和质量的限制,上述结论尚待更多高质量研究予以验证.","doi":"10.7507/1672-2531.201707129","pmid":"","date":"2018","journal":"中国循证医学杂志","authors":"林瑜; 何洁; 赵本华; 赖圳宾; 赵泽宇; 于晓姗; 陈江慧; 林修羽; 苏艳华","item_type":"journalArticle","volume":"18","issue":"4","pages":"365-372","issn":"1672-2531","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemd4enl4MjAxODA0MDE2GghyYjZ4MmE0YQ%3D%3D"},"YIQC946J":{"key":"YIQC946J","record_id":"R-YIQC946J","title":"Lethality of Birth Defects in Live Born Infants Categorized by Gestational Age and Birth Weight.","abstract":"OBJECTIVE: This study aimed to describe lethality of birth defects (BDs) in newborns categorized by gestational age and birth weight and to identify BDs  associated with prematurity. STUDY DESIGN: Live born infants (n = 16,452) with  isolated BDs classified by severity, and 42,511 healthy controls were assigned to  categories: adequate growth, preterm, or small for gestational age (SGA).  Proportion of cases and BDs' lethality rates were obtained by category and  compared with controls. RESULTS: Overall fewer malformed than nonmalformed  infants were of adequate growth, while the opposite occurred in the preterm and  SGA categories where gastroschisis and esophageal atresia were among the most  outstanding defects. For most severe BDs, the early neonatal death rate was  higher than control values in all categories; for mild defects, except cleft lip  in the preterm category, they did not differ. Diaphragmatic hernia showed the  highest lethality values, while those of spina bifida were among the lowest.  Talipes, hypospadias, and septal heart defects were mild defects significantly  associated with prematurity. CONCLUSION: Although reasons, such as induced  preterm delivery of fetuses with certain anomalies, could partially account for  their high prematurity rates, susceptibility to preterm birth might exist through  underlying mechanisms related with the defects. The identification of BDs  associated with prematurity should serve to improve measures that prevent preterm  birth especially of fetuses at risk. KEY POINTS: · Some BDs predispose to  prematurity.. · Prematurity is an additional risk factor for mortality in infants  with mild defects.. · Lethality values should be adjusted by gestational age and  birth weight..","doi":"10.1055/s-0041-1735867","pmid":"34634830","date":"2023 Oct","journal":"American journal of perinatology","authors":"Rittler Monica; Campaña Hebe; Heisecke Silvina; Ratowiecki Julia; Elias Dario; Gimenez Lucas; Poletta Fernando A.; Gili Juan; Pawluk Mariela; Santos Maria Rita; Uranga Rocio; Cosentino Viviana; Camelo Jorge Lopez","item_type":"journalArticle","volume":"40","issue":"13","pages":"1406-1412","issn":"1098-8785 0735-1631","isbn":"","url":""},"YRQCSRNE":{"key":"YRQCSRNE","record_id":"R-YRQCSRNE","title":"Primary hypospadias repair outcomes: results from a retrospective cohort of 292 children","abstract":"Purpose Hypospadias surgery is challenging. Numerous techniques have been described with variable complication rates. The main objectives of our study were to evaluate the urethroplasty complication rate of primary hypospadias repair and to identify risk factors for complications. Methods We retrospectively evaluated the outcomes of all patients who underwent primary hypospadias repair in our department between January 2012 and December 2020. Demographic, anatomical, operative, and postoperative data were reported. Univariate and multivariate logistic regression analyses were performed to identify variables associated with complications. Statistical significance was set at p \u003c 0.05. Results Of 292 patients, 203 (69.5%) had distal hypospadias, 63 (21.6%) had mid-penile hypospadias, and 26 (8.9%) had proximal hypospadias. The mean age at the time of surgery was 22.8 months. Seventy-eight patients (26.7%) had urethroplasty complications. The rate of complications was higher for proximal hypospadias (57.7%), onlay island flap (44.4%), and Koyanagi (75%) procedures. The mean follow-up duration was 29 months. Two predictors of complications were identified by multivariate analysis: catheterization duration and urethroplasty technique. The reoperation rate was 30.5%. Conclusion Urethroplasty complications frequently occur after primary hypospadias repair. The complication rate was higher in proximal hypospadias. Catheterization duration and surgical technique were significant predictors of complications. A longer and more standardized follow-up is needed for a better assessment of hypospadias repair outcomes.","doi":"10.1007/s00345-024-04811-x","pmid":"","date":"2024","journal":"World journal of urology","authors":"Hild O.; Fotso Kamdem A.; Boulard N.; Auber F.; Chaussy Y.","item_type":"journalArticle","volume":"42","issue":"","pages":"Article: 137","issn":"0724-4983","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDkwYWYyZWJkYWQ1ZjZjODFlNmRmNTY2ZDQ1NzFjYmFjGghyYjZ4MmE0YQ%3D%3D"},"YSM38U5R":{"key":"YSM38U5R","record_id":"R-YSM38U5R","title":"Risk factors for hypospadias: a prospective single-center study from Ghana","abstract":"Introduction Hypospadias is a common congenital defect in boys, though its causes are mostly unknown, likely arising from genetic and environmental factors. We analyzed hypospadias cases at our center to identify prevalence of risk factors. Methods We collected data prospectively on boys with hypospadias and their parents who visited our center from January 2023 to December 2024. The urology unit diagnoses two new cases of hypospadias each month. Therefore, 51 patients were recruited, expecting 5% of the data to be unusable. Data collected and analyzed included the child's gestational age, birth weight, type of hypospadias, associated abnormalities, parents' ages, exposure to organophosphate pesticides and phytoes-trogens, maternal contraceptive use during pregnancy, and a history of subfertility or hypospadias in the father. Results This study involving 51 boys aged 2 months to 11 years with hypospadias and their parents revealed that 84.3% were born at term, while 45.1% had low birth weights, with no correlation between birth weight and hypospadias type (p = 0.35). Most mothers (54.9%) and fathers (86.3%) were 30 or older at birth, and 45.1% of mothers and 27.5% of fathers frequently consumed phytoestrogen-rich foods. Exposure to organophosphate pesticides was noted by 17.6% of mothers and 11.7% of fathers. During pregnancy, 15.7% of mothers used oral contraceptives and 5.9% used progestogens. Among fathers, 11.7% had a history of subfertility, and 3.9% had cryptorchidism, with no father having hypospadias. Conclusion Low birth weight, advanced parental age, and exposure to phytoestrogens and organo-pesticides are associated with hypospadias in our patients","doi":"10.1007/s00345-025-06091-5","pmid":"","date":"2025","journal":"World journal of urology","authors":"Maison Patrick Opoku Manu; Appiah Kwaku Addai-Arhin; Arthur Douglas; Amoabeng Joseph; Mensah Phillip; Arthur Augustine","item_type":"journalArticle","volume":"43","issue":"","pages":"Article: 714","issn":"0724-4983","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDg2NWYwYWQ3OWI3MzgxOWQ5OTdmOWIxY2QzNTQ2ZWE5GghyYjZ4MmE0YQ%3D%3D"},"YWB8MLHC":{"key":"YWB8MLHC","record_id":"R-YWB8MLHC","title":"Meconium Concentrations of Pesticides and Risk of Hypospadias A Case–Control Study in Brittany, France","abstract":"in the maternity units completed a self-administered questionnaire, we collected medical data from hospital records, and medical staff collected meconium samples. We performed chemical analysis of 38 pesticides (parent compound and/or metabolite) by UHPLC/MS/MS following strict quality assurance/quality control criteria and blind to case–control status. We carried out logistic regression accounting for frequency-matching variables and major risk factors. Results: Among the 38 pesticides measured, 16 (42%) were never detected in the meconium samples, 18 (47%) were in \u003c5% of samples, and 4 (11%) in ≥5% of the samples. We observed an association between the detection of fenitrothion in meconium and the risk of hypospadias (OR = 2.6 [1.0–6.3] with ncases = 13, ncontrols = 21), but not the other pesticides. Conclusions: Our small study provides a robust assessment of fetal exposure. Fenitrothion’s established antiandrogenic activities provide biologic plausibility for our observations. Further studies are needed to confirm this hypothesis.; Background: Hypospadias is a male genital tract defect for which an increase in prevalence has been documented over the last few decades. A role for environmental risk factors is suspected, including prenatal exposure to pesticides. Objectives: To study the risk of hypospadias in association with multiple pesticide measurements in meconium samples. Methods: The Brittany Registry of Congenital Anomalies (France) conducted a case–control study between 2012 and 2018. Cases were hypospadias, ascertained by a pediatrician and a pediatric surgeon, excluding genetic conditions, following European Surveillance of Congenital Anomalies guidelines (N = 69). Controls (N = 135) were two male infants without congenital anomaly born after each case in the same maternity unit. Mothers Copyright © 2023 Wolters Kluwer Health, Inc. All rights reserved.","doi":"10.1097/EDE.0000000000001688","pmid":"","date":"2024","journal":"Epidemiology","authors":"Rouget F.; Bihannic A.; Le Bot B.; Mercier F.; Gilles E.; Garlantezec R.; Multigner L.; Cordier S.; Arnaud A.; Pladys P.; Chevrier C.","item_type":"journalArticle","volume":"35","issue":"2","pages":"185-195","issn":"10443983 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85183973596?origin=resultslist"},"Z5LGSRXF":{"key":"Z5LGSRXF","record_id":"R-Z5LGSRXF","title":"Incidence of depression and its related factors in hypospadias patients after surgical treatment","abstract":"Objectiv To investigate the incidence of depression and its etiological factors in patients with hypospadias after operation. Methods From January to June 2015, we investigated the incidence of depression symptoms among patients with hypospadias after surgical treatment from January 1990 to December 1994 in Zhangzhou Affiliated Hospital of Fujian Medical University, and we matched them with mentally healthy adults of the same age to 1:1 ratio. Zung Self-Rating Depression Scale and Correlation Factor Questionnaire were used to investigate and analyze the related factors of depression symptoms between the patients with hypospadias and the healthy males. Results A total of 80 patients with hypospadias after surgical treatment and 80 healthy males as control were included. There were no significant differences in male secondary sexual development, testis development, serum testosterone levels and postoperative length and girth of the penis in two groups. The incidence rate of depression symptoms was 45.0% (16/80) in the hypospadias patients after operation, extremely significantly higher than 6.3% (5/80) in the control group (χ2=6.632, P=0.01). The result of multiple stepwise regression analysis showed that the main risk factors of depression symptoms were worries about dissatisfaction with penile and scrotal appearance (F=16.210 3, P=0.001), sexual satisfaction (F=4.621 2, P=0.036) and sexual function (F=4.103 2, P=0.043). Conclusion Symptoms of depression often occur in hypospadias patients after operation, and the major etiological factors are dissatisfaction with penile and scrotal appearance, sexual satisfaction and sexual function. © 2015 Editorial Board of Chin J Evid-based Med.","doi":"10.7507/1672-2531.20150207","pmid":"","date":"2015","journal":"Chinese Journal of Evidence-Based Medicine","authors":"Yang M.-G.; Zheng Z.-D.; Xu Z.-Q.; Lin H.-L.; Zhuang Z.-M.; Zhang C.-X.","item_type":"journalArticle","volume":"15","issue":"11","pages":"1254-1257","issn":"16722531 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84948962412?origin=resultslist"},"Z5RLZE37":{"key":"Z5RLZE37","record_id":"R-Z5RLZE37","title":"Predictive value of urethral defect length for complications after one-stage duckett repair and a criterion for choosing staged reconstruction","abstract":"Objective To evaluate the predictive value of urethral defect length for postoperative complications following one-stage transverse preputial island flap tubularized urethroplasty (Duckett procedure) for hypospadias, and to define a simple intraoperative criterion for opting for staged repair. Methods We retrospectively reviewed 80 children who underwent one-stage Duckett repair at the Department of Pediatric Surgery, the First Affiliated Hospital of Zhengzhou University from January 2021 to January 2023. Patient age at surgery ranged from 12 to 116 months. Based on urethral defect length, patients were assigned to Group A(2.0-3.0 cm, n=30), Group B(3.1-4.0 cm, n=29), or Group C(4.1-5.0 cm, n=21). We collected age, duration of catheterization, operative time, intraoperative blood loss, glans diameter, and postoperative complications. A threshold urethral defect length predictive of complications was determined. Results There were no significant between-group differences in age, catheterization duration, operative time, intraoperative blood loss, or glans diameter (all P>0.05). Overall postoperative complication rates were 10.0%(3/30) in Group A, 37.9%(11/29) in Group B, and 71.4%(15/21) in Group C(χ2=20.226, P\u003c0.001). Urethrocutaneous fistula rates were 6.7%(2/30), 31.0% (9/29), and 33.3% (7/21) across Groups A-C, respectively (χ2=6.938, P=0.031). Penile residual curvature (chordee) recurred in 0, 3.4%(1/29), and 19.0%(4/21) of patients in Groups A-C, respectively (P=0.019). Rates of urethral stricture and glans dehiscence did not differ significantly among groups (both P>0.05). Multivariable logistic regression identified urethral defect length as an independent predictor of postoperative complications after one-stage Duckett repair (OR=4.734; 95% CI: 2.223-10.084; P=0.001). Receiver operating characteristic (ROC) analysis indicated that a urethral defect length >3.5 cm was associated with a higher probability of postoperative complications, with sensitivity 88.9%, specificity 73.6%, positive predictive value 63.2%, and negative predictive value 92.9%. Conclusions Urethral defect length has strong predictive value for complications following one-stage Duckett urethroplasty. After complete correction of penile curvature, a residual urethral defect length > 3.5 cm can serve as a simple quantitative intraoperative criterion to consider staged repair rather than a one-stage Duckett procedure. 2026, Chinese Medical Association","doi":"10.3760/cma.j.cn421158-20240617-00284","pmid":"","date":"2026","journal":"Chinese Journal of Pediatric Surgery","authors":"Liu P.; Zhang S.; Zhao X.; Yu B.; Li N.; Chen C.; Liu Y.; Fan Y.","item_type":"journalArticle","volume":"47","issue":"3","pages":"244-249","issn":"02533006 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/105036437803?origin=resultslist"},"Z76B8P23":{"key":"Z76B8P23","record_id":"R-Z76B8P23","title":"Catheter-associated meatal pressure injury in hospitalized males.","abstract":"AIMS: To assess the prevalence of catheter-associated meatal pressure injury in acute hospitalized males, to determine risk factors for its formation and to  propose a grading system for meatal pressure injury severity. METHODS: In this  cross-sectional study, we screened all adult males concurrently hospitalized at a  tertiary medical center for indwelling urethral catheters and for meatal pressure  injury. We proposed a system to grade meatal pressure injury severity and used  logistic-regression modeling to calculate odds ratios (ORs) of possible risk  factors. RESULTS: A number of 168/751 (22.4%) hospitalized males with indwelling  urethral catheters were included. Median age was 70.5 (inter-quartile range  [IQR]: 57.0-80.3) years, median time from catheterization 5.5 (IQR: 2-11) days. A  total of 61 (36%) had meatal pressure injury, as early as the first day after  catheterization. Grade III injuries (\u003c2 cm ulcer) developed in 22 (13%) patients,  earliest noted on the second catheter day, and grade IV injuries (≥2 cm) in 7  (4%) patients, as early as 5 days post catheterization. In a multivariable  analysis, catheter fixation (OR: 0.26 [95% CI: 0.10-0.70]; P = .008) was  associated with reduced risk of meatal pressure injury, while catheter presence  over 14 days (OR: 1.46 [95% CI: 1.01-1.08]; P = .005) and other skin ulcers (OR:  2.45 [95% CI: 1.05-5.71]; P = .038) were associated with a higher risk of meatal  pressure injury. CONCLUSIONS: Meatal pressure injury is a common complication of  indwelling catheters in hospitalized males, beginning days after catheterization.  Meatal pressure injury was associated with prolonged catheter presence, other  pressure injuries, and lack of catheter fixation. Prospective studies are needed  to establish evidence-based guidelines.","doi":"10.1002/nau.24372","pmid":"","date":"2020","journal":"Neurourology and urodynamics.","authors":"Shenhar Chen; Mansvetov Marina; Baniel Jack; Golan Shay; Aharony Shachar","item_type":"journalArticle","volume":"39","issue":"5","pages":"1456-1463","issn":"0733-2467","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDBhY2MzYzBiODlhNGE4Y2FlNDRmZjI1YjI3NzJkZTIyGghyYjZ4MmE0YQ%3D%3D"},"ZCJDVXSL":{"key":"ZCJDVXSL","record_id":"R-ZCJDVXSL","title":"Cumulative effects of in utero administration of mixtures of reproductive toxicants that disrupt common target tissues via diverse mechanisms of toxicity","abstract":"Although risk assessments are typically conducted on a chemical-by-chemical basis, the 1996 Food Quality Protection Act required the US Environmental Protection Agency to consider cumulative risk of chemicals that act via a common mechanism of toxicity. To this end, we are conducting studies with mixtures of chemicals to elucidate mechanisms of joint action at the systemic level with the goal of providing a framework for assessing the cumulative effects of reproductive toxicants. Previous mixture studies conducted with antiandrogenic chemicals are reviewed briefly and two new studies are described. In all binary mixture studies, rats were dosed during pregnancy with chemicals, singly or in pairs, at dosage levels equivalent to approximately one-half of the ED50 for hypospadias or epididymal agenesis. The binary mixtures included androgen receptor (AR) antagonists (vinclozolin plus procymidone), phthalate esters [di(n-butyl) phthalate (DBP) plus benzyl n-butyl phthalate (BBP) and diethyl hexyl phthalate (DEHP) plus DBP], a phthalate ester plus an AR antagonist (DBP plus procymidone), a mixed mechanism androgen signalling disruptor (linuron) plus BBP, and two chemicals which disrupt epididymal differentiation through entirely different toxicity pathways: DBP (AR pathway) plus 2,3,7,8 TCDD (AhR pathway). We also conducted multi-component mixture studies combining several 'antiandrogens'. In the first study, seven chemicals (four pesticides and three phthalates) that elicit antiandrogenic effects at two different sites in the androgen signalling pathway (i.e. AR antagonist or inhibition of androgen synthesis) were combined. In the second study, three additional phthalates were added to make a 10 chemical mixture. In both the binary mixture studies and the multi-component mixture studies, chemicals that targeted male reproductive tract development displayed cumulative effects that exceeded predictions based on a response-addition model and most often were in accordance with predictions based on dose-addition models. In summary, our results indicate that compounds that act by disparate mechanisms of toxicity to disrupt the dynamic interactions among the interconnected signalling pathways in differentiating tissues produce cumulative dose-additive effects, regardless of the mechanism or mode of action of the individual mixture component. © 2010 European Academy of Andrology.","doi":"10.1111/j.1365-2605.2009.01049.x","pmid":"","date":"2010","journal":"","authors":"Rider C.V.; Furr J.R.; Wilson V.S.; Gray Jr. L.E.","item_type":"conferencePaper","volume":"33","issue":"2","pages":"443-462","issn":"","isbn":"13652605 (ISSN)","url":"https://www.scopus.com/pages/publications/77949594465?origin=resultslist"},"ZCLQHEM7":{"key":"ZCLQHEM7","record_id":"R-ZCLQHEM7","title":"Impact of Two Urethral Stent Types on Complications after One-Stage Hypospadias Repair Using the Duckett Procedure","abstract":"Background: The authors evaluated whether the new nickel-titanium alloy stent (NTAS) is superior to the traditional silicone stent used in hypospadias repair surgery in preventing complications such as urinary fistula. Methods: This retrospective cohort study included 576 patients with hypospadias who underwent NTAS or traditional silicone stent placement after hypospadias surgery between March of 2002 and August of 2019. The primary outcome was the rate of urinary fistula occurrence at 4 weeks (stent removal time), and the secondary outcomes were the rate of other complications, such as urethral stricture, urethral diverticulum, infection, and so on. The occurrence of complications in both groups was compared, and the important contributing factors of urinary fistula and urethral stricture were determined. Results: Among 576 patients, 398 were assigned to the NTAS group, and 178 were assigned to the silicone group. Thirty-five patients in the NTAS group and 30 in the silicone group developed urinary fistula, with a rate of 8.8% and 16.9%, respectively (P = 0.005). Subgroup analysis showed that the differences were mainly in preschool patients (6 years or younger) (P = 0.004) and those with the penile type of hypospadias (P = 0.008). In addition, urethral stricture complicated five patients in the NTAS group and two in the silicone group, with a rate of 1.3% and 1.1%, respectively (P = 1.000). Logistic regression showed that hypospadias type (P = 0.001) and stent type (P = 0.001) are the important risk factors for urethral fistula. Conclusion: The NTAS reduced the occurrence of urinary fistula complications after hypospadias repair in preschool patients, and can be presented as a better choice for hypospadias surgery. CLINICAL QUESTION/LEVEL OF EVIDENCE: Therapeutic, III. © 2024 Lippincott Williams and Wilkins. All rights reserved.","doi":"10.1097/PRS.0000000000010783","pmid":"","date":"2024","journal":"Plastic and Reconstructive Surgery","authors":"Zhou S.; Zhang J.; Zhang J.; Xiao X.; Su Z.; Liu M.; Huang Z.; Tian D.; Liang W.; Zhang J.","item_type":"journalArticle","volume":"153","issue":"5","pages":"1123-1131","issn":"00321052 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85191542826?origin=resultslist"},"ZGTM9RI4":{"key":"ZGTM9RI4","record_id":"R-ZGTM9RI4","title":"Invited Commentary: Male Reproductive System Congenital Malformations and the Risk of Autism Spectrum Disorder","abstract":"Autism spectrum disorder (ASD) is a prevalent developmental disorder. Studies indicate that while ASD etiology has a genetic component, the risk is polygenic, with gene-environment interactions being likely. The prenatal period is a critical exposure window for nongenetic risk factors. Previous studies have found positive associations between congenital malformations (all types) and ASD; a few also found specific associations between genitourinary system malformations and ASD; and one study found an association between hypospadias and ASD. In the accompanying article, Rotem et al. (Am J Epidemiol. 2018;187(4):656-663) describe how they conducted a comprehensive analysis focusing on the shared risk of ASD with hypospadias or cryptorchidism, using existing data from a large Israeli health services system, which afforded several advantages because of the large sample size and low attrition of the patient population. The authors conducted a careful analysis, including sensitivity analyses, to account for risk factor and case misclassifications that might have occurred had they relied solely on preexisting diagnostic codes to define exposures and outcome. They observed positive associations between both hypospadias and cryptorchidism and ASD that were independent of numerous sociodemographic and pregnancy health factors. This study advances our understanding of ASD etiology and illustrates how existing data might be used to assess some ASD risk factors. © Published by Oxford University Press on behalf of the Johns Hopkins Bloomberg School of Public Health 2018.","doi":"10.1093/aje/kwx369","pmid":"","date":"2018","journal":"American Journal of Epidemiology","authors":"Schieve L.A.; Shapira S.K.","item_type":"journalArticle","volume":"187","issue":"4","pages":"664-667","issn":"00029262 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85045453073?origin=resultslist"},"ZKA85VVQ":{"key":"ZKA85VVQ","record_id":"R-ZKA85VVQ","title":"儿童尿道下裂术后出现创伤后应激障碍的危险因素分析","abstract":"目的 分析儿童尿道下裂术后出现创伤后应激障碍的危险因素。方法 回顾性分析2022年1月-2024年12月在我院进行尿道下裂术治疗的80例患儿临床资料，术后3个月采用加州大学洛杉矶分校创伤后应激障碍反应指数（儿童修订版）（the University of California at Los Angeles Posttraumatic Stress Disorder Reaction Index for DSM-Ⅳ,UCLA PTSD-RI,Child Version）评估创伤后应激障碍的发生情况，依据结果将其分为创伤后应激障碍组（n=32）、无创伤后应激障碍组（n=48）。比较两组基本资料（年龄、体质量指数、独生子女、单亲家庭、居住地、手术时间、住院时间、术后疼痛、并发症），采用单因素分析及多因素Logistic回归分析考察儿童尿道下裂术后出现创伤后应激障碍的影响因素。结果 创伤后应激障碍组单亲家庭、术后中度及重度疼痛以及术后并发症比率高于无创伤后应激障碍组（P\u003c0.05）；经多因素Logistic回归分析证实，单亲家庭、术后中度及重度疼痛、有术后并发症均为儿童尿道下裂术后创伤后应激障碍的危险因素，P均\u003c0.05。结论 单亲家庭、术后中度及重度疼痛、有术后并发症均为儿童尿道下裂术后创伤后应激障碍的危险因素，临床治疗时可结合以上因素制定防治措施，降低尿道下裂术后创伤后应激障碍发生风险。","doi":"10.13479/j.cnki.jip.2026.03
