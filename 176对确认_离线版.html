iated with syndromic frameworks or clinics highlighted in the patient, however it is not possible to predict the phenotype of the child and a monitoring follow-up over time is required.","doi":"10.1159/000492307","pmid":"","date":"2018","journal":"Hormone Research in Paediatrics","authors":"Barreca M.; Scavone M.; Giancotti L.; Colao E.; Miniero R.","item_type":"journalArticle","volume":"90","issue":"(Barreca M.) ASP Cosenza, Cetraro, Italy","pages":"466","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630604473&from=export"},"NF4EEYAV":{"key":"NF4EEYAV","record_id":"R-NF4EEYAV","title":"Analysis of the gene coding for steroidogenic factor 1 (SF-1, NR5A1) in a cohort of fifty Egyptian patients with 46,XY DSD","abstract":"Background: SF-1 is a key transcriptional regulator of genes involved in the hypothalamic-pituitary-gonadal axis. Recently, SF-1 mutations were found to be a frequent cause of 46,XY disorders of sex development (DSD) in humans. Objective and hypotheses: To investigate the frequency of SF-1 mutations in an Egyptian XY DSD cohort. Methods: Molecular genetic analysis of NR5A1, the gene coding for SF-1, in fifty Egyptian XY DSD patients (without adrenal insufficiency) with a phenotypic spectrum including: complete female external genitalia with/without uterus (n=8), ambiguous genitalia without uterus (n=5), vanishing/atrophic testes (n=10), penile to scrotal hypospadias (n=23) and isolated hypoplastic phallus (n=4). Results: NR5A1 analysis revealed 3 novel heterozygous mutations of the coding region. The p.Arg62Cys mutation lies in the DNA-binding zinc finger region and is predicted to result in conformational change of the protein. The p.Glu121AlafsX25 mutation results in a severely truncated protein. The p.Ala154Thr mutation lies in the hinge region. Furthermore, three novel heterozygous intronic mutations (IVS4-13 C>T, c.1137+105b C>T, c.1137+129b C>A), which are not present in the SNP databases, were detected in patients with severe hypospadias. Sixteen patients (32%) harboured the p.Gly146Ala polymorphism. (Table Presented) Conclusions: This is the first study of NR5A1 analysis in an oriental cohort of XY DSD patients. We identified exonic NR5A1 mutations in 3 out of 23 Egyptian XY DSD patients with hypospadias, which corresponds to the fre quency of 7.5-15% in European patients (Köhler et al, 2009, Allali 2011). Thus, NR5A1 mutations are a frequent cause of XY DSD with hypospadias also in Egyptians. NR5A1 analysis should be considered in XY DSD with hypospadias. Early cryoconservation of sperms should be initiated as there is a risk of early gonadal failure.","doi":"10.1159/000343182","pmid":"","date":"2012","journal":"Hormone Research in Paediatrics","authors":"Tantawy S.; Mazen I.; Soliman H.; Anwar G.; Atef A.; El-Gammal M.; El-Kotoury A.; Torky A.; Rudolf A.; Krude H.; Biebermann H.; Koehler B.","item_type":"journalArticle","volume":"78","issue":"(Tantawy S.; Rudolf A.; Krude H.; Biebermann H.; Koehler B.) Institute for Experimental Pediatric Endocrinology, Department of Pediatric Endocrinology, University Children's Hospital, Charite', Humboldt University, Berlin, Germany, Berlin, Germany","pages":"122-123","issn":"1663-2818","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L70896397&from=export"},"NKV5XBTB":{"key":"NKV5XBTB","record_id":"R-NKV5XBTB","title":"Congenital Abnormalities of the Male Reproductive System and Risk of Autism Spectrum Disorders.","abstract":"Androgens have an extensive influence on brain development in regions of the brain that are relevant for autism spectrum disorder (ASD), yet their etiological  involvement remains unclear. Hypospadias (abnormal positioning of the urethral  opening) and cryptorchidism (undescended testes) are 2 relatively common male  birth defects that are strongly associated with prenatal androgen deficiencies.  Having either disorder is a proxy indicator of atypical gestational androgen  exposure, yet the association between these disorders and autism has not been  extensively studied. We analyzed male singleton live births (n = 224,598)  occurring from January 1, 1999, through December 31, 2013, in a large Israeli  health-care organization. Boys with autism, cryptorchidism, and hypospadias were  identified via International Classification of Diseases, Ninth Revision, codes,  with further verification of autism case status by review of medical records. In  multivariable-adjusted analyses, the odds ratio for ASD among boys with either  condition was 1.62 (95% confidence interval (CI): 1.44, 1.82). The odds ratio for  boys with cryptorchidism only was 1.55 (95% CI: 1.34, 1.78), and that for boys  with hypospadias only was 1.65 (95% CI: 1.38, 1.98). ASD risk was not elevated  among unaffected brothers of hypospadias or cryptorchidism cases, despite  familial aggregation of all 3 conditions, providing some indication for the  possibility of pregnancy-specific risk factors driving the observed associations.  Results suggest that in-utero hypoandrogenicity could play a role in ASD  etiology.","doi":"10.1093/aje/kwx367","pmid":"","date":"2018","journal":"American Journal of Epidemiology","authors":"Rotem Ran S.; Chodick Gabriel; Davidovitch Michael; Hauser Russ; Coull Brent A.; Weisskopf Marc G.","item_type":"journalArticle","volume":"187","issue":"4","pages":"656-663","issn":"0002-9262","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDVkMjRjMzk0NTM0ZWEwNTYxZDUxNTJhZGUwNTU2NGRiGghyYjZ4MmE0YQ%3D%3D"},"NMMXY93N":{"key":"NMMXY93N","record_id":"R-NMMXY93N","title":"Maternal hypertension and risk for hypospadias in offspring.","abstract":"Hypospadias is one of the most common birth defects in male infants. Maternal hypertension is a suspected risk factor; however, few previous studies have addressed the possibility of reporting bias, and several previous studies have not accounted for hypospadias severity. We analyzed data from the Texas Birth Defects Registry for 10,924 nonsyndromic cases and statewide vital records for deliveries during 1999–2009, using Poisson regression. After adjustment for potential confounders, hypospadias was associated with maternal hypertension (adjusted prevalence ratio: 1.5, 95% confidence interval: 1.4–1.7). Similar associations were observed with gestational and pregestational hypertension, including separate analyses restricted to the subset of cases with severe (second- or third-degree) hypospadias. All of these associations were also similar among the subset of cases with isolated hypospadias (without additional birth defects). To evaluate the potential for bias due to potential hypertension misclassification, we repeated our analyses using logistic regression, comparing the cases to controls with other birth defects. In these analyses, the associations with gestational hypertension were similar, but adjusted associations with pregestational hypertension were no longer observed. Our findings support an association between gestational hypertension and hypospadias in offspring, but also suggest that previously observed associations with pregestational hypertension may have been inflated due to differential misclassification of hypertension (e.g., reporting bias). As gestational hypertension is recognized after hypospadias development, more research is needed to determine if this association reflects an increase in gestational hypertension risk secondary to hypospadias or if both conditions have shared risk factors (e.g., precursors of gestational hypertension). © 2016 Wiley Periodicals, Inc. © 2016 Wiley Periodicals, Inc.","doi":"10.1002/ajmg.a.37947","pmid":"","date":"2016","journal":"American Journal of Medical Genetics, Part A","authors":"Agopian A. J.; Hoang Thanh T.; Mitchell Laura E.; Morrison Alanna C.; Tu Duong; Nassar Natasha; Canfield Mark A.","item_type":"journalArticle","volume":"170","issue":"12","pages":"3125-3132","issn":"15524825 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84983598235?origin=resultslist"},"P4Y2J7WU":{"key":"P4Y2J7WU","record_id":"R-P4Y2J7WU","title":"Single Nucleotide Polymorphisms of HAAO and IRX6 Genes as Risk Factors for Hypospadias EDITORIAL COMMENT","abstract":"","doi":"10.1097/01.JU.0000553005.19337.6d","pmid":"","date":"2019","journal":"The Journal of Urology","authors":"Weiss Dana A.; Pyle Louise C.","item_type":"journalArticle","volume":"201","issue":"2","pages":"391","issn":"0022-5347","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGE2NWU1YWI2NWZiNDMxY2NlNGZhZjcwMzc1NzhjYzMwGghyYjZ4MmE0YQ%3D%3D"},"PAFNUXMY":{"key":"PAFNUXMY","record_id":"R-PAFNUXMY","title":"Combined exposure to anti-androgens causes markedly increased frequencies of hypospadias in the rat.","abstract":"The incidence of hypospadias is increasing in young boys, but it remains unclear whether human exposure to endocrine disrupting chemicals plays a role. Risk assessment is based on estimation of no-observed-adverse-effect levels for single compounds, although humans are exposed to combinations of several anti-androgenic chemicals. In a mixture (MIX) study with three androgen receptor antagonists, vinclozolin, flutamide and procymidone, rats were gavaged during gestation and lactation with several doses of a MIX of the three chemicals or the chemicals alone. External malformations of the male reproductive organs were assessed on PND 47 using a score from 0 to 3 (normal to marked) for hypospadias. Markedly increased frequencies were observed after exposure to a MIX of the three chemicals compared to administration of the three chemicals alone. Anogenital distance at PND 1, nipple retention at PND 13, and dysgenesis score at PND 16 were highly correlated with the occurrence of hypospadias, and MIX effects were seen at doses where each of the individual chemicals caused no observable effects. Therefore, the results indicate that doses of anti-androgens, which appear to induce no hypospadias when judged on their own, may induce a very high frequency of hypospadias when they interact in concert with other anti-androgens. © 2008 The Authors.","doi":"10.1111/j.1365-2605.2008.00866.x","pmid":"","date":"2008","journal":"International Journal of Andrology","authors":"Christiansen S.; Scholze M.; Axelstad M.; Boberg J.; Kortenkamp A.; Hass U.","item_type":"journalArticle","volume":"31","issue":"2","pages":"241-248","issn":"1365-2605","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L351341393&from=export"},"PDEJSD6Z":{"key":"PDEJSD6Z","record_id":"R-PDEJSD6Z","title":"The incidence of intersexuality in children with cryptorchidism and hypospadias: Stratification based on gonadal palpability and meatal position","abstract":"Purpose: The combined findings of cryptorchidism and hypospadias often indicate the existence of an intersex state. Testicular maldescent and incomplete tubularization of the urethral plate occur in a spectrum with the severity of the 2 processes likely dependent on the degree of pathophysiology in the androgenic hormonal axis. The incidence of intersexuality in children with undescended testes, hypospadias and otherwise nonambiguous male genitalia has been reported to be 27%. Although the likelihood of genotypic or gonadal ambiguity has previously been associated with meatal position in this population, to our knowledge our study is the first to evaluate the incidence of intersexuality relative to whether the undescended testis is palpable or nonpalpable. Materials and Methods: The database at our hospital was searched for all cases of undescended testes (2,105) and hypospadias (1,057) between 1982 and 1996. Radiographic, histological and karyotypic data were compiled for all patients presenting with both diagnoses. Gonadal palpability (palpable versus nonpalpable) and meatal position (anterior versus mid versus posterior) were recorded and correlated with the likelihood of identifying an intersex condition. Ten boys with a diagnosis of undescended testes subsequent to inguinal hernial repair were excluded from study. Patients with congenital adrenal hyperplasia or complete testicular feminization were also excluded from study due to the clearly female appearance of the external genitalia. Statistical significance was assessed using Fisher's exact test. Results: We identified 79 patients presenting with undescended testes, hypospadias and a phallus that was believed to be a possible penis. Intersex conditions were identified with nearly equal frequency in the 44 cases of unilateral (30%) and 35 of bilateral (32%) cryptorchidism. In the unilateral undescended testes group patients with a nonpalpable testis were at least 3-fold more likely to have an intersex condition than those with a palpable undescended testis (50 versus 15%, p = 0.02). In the bilateral group patients with i or more nonpalpable testes were also nearly 3-fold as likely to have an intersex condition than those with bilateral palpable undescended gonads (47 versus 16%, p = 0.07). Meatal position was graded as anterior in 33% of cases, mid in 25% and posterior in 41% with the more posterior location conferring a significantly greater likelihood of an intersex condition (anterior 2 of 26, mid 1 of 20 and posterior 21 of 33). Conclusions: Gonadal palpability is an important predictor of an intersex state in unilateral and bilateral cases of cryptorchidism with hypospadias. Patients with an undescended testis that cannot be palpated are significantly more likely to have an intersex condition than those in whom the undescended testis may be palpated on physical examination. The severity of hypospadias likewise has a strong positive correlation with an intersex state.","doi":"10.1016/S0022-5347(01)68048-0","pmid":"","date":"1999","journal":"","authors":"Kaefer M.; Diamond D.; Hendren W.H.; Vemulapalli S.; Bauer S.B.; Peters C.A.; Atala A.; Retik A.B.","item_type":"conferencePaper","volume":"162","issue":"3 II","pages":"1003-1006","issn":"","isbn":"00225347 (ISSN)","url":"https://www.scopus.com/pages/publications/0032828071?origin=resultslist"},"PEZLEEXY":{"key":"PEZLEEXY","record_id":"R-PEZLEEXY","title":"Evaluation of three patients with 46,XY gonadal dysgenesis due to desert hedgehog gene mutations","abstract":"Background: Desert Hedgehog (DHH) gene acts on early testicu lar development, testis cord formation and differentiation of fetal Leydig cells. It also has a role in nerve sheath formation. DHH gene mu tations is a very rare cause of 46,XY gonadal dysgenesis (GD). Gonadal tumors and peripheral neuropathy have been associated with DHH mutations. Aim: To present three patients with 46,XY GD due to novel homozygous DHH mutations. Patients and methods: Targeted next-generation sequencing of three patients by in-house designed DSD gene-panel. Results: First patient (one of the siblings) presented at age 1 year with penoscrotal hypospadias [external masculinization score (EMS) 5], bilateral inguinal testes, Müllerian structure evident on biopsy, no response to HCG, raised as female initially and conPoster verted to male at 5 years of age. Second patient (the other siblings) presented at age 14 days with severe micropenis, bilateral inguinal testes (EMS 2), no Müllerian structure. Testosterone response was normal to HCG and the patient was raised as female. Gonadectomy revealed gonadal dysgenesis with loss of Leydig cells with intratubuler germ cell neoplasia. Third patient presented at age 19 days with penoscrotal hypospadias, bilateral inguinal testes (EMS 6), penile size 2 cm, and basal testosterone at 4 months of age was 1.48 ng/ml, no Müllerian structure, low AMH and raised as male. Consanguinity was present in all. In two siblings, a novel homozygous c.114G>A mutation in exon 3 of the DHH gene was predicted to cause nonsense type alteration (p.Trp382∗). In other patient two missense variants in homozygous form were shown (c.71G>C in exon 1 and c.1063C>T in exon 3). None of patients had any clinical signs of neuropathy but detailed neurophysiologic evaluation has not been performed. Conclusion: DHH gene mutation should be analyzed in patients with 46,XY gonadal dysgenesis for diagnosis and the presence of potential neuropathy and gonadal tumors. In vivo studies are needed to further delineate the phenotype genotype relation.","doi":"10.1159/000492307","pmid":"","date":"2018","journal":"Hormone Research in Paediatrics","authors":"Poyrazoglu S.; Aghayev A.; Toksoy G.; Karaman B.; Avci S.; Al A.D.K.; Ozturan E.K.; Altunoglu U.; Bas F.; Basaran S.; Uyguner O.; Darendeliler F.","item_type":"journalArticle","volume":"90","issue":"(Poyrazoglu S.; Al A.D.K.; Ozturan E.K.; Bas F.; Darendeliler F.) Istanbul Faculty of Medicine, Pediatric Endocrinology Unit, Istanbul, Turkey","pages":"558-559","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630604523&from=export"},"PJKXSLSW":{"key":"PJKXSLSW","record_id":"R-PJKXSLSW","title":"Analysis of risk factors for urethral stricture after hypospadias by tubularized incised plat urethroplasty","abstract":"Objective To explore the risk factors of urethral stricture after tubularized incised plat (TIP) urethroplasty for boosting the therapeutic efficacy of hypospadias. Methods From January 2019 to January 2022, the relevant clinical data were retrospectively reviewed for 190 children with hypospadias with a median age of 31 months. And postoperative complications and follow-up results were collected. Finally 122 children were recruited after excluding the related cases. Urethra opened preoperatively at coronal sulcus (n=63), penile shaft (n=38) and penile scrotal junction (n=21). Binary Logistic regression was employed for examining the potential risk factors of urethral stricture after TIP. Results There were penile curvature ≤35° (n=85), urethral plate flatness (n=81), correction of posterior urethral defect length \u003c2 cm (n=70), glans diameter \u003c1.4 cm (n=83) and navicular fossa width \u003c4.25 mm (n=40). The length of indwelling catheter for 14 days (n=21) and 21 days (n=101). During a follow-up period of (7-43) months, follow-up success rate was 82.6%(157/190). Complications occurred in 59 cases (59/157, 37.6%), including urethral fistula (32/157, 20.4%), urethral stricture (28/157, 17.8%) and glans dehiscence (4/157, 2.5%). Univariate analysis of the related variables of urethral stricture after TIP indicated that postoperative urethral stricture occurred in 8 children with posterior urethral defect length \u003c2 cm after correcting hypospadias, while there were 16 children with ≥2 cm, the difference was statistically significant (P=0.008). There were urethral stricture of flat urethral plate (n=11) and unsmooth urethral plate (n=13)(P=0.017). In addition, penile curvature (P=0.019) and navicular fossa width (P=0.013) were also risk factors for urethral stricture after TIP.Operative age, diameter of glans, position of urethral opening and postoperative duration of indwelling catheter were not related to postoperative urethral stricture (P>0.05). Multivariate Logistic regression analysis revealed that length of posterior urethral defect (OR=0.333, 95%CI: 0.121~0.914) was an independent risk factor for urethral stricture after TIP (P=0.033). Conclusions Length of posterior urethral defect after TIP is an important factor affecting the occurrence of urethral stricture.And TIP should be carefully selected children with larger urethral defect. © 2023 Chinese Medical Journals Publishing House Co.Ltd. All rights reserved.","doi":"10.3760/cma.j.cn421158-20220913-00570","pmid":"","date":"2023","journal":"Chinese Journal of Pediatric Surgery","authors":"Sun Q.; Zhang Y.; Zhang Y.; Jiang J.; Fang X.; Li D.; Chao M.","item_type":"journalArticle","volume":"44","issue":"6","pages":"545-550","issn":"02533006 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85168701459?origin=resultslist"},"PPKDJYFT":{"key":"PPKDJYFT","record_id":"R-PPKDJYFT","title":"Prenatal ultrasound of fetal hypospadias: Genetic test results after confirmation and analysis of misdiagnoses","abstract":"Objective To explore the genetic test results after confirmation and analyze misdiagnoses of prenatal ultrasound of fetal hypospadias. Methods Totally 206 fetuses with prenatal ultrasound suspected hypospadias were retrospectively enrolled, and the outcomes were followed up. For confirmed cases of hypospadias, prenatal ultrasound showed or did not show other abnormalities, with or without chromosomal and genetic abnormalities were collected, while maternal ageS^35 years and the presence of other abnormalities detected by prenatal ultrasound related to the risk of chromosomal or genetic abnormalities were conducted. Results Hypospadias was confirmed Postpartum in 159 cases, yielding a positive predictive value of 77. 18% (159/ 206) for prenatal ultrasound. The common prenatal ultrasound manifestations of hypospadias included blunt tip, small penis, ventral curvature and tulip sign. Associated anomalies frequently observed on prenatal ultrasound included cryptorchidism, ventricular septal defect and fetal growth restriction. Maternal ageS&35 years and presence of additional abnormalities on prenatal ultrasound were both independent predictors of chromosomal or genetic abnormalities in fetuses with hypospadias (both P\u003c0. 05). Isolated small penis with ventral curvature, congenital adrenal hyperplasia or isolated labia minora hypertrophy in female fetus might lead to misdiagnosis of prenatal ultrasound for fetal hypospadias. Conclusion Prenatal ultrasound had relatively high positive predictive value for diagnosing fetal hypospadias. Maternal ageS&35 years and presence of other abnormalities on prenatal ultrasound suggested increased risk of chromosomal or genetic abnormalities. © 2025 Editorial Office - Chinese Journal of Interventional Imaging and Therapy. All rights reserved.","doi":"10.13929/j.issn.1003-3289.2025.04.025","pmid":"","date":"2025","journal":"Chinese Journal of Medical Imaging Technology","authors":"Li L.; Xin C.; Jiao B.","item_type":"journalArticle","volume":"41","issue":"4","pages":"627-631","issn":"10033289 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/105004949119?origin=resultslist"},"PRYIHPDS":{"key":"PRYIHPDS","record_id":"R-PRYIHPDS","title":"Response to Letter to the Editor RE: Introducing the HOPE (Hypospadias Objective Penile Evaluation)-score: A validation study of an objective scoring system for evaluating cosmetic appearance in hypospadias patients.","abstract":"","doi":"10.1016/j.jpurol.2013.07.023","pmid":"","date":"2013 DEC","journal":"JOURNAL OF PEDIATRIC UROLOGY","authors":"Toorn FD","item_type":"journalArticle","volume":"9","issue":"6","pages":"1017-1017","issn":"1477-5131 1873-4898","isbn":"","url":""},"PTWA2VYI":{"key":"PTWA2VYI","record_id":"R-PTWA2VYI","title":"Evaluation of External Genital Anomalies and the Underlying Factors in Male Newborns","abstract":"Background: External genital anomalies are the most common congenital disorders in male infants with unknown etiology in the majority of cases. According to recent reports, incidence rate of these anomalies is rising in different countries. This study aimed to evaluate the prevalence of external genital anomalies and possible underlying factors in male newborns. Methods: This cross-sectional study was conducted on all the male neonates born in Motahari Hospital of Urmia during October 2009-June 2010. Neonatal screening results and demographic data were recorded separately in a questionnaire for each neonate. Data analysis was performed in SPSS V.20 using descriptive statistics (mean, frequency, percentage, and standard deviation) and Chi-square test to evaluate the correlations between quantitative variables. Results: In this study, external genital anomalies were identified in 83 male neonates (8.3%). Moreover, 59 infants (5.9%) had cryptorchidism, 18 (1.8%) had hypospadias and 12 infants (1.2%) had microphallus. Moreover, a significant correlation was observed between the incidence of cryptorchidism and maternal comorbidities, low birth weight, prematurity, maternal gestational hypertension, and diabetes mellitus. Conclusion: According to the results of this study, cryptorchidism is the most prevalent external genital anomaly in male newborns, followed by hypospadias. Occurrence of these anomalies is associated with several risk factors, such as prematurity, low birth weight, maternal diseases (e.g., diabetes and hypertension), and use of medications during pregnancy. In addition, cryptorchidism had a significant correlation with smoking habits, and further studies with larger sample sizes are required in this regard.","doi":"","pmid":"","date":"2016","journal":"Iranian Journal of Neonatology","authors":"","item_type":"journalArticle","volume":"","issue":"","pages":"","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEERvYWowMDAwMDQ1MjAwNzcaCHJiNngyYTRh"},"PUTRIE6Y":{"key":"PUTRIE6Y","record_id":"R-PUTRIE6Y","title":"Low dose mixture effects of endocrine disrupters: implications for risk assessment and epidemiology","abstract":"During the last years, a series of studies on combinations of oestrogenic, thyroid-disrupting and anti-androgenic chemicals at low doses have been published. The available experimental evidence shows that combination effects may result from endocrine disrupters that each produces very small effects, if they are present in sufficiently large numbers. This review examines the implications of these findings for chemicals risk assessment and epidemiology. It is concluded that a lack of knowledge about relevant exposure scenarios presents serious obstacles for better human risk assessment. Epidemiology needs to abandon its focus on single endocrine disrupters and has to embrace the reality of endocrine disrupter mixture effects by developing biomarkers that capture cumulative exposure to endocrine disrupters.","doi":"10.1111/j.1365-2605.2007.00862.x","pmid":"","date":"2008 APR","journal":"INTERNATIONAL JOURNAL OF ANDROLOGY","authors":"Kortenkamp A","item_type":"journalArticle","volume":"31","issue":"2","pages":"233-237","issn":"0105-6263 1365-2605","isbn":"","url":""},"Q44R7WAI":{"key":"Q44R7WAI","record_id":"R-Q44R7WAI","title":"Intrauterine growth restriction and hypospadias: is there a connection?","abstract":"Hypospadias is one of the most common congenital malformations of the genitourinary tract in males. It is an incomplete fusion of urethral folds early  in fetal development and may be associated with other malformations of the  genital tract. The etiology is poorly understood and may be hormonal, genetic, or  environmental, but most often is idiopathic or multifactorial. Among many  possible risk factors identified, of particular importance is low birth weight,  which is defined in various ways in the literature. No mechanism has been  identified for the association of low birth weight and hypospadias, but some  authors propose placental insufficiency as a common inciting factor. Currently,  there is no standardized approach for evaluating children with hypospadias in the  setting of intrauterine growth restriction. We reviewed the available published  literature on the association of hypospadias and growth restriction to determine  whether it should be considered a separate entity within the category of  disorders of sexual differentiation.","doi":"10.1186/1687-9856-2014-20","pmid":"25337123","date":"2014","journal":"International journal of pediatric endocrinology","authors":"Chen Min-Jye; Macias Charles G.; Gunn Sheila K.; Dietrich Jennifer E.; Roth David R.; Schlomer Bruce J.; Karaviti Lefkothea P.","item_type":"journalArticle","volume":"2014","issue":"1","pages":"20","issn":"1687-9848 1687-9856","isbn":"","url":""},"QB78CC28":{"key":"QB78CC28","record_id":"R-QB78CC28","title":"Combined exposure to anti-androgens causes markedly increased frequencies of hypospadias in the rat","abstract":"The incidence of hypospadias is increasing in young boys, but it remains unclear whether human exposure to endocrine disrupting chemicals plays a role. Risk assessment is based on estimation of no-observed-adverse-effect levels for single compounds, although humans are exposed to combinations of several anti-androgenic chemicals. In a mixture (MIX) study with three androgen receptor antagonists, vinclozolin, flutamide and procymidone, rats were gavaged during gestation and lactation with several doses of a MIX of the three chemicals or the chemicals alone. External malformations of the male reproductive organs were assessed on PND 47 using a score from 0 to 3 (normal to marked) for hypospadias. Markedly increased frequencies were observed after exposure to a MIX of the three chemicals compared to administration of the three chemicals alone. Anogenital distance at PND 1, nipple retention at PND 13, and dysgenesis score at PND 16 were highly correlated with the occurrence of hypospadias, and MIX effects were seen at doses where each of the individual chemicals caused no observable effects. Therefore, the results indicate that doses of anti-androgens, which appear to induce no hypospadias when judged on their own, may induce a very high frequency of hypospadias when they interact in concert with other anti-androgens. © 2008 The Authors.","doi":"10.1111/j.1365-2605.2008.00866.x","pmid":"","date":"2008","journal":"","authors":"Christiansen S.; Scholze M.; Axelstad M.; Boberg J.; Kortenkamp A.; Hass U.","item_type":"conferencePaper","volume":"31","issue":"2","pages":"241-248","issn":"","isbn":"01056263 (ISSN)","url":"https://www.scopus.com/pages/publications/40349113152?origin=resultslist"},"QC6VIYE2":{"key":"QC6VIYE2","record_id":"R-QC6VIYE2","title":"产前超声诊断胎儿尿道下裂:遗传学检测结果及误诊原因分析","abstract":"目的 观察产前超声诊断尿道下裂胎儿确诊后遗传学检测结果及误诊原因.方法 回顾性分析206胎产前超声疑诊尿道下裂胎儿,记录其结局;对确诊病例评估产前超声是否显示其他异常,收集遗传学检测结果,分析孕妇年龄是否≥35岁及产前超声是否显示合并其他异常与染色体或基因异常风险的相关性.结果 206胎中,生后确诊159例尿道下裂,产前超声阳性预测值为77.18％ (159/206);其常见表现包括阴茎远端圆钝、阴茎短小、阴茎向腹侧弯曲及\"郁金香征\",隐睾、室间隔缺损及胎儿生长受限等为常见合并异常.孕妇年龄≥35岁及产前超声合并其他异常均为尿道下裂胎儿存在染色体或基因异常的独立预测因素(P均＜0.05).单纯阴茎短小下弯、肾上腺皮质增生症及女性胎儿单纯小阴唇肥大等可致产前超声误诊.结论 超声产前诊断胎儿尿道下裂阳性预测值较高;孕妇年龄≥35岁及产前超声合并其他异常提示胎儿染色体或基因异常风险相对较高.","doi":"10.13929/j.issn.1003-3289.2025.04.025","pmid":"","date":"2025","journal":"中国医学影像技术","authors":"李琳; 辛丞; 焦北鱼","item_type":"journalArticle","volume":"41","issue":"4","pages":"627-631","issn":"1003-3289","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRemd5eHl4anMyMDI1MDQwMjUaCHJiNngyYTRh"},"QCHUGJ4Q":{"key":"QCHUGJ4Q","record_id":"R-QCHUGJ4Q","title":"Editorial Comment","abstract":"","doi":"10.1016/j.urology.2009.02.020","pmid":"","date":"2009","journal":"Urology","authors":"Carr M.C.","item_type":"journalArticle","volume":"73","issue":"6","pages":"1245","issn":"00904295 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/65849217071?origin=resultslist"},"QD2IBFTK":{"key":"QD2IBFTK","record_id":"R-QD2IBFTK","title":"Artificial intelligence chatbots vs. YPUC pediatric urologists: performance on a Campbell Walsh urology hypospadiology questionnaire.","abstract":"Purpose: Artificial intelligence (AI) is increasingly used in medicine, with uncertain performance in highly specialized fields, like hypospadiology. This study aimed to compare the performance of AI platforms and pediatric urologists using a structured knowledge assessment. Methods: A 31-question multiple-choice questionnaire (12th edition of Campbell Walsh Urology) was completed by 23 members of the Young Pediatric Urologist Committee (YPUC) of the European Society for Paediatric Urology (ESPU), and by five AI models (ChatGPT 3.5, ChatGPT 4o, Gemini, Copilot, and Doubao). Scores were analyzed overall, by subgroups (FEAPU-certified (Fellow of the European Academy of Paediatric Urology, n=15), >35 years old (n=16), and self-declared hypospadiology experts (n=12)), and across four thematic categories : basics, clinical and paraclinical evaluation, initial management, and complications. Results: AI and human respondents showed comparable overall performance (67.7% vs. 61.2%, p=0.467). However, experienced subgroups outperformed their counterparts: FEAPU-certified vs. non-certified (61.3% vs. 53.2%, p=0.001), >35 vs. ≤35 years (61.3% vs. 54.8%, p=0.039), and self declared experts vs. non-experts (61.3% vs. 54.8%, p=0.039). AI performed better in Basics (83% vs. 67%, p=0.320), Initial management (71% vs. 57%, p=0.450), and Complications (64% vs. 55%, p=0.087), but underperformed significantly in Clinical and paraclinical evaluation (57% vs. 71%, p=0.003). The highly specialized nature of the topic limits generalizability to broader medical contexts. Conclusion: AI platforms achieved scores comparable to pediatric urologists in a structured questionnaire but fell short in domains requiring nuanced clinical reasoning. While AI shows potential as an educational-support tool, it does not replace expert human judgment in hypospadiology. © The Author(s), under exclusive licence to Springer-Verlag GmbH Germany, part of Springer Nature 2025.","doi":"10.1007/s00345-025-06104-3","pmid":"","date":"2025","journal":"World journal of urology","authors":"Sébastien Faraj; Pauline Clermidi; Sabine Irtan; François-Xavier Madec","item_type":"journalArticle","volume":"43","issue":"1","pages":"719","issn":"1433-8726","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L649273305&from=export"},"QN8I4RP7":{"key":"QN8I4RP7","record_id":"R-QN8I4RP7","title":"Adulthood cosmetic and sexual outcomes of the patients who underwent hypospadias repair in childhood.","abstract":"This study aimed to assess the cosmetic and sexual outcomes of childhood hypospadias repair after puberty. Among 672 patients who underwent hypospadias  repair between 2001 and 2017, 243 sexually active patients were included in the  study. At their last visit, cosmetic and sexual evaluation were done through the  Penile Perception Score, the Hypospadias Objective Scoring Evaluation, IIEF,  MSHQ-EjD. The levels of erectile dysfunction(ED) severity were determined  according to erectile function domain of IIEF. The median follow-up after the  last surgery was 16 [IQR (13-18)] years, and median patient age at the time of  study was 19.67 [IQR(18-22)] years. Patients were divided into two subgroups as  follows: Group I; Repairs using grafts (n = 120, 49.4%) and Group II; Graft-free  repairs (n = 123, 50.6%). The rate of dissatisfaction with penile appearance was  higher in Group I (16.7% vs. 4.9%, p = 0.003). Mild ED was more frequent in Group  I (14.2% vs. 3.3%, p = 0.007); while none of the patients had either moderate or  severe ED. Other domains of sexual function were observed to be similar in both  groups. The need for unwanted interventions due to complications, and surgeries  requiring grafts were found to be risk factors for ED development and  dissatisfaction with penile appearance in adulthood. Those who underwent  graft-free hypospadias repair experience better cosmetic and sexual outcomes when  compared to grafted repairs, yet, satisfactory results were achieved in almost  90% of the grafted repairs.","doi":"10.1038/s41443-024-00971-x","pmid":"","date":"2025","journal":"International Journal of Impotence Research","authors":"Ismail Selvi; M. İrfan Dönmez; Ahmet Barış Aydın; Tayfun Oktar; Orhan Ziylan","item_type":"journalArticle","volume":"37","issue":"7","pages":"527-535","issn":"0955-9930","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDM0MjE4OTg3GghyYjZ4MmE0YQ%3D%3D"},"QQ4TXITA":{"key":"QQ4TXITA","record_id":"R-QQ4TXITA","title":"What are the factors affecting glanular dehiscence after hypospadias surgery?","abstract":"BACKGROUND: Glanular dehiscence (GD) is one of the main complications after hypospadias surgery. There is a limited number of publications regarding GD in  the literature. OBJECTIVE: The aim of this work is to reveal the factors that  affect GD after a literature review. EVIDENCE ACQUISITION: A literature search  for relevant articles was performed in database using the search term glans  dehiscence without setting date range limit or any other limits. All articles  related to GD after hypospadias surgery were included in this study. After  collecting the information from full text articles, 71 articles were included in  this systematic review. In these studies, localization of hypospadic meatus, type  of surgery, and other clinical data which were thought to behave as risk factors  for GD were obtained. Chi-Square test was used to evaluate the differences  between the parameters, where p \u003c 0.05 was taken as statistically significant.  RESULTS: After evaluating the 71 articles that met the inclusion criteria, 309  cases (3.48%) of GD after 8858 hypospadias repairs were obtained in this review.  GD rates were found significantly high for proximal hypospadias (5%), two-stage  hypospadia repairs (5%) and re-do hypospadias repair (8.75%) (p = 0.002, 0.022,  and 0.004, respectively). Glans width \u003c14 mm, urethral plate (UP) width \u003c7 mm,  hypospadias surgeries performed before 6 months of age and after puberty, and  caudal block anesthesia increased the rate of GD. CONCLUSIONS: The rate of GD  increases after proximal, cripple and staged hypospadias surgeries, a glans width  \u003c15 mm and UP width \u003c8 mm, postpubertal surgeries, and caudal anesthesia use  during surgery.","doi":"10.1016/j.acuroe.2020.11.013","pmid":"34838491","date":"2022 Jan-Feb","journal":"Actas urologicas espanolas","authors":"Karabulut R.; Turkyilmaz Z.; Atan A.; Kaya C.; Sonmez K.","item_type":"journalArticle","volume":"46","issue":"1","pages":"4-15","issn":"2173-5786","isbn":"","url":""},"QSUTCLXA":{"key":"QSUTCLXA","record_id":"R-QSUTCLXA","title":"Editorial comment","abstract":"","doi":"10.1016/j.juro.2013.10.106","pmid":"","date":"2014","journal":"Journal of Urology","authors":"Canning D.A.","item_type":"journalArticle","volume":"191","issue":"2","pages":"465","issn":"15273792 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84891955738?origin=resultslist"},"QU83VCKS":{"key":"QU83VCKS","record_id":"R-QU83VCKS","title":"Administration of potentially antiandrogenic pesticides (procymidone, linuron, iprodione, chlozolinate, p,p′-DDE, and ketoconazole) and toxic substances (dibutyl- and diethylhexyl phthalate, PCB 169, and ethane dimethane sulphonate) during sexual differentiation produces diverse profiles of reproductive malformations in the male rat","abstract":"Antiandrogenic chemicals alter sexual differentiation by a variety of mechanisms, and as a consequence, they induce different profiles of effects. For example, in utero treatment with the androgen receptor (AR) antagonist, flutamide, produces ventral prostate agenesis and testicular nondescent, while in contrast, finasteride, an inhibitor of 5 alpha-dihydrotestosterone (DHT) synthesis, rarely, if ever, induces such malformations. In this regard, it was recently proposed that dibutyl phthalate (DBP) alters reproductive development by a different mechanism of action than flutamide or vinclozolin (V), which are AR antagonists, because the male offsprings display an unusually high incidence of testicular and epididymal alterations-effects rarely seen after in utero flutamide or V treatment. In this study, we present original data describing the reproductive effects of 10 known or suspected anti-androgens, including a Leydig cell toxicant ethane dimethane sulphonate (EDS, 50 mg kg(-1) day(-1)), linuron (L, 100 mg kg(-1) day(-1)), p,p'-DDE (100 mg kg(-1) day(-1)), ketoconazole (12-50 mg kg(-1) day(-1)), procymidone (P, 100 mg kg(-1) day(-1)), chlozolinate (100 mg kg(-1) day(-1)), iprodione (100 mg kg(-1) day(-1)), DBP (500 mg kg(-1) day(-1)), diethylhexyl phthalate (DEHP, 750 mg kg(-1) day(-1)), and polychlorinated biphenyl (PCB) congener no. 169 (single dose of 1.8 mg kg(-1)). Our analysis indicates that the chemicals discussed here can be clustered into three or four separate groups, based on the resulting profiles of reproductive effects. Vinclozolin, P, and DDE, known AR ligands, produce similar profiles of toxicity. However, p,p'-DDE is less potent in this regard. DBP and DEHP produce a profile distinct from the above AR ligands. Male offsprings display a higher incidence of epididymal and testicular lesions than generally seen with flutamide, P, or V even at high dosage levels. Linuron treatment induced a level of external effects consistent with its low affinity for AR [reduced anogenital distance (AGD), retained nipples, and a low incidence of hypospadias]. However, L treatment also induced an unanticipated degree of malformed epididymides and testis atrophy. In fact, the profile of effects induced by L was similar to that seen with DBP. These results suggest that L may display several mechanisms of endocrine toxicity, one of which involves AR binding. Chlozolinate and iprodione did not produce any signs of maternal or fetal endocrine toxicity at 100 mg kg(-1) day(-1). EDS produced severe maternal toxicity and a 45% reduction in size at birth, which resulted in the death of ail neonates by 5 days of age. However, EDS only reduced AGD in male pups by 15%. Ketoconazole did not demasculinize or feminize males but rather displayed anti-hormonal activities, apparently by inhibiting ovarian hormone synthesis, which resulted in delayed delivery and whole litter loss. In summary, the above in vivo data suggest that the chemicals we studied alter male sexual differentiation via different mechanisms. The anti-androgens V, P, and p,p'-DDE produce flutamide-like profiles that are distinct from those seen with DBP, DEHP, and L. The effects of PCB 169 bear little resemblance to those of any known anti-androgen. Only in depth in vitro studies will reveal the degree to which one can rely upon in vivo studies, like those presented here, to predict the cellular and molecular mechanisms of developmental toxicity.","doi":"10.1191/074823399678846664","pmid":"","date":"1999 JAN-MAR","journal":"TOXICOLOGY AND INDUSTRIAL HEALTH","authors":"Gray LE Jr; Wolf C; Lambright C; Mann P; Price M; Cooper RL; Ostby J","item_type":"journalArticle","volume":"15","issue":"1-2","pages":"94-118","issn":"0748-2337 1477-0393","isbn":"","url":""},"QZ6RGT6E":{"key":"QZ6RGT6E","record_id":"R-QZ6RGT6E","title":"Risk factors for short-term complications of hypospadias repair with transverse preputial island flap urethroplasty","abstract":"Objective To explore the risk factors of postoperative complications of transverse preputial island flap urethroplasty (Duckett procedure), and to improve the treatment effect of hypospadias. Methods A retrospectively analysis was performed on the clinical and follow-up data of children with hypospadias undergoing operations of Duckett technique, staging Duckett technique or Duckett plus Duplay technique from December 2018 to December 2019. The information of short-term postoperative complications,including u- rethral fistula, urethral stricture and urethral diverticulum was collected. A multivariate analysis of risk factors for postoperative complications was performed. Results A total of 220 children were enrolled and divided into 3 groups; Duckett group (n = 172), Duckett + Duplay group (n = 20), and staging Duckett group (n = 28). There are 208 cases who were followed up with the follow-up rate of 94. 5% and mean follow-up time of 19 months. The complication rate was 49. 5% (103/208),including 58 cases of urethral fistula (27. 9%),29 ca- ses of urethral stricture (13. 9%),34 cases of urethral diverticulum dilation (16. 3%),and 3 cases of recurrence/residual penile curvature (1.4%). Univariate analysis of Duckett group found that length of urethral defect (P = 0.048),length of transverse preputial island flap (P = 0.034),and location of urethra] opening after correction of ventral curvature (P = 0.027) were risk factors for postoperative complications of Duckett group. The patients’ age, length of penis, length and width of penis head, shape of foreskin, flatness and elasticity of skin flap, and distribution of superficial blood vessels in foreskin were irrelevant to postoperative complications (P >0. 05). Multivariate Logistic analysis showed that length of urethal defect (OR = 1. 858,95% Cl: 1 • 053 ~ 3.277) was an independent risk factor for postoperative complications after Duckett procedure (P =0.032). Conclusion Severe hypospadias entails difficult surgical treatment and high rate of postoperative complications. The length of urethral defect is an important factor influencing the complications of Duckett procedure. For children with hypospadias who have poor penile condition, it is feasible to perform staged surgery to reduce the operation difficulty and complication occurrence. © 2022, Science and Technology Association of Hunan Province. All rights reserved.","doi":"10.3760/cma.j.cn.101785-202107006-004","pmid":"","date":"2022","journal":"Journal of Clinical Pediatric Surgery","authors":"Yiwei F.; Hongcheng S.; Ning S.; Weiping Z.; Jun T.; Minglei L.; Ning L.; Yanchao Q.; Wen-Wen H.; Yang Y.; Haiyan L.; Guannan W.; Zhenwu L.","item_type":"journalArticle","volume":"21","issue":"1","pages":"18-23","issn":"16716353 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85126683098?origin=resultslist"},"R2MYAZ9S":{"key":"R2MYAZ9S","record_id":"R-R2MYAZ9S","title":"尿道下裂发病相关危险因素的研究","abstract":"目的　研究可能引起尿道下裂发病率增高的危险因素。　方法　采用病例 对照研究 ,调查 30个可能的暴露危险因素 ,病例组 2 10例 ,同期对照组 4 2 0例。对患儿和正常儿童的母亲采用问卷式调查 ,数据进行单因素非条件Logistic分析和多因素非条件Logistic逐步回归分析。　结果　本组病例均为汉族 ,有家族史者 5例 (2 .4 % ) ;危险因素 :怀孕年龄 (OR :38.6 3)、先兆流产 (OR :4 .71)、黄体酮 (OR :3.6 4 )、雌激素 (OR :5 .4 1)、杀虫剂 (OR :2 .39)、有机溶剂 (OR :2 .12 )、怀孕季节 (OR :1.86 )和洗洁精 (OR :1.87) ,而OR值 \u003c1的有 :流产次数 (OR :0 .81)、足月儿 (OR :0 .2 7)、正常胎儿体重 (OR :0 .0 0 5 ) ,其余 17项调查因素无阳性意义。　结论　先兆流产、胎儿未足月、低体重儿和外界环境中一些影响内分泌干扰剂 (杀虫剂、洗洁精、有机溶剂、黄体酮、雌激素 )可能是尿道下裂发生的危险因素 ,可能促进了近年来尿道下裂发病率的增加。","doi":"","pmid":"","date":"2004","journal":"中华泌尿外科杂志","authors":"罗琦; 黄鲁刚; 李虹; 魏强; 龚春雨; 陈绍基; 王明和; 文永均; 唐强; 周维彬","item_type":"journalArticle","volume":"","issue":"7","pages":"44-48","issn":"1000-6702","isbn":"","url":"https://kns.cnki.net/kcms2/article/abstract?v=qfSY-45OZzd3zwnymaBz8RilBJvz_bULuQgK3TJuU-uGaZa0T8bsv63npWt9PtGLUXN2ZjZsqAggdxO1K--xQcZUv9nbSYMyMsq_r7dFb7v769Y2v7SmE53CGqiW1WrRf6y_uopfG7WZRoN_5ngKicncxoh5vs2amBP3hvgu6z4N2ccq9z-f-w==&uniplatform=NZKPT&language=CHS"},"R4XKCWRW":{"key":"R4XKCWRW","record_id":"R-R4XKCWRW","title":"Retrospective analysis of individual risk factors for urethrocutaneous fistula after onlay hypospadias repair in pediatric patients.","abstract":"Background: To retrospectively identify the individual risk factors for the urethrocutaneous fistula (UCF) in pediatric patients after hypospadias repair (HR) with onlay island flap urethroplasty. Methods: A total of 167 patients who underwent primary HR at Nanjing Medical University Affiliated Children Hospital from January 2009 to December 2012 were enrolled. Clinical data including the patient' age at HR, hypospadias type and urethral defect length were documented. Results: Among 167 patients, 12.6% patients (n = 21) developed UCF after HR. Postoperative UCF occurred in 3.9% (3/76) cases at age of 0-2 years, 14.3% (9/63) at 2-4 years, 20.0% (2/10) at 4-6 years and 38.9% (7/18) at 6-12 years. The incidences of UCF were 12.0% (3/25), 11.4% (5/132) and 30.0% (3/10) for distal, middle and proximal types of hypospadias. As to the urethral defect length, the incidences of UCF were 8.2% (5/61) in patients with a length of ≤ 2 cm, 12.8% (9/70) in 2-3 cm, 22.6% (7/31) in 3-4 cm and 0% (0/5) in above 4 cm. Older age at HR was significantly associated with the high incidence of UCF formation (P = 0.004), while the hypospadias type and urethral defect length did not affect it (P = 0.264 and P = 0.312, respectively). Conclusions: The patient' age at HR was a risk factor for the UCF formation after HR, and treatment of HR within two years old might be with the least incidence of UCF. © 2015 Huang et al.; licensee BioMed Central.","doi":"10.1186/s13052-015-0140-8","pmid":"","date":"2015","journal":"Italian Journal of Pediatrics","authors":"Huang Li-Qu; Ge Zheng; Tian Jun; Ma Geng; Lu Ru-Gang; Deng Yong-Ji; Wang Li-Xia; Chen Chen-Jun; Zhu Hao-Bo; Zhu Xiao-Jiang; Guo Yun-Fei","item_type":"journalArticle","volume":"41","issue":"1","pages":"35","issn":"1824-7288","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDI1MTcyNjMwGghyYjZ4MmE0YQ%3D%3D"},"R6EZ6ZBN":{"key":"R6EZ6ZBN","record_id":"R-R6EZ6ZBN","title":"Influencing Factors of Hypospadias","abstract":"Objective: To explore the influencing factors of hypospadias. Methods: We enrolled 440 children who were delivered or received treatment in the Third Affiliated Hospital of Zhengzhou University from September 2015 to September 2016, including 220 with hypospadias (case group), and 220 healthy cases or with non-reproductive diseases (control group). Multivariate Logistic regression analysis was conducted to explore the overall risk factors for hypospadias, and risk factors for 4 different types of hypospadias. Results: Multivariate Logistic regression analysis showed that preterm birth, fetal growth restriction, maternal rural residence, gestational age, primiparity, maternal smoking or passive smoking during pregnancy, progesterone treatment during pregnancy, prevalence of cold and fever during pregnancy, and exposure to high temperature during early pregnancy were the overall risk factors for neonatal hypospadias, while supplement of proteins during early pregnancy was its protective factor (P\u003c0.05); the risk factors for type Ⅰ hypospadias were gestational age, and supplement of proteins during early pregnancy was its protective factor (P\u003c0.05); the risk factors of type Ⅱ hypospadias were preterm birth, fetal growth restriction, maternal rural residence, primiparity, maternal smoking or passive smoking during pregnancy, and supplement of proteins during early pregnancy was its protective factor (P\u003c0.05); preterm birth, fetal growth restriction, maternal rural residence, primiparity, and maternal smoking or passive smoking during pregnancy were the risk factors while supplement of proteins during early pregnancy was the protective factor for type Ⅲ hypospadias (P\u003c0.05); the risk factors of type Ⅳ hypospadias were maternal smoking or passive smoking during pregnancy and progesterone treatment during pregnancy (P\u003c0.05). Conclusion: Neonatal hypospadias is affected by many factors. Mothers should avoid bad habits and steroid hormones during pregnancy. Early pregnancy, supplementation of protein is important for preventing the incidence of hypospadias in the fetal system. Copyright © 2018 by the Chinese General Practice.","doi":"10.3969/j.issn.1007-9572.2017.00.218","pmid":"","date":"2018","journal":"Chinese General Practice","authors":"Feng Q.-L.; Wang W.-J.","item_type":"journalArticle","volume":"21","issue":"3","pages":"289-295","issn":"10079572 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85051179434?origin=resultslist"},"R6XDDUAX":{"key":"R6XDDUAX","record_id":"R-R6XDDUAX","title":"Hypospadias and Endocrine Disruption: Is There a Connection?","abstract":"Hypospadias is one of the most common congenital anomalies in the United States, occurring in approximately 1 in 250 newborns or roughly 1 in 125 live male births. It is the result of arrested development of the urethra, foreskin, and ventral surface of the penis where the urethral opening may be anywhere along the shaft, within the scrotum, or in the perineum. The only treatment is surgery. Thus, prevention is imperative. To accomplish this, it is necessary to determine the etiology of hypospadias, the majority of which have been classified as idiopathic. In this paper we briefly describe the normal development of the male external genitalia and review the prevalence, etiology, risk factors, and epidemiology of hypospadias. The majority of hypospadias are believed to have a multifactorial etiology, although a small percentage do result from single gene mutations. Recent findings suggest that some hypospadias could be the result of disrupted gene expression. Discoveries about the antiandrogenic mechanisms of action of some contemporary-use chemicals have provided new knowledge about the organization and development of the urogenital system and may provide additional insight into the etiology of hypospadias and direction for prevention. Key words: antiandrogens, differentiation, external genitalia, gene expression, urogenital development. Environ Health Perspect 109:1175-1183 (2001). [Online 7 November 2001] http.//ehpnet1.niehs.nih.gov/docs/2001/109p1175-1183baskin/abs tract.html","doi":"","pmid":"","date":"2001","journal":"Environmental Health Perspectives","authors":"Baskin Laurence S.; Himes Katherine; Colborn Theo","item_type":"journalArticle","volume":"109","issue":"11","pages":"1175","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISFUVCU0NPX0FzcDAwMDAwNjM0NzQ0MBoIcmI2eDJhNGE%3D"},"RE3SG893":{"key":"RE3SG893","record_id":"R-RE3SG893","title":"Occupational exposure to endocrine-disrupting chemicals and other parental risk factors in hypospadias and cryptorchidism development: a case-control study","abstract":"Aim of the study\n   Endocrine-disrupting chemicals (EDCs) are exogenous agents that are capable of altering the endocrine system functions, including the regulation of developmental processes. The aim of this study was to investigate the association between EDC exposure and other parental factors in the etiology of hypospadias and cryptorchidism.\n   Methods\n   A case-control study was conducted. Cases (n = 210) were infants aged between 6 months and 14 years diagnosed with hypospadias or cryptorchidism who attended the authors' hospital over a period of 18 months, and controls (n = 210) were infants within the same range of age and without any urological disorders who attended the outpatient clinic of the same hospital during the same time period. Their selection was independent of exposures. Data on parental occupational exposure to EDCs and other sociodemographic variables were collected through face-to-face interviews and systematically for both cases and controls. Crude and adjusted odds ratios (ORs) were estimated to control for confounding with their 95% confidence interval (CI) by means of logistic regressions. Specifically, three final models of a dichotomous outcome were constructed: one for cryptorchidism, one for hypospadias, and the third considering both malformations together. The Hosmer-Lemeshow test was used to assess the goodness of fit of the models. Their discriminatory accuracy (DA) was ascertained by estimating their areas under the receiver operating characteristic curves area under the curve (AUC) along with their 95% CI.\n   Results\n   Associations were found between advanced maternal age (OR adjusted = 1.82; 95% CI: 1.14-2.92), mother's consumption of anti-abortives (OR = 5.40; 95% CI: 1.40-38.5) and other drugs (OR = 2.02; 95% CI: 1.31-3.16) during pregnancy, maternal and paternal occupational exposure to EDCs (OR = 4.08; 95% CI: 2.03-8.96 and OR = 3.90; 95% CI: 2.41-6.48, respectively), fathers smoking (OR = 2.0; 95% CI: 1.33-2.99), and fathers with urological disorders (OR = 2.31; 95% CI: 1.15-4.90). Maternal and paternal high educational level could be protective of cryptorchidism (OR = 0.47; 95% CI: 0.28-0.76 and OR = 0.63; 95% CI: 0.42-0.93, respectively). The DA of the models for the whole sample (AUC = 0.75; 95% CI: 0.70-0.79) for cryptorchidism (AUC = 0.76; 95% CI: 0.71-0.82) and for hypospadias (AUC = 0.75; 95% CI: 0.69-0.81) was moderately high.\n   Conclusions\n   Advanced age, some parental occupational exposure to EDCs, some drug consumption, smoking, and the father's history of urological disorders may increase risk and predict the developments of these malformations. Studies with higher samples sizes are needed to assess associations between individual EDC occupational exposures and drugs and these malformations.","doi":"10.1016/j.jpurol.2019.07.001","pmid":"","date":"2019 OCT","journal":"JOURNAL OF PEDIATRIC UROLOGY","authors":"Sastre BE; Artero CC; Ruiz YG; Atuan RLF; Rodríguez PB; Juan GF; Romero JG","item_type":"journalArticle","volume":"15","issue":"5","pages":"","issn":"1477-5131 1873-4898","isbn":"","url":""},"RKQN238R":{"key":"RKQN238R","record_id":"R-RKQN238R","title":"Endocrine assessment of prepubertal boys with a history of cryptorchidism and/or hypospadias: a pilot study.","abstract":"Purpose: Four disorders, including poor semen quality, testicular cancer, cryptorchidism and hypospadias, are thought to represent testicular dysgenesis syndrome and have been hypothesized to share a common etiology. We predicted testicular function in prepubertal boys with a history of cryptorchidism and/or hypospadias by measuring serum hormone levels. Materials and Methods: A total of 82 prepubertal boys who underwent orchiopexy and/or hypospadias repair in childhood were enrolled in the study. Patients were surgically treated for cryptorchidism (23 in group 1), hypospadias (49 in group 2), cryptorchidism and hypospadias (10 in group 3), and hydrocele testis (7 in control group 4). Serum hormones, including luteinizing hormone, follicle-stimulating hormone and total testosterone, were measured separately by age less than 12.5, 12.5 to 13.5 and greater than 13.5 years, and by Tanner pubertal stage. Results: Follicle-stimulating hormone in group 3 was significantly higher than in groups 1, 2 and 4 at ages 12.5 to 13.5 and greater than 13.5 years, and for Tanner stages 2 and 3 (p \u003c0.05). However, luteinizing hormone and testosterone did not differ among the groups regardless of age or Tanner stage. Group 3 patients had significantly higher follicle-stimulating hormone regardless of the severity of cryptorchidism or hypospadias. Conclusions: Data suggest that testicular function in patients with cryptorchidism plus hypospadias is more severely impaired than that in patients with cryptorchidism or hypospadias, lending clinical support to the testicular dysgenesis syndrome hypothesis of a common origin. © 2011 by AMERICAN UROLOGICAL ASSOCIATION EDUCATION AND RESEARCH, INC.","doi":"10.1016/j.juro.2011.01.018","pmid":"","date":"2011","journal":"Journal of Urology","authors":"Iwatsuki Shoichiro; Kojima Yoshiyuki; Mizuno Kentaro; Kamisawa Hideyuki; Umemoto Yukihiro; Sasaki Shoichi; Kohri Kenjiro; Hayashi Yutaro","item_type":"journalArticle","volume":"185","issue":"6 SUPPL.","pages":"2444-2449","issn":"0022-5347","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L361743141&from=export"},"RMPR23CZ":{"key":"RMPR23CZ","record_id":"R-RMPR23CZ","title":"阴茎远端尿道狭窄疾病的手术治疗方式","abstract":"目的:探讨阴茎远端尿道狭窄疾病的手术治疗方式.方法:回顾性收集自2018年1月至2022年12月就诊于首都医科大学附属北京积水潭医院的80例阴茎远端尿道狭窄患者的临床资料,包括男性生殖器苔藓样硬化(male genital lichen sclerosus,MGLS)33例,医源性损伤25例,尿道下裂术后12例,外伤等其他原因10例.狭窄仅累及尿道外口 54例,其中38例行尿道外口切开术(meatotomy,MO),7例行阴茎皮瓣尿道成形术(penile skin flap urethroplasty,PSFU),9 例行口腔黏膜尿道成形术(oral mucosa graft urethroplasty,OMGU);狭窄同时累及尿道外口和舟状窝26例,其中1例行PSFU,25例行OMGU.以术式不同将80例患者分为MO、PSFU、OMGU 3组,平均年龄分别为(48.8±20.0)岁、(53.3±21.8)岁、(44.5±16.4)岁;平均体重指数(body mass index,BMI)分别为(28.6±3.9)kg/m2、(29.6±3.2)kg/m2、(29.2±4.8)kg/m2;平均术前最大尿流率分别为(5.8±2.3)mI/s、(6.8±2.4)mL/s、(5.7±3.1)mL/s.结果:所有手术均顺利完成,围术期无Clavien Ⅲ或Ⅳ级并发症发生.3组中位狭窄长度(术中测量)分别为1.1(1.0,1.6)、1.5(1.1,2.0)、4.0(2.5,5.0)cm;中位手术时间分别为60.0(60.0,75.0)、85.0(75.0,112.5)、180.0(75.0,330.0)min;中位估计出血量分别为 5.0(2.0,10.0)、15.0(5.0,42.5)、180.0(135.0,216.3)mL;术后中位住院日分别为 3.5(2.0,5.0)、6.5(3.5,7.0)、7.5(7.0,11.3)d;术后中位随访时间分别为 40.0(26.3,57.3)、55.0(18.8,62.8)、52.5(30.5,64.0)个月;术后中位最大尿流率分别为 18.3(15.5,19.8)、19.2(16.1,20.1)、17.2(14.2,19.6)mL/s.38 例 MO 中 33 例排尿通畅,无需干预;5例狭窄复发,需定期尿道扩张.8例PSFU中7例排尿通畅,无需干预;1例出现尿瘘,建议干预,但患者决定维持现状.34例OMGU中28例排尿通畅,无需干预;6例狭窄复发,其中5例需定期尿道扩张,1例再行重建手术.所有病例术后成功率为85.0％,再干预率为15.0％.统计分析发现,3组患者的狭窄病因(P=0.002)、狭窄部位(P＜0.001)、狭窄长度(P＜0.001)、手术时间(P＜0.001)、估计出血量(P＜0.001)及术后住院日(P＜0.001)差异有统计学意义;年龄、BMI、既往尿道狭窄手术史、术前最大尿流率、随访时间、术后最大尿流率及再干预率均差异无统计学意义.单因素及多因素Logistic回归分析发现,既往尿道狭窄手术史是术后再干预的危险因素(P=0.026).结论:MO和PSFU主要适用于短段(≤1.5 cm)阴茎远端尿道狭窄,OMGU则适用于处理更长段狭窄;MO和OMGU可用于MGLS病例;PSFU和OMGU更有利于改善尿道外口外观;阴茎远端尿道狭窄手术治疗的成功率为85.0％,15.0％的患者术后仍需外科干预,既往尿道狭窄手术史是术后再干预的危险因素.","doi":"10.19723/j.issn.1671-167X.2024.06.021","pmid":"","date":"2024","journal":"北京大学学报（医学版）","authors":"王杰; 王建伟; 夏海缀; 徐啸; 翟建坡; 何峰; 黄广林; 李贵忠","item_type":"journalArticle","volume":"56","issue":"6","pages":"1075-1082","issn":"1671-167X","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRYmp5a2R4eHgyMDI0MDYwMjEaCHJiNngyYTRh"},"RRXGBENC":{"key":"RRXGBENC","record_id":"R-RRXGBENC","title":"Congenital malformations co-occurring with hypospadias in California, 1983-1997.","abstract":"Investigations for co-occurring malformations can serve as a first step to discover new risk factors and provide insights into malformation etiologies. Our objective was to explore the risks of occurrence of structural congenital malformation phenotypes in 5,481 infants with hypospadias, using data from a population-based active surveillance system. Ascertainment was performed among 1,816,258 liveborn and 12,203 stillborn male offspring of women who were residents of registry counties during 1983-1997. Malformations other than hypospadias were grouped according to the 3- and 4-digit BPA malformation codes. Prevalences of each malformation grouping were calculated among all births with hypospadias and their three subgroups and all births without hypospadias but with another structural malformation. Relative risks were estimated based on the ratio of two prevalences, and the corresponding 95% confidence intervals were computed using Poisson regression models. Observed relative risks indicated that all malformation groupings were less likely to co-occur with hypospadias and their three subgroups than with other types of malformations, with relative risks ranging from 0.04 to 0.93. For most malformations, risks were relatively similar among all births with hypospadias and the three subgroups of hypospadias. The observed relative risks were not substantially changed in analyses that adjusted for maternal age, race/ethnicity, and parity. Computations were extended to 4-digit level BPA codes. Almost all observed relative risks for malformations co-occurring with hypospadias overall and three subgroups were less than 1. (C) 2007 Wiley-Liss, Inc.","doi":"10.1002/ajmg.a.32001","pmid":"17937439","date":"2007 Nov 15","journal":"American journal of medical genetics. Part A","authors":"Yang Wei; Carmichael Suzan L.; Shaw Gary M.","item_type":"journalArticle","volume":"143A","issue":"22","pages":"2627-2634","issn":"1552-4825","isbn":"","url":""},"RT4N5VSS":{"key":"RT4N5VSS","record_id":"R-RT4N5VSS","title":"Ventral oral mucosal onlay graft urethroplasty in nontraumatic bulbar urethral strictures: Surgical technique and multivariable analysis of results in 214 patients","abstract":"Background: The ventral oral mucosal onlay graft is suggested in proximal bulbar strictures where the thick spongiosum provides excellent support to the graft. Some technical steps used in this technique are currently under debate in the literature.\n   Objective: To describe the surgical steps of this urethroplasty and investigate predictive factors of success using a multivariable logistic regression analysis.\n   Design, setting, and participants: This is a descriptive observational retrospective study of 214 patients who underwent urethroplasty for bulbar urethral strictures between May 1999 and November 2010 in a single high-volume center. Study inclusion criteria were patients presenting nontraumatic bulbar urethral strictures ranging from 1.3 cm to 6.8 cm in length. Exclusion criteria were traumatic strictures, panurethral strictures, lichen sclerosus, and failed hypospadias repair.\n   Surgical procedure: The oral graft was placed on the ventral bulbar urethral surface and pushed as proximally as possible using dedicated instruments and surgical techniques.\n   Outcome measurements and statistical analysis: The primary outcome measure was the objective result, defined as the absence of stricture recurrence at follow-up. The objective outcome was considered a failure when any postoperative instrumentation was needed. Multivariable logistic regression analysis was developed. All tests were two sided with a significance level set at 0.05.\n   Results and limitations: Median follow-up was 54 mo. Of the 214 patients, 183 (85.5%) were successful and 31 (14.5%) were failures. The preoperative maximum flow rate (Q(max)) was a significant predictor of surgical outcome (odds ratio: 1.352; p = 0.001). Age, length, and type of stenosis, and previous treatment were not significant predictors of surgical outcome (all p > 0.05). The limitation of our survey is the absence of a subjective evaluation or the use of specific tools, such as a questionnaire.\n   Conclusions: Ventral oral graft urethroplasty represents a valid option in nontraumatic bulbar strictures. Preoperative Q(max) may be predictive of urethroplasty failure. (C) 2013 European Association of Urology. Published by Elsevier B. V. All rights reserved.","doi":"10.1016/j.eururo.2013.05.046","pmid":"","date":"2013","journal":"European Urology","authors":"Barbagli G.; Montorsi F.; Guazzoni G.; Larcher A.; Fossati N.; Sansalone S.; Romano G.; Buffi N.; Lazzeri M.","item_type":"journalArticle","volume":"64","issue":"3","pages":"440-447","issn":"0302-2838","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L52623043&from=export"},"S3UFSYI2":{"key":"S3UFSYI2","record_id":"R-S3UFSYI2","title":"Preserved Fertility in a Patient with a 46,XY Disorder of Sex Development due to a New Heterozygous Mutation in the NR5A1/SF-1 Gene: Evidence of 46,XY and 46,XX Gonadal Dysgenesis Phenotype Variability in Multiple Members of an Affected Kindred","abstract":"In humans, steroidogenic factor 1 (NR5A1/SF-1) mutations have been reported to cause gonadal dysgenesis, with or without adrenal failure, in both 46,XY and 46,XX individuals. We have previously reported extreme within-family variability in affected 46,XY patients. Even though low ovarian reserve with preserved fertility has been reported in females harboring NR5A1 gene mutations, fertility has only been observed in one reported case in affected 46,XY individuals. A kindred with multiple affected members presenting gonadal dysgenesis was studied. Four 46,XY individuals presented severe hypospadias at birth, one of them associated with micropenis and cryptorchidism. The other 3 developed spontaneous male puberty, and 1 has fathered 5 children. Four 46,XX patients presented premature ovarian failure (one of them was not available for the study) or high follicle-stimulating hormone levels. Mutational analysis of the NR5A1 gene revealed a novel heterozygous mutation, c.938G→A, predicted to cause a p.Arg313Hys amino acid change. A highly conserved amino acid of the ligand-binding domain of the mature protein is affected, predicting abnormal protein function. We confirm that preserved fertility can be observed in patients with a 46,XY disorder of sex development due to heterozygous mutations in the NR5A1 gene. Copyright © 2012 S. Karger AG, Basel.","doi":"10.1159/000338346","pmid":"","date":"2012","journal":"","authors":"Ciaccio M.; Costanzo M.; Guercio G.; De Dona V.; Marino R.; Ramirez P.C.; Galeano J.; Warman D.M.; Berensztein E.; Saraco N.; Baquedano M.S.; Chaler E.; MacEiras M.; Lazzatti J.M.; Rivarola M.A.; Belgorosky A.","item_type":"conferencePaper","volume":"78","issue":"2","pages":"119-126","issn":"","isbn":"16632826 (ISSN)","url":"https://www.scopus.com/pages/publications/84866494512?origin=resultslist"},"S7UE66A5":{"key":"S7UE66A5","record_id":"R-S7UE66A5","title":"Severe hypospadias and its association with maternal-placental factors.","abstract":"The neonate born small for gestational age (SGA, birth weight \u003c10th centile) with severe hypospadias, and without the presence of other malformations, is a  presentation which clinical geneticists are asked to assess. However, this  combination is not well addressed in the literature. Epidemiological studies  point to an increased incidence and severity of hypospadias in SGA infants, but  leave open the possibility that the association is attributable to the population  subset who have multiple congenital abnormalities or genetic syndromes.  Epidemiological studies unselected for birth weight have also identified an  association between hypospadias with some risk factors tied to SGA, including  prematurity, preeclampsia, and placental insufficiency. This study was developed  after being involved in the care of several boys with SGA and severe hypospadias  who were premature, with gestational histories of maternal hypertension and  oligohydramnios. No underlying syndromes, hormonal abnormalities, or contributory  family histories could be found. We hypothesized that severe hypospadias may in  some cases be causally related to maternal-placental factors rather than primary  fetal abnormalities. A retrospective study of a cohort of singletons born SGA  with unexplained hypospadias was conducted. We compared their gestational  histories and hypospadias severities with those born at normal birth weights. The  cohort with SGA had an increased ratio of severe to mild hypospadias. Further,  within the cohort of SGA boys, there was a higher prevalence of prematurity,  maternal hypertension, and oligohydramnios among those with severe vs mild  hypospadias. Small sample sizes are limiting.","doi":"10.1002/ajmg.a.36050","pmid":"","date":"2013","journal":"American journal of medical genetics, Part A","authors":"Huisma Felicity; Thomas Marion; Armstrong Linlea","item_type":"journalArticle","volume":"161A","issue":"9","pages":"2183-2187","issn":"1552-4825","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGI5NjUxMjliNTk4MGNmYzkzMDhlMzBkNmYyNDY0NTUwGghyYjZ4MmE0YQ%3D%3D"},"SEAF7BE6":{"key":"SEAF7BE6","record_id":"R-SEAF7BE6","title":"尿道下裂发病相关危险因素的研究","abstract":"目的:研究可能引起尿道下裂发病率增高的危险因素。方法:采用病例-对照研究,调查30个可能的暴露危险因素,病例组210例,同期对照组420例。对患儿和正常儿童的母亲采用问卷式调查,数据进行单因素非条件Logistic分析和多因素非条件Logistic逐步回归分析。结果:本组病例均为汉族,有家族史者5例(2.4%);危险因素:怀孕年龄(OR:38.63)、先兆流产(OR:4.71)、黄体酮(OR:3.64)、雌激素(OR:5.41)、杀虫剂(OR:2.39)、有机溶剂(OR:2.12)、怀孕季节(OR:1.86)和洗洁精(OR:1.87),而OR值\u003c1的有:流产次数(OR:0.81)、足月儿(OR:0.27)、正常胎儿体重(OR:0.005),其余17项调查因素无阳性意义。结论:先兆流产、胎儿未足月、低体重儿和外界环境中一些影响内分泌干扰剂(杀虫剂、洗洁精、有机溶剂、黄体酮、雌激素)可能是尿道下裂发生的危险因素,可能促进了近年来尿道下裂发病率的增加。","doi":"10.3760/j:issn:1000-6702.2004.07.013","pmid":"","date":"2004","journal":"中华泌尿外科杂志","authors":"罗琦; 黄鲁刚; 李虹; 魏强; 龚春雨; 陈绍基; 王明和; 文永均; 唐强; 周维彬","item_type":"journalArticle","volume":"25","issue":"7","pages":"476-480","issn":"1000-6702","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemhtbndrMjAwNDA3MDEzGghyYjZ4MmE0YQ%3D%3D"},"SEPS7B85":{"key":"SEPS7B85","record_id":"R-SEPS7B85","title":"Cryptorchidism as part of the testicular dysgenesis syndrome: The environmental connection","abstract":"Cryptorchidism is part of the testicular dysgenesis syndrome (TDS), which includes other male reproductive disorders such as hypospadias, testis cancer and reduced semen quality. These diseases appear to be linked by common pathogenic mechanisms, interfering with normal fetal testis development. Testis development and descent is dependent on androgens and thus on an intact hypothalamus-pituitary-gonadal axis. Although cryptorchidism occurs in rare syndromes and genetic disorders, in the majority of children the etiology remains open. Many maternal and fetal risk factors have been previously identified but recently, scientific focus has also been directed to environmen-tal hormone disrupting chemicals and lifestyle, as the prevalence of testis cancer and cryptorchidism has increased and semen quality decreased over few decades in several countries. Some persistent environmental chemicals, e.g. polychlorinated pesticides and polybrominated flame retardants, were associated with testicular maldescent and testis cancer. In addition, prenatal exposure to phthalates was negatively correlated to testosterone levels and anogenital distance as a measure of androgen effect in infant boys. Alcohol consumption and maternal smoking during pregnancy also appeared to be a risk factor for cryptorchidism. Thus, current evidence suggests that the development of the male reproductive tract may be susceptible to adverse effects of environmental hormone disrupters. Copyright © 2009 S. Karger AG, Basel.","doi":"10.1159/000207485","pmid":"","date":"2009","journal":"","authors":"Main K.M.; Skakkebæk N.E.; Toppari J.; Cappa M.; Bottazzo G.F.; Pediatric Hospital Bambino Gesu Department of Pediatrics, Rome; Loche S.; Regional Hospital for Microcytaemia Cagliari; Maghnie M.; University of Genova Department of Pediatrics, RCCS G. Gaslini, Genova","item_type":"conferencePaper","volume":"14","issue":"","pages":"167-173","issn":"","isbn":"16622979 (ISSN); 978-380559041-9 (ISBN)","url":"https://www.scopus.com/pages/publications/65549140789?origin=resultslist"},"SEYDM6DA":{"key":"SEYDM6DA","record_id":"R-SEYDM6DA","title":"Machine learning for predicting hypospadias classification based upon anogenital and penoscrotal distances","abstract":"Objective To describe the anatomical abnormalities of hypospadias before puberty using current commonly used anthropometric index data and predict postoperative diagnostic classification. Methods From April 2021 to September 2022, retrospective review was performed for 259 children with hypospadias before puberty (Tanner stage I). The clinical data of height, weight, body mass index (BMI), preoperative penoscrotal distance, anogenital distance, 2D: 4D digit ratio and postoperative hypospadias classification were recorded. One-way analysis of variance was utilized for examining the differences in each index between different classifications. Receiver operating character (ROC) curve was plotted for univariate analysis of diagnostic predictive value of each index for hypospadias classification in training set. Binary Logistic regression (LR), random forest (RF) and support vector machine (SVM) models were constructed for exploring the value of machine learning methods in predicting hypospadias classification based upon anthropometric parameters. Results The involved segments were distal (n=33, 13%), midshaft (n=120, 46%) and proximal (n=106, 41%). In training set, the area under the ROC curve (AUC) of posterior penoscrotal distance (PPSD), anterior penoscrotal distance (APSD), anoscrotal distance 2 (ASD2), anogenital distance 2 (AGD2) and anogenital distance 1 (AGD) for diagnosing each type was superior to anoscrotal distance (ASD). And AGD2 was the best while 2D: 4D digit ratio had no diagnostic value. In training set, the sensitivity of binary LR, RF and SVM was 15%, 7% and 11% for identifying distal type, 62%, 56% and 79% for identifying midshaft type and 69%, 64% and 68% for identifying proximal type. In validation set, sensitivity was 17%, 17% and 0 for identifying distal type, 61%, 55% and 64% for identifying midshaft type and 56%, 60% and 48% for identifying proximal type. The diagnostic accuracy of three-classification RF and SVM was 62.56% and 73.33% in training set versus 57.81% and 62.50% in validation set. In training and validation sets, the accuracy of three-classification models was largely attributable to high sensitivity of models for detecting midshaft/proximal hypospadias. Conclusion Anogenital distance and penoscrotal distance have a favorable predictive value for midshaft/proximal hypospadias. With higher test efficiency and stability, AGD2 is recommended as a preferred anogenital distance parameter. Also ASD2 is ideal for measuring anogenital distance. Bilateral 2D∶4D digit ratio has a low predictive value for hypospadias classification. © 2024 Chinese Medical Journals Publishing House Co.Ltd. All rights reserved.","doi":"10.3760/cma.j.cn421158-20230831-00307","pmid":"","date":"2024","journal":"Chinese Journal of Pediatric Surgery","authors":"He Z.; Wang X.; Yang B.; Tang Y.","item_type":"journalArticle","volume":"45","issue":"11","pages":"1024-1031","issn":"02533006 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85209073343?origin=resultslist"},"SFR3K8LQ":{"key":"SFR3K8LQ","record_id":"R-SFR3K8LQ","title":"Male reproductive organs are at risk from environmental hazards.","abstract":"Male reproductive disorders that are of interest from an environmental point of view include sexual dysfunction, infertility, cryptorchidism, hypospadias and testicular cancer. Several reports suggest declining sperm counts and increase of these reproductive disorders in some areas during some time periods past 50 years. Except for testicular cancer this evidence is circumstantial and needs cautious interpretation. However, the male germ line is one of the most sensitive tissues to the damaging effects of ionizing radiation, radiant heat and a number of known toxicants. So far occupational hazards are the best documented risk factors for impaired male reproductive function and include physical exposures (radiant heat, ionizing radiation, high frequency electromagnetic radiation), chemical exposures (some solvents as carbon disulfide and ethylene glycol ethers, some pesticides as dibromochloropropane, ethylendibromide and DDT/DDE, some heavy metals as inorganic lead and mercury) and work processes such as metal welding. Improved working conditions in affluent countries have dramatically decreased known hazardous workplace exposures, but millions of workers in less affluent countries are at risk from reproductive toxicants. New data show that environmental low-level exposure to biopersistent pollutants in the diet may pose a risk to people in all parts of the world. For other toxicants the evidence is only suggestive and further evaluation is needed before conclusions can be drawn. Whether compounds as phthalates, bisphenol A and boron that are present in a large number of industrial and consumer products entails a risk remains to be established. The same applies to psychosocial stressors and use of mobile phones. Finally, there are data indicating a particular vulnerability of the fetal testis to toxicantsfor instance maternal tobacco smoking. Time has come where male reproductive toxicity should be addressed form entirely new angles including exposures very early in life. © 2010 AJA, SIMM & SJTU All rights reserved.","doi":"10.1038/aja.2009.83","pmid":"","date":"2010","journal":"Asian Journal of Andrology","authors":"Bonde Jens Peter","item_type":"journalArticle","volume":"12","issue":"2","pages":"152-156","issn":"17457262 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/77749302224?origin=resultslist"},"SN8E87PY":{"key":"SN8E87PY","record_id":"R-SN8E87PY","title":"Hypospadias and endocrine disruption: is there a connection?","abstract":"Hypospadias is one of the most common congenital anomalies in the United States, occurring in approximately 1 in 250 newborns or roughly 1 in 125 live male
