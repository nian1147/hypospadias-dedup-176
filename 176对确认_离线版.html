di S.","item_type":"journalArticle","volume":"7","issue":"1","pages":"52-57","issn":"22517510 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84980052951?origin=resultslist"},"EGTAD9CZ":{"key":"EGTAD9CZ","record_id":"R-EGTAD9CZ","title":"Re: risk factors for different phenotypes of hypospadias: results from a dutch case-control study.","abstract":"","doi":"10.1016/j.juro.2013.10.106","pmid":"","date":"2014","journal":"Journal of Urology","authors":"Canning Douglas A.","item_type":"journalArticle","volume":"191","issue":"2","pages":"465-466","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84898540670?origin=resultslist"},"EJK3DWCD":{"key":"EJK3DWCD","record_id":"R-EJK3DWCD","title":"Retrospective analysis of individual risk factors for urethrocutaneous fistula after onlay hypospadias repair in pediatric patients.","abstract":"To retrospectively identify the individual risk factors for the urethrocutaneous fistula (UCF) in pediatric patients after hypospadias repair (HR) with onlay island flap urethroplasty.A total of 167 patients who underwent primary HR at Nanjing Medical University Affiliated Children Hospital from January 2009 to December 2012 were enrolled. Clinical data including the patient' age at HR, hypospadias type and urethral defect length were documented.Among 167 patients, 12.6% patients (n = 21) developed UCF after HR. Postoperative UCF occurred in 3.9% (3/76) cases at age of 0-2 years, 14.3% (9/63) at 2-4 years, 20.0% (2/10) at 4-6 years and 38.9% (7/18) at 6-12 years. The incidences of UCF were 12.0% (3/25), 11.4% (5/132) and 30.0% (3/10) for distal, middle and proximal types of hypospadias. As to the urethral defect length, the incidences of UCF were 8.2% (5/61) in patients with a length of ≤ 2 cm, 12.8% (9/70) in 2-3 cm, 22.6% (7/31) in 3-4 cm and 0% (0/5) in above 4 cm. Older age at HR was significantly associated with the high incidence of UCF formation (P = 0.004), while the hypospadias type and urethral defect length did not affect it (P = 0.264 and P = 0.312, respectively).The patient' age at HR was a risk factor for the UCF formation after HR, and treatment of HR within two years old might be with the least incidence of UCF.","doi":"10.1186/s13052-015-0140-8","pmid":"","date":"2015","journal":"Italian journal of pediatrics","authors":"Li-Qu Huang; Zheng Ge; Jun Tian; Geng Ma; Ru-Gang Lu; Yong-Ji Deng; Li-Xia Wang; Chen-Jun Chen; Hao-Bo Zhu; Xiao-Jiang Zhu; Yun-Fei Guo","item_type":"journalArticle","volume":"41","issue":"","pages":"35","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISDlB1Ym1lZDAwNjM0NDA0GghyYjZ4MmE0YQ%3D%3D"},"EMJ3JNNL":{"key":"EMJ3JNNL","record_id":"R-EMJ3JNNL","title":"Maternal hypertension and risk for hypospadias in offspring","abstract":"Hypospadias is one of the most common birth defects in male infants. Maternal hypertension is a suspected risk factor; however, few previous studies have addressed the possibility of reporting bias, and several previous studies have not accounted for hypospadias severity. We analyzed data from the Texas Birth Defects Registry for 10,924 nonsyndromic cases and statewide vital records for deliveries during 1999–2009, using Poisson regression. After adjustment for potential confounders, hypospadias was associated with maternal hypertension (adjusted prevalence ratio: 1.5, 95% confidence interval: 1.4–1.7). Similar associations were observed with gestational and pregestational hypertension, including separate analyses restricted to the subset of cases with severe (second‐ or third‐degree) hypospadias. All of these associations were also similar among the subset of cases with isolated hypospadias (without additional birth defects). To evaluate the potential for bias due to potential hypertension misclassification, we repeated our analyses using logistic regression, comparing the cases to controls with other birth defects. In these analyses, the associations with gestational hypertension were similar, but adjusted associations with pregestational hypertension were no longer observed. Our findings support an association between gestational hypertension and hypospadias in offspring, but also suggest that previously observed associations with pregestational hypertension may have been inflated due to differential misclassification of hypertension (e.g., reporting bias). As gestational hypertension is recognized after hypospadias development, more research is needed to determine if this association reflects an increase in gestational hypertension risk secondary to hypospadias or if both conditions have shared risk factors (e.g., precursors of gestational hypertension). ? 2016 Wiley Periodicals, Inc.","doi":"10.1002/ajmg.a.37947","pmid":"","date":"2016","journal":"American journal of medical genetics, Part A","authors":"Agopian A. J.; Hoang Thanh T.; Mitchell Laura E.; Morrison Alanna C.; Tu Duong; Nassar Natasha; Canfield Mark A.","item_type":"journalArticle","volume":"170A","issue":"12","pages":"3125-3132","issn":"1552-4825","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDAxNDAzZjQ0NGQyOWVjYjI5NjM2NzIzNzZlZGI4MzdmGghyYjZ4MmE0YQ%3D%3D"},"EPTFN76S":{"key":"EPTFN76S","record_id":"R-EPTFN76S","title":"Hypospadias Risk from Maternal Residential Exposure to Heavy Metal Hazardous Air Pollutants.","abstract":"Objective: Investigate whether residential prenatal exposure to heavy metal hazardous air pollutants (HMHAPs) is associated with an increased risk of hypospadias. Methods: Data on non-syndromic hypospadias cases (n = 8981) and control patients delivered in Texas were obtained from the Texas Birth Defects Registry and matched 1:10 by birth year. Average exposure concentrations of HMHAPs were obtained from the 2005 U.S. Environmental Protection Agency National-Scale Air Toxics Assessment and categorized into quintiles. Odds ratios and 95% confidence intervals were estimated. STROBE reporting guidelines were followed. Results: We observed associations between hypospadias and prenatal HMHAP exposure. Manganese demonstrated significant increased risk of hypospadias at the medium, medium-high and high exposure quintiles; lead in the medium-high and high exposure quintiles. Cadmium, mercury and nickel demonstrated a significant inverted “U-shaped” association for exposures with significant associations in the medium and medium-high quintiles but not in the medium-low and high quintiles. Arsenic and chromium demonstrated a significant bivalent association for risk of hypospadias in a lower quintile as well as a higher quintile with non-significant intermediate quintiles. Conclusions: Using data from one of the world’s largest active surveillance birth defects registries, we identified significant associations between hypospadias and HMHAP exposures. These results should be used in counseling for maternal demographic risk factors as well as avoidance of heavy metals and their sources. © 2019 by the authors. Licensee MDPI, Basel, Switzerland.","doi":"10.3390/ijerph16060930","pmid":"","date":"2019","journal":"International Journal of Environmental Research and Public Health","authors":"White Jeffrey T.; Kovar Erin; Chambers Tiffany M.; Sheth Kunj R.; Peckham-Gregory Erin C.; O'Neill Marisol; Langlois Peter H.; Jorgez Carolina J.; Lupo Philip J.; Seth Abhishek","item_type":"journalArticle","volume":"16","issue":"6","pages":"","issn":"16617827 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85062964200?origin=resultslist"},"ERQIJUIM":{"key":"ERQIJUIM","record_id":"R-ERQIJUIM","title":"Risk factors for hypospadias: a prospective single-center study from Ghana.","abstract":"Introduction: Hypospadias is a common congenital defect in boys, though its causes are mostly unknown, likely arising from genetic and environmental factors. We analyzed hypospadias cases at our center to identify prevalence of risk factors. Methods: We collected data prospectively on boys with hypospadias and their parents who visited our center from January 2023 to December 2024. The urology unit diagnoses two new cases of hypospadias each month. Therefore, 51 patients were recruited, expecting 5% of the data to be unusable. Data collected and analyzed included the child's gestational age, birth weight, type of hypospadias, associated abnormalities, parents' ages, exposure to organophosphate pesticides and phytoestrogens, maternal contraceptive use during pregnancy, and a history of subfertility or hypospadias in the father. Results: This study involving 51 boys aged 2 months to 11 years with hypospadias and their parents revealed that 84.3% were born at term, while 45.1% had low birth weights, with no correlation between birth weight and hypospadias type (p = 0.35). Most mothers (54.9%) and fathers (86.3%) were 30 or older at birth, and 45.1% of mothers and 27.5% of fathers frequently consumed phytoestrogen-rich foods. Exposure to organophosphate pesticides was noted by 17.6% of mothers and 11.7% of fathers. During pregnancy, 15.7% of mothers used oral contraceptives and 5.9% used progestogens. Among fathers, 11.7% had a history of subfertility, and 3.9% had cryptorchidism, with no father having hypospadias. Conclusion: Low birth weight, advanced parental age, and exposure to phytoestrogens and organo-pesticides are associated with hypospadias in our patients. © The Author(s), under exclusive licence to Springer-Verlag GmbH Germany, part of Springer Nature 2025.","doi":"10.1007/s00345-025-06091-5","pmid":"","date":"2025","journal":"World Journal of Urology","authors":"Patrick Opoku Manu Maison; Kwaku Addai-Arhin Appiah; Douglas Arthur; Joseph Amoabeng; Phillip Mensah; Augustine Arthur","item_type":"journalArticle","volume":"43","issue":"1","pages":"714","issn":"1433-8726","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDM1MDgzOTAzGghyYjZ4MmE0YQ%3D%3D"},"ET9XEFJ8":{"key":"ET9XEFJ8","record_id":"R-ET9XEFJ8","title":"性激素与儿童轻度尿道下裂术后小阴茎的相关性分析","abstract":"目的:分析性激素水平与儿童轻度尿道下裂术后小阴茎的相关性。方法:病例对照研究。分析2022年4月至2024年4月就诊于新乡医学院第一附属医院的1～13岁轻度尿道下裂手术患儿71例临床资料，术前依据阴茎牵伸长度(SPL)将患儿分为轻度尿道下裂组(A组)和轻度尿道下裂合并小阴茎组(B组)。采集患儿催乳素、卵泡刺激素(FSH)、黄体生成素(LH)、孕酮、睾酮(TES)水平，采用多因素Logistic回归分析构建风险预测模型，采用受试者工作特征(ROC)曲线评价模型的区分度。术后6个月再次测量SPL并将患儿分为轻度尿道下裂术后阴茎正常组(AA组)和轻度尿道下裂术后小阴茎组(BB组)，再次采集性激素水平，采用多因素Logistic回归分析构建风险预测模型，并采用ROC曲线评价模型。结果:术前A组的FSH、LH、TES水平分别为3.28(2.02，4.46) IU/L、0.53(0.25，0.79) IU/L、25.24(17.94，36.67) ng/dL，B组的FSH、LH、TES水平分别为1.42(1.10，1.84) IU/L、0.14(0.09，0.23) IU/L、15.73(12.92，17.00) ng/dL，差异均有统计学意义(均 P\u003c0.05)。多因素Logistic回归分析显示有统计学意义( OR＝0.515，95% CI：0.271～0.977； OR＝0.035，95% CI：0.002～0.542； OR＝0.883，95% CI：0.796～0.980)，构建ROC曲线计算出ROC曲线下面积(AUC)＝0.906，敏感度为75.00%，特异度为95.74%。术后AA组的FSH、LH、TES水平分别为2.97(1.88，4.28) IU/L、0.46(0.23，0.78) IU/L、20.92(17.34，33.27) ng/dL，BB组的FSH、LH、TES水平分别为1.52(1.27，1.82) IU/L、0.17(0.12，0.26) IU/L、15.08(11.68，16.68) ng/dL，差异均有统计学意义(均 P\u003c0.05)。多因素Logistic回归分析显示有统计学意义( OR＝0.484，95% CI：0.236～0.992； OR＝0.061，95% CI：0.004～0.939； OR＝0.891，95% CI：0.795～0.999)，构建ROC曲线计算出AUC＝0.877，敏感度为94.12%，特异度为68.52%。 结论:FSH、LH和TES水平较低是轻度尿道下裂术后小阴茎的相关危险因素，且术前的激素水平更具有预测价值。","doi":"10.3760/cma.j.cn101070-20241120-00770","pmid":"","date":"2025","journal":"中华实用儿科临床杂志","authors":"王佳怡; 张海洋; 郭丽娟; 刘晖; 刘红霞; 贾茹; 刘亚凯; 苏丹; 宋翠萍","item_type":"journalArticle","volume":"40","issue":"8","pages":"619-624","issn":"2095-428X","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRc3lla2xjenoyMDI1MDgwMDkaCHJiNngyYTRh"},"EY9RX97X":{"key":"EY9RX97X","record_id":"R-EY9RX97X","title":"尿道下裂流行病学及其危险因素的研究现状","abstract":"尿道下裂居于常见的男性先天性生殖器畸形第2位,近20 ～ 40年,全世界范围发病率报道不一,其病因及发病机制尚不明确,且存在地理、区域及种族差异.目前绝大多数相关研究数据来自国外,国内尿道下裂流行病学及其危险因素的调查研究相对匮乏.本文就尿道下裂流行病学及其危险因素的研究现状做一综述,旨在为今后该领域的继续研究提供帮助.","doi":"10.3969/j.issn.1007-9572.2017.06.y38","pmid":"","date":"2017","journal":"中国全科医学","authors":"徐国顺; 倪建鑫; 薛庆; 于磊","item_type":"journalArticle","volume":"20","issue":"30","pages":"3827-3834","issn":"1007-9572","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemdxa3l4MjAxNzMwMDI1GghyYjZ4MmE0YQ%3D%3D"},"F8WG34NK":{"key":"F8WG34NK","record_id":"R-F8WG34NK","title":"机器学习评估尿道下裂肛门生殖器距、阴茎阴囊距对分型的预测","abstract":"目的采用常用的人体测量学指标对青春期前尿道下裂的解剖异常进行数据化描述, 探讨其对术后诊断分型进行预测的可行性。方法收集2021年4月至2022年9月四川省医学科学院·四川省人民医院初治的青春期前(Tanner I级)尿道下裂患儿的临床资料, 记录身高、体重、BMI、术前阴茎至阴囊边缘距离、肛殖距、双手指长比及术后尿道下裂分型。采用单因素方差分析各指标在不同分型间的差异, 利用受试者工作特征曲线单因素分析各指标在训练集中对尿道下裂分型的诊断预测价值, 并构建二分类和三分类logistic回归、随机森林和支持向量机探索机器学习方法评估人体测量学指标对尿道下裂分型的预测价值。结果共259例纳入研究, 其中远段型占13%(33/259), 中段型占46%(120/259), 近段型占41%(106/259)。在训练集中阴茎根部(6点钟)与阴囊边缘连线中点皮纹间距(posterior penoscrotal distance, PPSD)、阴茎自然下垂测量根部与双侧阴囊上缘连线中点皮纹间距(anterior penoscrotal distance, APSD)、肛门阴囊距2(anoscrotal distance 2, ASD2)、肛门阴茎后距2(anogenital distance 2, AGD2)、肛门阴茎前距1(anogenital distance 1, AGD1)等参数值诊断各类型的ROC曲线下面积均优于肛门阴囊距(anoscrotal distance, ASD), 其中AGD2最佳, 而双手指长比(2D∶4D)对各类型不具备诊断价值。在二分类logistic回归、随机森林、支持向量机模型在训练集中, 对远段型鉴别的灵敏度分别为15%, 7%, 11%, 对中段型鉴别的灵敏度分别为62%, 56%, 79%, 对近段型鉴别的灵敏度分别为69%, 64%, 68%。在验证集中, 对远段型鉴别的灵敏度分别为17%, 17%, 0%, 对中段型鉴别的灵敏度分别为61%, 55%, 64%, 对近段型鉴别的灵敏度分别为56%, 60%, 48%。在训练集中, 三分类随机森林和支持向量机的诊断准确率分别为62.56%和73.33%;在验证集中的准确率分别为57.81%和62.50%。在训练集和验证集中, 三分类的准确性主要源于模型对中段型和近段型的检测具有较高的敏感性。结论肛殖距、阴茎阴囊距对于中段型、近段型尿道下裂有较好的诊断预测价值, 其中AGD2具有较高的检验效能及稳定性, 可作为肛殖距测量首选指标纳入肛殖距测量。双手指长比(2D∶4D)对分型预测价值并不高。","doi":"10.3760/cma.j.cn421158-20230831-00307","pmid":"","date":"2024","journal":"中华小儿外科杂志","authors":"何姿蓉; 王学军; 杨博; 唐耘熳","item_type":"journalArticle","volume":"45","issue":"11","pages":"1024-1031","issn":"0253-3006","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORINeHJ3azIwMjQxMTAwNBoIcmI2eDJhNGE%3D"},"FDSWGKV8":{"key":"FDSWGKV8","record_id":"R-FDSWGKV8","title":"Exposure to endocrine disruptors and male urogenital tract malformations [cryptorchidism and hypospadias]","abstract":"Background: It has been proposed that the intrauterine period of child-mother exposure to hormonally active compounds (endocrine disruptors) is of critical importance.\n   Objective: We reviewed all Spanish and English-language epidemiological studies published between 1990 and the first trimester of 2006 that studied the possible association between human exposure to chemical compounds and the risk of cryptorchidism and/or hypospadias.\n   Methods: The MEDLINE (PubMed) database was searched using the following key words: endocrine disruptors, organochlorine pesticides, xenoestrogens, cryptorchidism and hypospadias. Selection of the 16 studies included was based on the following criteria: study design and population, the measures of exposure used, inclusion and exclusion criteria, and the statistical analysis used.\n   Results and conclusions: Although the studies reviewed do not conclusively confirm the association between exposure to endocrine disruptors; and the risk of male genital malformation, this association cannot be ruled out. Further in-depth investigation of this association is required. Issues that remain to be resolved are the diagnostic classification to be used and appropriate measurement of exposure to multiple chemical compounds and environmental contaminants that act conjointly through mechanisms similar to endogenous hormones.","doi":"10.1157/13112246","pmid":"","date":"2007","journal":"Gaceta Sanitaria","authors":"Fernández Cabrera M.F.; Olmos B.; Olea N.","item_type":"journalArticle","volume":"21","issue":"6","pages":"500-514","issn":"02139111 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/36248979151?origin=resultslist"},"FGHREGC8":{"key":"FGHREGC8","record_id":"R-FGHREGC8","title":"Analysis of Risk Factors for Glans Dehiscence After Tubularized Incised Plate Hypospadias Repair EDITORIAL COMMENT","abstract":"","doi":"10.1016/j.juro.2010.12.109","pmid":"","date":"2011 MAY","journal":"JOURNAL OF UROLOGY","authors":"Baskin LS","item_type":"journalArticle","volume":"185","issue":"5","pages":"1850-1850","issn":"0022-5347 1527-3792","isbn":"","url":""},"FI4QHMK8":{"key":"FI4QHMK8","record_id":"R-FI4QHMK8","title":"Bilateral male breast cancer with male potential hypogonadism.","abstract":"BACKGROUND: Male breast cancer is a comparatively rare disease, and simultaneous bilateral male breast cancer is considered to be an extremely rare event. Risk  factors are said to be genetic factors and hormonal abnormalities due to obesity  or testicular diseases. CASE PRESENTATION: The patient was a 47-year-old Japanese  male. His family had no history of female breast cancer. This patient also had  hypospadias and hormonal examination indicated the presence of primary testicular  potential hypogonadism, and these hormonal abnormalities seemed to be present  since childhood or the fetal period. The bilateral breast cancer developed in  this man at a comparatively young age, and histopathological studies of multiple  sections showed that there was almost no normal epithelial cell in the ducts,  while the ducts were almost completely filled with breast cancer cells.  CONCLUSION: It is thought that male breast cancer is caused by an imbalance  between estrogen and testosterone. We cannot rule out the possibility that the  breast cancer developed due to the effect of the slight elevation of estrogen  over a long period of time, but the actual causative factors in this patient were  unable to be definitively identified. In the future, we hope to further elucidate  the causes of male breast cancer.","doi":"10.1186/1477-7819-5-60","pmid":"","date":"2007","journal":"World Journal of Surgical Oncology","authors":"Hirose Yukiko; Sasa Mitsunori; Bando Yoshimi; Hirose Toshiyuki; Morimoto Tadaoki; Kurokawa Yasushi; Nagao Taeko; Tangoku Akira","item_type":"journalArticle","volume":"5","issue":"1","pages":"60","issn":"1477-7819","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDI1MDgxNTYwGghyYjZ4MmE0YQ%3D%3D"},"FJ2NR8X3":{"key":"FJ2NR8X3","record_id":"R-FJ2NR8X3","title":"环境颗粒物和尿道下裂相关性的临床研究：范围性综述","abstract":"目的:总结分析环境颗粒物和尿道下裂关系的相关研究，发现当前领域的不足，为进一步研究提供参考。方法:通过检索中国知网、万方医学网、中文科技期刊数据库、PubMed、Web of Science、Embase、Cochrane Library数据库，检索时间自1930年1月1日至2023年11月3日。筛选针对\"环境颗粒物和尿道下裂相关性\"开展的临床研究类文献并下载。采用范围性综述的研究方法，运用Microsoft Excel对文献的发表国家、发表时间、研究类型、颗粒物特征、颗粒物和尿道下裂的关系等信息进行整合分析。结果:本研究共检索到3 582篇文献，经过初筛和复筛后，最终纳入19篇文献(中国知网4篇，万方医学网3篇，PubMed 3篇，Web of Science 9篇，中文科技期刊数据库0篇，Embase 0篇，Cochrane Library数据库0篇)，其中发文量最多的国家是中国( n＝11)；2021年发文量最多(6篇)，占总文献量的31.6%(6/19)；共包括9项回顾性队列研究、9项病例对照研究(其中包含1项病例交叉研究)、1项横断面调查；19项研究中纳入的协变量包括产母资料(年龄、文化程度、种族、产次等)、孕期情况(受孕季节、孕期是否使用叶酸、孕期是否吸烟或饮酒等)、婴儿情况(出生缺陷类型)、社会经济指数、污染物、气象因素等。主要应用的统计学方法为Logistic回归，有4项研究利用了时间序列分析的方法。在纳入的19项研究中，可吸入颗粒物(particulate matter，PM)暴露窗口期多样，主要通过固定监测点收集数据，部分研究采用模型校正暴露物浓度；多地颗粒物浓度数据被报道，且多超出国家空气质量标准；部分研究分析发现季节和人类活动对PM浓度具有影响。4项研究报道了气象因素与大气污染物之间具有相关性。10项研究(包括6项回顾性队列研究、3项病例对照研究、1项横断面调查)关注空气污染和出生缺陷的相关性，仅将尿道下裂作为结局指标的一部分。9项研究(包括3项回顾性队列研究、6项病例对照研究)对环境颗粒物与尿道下裂的相关性进行了探讨，其中4项报告指出孕期PM 2.5的暴露和尿道下裂的发生有关，2项报告二者呈无意义正相关，2项报告二者呈零关联，1项报告二者呈无意义负相关。对不同研究中报道的PM浓度和尿道下裂发病率进行对比，发现PM浓度越高的地区尿道下裂的发病率越高。 结论:孕期颗粒物暴露会增加尿道下裂的发生风险，尤其在孕早期。即使在未对二者相关性进行探讨的研究中也可发现，颗粒物浓度越高，尿道下裂的发病率越高。未来还需进行更大样本的队列研究，纳入气象因素、尿道下裂分型、生物学指标等相关因素。","doi":"10.3760/cma.j.cn101785-202312064","pmid":"","date":"2026","journal":"临床小儿外科杂志","authors":"刘焱; 韩榕; 吴盛德","item_type":"journalArticle","volume":"25","issue":"1","pages":"43-48","issn":"1671-6353","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRbGN4ZXdrenoyMDI2MDEwMDkaCHJiNngyYTRh"},"FR7NEGFL":{"key":"FR7NEGFL","record_id":"R-FR7NEGFL","title":"Comprehensive analysis of tubularized incised-plate urethroplasty in primary and re-operative hypospadias","abstract":"OBJECTIVE: To retrospectively review our experience of the tubularized incised-plate (TIP) urethroplastv over the last 4 years. PATIENTS AND METHODS: From 1998 to December 2001, 133 patients (mean age 7 years, SD 4, range 1-22), had a TIP urethroplasty by one surgeon for primary (103) and re-operative (30) hypospadias; the defects included 106 (79%) distal and mid-shaft, and 27 (21%) posterior shaft. The neourethra was covered by a subcutaneous flap in 66 (50%) patients or by corpus spongiosa (spongioplasty) in 31 (23%), with no cover in the remaining 36 (27%). In the last 20 patients (15%) a modified meatoplasty was used; the site and size of the new meatus was predetermined on the glans around a suitable catheter before any incision. Urethral stents were not used after repair in 39 (29%) patients, and regular meatal dilation was used only in patients with voiding difficulty and obvious tendency to stenosis. The presence of complications requiring re-operation and overall general appearance were recorded. RESULTS: The mean (SD) follow-up was 10 (5) months; there were 24 complications in 20 patients (15%), including a small fistula in 12 (9%), complete disruption of the repair in 4 (3%), meatal stenosis in seven (5%) and neourethral stricture in one (0.8%). Complications were not significantly different between primary and re-operative cases, and unaffected by the use of the stents. On univariate analysis complications were significantly higher with running than interrupted sutures, in repairs in the first 2 years of the study, in patients with posterior hypospadias, and in those with no neourethral coverage. However, the last two factors were the only significant independent risk factors in a multivariate analysis. Regular urethral dilatation was indicated in 43 patients (32%). Modified meatoplasty was associated with a significantly lower requirement for regular dilatation (P \u003c 0.05) and no meatal stenosis. In the 113 complication-free patients the operation gave an excellent cosmetic appearance with a vertical slit meatus on the tip of conical glans in 110 (97%); there was slight meatal retraction in the remaining three patients. CONCLUSION: The TIP repair is a reliable method for treating both distal and proximal penile shaft hypospadias, is suitable for both primary and re-operative cases, and is more versatile than other repairs. Covering the neourethra with a flap or spongioplasty significantly improves the results. Regular urethral dilatation is required in a third of patients but modified meatoplasty obviates the need for regular dilatation and eliminates the risk of meatal stenosis.","doi":"10.1111/j.1464-410X.2004.04781.x","pmid":"","date":"2004","journal":"","authors":"El-Sherbiny M.T.; Hafez A.T.; Dawaba M.S.; Shorrab A.A.; Bazeed M.A.","item_type":"conferencePaper","volume":"93","issue":"7","pages":"1057-1061","issn":"","isbn":"14644096 (ISSN)","url":"https://www.scopus.com/pages/publications/2542596958?origin=resultslist"},"G6X2CNWJ":{"key":"G6X2CNWJ","record_id":"R-G6X2CNWJ","title":"Environmental antiandrogens: low doses of the fungicide vinclozolin alter sexual differentiation of the male rat","abstract":"In humans and rodents, exposure to antiandrogenic chemicals during sexual differentiation can produce malformations of the reproductive tract. Perinatal administration of 100 or 200 mg vinclozolin (V) kg(-1) day(-1) during sexual differentiation in rats induces female-like anogenital distance (AGD), retained nipples, cleft phallus with hypospadias, suprainguinal ectopic scrota/testes, a vaginal pouch, epididymal granulomas, and small to absent sex accessory glands in male offspring. Vinclozolin is metabolized to at least two active forms, M1 and M2, that display antiandrogenic activity by binding the androgen receptor (AR). Here, we present information on the reproductive effects of oral treatment with low dosage levels of V during sexual differentiation of the male rat. Vinclozolin was administered to the dam at 0, 3.125, 6.25, 12.5, 25, 50, or 100 mg kg(-1) day(-1) from gestational day 14 to postnatal day 3 (the period of fetal/neonatal testicular testosterone synthesis and sexual differentiation). At doses of 3.125 mg V kg(-1) and above, AGD was significantly reduced in newborn male offspring and the incidence of areolas was increased. These effects were associated with permanent alterations in other androgen-dependent tissues. Ventral prostate weight in one year old male offspring was reduced in all treatment groups (significant at 6.25, 25, 50, and 100 mg kg(-1) day(-1)), and permanent nipples were detected in males at 3.125 (1.4%), 6.25 (3.6%), 12.5 (3.9%), 25 (8.5%), 50 (91%), and 100 (100%) mg V kg(-1) day(-1). To date, permanent nipples have not been observed in a control male from any study in our laboratory. Vinclozolin treatment at 50 and 100 mg kg(-1) day(-1) induced reproductive tract malformations and reduced ejaculated sperm numbers and fertility. Even though all of the effects of V likely result from the same initial event (AR binding), the different endpoints displayed a wide variety of dose-response curves and ED50's. The dose-response data for several of the functional endpoints failed to display an obvious threshold. These data demonstrate that V produces subtle alterations in sexual differentiation of the external genitalia, ventral prostate, and nipple tissue in male rat offspring at dosage levels below the previously described no-observed-effect-level (NOEL). These effects occur at a dosage level an order of magnitude below that required to induce malformations and reduce fertility. Hence, multigenerational reproduction studies of antiandrogenic chemicals that were not conducted under the Environmental Protection Agency's new Harmonized Multigenerational Test Guidelines, which include endpoints sensitive to antiandrogens at low dosage levels, could yield a NOEL that is at least an order of magnitude too high.","doi":"10.1191/074823399678846646","pmid":"","date":"1999 JAN-MAR","journal":"TOXICOLOGY AND INDUSTRIAL HEALTH","authors":"Gray LE Jr; Ostby J; Monosson E; Kelce WR","item_type":"journalArticle","volume":"15","issue":"1-2","pages":"48-64","issn":"0748-2337 1477-0393","isbn":"","url":""},"G9F8D36E":{"key":"G9F8D36E","record_id":"R-G9F8D36E","title":"Editorial comment","abstract":"","doi":"10.1016/j.juro.2010.08.098","pmid":"","date":"2010","journal":"Journal of Urology","authors":"Afshar K.","item_type":"journalArticle","volume":"184","issue":"6","pages":"2515","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/78349307390?origin=resultslist"},"GLQDZICT":{"key":"GLQDZICT","record_id":"R-GLQDZICT","title":"Major birth defects in the Brazilian side of the triple border: A population-based cross-sectional study","abstract":"Background: Major birth defects increase the risk of fetal death and pediatric hospitalization, which also impact on healthcare costs. Sociodemographic factors can drastically affect reproductive health and be used to discriminate the exposure to hidden risk factors. Foz do Iguassu is a Brazilian city located in the triple-border region of Brazil / Paraguay / Argentina with high rates of birth defects. However no study aimed to verify factors associated with this incidence or preventive care is reported. The current work investigated the prevalence of major birth defects and its association with maternal sociodemographic factors in Foz do Iguassu. Methods: In this population-based cross-sectional study we used data of all live births occurred in Foz do Iguassu from 2012 to 2017. The associated sociodemographic variables such as maternal age, maternal education, maternal race, country of residence, maternal parity and onset of prenatal care were analyzed. Each major birth defect was described according to absolute and relative frequencies, Kruskal-Wallis and logistic regression models were used to evaluate variables associated with selected birth defects. Results: The most prevalent major birth defects were Cleft Lip and/or Palate (9.5/10,000), gastroschisis (6.93/10,000), spina bifida (5.53/10,000), hydrocephalus (5.53/10,000), hypospadias (4.55/10,000), Down syndrome (4.23/10,000), anencephaly (2.93/10,000), anorectal atresia / stenosis (1.95/10,000), undetermined sex (1.95/10,000), esophageal atresia / stenosis with or without fistula (1.63/10,000) and limb reduction defects (1.30/10,000). Maternal age was associated with gastroschisis and Down syndrome. Only maternal education up to 7 years was statistically associated with major birth defects considering all other sociodemographic variables. Conclusion: Cleft Lip and/or Palate and Gastroschisis prevalence were higher than those found in the literature. This findings may suggest a distinct epidemiological behavior regarding major birth defects in the region. The work opens new perspectives for birth defects risk factors in the triple-border. © 2020 The Author(s).","doi":"10.1186/s13690-020-00443-w","pmid":"","date":"2020","journal":"Archives of Public Health","authors":"De Souza S.; Nampo F.K.; Pestana C.R.","item_type":"journalArticle","volume":"78","issue":"1","pages":"1-7","issn":"07787367 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85088096883?origin=resultslist"},"GVFE8RTT":{"key":"GVFE8RTT","record_id":"R-GVFE8RTT","title":"Artificial intelligence chatbots vs. YPUC pediatric urologists: performance on a Campbell Walsh urology hypospadiology questionnaire","abstract":"Purpose: Artificial intelligence (AI) is increasingly used in medicine, with uncertain performance in highly specialized fields, like hypospadiology. This study aimed to compare the performance of AI platforms and pediatric urologists using a structured knowledge assessment.Methods: A 31-question multiple-choice questionnaire (12th edition of Campbell Walsh Urology) was completed by 23 members of the Young Pediatric Urologist Committee (YPUC) of the European Society for Paediatric Urology (ESPU), and by five AI models (ChatGPT 3.5, ChatGPT 4o, Gemini, Copilot, and Doubao). Scores were analyzed overall, by subgroups (FEAPU-certified (Fellow of the European Academy of Paediatric Urology, n=15), >35 years old (n=16), and self-declared hypospadiology experts (n=12)), and across four thematic categories : basics, clinical and paraclinical evaluation, initial management, and complications.Results: AI and human respondents showed comparable overall performance (67.7% vs. 61.2%, p=0.467). However, experienced subgroups outperformed their counterparts: FEAPU-certified vs. non-certified (61.3% vs. 53.2%, p=0.001), >35 vs. ≤35 years (61.3% vs. 54.8%, p=0.039), and self declared experts vs. non-experts (61.3% vs. 54.8%, p=0.039). AI performed better in Basics (83% vs. 67%, p=0.320), Initial management (71% vs. 57%, p=0.450), and Complications (64% vs. 55%, p=0.087), but underperformed significantly in Clinical and paraclinical evaluation (57% vs. 71%, p=0.003). The highly specialized nature of the topic limits generalizability to broader medical contexts.Conclusion: AI platforms achieved scores comparable to pediatric urologists in a structured questionnaire but fell short in domains requiring nuanced clinical reasoning. While AI shows potential as an educational-support tool, it does not replace expert human judgment in hypospadiology.","doi":"10.1007/s00345-025-06104-3","pmid":"","date":"2025","journal":"World journal of urology","authors":"Sébastien Faraj; Pauline Clermidi; Sabine Irtan; François-Xavier Madec","item_type":"journalArticle","volume":"43","issue":"","pages":"Article: 719","issn":"0724-4983","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDRlODk1NzIxNzg0OTE4ZWE2YzZjNWYzZGZmMjQ0N2EzGghyYjZ4MmE0YQ%3D%3D"},"GW8ATCGC":{"key":"GW8ATCGC","record_id":"R-GW8ATCGC","title":"The incidence of intersexuality in children with cryptorchidism and hypospadias: stratification based on gonadal palpability and meatal position.","abstract":"PURPOSE: The combined findings of cryptorchidism and hypospadias often indicate the existence of an intersex state. Testicular maldescent and incomplete  tubularization of the urethral plate occur in a spectrum with the severity of the  2 processes likely dependent on the degree of pathophysiology in the androgenic  hormonal axis. The incidence of intersexuality in children with undescended  testes, hypospadias and otherwise nonambiguous male genitalia has been reported  to be 27%. Although the likelihood of genotypic or gonadal ambiguity has  previously been associated with meatal position in this population, to our  knowledge our study is the first to evaluate the incidence of intersexuality  relative to whether the undescended testis is palpable or nonpalpable. MATERIALS  AND METHODS: The database at our hospital was searched for all cases of  undescended testes (2,105) and hypospadias (1,057) between 1982 and 1996.  Radiographic, histological and karyotypic data were compiled for all patients  presenting with both diagnoses. Gonadal palpability (palpable versus nonpalpable)  and meatal position (anterior versus mid versus posterior) were recorded and  correlated with the likelihood of identifying an intersex condition. Ten boys  with a diagnosis of undescended testes subsequent to inguinal hernial repair were  excluded from study. Patients with congenital adrenal hyperplasia or complete  testicular feminization were also excluded from study due to the clearly female  appearance of the external genitalia. Statistical significance was assessed using  Fisher's exact test. RESULTS: We identified 79 patients presenting with  undescended testes, hypospadias and a phallus that was believed to be a possible  penis. Intersex conditions were identified with nearly equal frequency in the 44  cases of unilateral (30%) and 35 of bilateral (32%) cryptorchidism. In the  unilateral undescended testes group patients with a nonpalpable testis were at  least 3-fold more likely to have an intersex condition than those with a palpable  undescended testis (50 versus 15%, p = 0.02). In the bilateral group patients  with 1 or more nonpalpable testes were also nearly 3-fold as likely to have an  intersex condition than those with bilateral palpable undescended gonads (47  versus 16%, p = 0.07). Meatal position was graded as anterior in 33% of cases,  mid in 25% and posterior in 41% with the more posterior location conferring a  significantly greater likelihood of an intersex condition (anterior 2 of 26, mid  1 of 20 and posterior 21 of 33). CONCLUSIONS: Gonadal palpability is an important  predictor of an intersex state in unilateral and bilateral cases of  cryptorchidism with hypospadias. Patients with an undescended testis that cannot  be palpated are significantly more likely to have an intersex condition than  those in whom the undescended testis may be palpated on physical examination. The  severity of hypospadias likewise has a strong positive correlation with an  intersex state.","doi":"10.1016/S0022-5347(01)68048-0","pmid":"","date":"1999","journal":"Journal of Urology","authors":"Kaefer M.; Diamond D.; Hendren W. H.; Vemulapalli S.; Bauer S. B.; Peters C. A.; Atala A.; Retik A. B.","item_type":"journalArticle","volume":"162","issue":"3 II","pages":"1003-1007","issn":"0022-5347","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L29434661&from=export"},"H5JE47A3":{"key":"H5JE47A3","record_id":"R-H5JE47A3","title":"Male reproductive organs are at risk from environmental hazards.","abstract":"Male reproductive disorders that are of interest from an environmental point of view include sexual dysfunction, infertility, cryptorchidism, hypospadias and testicular cancer. Several reports suggest declining sperm counts and increase of these reproductive disorders in some areas during some time periods past 50 years. Except for testicular cancer this evidence is circumstantial and needs cautious interpretation. However, the male germ line is one of the most sensitive tissues to the damaging effects of ionizing radiation, radiant heat and a number of known toxicants. So far occupational hazards are the best documented risk factors for impaired male reproductive function and include physical exposures (radiant heat, ionizing radiation, high frequency electromagnetic radiation), chemical exposures (some solvents as carbon disulfide and ethylene glycol ethers, some pesticides as dibromochloropropane, ethylendibromide and DDT/DDE, some heavy metals as inorganic lead and mercury) and work processes such as metal welding. Improved working conditions in affluent countries have dramatically decreased known hazardous workplace exposures, but millions of workers in less affluent countries are at risk from reproductive toxicants. New data show that environmental low-level exposure to biopersistent pollutants in the diet may pose a risk to people in all parts of the world. For other toxicants the evidence is only suggestive and further evaluation is needed before conclusions can be drawn. Whether compounds as phthalates, bisphenol A and boron that are present in a large number of industrial and consumer products entails a risk remains to be established. The same applies to psychosocial stressors and use of mobile phones. Finally, there are data indicating a particular vulnerability of the fetal testis to toxicants-for instance maternal tobacco smoking. Time has come where male reproductive toxicity should be addressed form entirely new angles including exposures very early in life.","doi":"10.1038/aja.2009.83","pmid":"","date":"2010","journal":"Asian journal of andrology","authors":"Jens Peter Bonde","item_type":"journalArticle","volume":"12","issue":"","pages":"152-6","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISElB1Yk1lZDAwMDAyMTY2ODk0MBoIcmI2eDJhNGE%3D"},"H7J76TDV":{"key":"H7J76TDV","record_id":"R-H7J76TDV","title":"Intrauterine growth restriction and hypospadias: is there a connection?","abstract":"Hypospadias is one of the most common congenital malformations of the genitourinary tract in males. It is an incomplete fusion of urethral folds early in fetal development and may be associated with other malformations of the genital tract. The etiology is poorly understood and may be hormonal, genetic, or environmental, but most often is idiopathic or multifactorial. Among many possible risk factors identified, of particular importance is low birth weight, which is defined in various ways in the literature. No mechanism has been identified for the association of low birth weight and hypospadias, but some authors propose placental insufficiency as a common inciting factor. Currently, there is no standardized approach for evaluating children with hypospadias in the setting of intrauterine growth restriction. We reviewed the available published literature on the association of hypospadias and growth restriction to determine whether it should be considered a separate entity within the category of disorders of sexual differentiation.","doi":"","pmid":"","date":"2014","journal":"International journal of pediatric endocrinology","authors":"Min-Jye Chen; Charles G Macias; Sheila K Gunn; Jennifer E Dietrich; David R Roth; Bruce J Schlomer; Lefkothea P Karaviti","item_type":"journalArticle","volume":"","issue":"Jan./Dec.","pages":"1-9","issn":"1687-9848","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDYyYTdlYzcyY2Q1Y2I1YWMzYTQwZDQ5NDk4NmEzMzE4GghyYjZ4MmE0YQ%3D%3D"},"HDACMAN2":{"key":"HDACMAN2","record_id":"R-HDACMAN2","title":"Glans dehiscence after severe hypospadias repair. Is it a real complication? Clues from a study in post-pubertal patients.","abstract":"Introduction: Glans dehiscence (GD) is reportedly a common complication after proximal hypospadias repairs. However, the need for surgical correction is controversial. The aim of this study was to assess awareness, risk factors, and outcome of GD in post-pubertal patients. The agreement with surgeon assessment was also evaluated. Methods: The design was retrospective. All consecutive patients treated for proximal hypospadias between 2000 and 2011 were included. The presence of GD was self-reported, and the participants could optionally upload a photograph for surgeon assessment. Cosmetic and functional outcomes were assessed by validated questionnaires (HOSE, PPPS, KINDL®, IIEF-5). Results were compared between patients with and without GD. Results: Of 219 patients, 34 (16%) participated. Fourteen of them (41%) self-reported GD. Eighteen patients (8%) also uploaded a photograph and, in ten of them (56%), the surgeon noted the presence of GD with poor agreement [k = − 0.444 (95 CI − 0.856 to − 0.033)] with patient report. Patients self-reporting GD had had more frequently a penile curvature at diagnosis (12/14 = 86%, p = 0.01), and had undergone a single-staged repair (100% vs. 65%, p = 0.03). No difference was found in cosmetic and functional outcomes. Results were similar also comparing groups with and without GD as assessed by the surgeon. Conclusion: GD was a common finding after severe hypospadias repair. It was more common in case of surgeon assessment with poor agreement between patients and surgeons. GD did not prove to have clear clinical implications. Therefore, in our opinion, surgical repair of GD should be recommended only on patients request. © 2023, The Author(s).","doi":"10.1007/s00383-023-05387-0","pmid":"36737577","date":"2023 Feb 3","journal":"Pediatric surgery international","authors":"Durante Ludovica; Ghidini Filippo; Panchieri Francesco; Bovolenta Eleonora; Bagnara Vincenzo; Esposito Ciro; Castagnetti Marco","item_type":"journalArticle","volume":"39","issue":"1","pages":"101","issn":"1437-9813 0179-0358","isbn":"","url":"https://www.scopus.com/pages/publications/85147458300?origin=resultslist"},"HHG8AZFB":{"key":"HHG8AZFB","record_id":"R-HHG8AZFB","title":"Risk factor analysis for urethral stricture after hypospadias repair requiring urethral plate transaction","abstract":"Objective To explore the risk factors of urethral stricture after urethroplasty for hypospadias and to seek a more appropriate surgical strategy. Methods Clinical data were retrospectively analyzed for 429 cases undergoing primary hypospadias repair with urethral plate transection from February 2008 to October 2017. The mean age was 2. 9 (0. 3-17. 5) years. The meatal location was penile-scrotal (n = 349, 81. 4%) and perineal (n = 80, 18. 6%). The operations were were performed by experienced (n = 340, 79. 3%) and novice surgeons (n = 89, 20. 7%). The surgical approaches included Duckett's procedure (n = 269, 62. 7%), staged flap urethroplasty (n = 98, 22.8%) and staged buccal mucosa tubularized tunnel urethroplasty (n = 62, 14. 5%). Results During a median follow-up period of 64 (14-125) months, there were urethral complications (n = 173, 40. 3%) and urethral stricture (n= 58, 13. 5%). Age, hypospadias type and surgical strategy varied widely among surgeons with different seniorities. Among less experienced surgeons, urethral stricture incidence rate was 23. 1 % during Duckett's procedure and 5. 6% during staged flap urethroplasty. As compared with Duckett's procedure, staged flap urethroplasty lowered the risk of urethral stricture (OR 0. 185, 95% CI 0. 038-0. 902, P\u003c0. 05). Among experienced surgeons, the incidence rate of urethral stricture was 10.1% during Duckett's procedure, 8. 1 % during staged flap urethroplasty and 24.6% during staged buccal mucosa tubularized tunnel urethroplasty. As compared with Duckett's procedure, staged buccal mucosa tubularized tunnel urethroplasty increased the risk of urethral stricture (OR 2. 726, 95% CI 1.185-6.268, P\u003c0. 05) and staged flap urethroplasty offered no obvious advantage. Within each group, age or hypospadias type was not related with the occurrence of urethral stricture. Conclusions For severe hypospadias with urethral plate transaction, surgical strategy should be based upon surgeon seniorities. Suitable for novice surgeons, staged flap urethroplasty offers no advantage for experienced operators. © 2019 Chinese Medical Journals Publishing House Co.Ltd. All rights reserved.","doi":"10.3760/cma.j.issn.0253-3006.2019.11.005","pmid":"","date":"2019","journal":"Chinese Journal of Pediatric Surgery","authors":"Ru W.; Xu Z.; Shen Y.; Wang H.; Zhu L.; Tang D.","item_type":"journalArticle","volume":"40","issue":"11","pages":"976-980","issn":"02533006 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85168676924?origin=resultslist"},"HKIHQPJS":{"key":"HKIHQPJS","record_id":"R-HKIHQPJS","title":"Administration of potentially antiandrogenic pesticides (procymidone, linuron, iprodione, chlozolinate, p,p'-DDE, and ketoconazole) and toxic substances  (dibutyl- and diethylhexyl phthalate, PCB 169, and ethane dimethane sulphonate)  during sexual differentiation produces diverse profiles of reproductive  malformations in the male rat.","abstract":"Antiandrogenic chemicals alter sexual differentiation by a variety of mechanisms, and as a consequence, they induce different profiles of effects. For example, in  utero treatment with the androgen receptor (AR) antagonist, flutamide, produces  ventral prostate agenesis and testicular nondescent, while in contrast,  finasteride, an inhibitor of 5 alpha-dihydrotestosterone (DHT) synthesis, rarely,  if ever, induces such malformations. In this regard, it was recently proposed  that dibutyl phthalate (DBP) alters reproductive development by a different  mechanism of action than flutamide or vinclozolin (V), which are AR antagonists,  because the male offsprings display an unusually high incidence of testicular and  epididymal alterations--effects rarely seen after in utero flutamide or V  treatment. In this study, we present original data describing the reproductive  effects of 10 known or suspected anti-androgens, including a Leydig cell toxicant  ethane dimethane sulphonate (EDS, 50 mg kg-1 day-1), linuron (L, 100 mg kg-1  day-1), p,p'-DDE (100 mg kg-1 day-1), ketoconazole (12-50 mg kg-1 day-1),  procymidone (P, 100 mg kg-1 day-1), chlozolinate (100 mg kg-1 day-1), iprodione  (100 mg kg-1 day-1), DBP (500 mg kg-1 day-1), diethylhexyl phthalate (DEHP, 750  mg kg-1 day-1), and polychlorinated biphenyl (PCB) congener no. 169 (single dose  of 1.8 mg kg-1). Our analysis indicates that the chemicals discussed here can be  clustered into three or four separate groups, based on the resulting profiles of  reproductive effects. Vinclozolin, P, and DDE, known AR ligands, produce similar  profiles of toxicity. However, p,p'-DDE is less potent in this regard. DBP and  DEHP produce a profile distinct from the above AR ligands. Male offsprings  display a higher incidence of epididymal and testicular lesions than generally  seen with flutamide, P, or V even at high dosage levels. Linuron treatment  induced a level of external effects consistent with its low affinity for AR  [reduced anogenital distance (AGD), retained nipples, and a low incidence of  hypospadias]. However, L treatment also induced an unanticipated degree of  malformed epididymides and testis atrophy. In fact, the profile of effects  induced by L was similar to that seen with DBP. These results suggest that L may  display several mechanisms of endocrine toxicity, one of which involves AR  binding. Chlozolinate and iprodione did not produce any signs of maternal or  fetal endocrine toxicity at 100 mg kg-1 day-1. EDS produced severe maternal  toxicity and a 45% reduction in size at birth, which resulted in the death of all  neonates by 5 days of age. However, EDS only reduced AGD in male pups by 15%.  Ketoconazole did not demasculinize or feminize males but rather displayed  anti-hormonal activities, apparently by inhibiting ovarian hormone synthesis,  which resulted in delayed delivery and whole litter loss. In summary, the above  in vivo data suggest that the chemicals we studied alter male sexual  differentiation via different mechanisms. The anti-androgens V, P, and p,p'-DDE  produce flutamide-like profiles that are distinct from those seen with DBP, DEHP,  and L. The effects of PCB 169 bear little resemblance to those of any known  anti-androgen. Only in depth in vitro studies will reveal the degree to which one  can rely upon in vivo studies, like those presented here, to predict the cellular  and molecular mechanisms of developmental toxicity.","doi":"10.1177/074823379901500109","pmid":"","date":"1999","journal":"Toxicology and Industrial Health","authors":"Wolf C. Jr; Lambright C.; Mann P.; Price M.; Cooper R. L.; Ostby J.; Gray L. E. Jr","item_type":"journalArticle","volume":"15","issue":"2","pages":"94-118","issn":"07482337 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0343090362?origin=resultslist"},"HPNNYDVL":{"key":"HPNNYDVL","record_id":"R-HPNNYDVL","title":"Long-Term Complications of Hypospadias Repair: A Ten-Year Experience from Northern Zone of Tanzania.","abstract":"Background: Hypospadias is one of the commonest congenital penile abnormalities in newborn males. The external urethral opening can be located anywhere from the glans penis along the ventral aspect of the shaft of the penis up to the scrotum or the perineum in extreme cases. The condition has a huge impact on the patient’s psychological, emotional and sexual well-being. Aim: To determine the proportion of patients who develop long-term complications after hypospadias repair and its associated risk factors. Methods: This was a hospital-based analytical cross-sectional study, conducted at KCMC Urology Institute from January 2009 to December 2018 and all children were followed up for 1-year post-operatively. A structural data sheet was used to collect information from patients’ files. Study parameters include age, location of hypospadias, surgical technique, surgeon experience, chordee, suture size, materials to assess the association with long-term complications. Results: A total of 254 patients were included in the study, the majority were aged more than 2 years (71.83%) with mean age at operation (SD) of 4.74 ± 2.99 years. Distal types were the most common type of hypospadias (125 patients; 50%), and 51 patients (20%) had severe chordee. Tubularized incised plate (TIP) repair was the most common technique (130 patients; 51.59%). The number of patients with long-term complications following hypos-padias repair was 156 (61.60%) and urethrocutaneous fistula(UCF) accounted for 40.5%. The surgeon’s experience, location of hypospadias, surgical technique and associated chordee were significant predictors of long-term complications of hypospadias repair. Conclusion: Tubularized incised plate urethroplasty is a safe and reliable method of hypospadias repair. Proximal hypospadias with severe chordee still remain a challenge. © 2020 Mohammed et al.","doi":"10.2147/RRU.S270248","pmid":"","date":"2020","journal":"Research and Reports in Urology","authors":"Mohammed Mbarouk; Bright Frank; Mteta Alfred; Mbwambo Jasper; Ngowi Bartholomeo Nicholaus; Mbwambo Orgeness; Yongolo Sidney; Mganga Andrew","item_type":"journalArticle","volume":"12","issue":"(Mohammed M., mbaroukmohd281@gmail.com; Bright F.; Mteta A.; Mbwambo J.; Ngowi B.N.; Mbwambo O.) Department of Urology, Faculty of Medicine, Kilimanjaro Christian Medical University College, Moshi, Tanzania","pages":"463-469","issn":"2253-2447","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2005203745&from=export"},"I5628FAW":{"key":"I5628FAW","record_id":"R-I5628FAW","title":"Analysis of the correlation between sex hormones and micropenis after mild hypospadias surgery in children","abstract":"Objective To analyze the correlation between sex hormone levels and micropenis after mild hypospadias surgery in children. Methods A case control study was carried out.The clinical data of 71 children aged 1 to 13 years who underwent mild hypospadias surgery at the First Affiliated Hospital of Xinxiang Medical University from April 2022 to April 2024 were analyzed.Preoperatively, the children were divided into a mild hypospadias group (Group A) and a mild hypospadias with micropenis group (Group B) based on the stretched penile length (SPL).Prolactin, follicle-stimulating hormone (FSH), luteinizing hormone (LH), progesterone, and testosterone (TES) levels of the 2 groups were measured.Multivariate Logistic regression analysis was used to construct a risk prediction model.The discrimination capability of the model was evaluated using the receiver operating characteristic (ROC) curve.SPL and sex hormone levels were measured again 6 months after surgery.The children were divided into a normal penile group (Group AA) and a micropenis group (Group BB) after mild hypospadias according to SPL.Multivariate Logistic regression analysis was used to construct a risk prediction model, which was evaluated using the ROC curve. Results The levels of FSH, LH and TES in group A before the operation were 3.28(2.02, 4.46) IU/L, 0.53(0.25, 0.79) IU/L and 25.24(17.94, 36.67) ng/dL, respectively, and those in group B were 1.42(1.10, 1.84) IU/L, 0.14(0.09, 0.23) IU/L and 15.73 (12.92, 17.00) ng/dL, respectively.The difference was all statistically significant (all P\u003c0.05).Multivariate Logistic regression analysis showed statistical significance (OR=0.515, 95%CI: 0.271-0.977; OR=0.035, 95%CI: 0.002-0.542; OR=0.883, 95%CI: 0.796-0.980).The area under the ROC curve (AUC) of the prediction model was 0.906, with a sensitivity of 75.00% and a specificity of 95.74%.The levels of FSH, LH and TES in the postoperative AA group were 2.97 (1.88, 4.28) IU/L, 0.46 (0.23, 0.78) IU/L and 20.92 (17.34, 33.27) ng/dL, respectively.The median levels of FSH, LH and TES in the BB group were 1.52 (1.27, 1.82) IU/L, 0.17 (0.12, 0.26) IU/L and 15.08(11.68, 16.68) ng/dL, respectively.The difference was all statistically significant (all P\u003c0.05).Multivariate Logistic regression analysis showed statistical significance (OR=0.484, 95%CI: 0.236-0.992; OR=0.061, 95%CI: 0.004-0.939; OR=0.891, 95%CI: 0.795-0.999).The AUC of the prediction model constructed was 0.877, with a sensitivity of 94.12% and a specificity of 68.52%. Conclusions Lower FSH, LH and TES levels are risk factors for the micropenis after mild hypospadias surgery, and preoperative hormone levels have higher predictive value. © 2025 Chinese Medical Association.","doi":"10.3760/cma.j.cn101070-20241120-00770","pmid":"","date":"2025","journal":"Chinese Journal of Applied Clinical Pediatrics","authors":"Wang J.; Zhang H.; Guo L.; Liu H.; Liu H.; Jia R.; Liu Y.; Su D.; Song C.","item_type":"journalArticle","volume":"40","issue":"8","pages":"619-624","issn":"2095428X (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/105012414979?origin=resultslist"},"I584ZN4D":{"key":"I584ZN4D","record_id":"R-I584ZN4D","title":"Hypospadias Risk from Maternal Residential Exposure to Heavy Metal Hazardous Air Pollutants.","abstract":"Objective: Investigate whether residential prenatal exposure to heavy metal hazardous air pollutants (HMHAPs) is associated with an increased risk of hypospadias. Methods: Data on non-syndromic hypospadias cases (n = 8981) and control patients delivered in Texas were obtained from the Texas Birth Defects Registry and matched 1:10 by birth year. Average exposure concentrations of HMHAPs were obtained from the 2005 U.S. Environmental Protection Agency National-Scale Air Toxics Assessment and categorized into quintiles. Odds ratios and 95% confidence intervals were estimated. STROBE reporting guidelines were followed. Results: We observed associations between hypospadias and prenatal HMHAP exposure. Manganese demonstrated significant increased risk of hypospadias at the medium, medium-high and high exposure quintiles; lead in the medium-high and high exposure quintiles. Cadmium, mercury and nickel demonstrated a significant inverted \"U-shaped\" association for exposures with significant associations in the medium and medium-high quintiles but not in the medium-low and high quintiles. Arsenic and chromium demonstrated a significant bivalent association for risk of hypospadias in a lower quintile as well as a higher quintile with non-significant intermediate quintiles. Conclusions: Using data from one of the world's largest active surveillance birth defects registries, we identified significant associations between hypospadias and HMHAP exposures. These results should be used in counseling for maternal demographic risk factors as well as avoidance of heavy metals and their sources.","doi":"10.3390/ijerph16060930","pmid":"","date":"2019","journal":"International journal of environmental research and public health","authors":"Jeffrey T White; Erin Kovar; Tiffany M Chambers; Kunj R Sheth; Erin C Peckham-Gregory; Marisol O'Neill; Peter H Langlois; Carolina J Jorgez; Philip J Lupo; Abhishek Seth","item_type":"journalArticle","volume":"16","issue":"6","pages":"","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISGlB1Ym1lZDIwMTkyMDE5MDYxODE0NDg1MTEzGghyYjZ4MmE0YQ%3D%3D"},"I9JMFGF2":{"key":"I9JMFGF2","record_id":"R-I9JMFGF2","title":"Exploiting gene-environment interaction to detect adverse health effects of environmental chemicals on the next generation","abstract":"There is increasing evidence from epidemiological studies that genetic susceptibilities may modify the teratogenic effects of toxic chemicals. However, in contrast to tobacco smoke, few epidemiological studies have addressed environmental chemicals, such as polychlorinated dibenzo-p-dioxins, polychlorinated dibenzofurans and polychlorinated biphenyls in regard to genetic susceptibility. Recent studies, including the Hokkaido Study of Environments and Children's Health, have investigated the impacts of both environmental and genetic factors on children's development. Several xenobiotic-metabolizing genes have been reported to confer genetic susceptibility to low birth weight. These genes seem to be influenced functionally by maternal smoking during pregnancy, itself a significant risk factor. In our study, we found that birth weight was significantly lower among infants born to smoking women having the specific AHR, CYP1A1, GSTM1, CYP2E1 and NQO1 genotypes. When combinations of these genotypes were considered, birth weight was even lower. On the other hand, congenital anomalies such as hypospadias seemed to be caused by environmental factors in conjunction with genetic predisposition as suggested by linkage in several case-control studies reported to low birth weight. We have found an association between maternal CYP1A1 genotype or low birth weight and the risk of hypospadias irrespective of smoking. At the same time, birth weight was negatively correlated with maternal blood concentrations of polychlorinated dibenzofurans. Further studies should elucidate the impact of genetic factors on adverse effects of exposures to dioxin-related chemicals. © 2008 The Authors.","doi":"10.1111/j.1742-7843.2007.00201.x","pmid":"","date":"2008","journal":"","authors":"Kishi R.; Sata F.; Yoshioka E.; Ban S.; Sasaki S.; Konishi K.; Washino N.","item_type":"conferencePaper","volume":"102","issue":"2","pages":"191-203","issn":"","isbn":"17427843 (ISSN)","url":"https://www.scopus.com/pages/publications/38449084560?origin=resultslist"},"IDK495TU":{"key":"IDK495TU","record_id":"R-IDK495TU","title":"Children's health and the environment: a new agenda for prevention research.","abstract":"Patterns of illness in American children have changed dramatically in this century. The ancient infectious diseases have largely been controlled. The major  diseases confronting children now are chronic and disabling conditions termed the  \"new pediatric morbidity\"--asthma mortality has doubled; leukemia and brain  cancer have increased in incidence; neurodevelopmental dysfunction is widespread;  hypospadias incidence has doubled. Chemical toxicants in the environment as well  as poverty, racism, and inequitable access to medical care are factors known and  suspected to contribute to causation of these pediatric diseases. Children are at  risk of exposure to over 15,000 high-production-volume synthetic chemicals,  nearly all of them developed in the past 50 years. These chemicals are used  widely in consumer products and are dispersed in the environment. More than half  are untested for toxicity. Children appear uniquely vulnerable to chemical  toxicants because of their disproportionately heavy exposures and their inherent  biological susceptibility. To prevent disease of environmental origin in  America's children, the Children's Environmental Health Network (CEHN) calls for  a comprehensive, national, child-centered agenda. This agenda must recognize  children's vulnerabilities to environmental toxicants. It must encompass a) a new  prevention-oriented research focus; b) a new child-centered paradigm for health  risk assessment and policy formulation; and c) a campaign to educate the public,  health professionals, and policy makers that environmental disease is caused by  preventable exposures and is therefore avoidable. To anchor the agenda, CEHN  calls for long-term, stable investment and for creation of a national network of  pediatric environmental health research and prevention centers.","doi":"10.1289/ehp.98106787","pmid":"9646038","date":"1998 Jun","journal":"Environmental health perspectives","authors":"Landrigan P. J.; Carlson J. E.; Bearer C. F.; Cranmer J. S.; Bullard R. D.; Etzel R. A.; Groopman J.; McLachlan J. A.; Perera F. P.; Reigart J. R.; Robison L.; Schell L.; Suk W. A.","item_type":"journalArticle","volume":"106 Suppl 3","issue":"Suppl 3","pages":"787-794","issn":"0091-6765","isbn":"","url":""},"IDX32KQD":{"key":"IDX32KQD","record_id":"R-IDX32KQD","title":"Prevalence of hypospadias in Italy according to severity, gestational age and birthweight: an epidemiological study.","abstract":"BACKGROUND: Hypospadias is a congenital displacement of the urethral meatus in male newborns, being either an isolated defect at birth or a sign of sexual  development disorders. The aim of this study was to assess the prevalence rate of  hypospadias in different Districts of Italy, in order to make a comparison with  other countries all over the world. METHODS: We reviewed all the newborns file  records (years 2001-2004) in 15 Italian Hospitals. RESULTS: We found an overall  hypospadias prevalence rate of 3.066 +/- 0.99 per 1000 live births (82.48% mild  hypospadias, 17.52% moderate-severe). In newborns Small for Gestational Age  (birthweight \u003c 10(th )percentile) of any gestational age the prevalence rate of  hypospadias was 6.25 per 1000 live births. Performing multivariate logistic  regression analysis for different degrees of hypospadias according to severity,  being born SGA remained the only risk factor for moderate-severe hypospadias (p =  0.00898) but not for mild forms (p > 0.1). CONCLUSION: In our sample the  prevalence of hypospadias results as high as reported in previous European and  American studies (3-4 per 1000 live births). Pathogenesis of isolated hypospadias  is multifactorial (genetic, endocrine and environmental factors): however, the  prevalence rate of hypospadias is higher in infants born small for gestational  age than in newborns with normal birth weight.","doi":"10.1186/1824-7288-35-18","pmid":"19558700","date":"2009 Jun 27","journal":"Italian journal of pediatrics","authors":"Ghirri Paolo; Scaramuzzo Rosa T.; Bertelloni Silvano; Pardi Daniela; Celandroni Amerigo; Cocchi Guido; Danieli Roberto; De Santis Luisa; Di Stefano Maria C.; Gerola Orietta; Giuffrè Mario; Gragnani Giuseppe S.; Magnani Cinzia; Meossi Cristiano; Merusi Ilaria; Sabatino Giuseppe; Tumini Stefano; Corsello Giovanni; Boldrini Antonio","item_type":"journalArticle","volume":"35","issue":"","pages":"18","issn":"1824-7288 1720-8424","isbn":"","url":""},"IFEH4W29":{"key":"IFEH4W29","record_id":"R-IFEH4W29","title":"Impact of three urethral stent types on outcomes following one-stage hypospadias repair: a multi-center retrospective controlled study.","abstract":"Purpose: To evaluate whether the double cannula urethral stents (DCUS) are superior to traditional silicone Foley catheters (FC) or gastric tubes (GT) in hypospadias repair to decrease complications. Patients and methods: This retrospective cohort study included 224 patients with hypospadias who underwent placement with DCUS (group DCUS), FC (group FC), and GT (group GT) after hypospadias repair between August 2019 and June 2023. The occurrence of early and late complications was assessed. The occurrence of complications in the three groups was compared, and the important contributing factors of urinary fistula and glans dehiscence were determined. Results: A total of 224 patients, 86 in FC, 59 in GT, and 79 in the DCUS group, met the inclusion criteria. Postoperative early complications in the DCUS group were significantly lower than those in the FC group (P = 0.002), but there was no significant difference between the GT and FC group (P = 0.390), or between the GT and DCUS group (P = 0.065). Postoperative late complications in the DCUS group were significantly lower than those in the FC group (P = 0.040), and there was no significant difference between the GT and FC group (P = 0.422), or between the GT and DCUS group (P = 0.325). Logistic regression showed that age (p = 0.030) and stent type (p = 0.048) were important risk factors for urethral fistula, while glans width (p = 0.016) was an important risk factor for glans dehiscence. Conclusions: DCUS reduced the occurrence of complications compare to FC and GT after hypospadias repair, offering practical value for clinical application. © The Author(s), under exclusive licence to Springer-Verlag GmbH Germany, part of Springer Nature 2025.","doi":"10.1007/s00345-025-05724-z","pmid":"","date":"2025","journal":"World journal of urology","authors":"Hualin Cao; Pin Li; Yuandong Tao; Xiaoyu Yi; Honghong Liu; Xiaoye Chen; Songbai Liao; Hongshuai Jia; Xiaowei Zhang; Xincheng Jiang; Weijing Ye; Huixia Zhou","item_type":"journalArticle","volume":"43","issue":"1","pages":"334","issn":"1433-8726","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L647495550&from=export"},"IFS5HTPT":{"key":"IFS5HTPT","record_id":"R-IFS5HTPT","title":"[Association between maternal peri-conceptional exposures and risk of hypospadias and cryptorchidism in offspring].","abstract":"Objective To investigate the relationship between maternal exposures to peri‑conceptional risk factors and the risk of hypospadias and cryptorchidism in offspring. Methods Pregnant women who delivered male newborns and participated in the China birth cohort study between February 2018 and December 2020 at the research center of Beijing Obstetrics and Gynecology Hospital, Capital Medical University were selected for the study. All were enrolled at 6‑13+6 weeks of their gestation. Baseline risk factor information was collected by questionnaire survey. Information on the outcome of hypospadias and cryptorchidism was obtained by clinical examination at birth and ultrasonography. Logistic regression was used to analyze the Odds Ratio (OR) and 95% Confidence Interval (95%CI) of each factor with respect to the onset of the outcome. Results A total of 15, 833 pregnant women with an average age of (31.81±3.84) years were included. Among their offsprings, 113 were diagnosed as hypospadias or cryptorchidism (42 hypospadias, 69 cryptorchidism, and 2 both hypospadias and crypterchidism), with an incidence of 7.14%0. The results of multivariate logistic regression analysis showed that mothers with pregnancy history of birth defects (OR=3.01, 95%CI: 1.09‑8.35), with preconception Hepatitis B infection (OR=4.74, 95%CI: 1.10‑20.42), fetal growth restriction (OR=4.02, 95%CI: 2.10‑7.68), multivitamin use since preconception (OR=1.98, 95%CI: 1.12‑3.52), and never cook and eat at home (OR=2.17, 95%CI: 1.23‑3.82) were risk factors for hypospadias and cryptorchidism (all P\u003c0.05). Conclusions Obesity in early pregnancy, preconception Hepatitis B infection, pregnancy history of birth defects, fetal growth restriction, multivitamin use before pregnancy, and rarely cook and eat at home were associated with an increased risk of hypospadias or cryptorchidism in their offsprings. © 2024 Chinese Medical Journals Publishing House Co.Ltd. All rights reserved.","doi":"10.3760/cma.j.cn112137-20231215-01387","pmid":"","date":"2024","journal":"National Medical Journal of China","authors":"Xie S. H.; Yue W. T.; Zhang E. J.; Gao S.; Su S. F.; Hao Y. X.; Zhang Y.; Liu J. H.; Yin C. H.; Liu R. X.","item_type":"journalArticle","volume":"104","issue":"26","pages":"2424-2430","issn":"03762491 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85198307643?origin=resultslist"},"IG4FDAEL":{"key":"IG4FDAEL","record_id":"R-IG4FDAEL","title":"Novel heterozygous mutation in Wilms tumor 1 gene in patient with mixed gonadal dysgenesis","abstract":"Disorders of sex development (DSD) have defined as congenital conditions in which the development of chromosomal, gonadal, or anatomical sex is atypical. Wilms tumor 1(WT1) gene mutations have been described in 46, XY patients with ambiguous genitalia or complete gonadal dysgenesis with or without Wilms tumor, nephropathy, gonadoblastoma and other defects e.g. cryptorchidism, hypospadias. Sex chromosome mosaicism is a major cause of DSD with a wide phenotypic variability. The phenotype is primarily dependent on the proportion of each cell line in the developing gonads. This study reports one year old infant, reared as a male, presented with ambiguous genitalia. According to clinical investigations of the gonadal phenotype, gonadal histopathology and the karyotype, our patient was clinically diagnosed to have mixed gonadal dysgenesis (MGD). Furthermore, pelvic ultrasonography showed moderate pelvicalyceal dilatation in the left kidney. Cytogenetics studies have detected two cell lines by karyotype analysis of blood lymphocytes 45, X[90]/46, X, idic(Y)(q11.2)[10]. FISH was also applied on gonadal cells and showed the same type of sex chromosome mosaicism, but with different distribution. Sequencing analysis of WT1 gene showed that the patient has a novel heterozygous missense mutation in exon 9. In silico functional studies predicted the pathogenicity of the mutation. This is the first study to report a mutation in WT1 in MGD patient. This study demonstrates the importance of WT1 in male sexual differentiation and kidney development.","doi":"10.1159/000501868","pmid":"","date":"2019","journal":"Hormone Research in Paediatrics","authors":"Hassan H.; Essawi M.; Mekkawy M.; Kamel A.; Mazen I.","item_type":"journalArticle","volume":"91","issue":"(Hassan H.; Essawi M.; Mekkawy M.; Kamel A.; Mazen I.) National Research Centre, Cairo, Egypt","pages":"602","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630603833&from=export"},"IKIL4Y76":{"key":"IKIL4Y76","record_id":"R-IKIL4Y76","title":"Urban-rural residence and birth defects prevalence in Texas: a phenome-wide association study.","abstract":"BACKGROUND: Some assessments indicate the prevalence of certain birth defects varies by urban-rural status. We evaluated associations between urban-rural  residence and a spectrum of birth defects, using a phenome-wide association study  approach in Texas, a state with large urban centers and expansive rural areas.  METHODS: Data for birth defects and livebirths during 1999-2015 were obtained  from the Texas Birth Defects Registry and the Center for Health Statistics.  Maternal residence was classified as urban or rural, and prevalence ratios (PR)  and 95% confidence intervals (CI) were calculated for any defect and 140 specific  defects by Poisson regression. RESULTS: Overall, birth defects were less frequent  in rural compared to urban counties (PR = 0.88, 95% CI: 0.87-0.89). Twelve  specific defects were less prevalent in rural counties, including ventricular  septal defects (VSDs; PR = 0.76, 95% CI: 0.73-0.79) and hypospadias (PR = 0.86,  95% CI: 0.82-0.89). For some birth defects, including VSDs, there was evidence of  decreasing prevalence with decreasing population size. CONCLUSIONS: In our large  population-based assessment, we demonstrated that several birth defects were less  prevalent in rural counties, suggesting that characteristics of urban settings  may be relevant to their etiologies, diagnosis, or surveillance. Further research  is needed to identify specific exposures underlying these associations. IMPACT:  There are few studies of birth defects prevalence in urban versus rural settings.  To address this, we investigated a comprehensive range of birth defects,  including several rare defects that have not been previously studied, in a large  and diverse population. We identified 12 structural birth defects that were less  prevalent in rural areas. Findings suggest possible differential exposures among  urban and rural women, and/or possible underdiagnosis of certain birth defects in  rural areas. Findings highlight the need for further study of geographically  referenced risk factors for birth defects, and of the completeness of birth  defects ascertainment in rural areas.","doi":"10.1038/s41390-021-01700-6","pmid":"","date":"2021","journal":"Pediatric Research","authors":"Benavides Elisa; Lupo Philip J.; Sosa Miranda; Whitworth Kristina W.; Canfield Mark A.; Langlois Peter H.; Schraw Jeremy M.","item_type":"journalArticle","volume":"91","issue":"6","pages":"1587-1594","issn":"0031-3998","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDI5NDI5MjAxGghyYjZ4MmE0YQ%3D%3D"},"IL9KW593":{"key":"IL9KW593","record_id":"R-IL9KW593","title":"Prevalence and surgical management of pubic hypertrophy in hypospadias patients: Results from a high-volume surgeon","abstract":"Aim of the study: Pubic hypertrophy (PH), defined as an abnormal and abundant round mass of fatty tissue located over the pubic symphysis that mimics the mons veneris, is frequently underestimated in hypospadias patients. We examined the prevalence of this condition, as well as the outcomes associated with its surgical treatment. Materials and Methods: Between Jan 2014 and Apr 2018, 266 patients were referred for hypospadias repair at our center. We treated all patients presenting PH with pubic lipectomy following precise steps. After penile degloving, we divided suspensory ligament releasing the skin and the Scarpa fascia from the body of the penis: such was made in order to get access to the suprapubic fat. The Scarpa fascia was carefully preserved in order to avoid any damage of the blood vessels and the nerves directed to the penile skin. The abundant fat was detached from the aponeurosis of the external oblique muscle and then resected. The procedure was completed with the fixation of the tunica albuginea to the periosteum of the symphysis pubis and with the fixation of the penile skin to the Buck's fascia (Fig). Urethroplasty was subsequently performed using tailored surgical techniques. Multivariable logistic regression (MLR) tested for predictors of PH. Finally, separate MLRs tested for predictors of fistula and any complications after pubic lipectomy. Results: Of 266 hypospadias patients, 100 (37.6%) presented PH and underwent pubic lipectomy. Overall, we found that patients with PH more frequently had proximal hypospadias (44 vs. 7.8%), disorders of sex development (10 vs. 0.6%), cryptorchidism (12 vs. 2.4%), and moderate (30°-60°) or severe (>60°) penile curvature (33 vs. 4.2%). In MLR, the location of urethral meatus (proximal, Odds ratio [OR]: 10.1, p \u003c 0.001) was the only significant predictor of PH. Finally, pubic lipectomy was not associated with increased risk of fistula (OR: 1.12, p = 0.7) or any complications (OR: 1.37, 95% CI: 0.64–2.88, p = 0.4) after multivariable adjustment. [Figure presented] Discussion: One out of 3 hypospadias patients, referred to our center, presented PH and received pubic lipectomy. This rate was higher in patients with proximal hypospadias suggesting a correlation between PH and severity of hypospadias. Noteworthy, pubic lipectomy was not associated with increased risk of fistula or any complications.","doi":"10.1016/S1569-9056(19)33573-0","pmid":"","date":"2019","journal":"European Urology, Supplements","authors":"Djinovic R.; Sekulovic S.; Spiridonescu B.; Pesic V.; Slavkovic M.; Salonia A.; Briganti A.; Montorsi F.; Bandini M.","item_type":"journalArticle","volume":"18","issue":"9","pages":"e3213","issn":"1878-1500","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2004021403&from=export"},"IMD6P7VS":{"key":"IMD6P7VS","record_id":"R-IMD6P7VS","title":"Cryptorchidism as part of the testicular dysgenesis syndrome: the environmental connection.","abstract":"Cryptorchidism is part of the testicular dysgenesis syndrome (TDS), which includes other male reproductive disorders such as hypospadias, testis cancer and reduced semen quality. These diseases appear to be linked by common pathogenic mechanisms, interfering with normal fetal testis development. Testis development and descent is dependent on androgens and thus on an intact hypothalamus-pituitary-gonadal axis. Although cryptorchidism occurs in rare syndromes and genetic disorders, in the majority of children the etiology remains open. Many maternal and fetal risk factors have been previously identified but recently, scientific focus has also been directed to environmen-tal hormone disrupting chemicals and lifestyle, as the prevalence of testis cancer and cryptorchidism has increased and semen quality decreased over few decades in several countries. Some persistent environmental chemicals, e.g. polychlorinated pesticides and polybrominated flame retardants, were associated with testicular maldescent and testis cancer. In addition, prenatal exposure to phthalates was negatively correlated to testosterone levels and anogenital distance as a measure of androgen effect in infant boys. Alcohol consumption and maternal smoking during pregnancy also appeared to be a risk factor for cryptorchidism. Thus, current evidence suggests that the development of the male reproductive tract may be susceptible to adverse effects of environmental hormone disrupters. Copyright © 2009 S. Karger AG, Basel.","doi":"10.1159/000207485","pmid":"","date":"2009","journal":"Endocrine Development","authors":"Main K. M.; Skakkebaek N. E.; Toppari J.","item_type":"journalArticle","volume":"14","issue":"(Main K.M., katharina.main@rh.regionh.dk; Skakkebæk N.E.) University Department of Growth and Reproduction, Rigshospitalet, Copenhagen, Denmark","pages":"167-173","issn":"1421-7082","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L355041723&from=export"},"IX6NUU33":{"key":"IX6NUU33","record_id":"R-IX6NUU33","title":"Risk factors affecting post-pubertal high serum follicle-stimulating hormone in patients with hypospadias.","abstract":"The factors affecting spermatogenesis in adulthood in patients with hypospadias (HS) are not clearly understood. In the present study, risk factors affecting post-pubertal high serum follicle-stimulating hormone (FSH) were evaluated in patients with HS.Among those with a history of HS surgery, patients in whom endocrinological evaluation regarding pituitary-gonadal axis was performed at 15 years of age or older between March 2004 and April 2018 were enrolled in the present study. High serum FSH was defined as greater than 10 mIU/ml. The severity of HS was divided int
