o mild and severe. Factors affecting the post-pubertal high serum FSH were estimated.Seventy-nine patients were included in the present study. The severity of HS was mild in 35 and severe in 44. History of undescended testis (UDT) was confirmed in 12. High serum FSH was detected in nine. On logistic regression model analysis, a history of UDT was the only significant factor for high serum FSH. The incidence of high serum FSH in patients with UDT was significantly higher than that in those without UDT (58.3% vs 7.5%, p A history of UDT was a significant factor for post-pubertal high serum FSH in patients with HS. Accordingly, the presence of UDT may be a marker for impaired spermatogenesis in patients with HS, especially in severe cases.","doi":"10.1007/s00345-019-02687-w","pmid":"","date":"2019","journal":"World journal of urology","authors":"Kimihiko Moriya; Michiko Nakamura; Masafumi Kon; Yoko Nishimura; Yukiko Kanno; Takeya Kitta; Nobuo Shinohara","item_type":"journalArticle","volume":"","issue":"","pages":"","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISGlB1Ym1lZDIwMTkyMDE5MDYxODEyODkwNzgwGghyYjZ4MmE0YQ%3D%3D"},"IXI2C7HC":{"key":"IXI2C7HC","record_id":"R-IXI2C7HC","title":"Prevalence and risk factors of testicular microlithiasis in patients with hypospadias: a retrospective study.","abstract":"BACKGROUND: It has been described that the incidence of testicular microlithiasis is high in several congenital disorders which may be associated with testicular  impairment and infertility. Several reports have shown that a prepubertal or  pubertal hormonal abnormality in the pituitary-gonadal axis was identified in  some patients with hypospadias that is one of the most common disorders of sex  development. However, exact prevalence or risk factors of testicular  microlithiasis in patients with hypospadias have not reported so far. In the  present study, to clarify the prevalence and risk factors of testicular  microlithiasis in patients with hypospadias, a retrospective chart review was  performed. METHODS: Children with hypospadias who underwent testicular  ultrasonography between January 2010 and April 2016 were enrolled in the present  study. Severity of hypospadias was divided into mild and severe. The prevalence  and risk factors of testicular microlithiasis or classic testicular  microlithiasis were examined. RESULTS: Of 121 children, mild and severe  hypospadias were identified in 66 and 55, respectively. Sixteen children had  undescended testis. Median age at ultrasonography evaluation was 1.7 years old.  Testicular microlithiasis and classic testicular microlithiasis were documented  in 17 children (14.0%) and 8 (6.6%), respectively. Logistic regression analysis  revealed that presence of undescended testis was only a significant factor for  testicular microlithiasis and classic testicular microlithiasis. The prevalence  of testicular microlithiasis or classic testicular microlithiasis was  significantly higher in children with undescended testis compared to those  without undescended testis (testicular microlithiasis; 43.8% versus 9.5%  (p = 0.002), classic testicular microlithiasis; 37.5% versus 1.9% (p \u003c 0.001).  CONCLUSIONS: The current study demonstrated that the presence of undescended  testis was only a significant risk factor for testicular microlithiasis or  classic testicular microlithiasis in patients with hypospadias. As co-existing  undescended testis has been reported as a risk factor for testicular dysfunction  among patients with hypospadias, the current findings suggest that testicular  microlithiasis in children with hypospadias may be associated with impaired  testicular function. Conversely, patients with isolated HS seem to have lower  risks for testicular impairment. Further investigation with longer follow-up will  be needed to clarify these findings.","doi":"10.1186/s12887-018-1151-6","pmid":"29843681","date":"2018 May 29","journal":"BMC pediatrics","authors":"Nakamura Michiko; Moriya Kimihiko; Nishimura Yoko; Nishida Mutsumi; Kudo Yusuke; Kanno Yukiko; Kitta Takeya; Kon Masafumi; Shinohara Nobuo","item_type":"journalArticle","volume":"18","issue":"1","pages":"179","issn":"1471-2431","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L622334304&from=export"},"IYTDS8P6":{"key":"IYTDS8P6","record_id":"R-IYTDS8P6","title":"Teratogenic Effects of Antiepileptic Drugs: Implications for the Management of Epilepsy in Women of Childbearing Age","abstract":"Summary:  Exposure to antiepileptic drug (AED) treatment in utero occurs in 1 of every 250 newborns. The absolute risk of major malformations in these infants is about 7–10%, ˜3–5% higher than in the general population. Specific risk factors include high maternal daily dosage or serum concentrations of AED, low folate levels, polytherapy, and generalized seizures during pregnancy. Adverse pregnancy outcomes, including congenital heart malformations, facial clefts, spina bifida aperta, hypospadias, growth retardation, and psychomotor and mental retardation, are associated with, although not necessarily caused by, AED exposure. Specific cognitive defects, hypertelorism, and nail hypoplasia can be causally related to specific AED exposures. To prevent teratogenic side effects, the prospective mother should be treated with AEDs only when absolutely necessary. Monotherapy with the AED that is most effective in the lowest possible daily dose (divided into at least two or three administrations) should be prescribed. High‐dose folate supplementation (4–5 mg/day) reduces the risk of a neural tube defect in a child whose sibling had such a defect, but its impact on the specific teratogenic risks of AEDs is unknown. A substantial proportion of fetal malformations may be secondarily prevented by prenatal diagnosis, consisting of a fetal structural ultrasound examination at weeks 18 and 20 of gestation and, with VPA or CBZ administration, an α1‐fetoprotein analysis of amniotic fluid at week 16. Determination of a specific defect prevention strategy depends largely on parental attitudes toward prenatal diagnosis and termination of pregnancy, which should be discussed before conception. The availability of many new AEDs, many of which will be used in polytherapy, will make prospective evaluation of large numbers of pregnancy outcome on a population basis even more important in the future. Copyright © 1994, Wiley Blackwell. All rights reserved","doi":"10.1111/j.1528-1157.1994.tb05952.x","pmid":"","date":"1994","journal":"Epilepsia","authors":"Lindhout D.; Omtzigt J.G.C.","item_type":"journalArticle","volume":"35","issue":"","pages":"S19-S28","issn":"00139580 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0028296107?origin=resultslist"},"J49667R6":{"key":"J49667R6","record_id":"R-J49667R6","title":"Meeting report: Moving upstream - Evaluating adverse upstream end points for improved risk assessment and decision-making","abstract":"Background: Assessing adverse effects from environmental chemical exposure is integral to public health policies. Toxicology assays identifying early biological changes from chemical exposure are increasing our ability to evaluate links between early biological disturbances and subsequent overt downstream effects. A workshop was held to consider how the resulting data inform consideration of an \"adverse effect\" in the context of hazard identification and risk assessment. Objectives: Our objective here is to review what is known about the relationships between chemical exposure, early biological effects (upstream events), and later overt effects (downstream events) through three case studies (thyroid hormone disruption, antiandrogen effects, immune system disruption) and to consider how to evaluate hazard and risk when early biological effect data are available. Discussion: Each case study presents data on the toxicity pathways linking early biological perturbations with downstream overt effects. Case studies also emphasize several factors that can influence risk of overt disease as a result from early biological perturbations, including background chemical exposures, underlying individual biological processes, and disease susceptibility. Certain effects resulting from exposure during periods of sensitivity may be irreversible. A chemical can act through multiple modes of action, resulting in similar or different overt effects. Conclusions: For certain classes of early perturbations, sufficient information on the disease process is known, so hazard and quantitative risk assessment can proceed using information on upstream biological perturbations. Upstream data will support improved approaches for considering developmental stage, background exposures, disease status, and other factors important to assessing hazard and risk for the whole population.","doi":"10.1289/ehp.11516","pmid":"","date":"2008","journal":"","authors":"Woodruff T.J.; Zeise L.; Axeirad D.A.; Guyton K.Z.; Janssen S.; Miller M.; Miller G.G.; Schwartz J.M.; Alexeeff G.; Anderson H.; Birnbaum L.; Bois F.; Cogliano V.J.; Crofton K.; Euling S.Y.; Foster P.M.D.; Germolec D.R.; Gray E.; Hattis D.B.; Kyle A.D.; Luebke R.W.; Luster M.I.; Portier C.; Rice D.C.; Solomon G.; Vandenberg J.; Zoeller R.T.","item_type":"conferencePaper","volume":"116","issue":"11","pages":"1568-1575","issn":"","isbn":"15529924 (ISSN)","url":"https://www.scopus.com/pages/publications/58849107587?origin=resultslist"},"J5KDLCNG":{"key":"J5KDLCNG","record_id":"R-J5KDLCNG","title":"FOXP1 Haploinsufficiency Contributes to the Development of Congenital Diaphragmatic Hernia","abstract":"FOXP1 encodes a transcription factor involved in tissue regulation and cell-type-specific functions. Haploinsufficiency of FOXP1 is associated with a neurodevelopmental disorder: autosomal dominant mental retardation with language impairment with or without autistic features. More recently, heterozygous FOXP1 variants have also been shown to cause a variety of structural birth defects including central nervous system (CNS) anomalies, congenital heart defects, congenital anomalies of the kidney and urinary tract, cryptorchidism, and hypospadias. In this report, we present a previously unpublished case of an individual with congenital diaphragmatic hernia (CDH) who carries an approximately 3.8 Mb deletion. Based on this deletion, and deletions previously reported in two other individuals with CDH, we define a CDH critical region on chromosome 3p13 that includes FOXP1 and four other protein-coding genes. We also provide detailed clinical descriptions of two previously reported individuals with CDH who carry de novo, pathogenic variants in FOXP1 that are predicted to trigger nonsense-mediated mRNA decay. A subset of individuals with putatively deleterious FOXP4 variants has also been shown to develop CDH. Since FOXP proteins function as homo- or heterodimers and the homologs of FOXP1 and FOXP4 are expressed at the same time points in the embryonic mouse diaphragm, they may function together as a dimer, or in parallel as homodimers, to regulate gene expression during diaphragm development. Not all individuals with heterozygous, loss-of-function changes in FOXP1 develop CDH. Hence, we conclude that FOXP1 acts as a susceptibility factor that contributes to the development of CDH in conjunction with other genetic, epigenetic, environmental, and/or stochastic factors.","doi":"10.1055/s-0043-1767731","pmid":"","date":"2021","journal":"Journal of Pediatric Genetics","authors":"Pendleton K.E.; Hernandez-Garcia A.; Lyu J.M.; Campbell I.M.; Shaw C.A.; Vogt J.; High F.A.; Donahoe P.K.; Chung W.K.; Scott D.A.","item_type":"journalArticle","volume":"13","issue":"1","pages":"29-34","issn":"2146-460X","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2024792861&from=export"},"JD6RPCAG":{"key":"JD6RPCAG","record_id":"R-JD6RPCAG","title":"Lethality of Birth Defects in Live Born Infants Categorized by Gestational Age and Birth Weight","abstract":"Objective  This study aimed to describe lethality of birth defects (BDs) in newborns categorized by gestational age and birth weight and to identify BDs associated with prematurity. Study Design  Live born infants (n = 16,452) with isolated BDs classified by severity, and 42,511 healthy controls were assigned to categories: adequate growth, preterm, or small for gestational age (SGA). Proportion of cases and BDs' lethality rates were obtained by category and compared with controls. Results  Overall fewer malformed than nonmalformed infants were of adequate growth, while the opposite occurred in the preterm and SGA categories where gastroschisis and esophageal atresia were among the most outstanding defects. For most severe BDs, the early neonatal death rate was higher than control values in all categories; for mild defects, except cleft lip in the preterm category, they did not differ. Diaphragmatic hernia showed the highest lethality values, while those of spina bifida were among the lowest. Talipes, hypospadias, and septal heart defects were mild defects significantly associated with prematurity. Conclusion  Although reasons, such as induced preterm delivery of fetuses with certain anomalies, could partially account for their high prematurity rates, susceptibility to preterm birth might exist through underlying mechanisms related with the defects. The identification of BDs associated with prematurity should serve to improve measures that prevent preterm birth especially of fetuses at risk. Key Points Some BDs predispose to prematurity. Prematurity is an additional risk factor for mortality in infants with mild defects. Lethality values should be adjusted by gestational age and birth weight. © 2021 Thieme Medical Publishers, Inc.. All rights reserved.","doi":"10.1055/s-0041-1735867","pmid":"","date":"2021","journal":"American Journal of Perinatology","authors":"Rittler M.; Campaña H.; Heisecke S.; Ratowiecki J.; Elias D.; Gimenez L.; Poletta F.A.; Gili J.; Pawluk M.; Santos M.R.; Uranga R.; Cosentino V.; Lopez Camelo J.","item_type":"journalArticle","volume":"40","issue":"13","pages":"1406-1412","issn":"07351631 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85117241495?origin=resultslist"},"JHKVCQN7":{"key":"JHKVCQN7","record_id":"R-JHKVCQN7","title":"Quality of information on hypospadias from artificial intelligence chatbots: are artificial intelligence large language models effective tools for patient-centred care?","abstract":"","doi":"","pmid":"","date":"2026 FEB","journal":"BJU INTERNATIONAL","authors":"Santucci J; Stapleton P; Thet M; Lawrentschuk N; Dodds L; Cundy T; Sathianathen N","item_type":"journalArticle","volume":"137","issue":"","pages":"","issn":"1464-4096 1464-410X","isbn":"","url":""},"JQKNRBBZ":{"key":"JQKNRBBZ","record_id":"R-JQKNRBBZ","title":"Impact of urethroplasty on erectile function: A retrospective multicenter analysis of the international index of erectile function score changes across different etiologies of urethral stricture","abstract":"Introduction & Objectives: Urethral stricture disease, characterized by urethral narrowing due to fibrotic scarring, affects both urinary and sexual health. While urethroplasty is the standard treatment method, its impact on erectile function is not yet fully investigated. This study examines changes in International Index of Erectile Function (IIEF) scores following urethroplasty across various stricture etiologies, identifies predictors of erectile function outcomes, and evaluates recovery patterns after surgery. Materials & Methods: This multicenter retrospective study analyzed 103 patients who underwent urethroplasty between 2017 and 2023. Preoperative and postoperative IIEF scores were assessed at 3 months and at either 6 or 12 months post-surgery. Stricture etiologies included pelvic fracture urethral injury, transurethral resection, catheterization, idiopathic causes, and hypospadias. The Wilcoxon signed-rank test and multivariate regression models were employed to evaluate changes in IIEF scores and to identify significant predictors. Results: Preoperative erectile function and patient age were significant predictors of postoperative outcomes, with younger patients and those with higher baseline IIEF scores demonstrating improved erectile function after surgery. Long-term outcomes (6 to 12 months) were notably poorer in patients with strictures involving both the penile and bulbar regions. Multivariate analysis indicated that higher preoperative IIEF scores and younger age were associated with better short-term (R2 = 0.562) and long-term outcomes (R2 = 0.507). Additionally, diabetes was linked to poorer erectile function outcomes at 3 months post-surgery. Conclusions: Patients who are younger and have higher baseline IIEF scores tend to experience more favorable erectile function outcomes after urethroplasty. However, complex strictures involving both the penile and bulbar regions negatively impact long-term results. Furthermore, diabetes is associated with reduced erectile function in the early postoperative period.","doi":"10.1016/S0302-2838(25)00085-5","pmid":"","date":"2025","journal":"European Urology","authors":"Frankiewicz M.; Bialek T.; Rydzinska M.; Skrzypczyk M.; Peksa R.; Folwarski M.; Kaftan A.; Kaluzny A.; Matuszewski M.","item_type":"journalArticle","volume":"87","issue":"(Frankiewicz M.; Kaftan A.; Kaluzny A.; Matuszewski M.) Medical University of Gdansk, Dept. of Urology, Gdansk, Poland","pages":"369-369","issn":"1873-7560","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2039699108&from=export"},"JRYZVFU4":{"key":"JRYZVFU4","record_id":"R-JRYZVFU4","title":"Testicular dysgenesis syndrome and the development and occurrence of male reproductive disorders","abstract":"Patients with 45,X0/46XY karyotype often present with intersex phenotype and testicular dysgenesis. These patients may also have undescended testes (cryptorchidism), hypospadias and their spermatogenesis is severely disrupted. They have a high risk for testicular cancer. These patients have the most severe form of testicular dysgenesis syndrome (TDS). We have hypothesized that testicular cancer, cryptorchidism, hypospadias and poor spermatogenesis are all signs of a developmental disturbance that was named as testicular dysgenesis syndrome. The hypothesis is based on clinical and epidemiological findings and on biological and experimental evidence. Signs of TDS share several risk factors, such as small birth weight (particularly being small for gestational age), and they are risk factors for each other. All of them have background in fetal development. They show strong epidemiological links so that countries with high incidence of testicular cancer, such as Denmark, tend to also have high prevalence rates of cryptorchidism and hypospadias and poor semen quality. Vice versa, in countries with good male reproductive health, e.g., in Finland, all these aspects are better than in Denmark. Although genetic abnormalities can cause these disorders, in the majority of cases, the reasons remain unclear. Adverse trends in the incidence of male reproductive disorders suggest that environmental and life style factors contribute to the problem. Endocrine disrupters are considered as prime candidates for environmental influence. Fetal exposure to high doses of dibutyl phthalate was shown to cause a TDS-like phenotype in the rats. Studies are underway to assess whether there is any exposure-outcome relation with selected chemicals (persistent organic pollutants, pesticides, phthalates) and cryptorchidism. © 2005 Elsevier Inc. All rights reserved.","doi":"10.1016/j.taap.2005.01.058","pmid":"","date":"2005","journal":"","authors":"Virtanen H.E.; Rajpert-De Meyts E.; Main K.M.; Skakkebaek N.E.; Toppari J.","item_type":"conferencePaper","volume":"207","issue":"2 SUPPL.","pages":"501-505","issn":"","isbn":"0041008X (ISSN)","url":"https://www.scopus.com/pages/publications/24644470659?origin=resultslist"},"JTZLA54Q":{"key":"JTZLA54Q","record_id":"R-JTZLA54Q","title":"Association between SNP12 in estrogen receptor a gene and hypospadias: a systematic review and meta-analysis","abstract":"To investigate the association between single nucleotide polymorphism 12 in estrogen receptor a gene and hypospadias, four databases (PubMed, Web of Science, Embase and Cochrane Library) were electronically searched by 2nd November 2015. Finally, four studies were included for our meta-analysis, involving 1379 cases and 1648 controls. A quality assessment was performed using the Newcastle-Ottawa Scale of case-control study. Meta-analysis and publication bias measuring were all done by Stata 12.0. No significant publication bias (P-Begg = 0.296, P-Egger = 0.161) was found. Overall, there was statistically significant association for recessive genetic model (AA vs. GA + GG: OR 3.45, 95 % CI [1.89, 6.30], P = 0.038). Moreover, the positive result was confirmed using trial sequential analysis even only three original studies. For allele model, there was also statistically significant association (allele A vs. G: OR 1.43, 95 % CI [1.23, 1.67], P = 0.034). Meanwhile, A allele as a risk factor turned out to be true positive by trial sequential analysis. In a word, this meta-analysis suggested that the single nucleotide polymorphism 12 definitely increase the risk of hypospadias.","doi":"10.1186/s40064-016-2288-0","pmid":"","date":"2016 MAY 11","journal":"SPRINGERPLUS","authors":"Deng CK; Dai R; Li XL; Liu F","item_type":"journalArticle","volume":"5","issue":"","pages":"","issn":"2193-1801","isbn":"","url":""},"JYI23QDD":{"key":"JYI23QDD","record_id":"R-JYI23QDD","title":"Combined exposure to endocrine disrupting pesticides impairs parturition, causes pup mortality and affects sexual differentiation in rats","abstract":"Risk assessment is currently based on the no observed adverse effect levels (NOAELs) for single compounds. Humans are exposed to a mixture of chemicals and recent studies in our laboratory have shown that combined exposure to endocrine disrupters can cause adverse effects on male sexual development, even though the doses of the single compounds are below their individual NOAELs for anti-androgenic effects. Consequently, we have initiated a large project where the purpose is to study mixture effects of endocrine disrupting pesticides at low doses. In the initial range-finding mixture studies, rats were gavaged during gestation and lactation with five doses of a mixture of the fungicides procymidone, mancozeb, epoxyconazole, tebuconazole and prochloraz. The mixture ratio was chosen according to the doses of each individual pesticide that produced no observable effects on pregnancy length and pup survival in our laboratory and the dose levels used ranged from 25 to 100% of this mixture. All dose levels caused increased gestation length and dose levels above 25% caused impaired parturition leading to markedly decreased number of live born offspring and high pup perinatal mortality. The sexual differentiation of the pups was affected at 25% and higher as anogenital distance was affected in both male and female offspring at birth and the male offspring exhibited malformations of the genital tubercle, increased nipple retention, and decreased prostate and epididymis weights at pup day 13. The results show that doses of endocrine disrupting pesticides, which appear to induce no effects on gestation length, parturition and pup mortality when judged on their own, induced marked adverse effects on these endpoints in concert with other pesticides. In addition, the sexual differentiation of the offspring was affected. This as well as the predictability of the combination effects based on dose-additivity modelling will be studied further in a large dose-response study. © 2010 European Academy of Andrology.","doi":"10.1111/j.1365-2605.2009.01046.x","pmid":"","date":"2010","journal":"International Journal of Andrology","authors":"Jacobsen P.R.; Christiansen S.; Boberg J.; Nellemann C.; Hass U.","item_type":"journalArticle","volume":"33","issue":"2","pages":"434-442","issn":"1365-2605","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L358484161&from=export"},"JZ4KQS3C":{"key":"JZ4KQS3C","record_id":"R-JZ4KQS3C","title":"Psychosocial adjustment, health-related quality of life, and psychosexual development of boys with hypospadias: a systematic review.","abstract":"Objective: A systematic review of studies on psychosocial adjustment, HRQoL (health-related quality of life), and psychosexual development of boys with hypospadias. Methods: Research was conducted on several online bibliographic databases. Articles were selected on the basis of predefined criteria. Methodological quality was assessed by two independent reviewers who applied a standardized checklist. When possible, data analyses were performed by calculating effect sizes. Results: Thirteen studies met the criteria for inclusion, whose methodological standard ranged from low to high quality. None of them has focused on HRQoL. Findings with regard to psychosocial and psychosexual adjustment were inconsistent, though they clearly showed that boys with hypospadias suffer from negative genital appraisal and sexual inhibitions. Overall, medical factors exerted a rather small influence. Psychosocial risk factors have hardly been examined so far. Conclusions: The identification of psychosocial risk factors in methodologically sound studies is necessary to guarantee a comprehensive treatment for boys with hypospadias. © The Author 2007.","doi":"10.1093/jpepsy/jsm098","pmid":"","date":"2008","journal":"Journal of Pediatric Psychology","authors":"Schönbucher Verena B.; Weber Daniel M.; Landolt Markus A.","item_type":"journalArticle","volume":"33","issue":"5","pages":"520-535","issn":"1465735X (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/48649083377?origin=resultslist"},"K5QR6PY5":{"key":"K5QR6PY5","record_id":"R-K5QR6PY5","title":"Leydig Cell Hypoplasia as a Cause of 46,XY Difference of Sexual Development","abstract":"Objectives Describe the presentation of an infant with Leydig Cell Hypoplasia Methods A case report Results Patient was born term to a G1P1 mother. Free-cell DNA testing performed early in gestation showed 46,XY; however, subsequent fetal ultrasound imaging demonstrated female appearance of external genitalia. Additional fetal genetic testing by amniocentesis showed heterozygous, likely pathogenic, biallelic variants in the LHGCR gene: c.1868A>C (p.Tyr623Ser) and c.29-55del (p.Leu10-Gln18del). The combination of an inactivating mutation of the LH receptor with a presumed loss of function change in the LH receptor, respectively, was most suggestive of Leydig Cell Hypoplasia. At birth, physical exam revealed a clitorophallic structure with stretched length in the upper limit of normal for female (1cm), no posterior fusion or rugation of labioscrotal folds, normal appearing vaginal introitus, separate urethral opening at the base of the clitorophallic structure, anogenital ratio of 0.51 (>0.5 suggests virilization), and palpable gonads in bilateral inguinal creases. No mullerian structures were identified on pelvic ultrasound. Electrolytes were normal. The baby remained medically stable and was discharged home on day of life 3. Labwork done during the mini puberty of infancy showed an LH of 0.8 mU/mL with total testosterone of 5 ng/dL. AMH resulted in the typical range for male (86.47 ng/mL). Although his multidisciplinary team presented that the most likely gender identity is female, family opted to rear the child as male until the child expresses otherwise. He underwent left inguinal repair at 5 months old, during which a gonadal biopsy was performed. Results confirmed the suspected diagnosis of Leydig Cell Hypoplasia. Parents have chosen to forego additional urogenital surgery until the patient can participate in medical decision making. Conclusions Leydig Cell Hypoplasia is a very rare condition. Dependent on the specific mutations present in the LH receptor gene, patients may present with micropenis or hypospadias to complete undervirilization of male genitalia. Due to rarity and wide phenotypic range, it is difficult to predict gender identity. With presumed lack of in-utero androgen exposure, it is reasonable to speculate the patient would identify as female, as evidenced by 46XY individuals with complete androgen insensitivity. This case is an excellent demonstration of the complexity that we now face as endocrinologists in the era of readily available prenatal genetic testing.","doi":"10.1159/000531602","pmid":"","date":"2023","journal":"Hormone Research in Paediatrics","authors":"Meder M.; Jelley H.; Timme K.","item_type":"journalArticle","volume":"96","issue":"(Meder M.; Jelley H.; Timme K.) University of Utah, Salt Lake City, UT, United States","pages":"320-321","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L642576866&from=export"},"KB5TEDG8":{"key":"KB5TEDG8","record_id":"R-KB5TEDG8","title":"Editorial comment","abstract":"","doi":"10.1016/j.juro.2011.01.093","pmid":"","date":"2011","journal":"Journal of Urology","authors":"Zaontz M.R.","item_type":"journalArticle","volume":"185","issue":"6 SUPPL.","pages":"2486","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/79955846224?origin=resultslist"},"KDQK9F28":{"key":"KDQK9F28","record_id":"R-KDQK9F28","title":"性别发育异常合并近端尿道下裂尿道成形术后并发症的危险因素分析","abstract":"目的探讨性别发育异常(disorders of sex development, DSD)合并近端尿道下裂患儿尿道成形术后并发症的危险因素。方法回顾性分析2012年1月至2020年1月郑州大学第一附属医院小儿泌尿外科收治的40例DSD合并近端尿道下裂患儿临床资料, 随访时间均超过2年。收集患儿首次入院时年龄、DSD类型、术前合并疾病、尿道成形术式、尿道成形长度、外生殖器雄性化评分(external masculinization score, EMS)、术前是否应用激素治疗、术后近期并发症等情况, 分析DSD合并近端尿道下裂患儿术后出现近期并发症的影响因素。结果 40例患儿入院时年龄1岁1个月至10岁8个月, 平均年龄3岁8个月;尿道成形术后出现并发症10例(10/40, 25%), 其中尿瘘7例, 尿道狭窄1例, 尿道裂开1例, 术后反流性附睾炎1例;并发症组与无并发症组患儿术前应用激素治疗[(2/10)比(19/30)]、EMS评分[5.5(4, 8)比8(7, 8)]及合并小阴茎[(6/10)比(5/30)]比较, 差异具有统计学意义(P0.05), 而两组患儿入院年龄[39.0(18.75, 58.50)比30.5(22.00, 38.75)]、DSD类型[(3/10)比(4/10)比(3/10)]、尿道成形长度[一期5.0(5.0, 6.0)比3.0(2.0, 4.0), 分期4.5(4.25, 8.75)比5.0(4.5, 6.5)]比较, 差异无统计学意义(P0.05)。结论对于DSD合并近端尿道下裂患儿, 术前应用激素治疗、EMS低以及合并小阴茎可能导致术后近期并发症发生率升高。","doi":"10.3760/cma.j.cn101785-202211056-010","pmid":"","date":"2023","journal":"临床小儿外科杂志","authors":"王登辉; 崔梦杰; 韩晓江; 楚向阳; 赵祥; 刘鹏鹏; 范应中","item_type":"journalArticle","volume":"22","issue":"9","pages":"849-854","issn":"1671-6353","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRbGN4ZXdrenoyMDIzMDkwMTAaCHJiNngyYTRh"},"KL4DT5CL":{"key":"KL4DT5CL","record_id":"R-KL4DT5CL","title":"Preserved fertility in a patient with a 46,XY disorder of sex development due to a new heterozygous mutation in the NR5A1/SF-1 gene: evidence of 46,XY and 46,XX  gonadal dysgenesis phenotype variability in multiple members of an affected  kindred.","abstract":"In humans, steroidogenic factor 1 (NR5A1/SF-1) mutations have been reported to cause gonadal dysgenesis, with or without adrenal failure, in both 46,XY and 46,XX individuals. We have previously reported extreme within-family variability in affected 46, XY patients. Even though low ovarian reserve with preserved fertility has been reported in females harboring NR5A1 gene mutations, fertility has only been observed in one reported case in affected 46,XY individuals. A kindred with multiple affected members presenting gonadal dysgenesis was studied. Four 46, XY individuals presented severe hypospadias at birth, one of them associated with micropenis and cryptorchidism. The other 3 developed spontaneous male puberty, and 1 has fathered 5 children. Four 46,XX patients presented premature ovarian failure (one of them was not available for the study) or high follicle-stimulating hormone levels. Mutational analysis of the NR5A1 gene revealed a novel heterozygous mutation, c.938G -> A, predicted to cause a p.Arg313Hys amino acid change. A highly conserved amino acid of the ligand-binding domain of the mature protein is affected, predicting abnormal protein function. We confirm that preserved fertility can be observed in patients with a 46, XY disorder of sex development due to heterozygous mutations in the NR5A1 gene. Copyright (C) 2012 S. Karger AG, Basel","doi":"10.1159/000338346","pmid":"","date":"2012","journal":"Hormone Research in Paediatrics","authors":"Ciaccio Marta; Costanzo Mariana; Guercio Gabriela; De Dona Valeria; Marino Roxana; Ramirez Pablo C.; Galeano Jessica; Warman Diana Monica; Berensztein Esperanza; Saraco Nora; Baquedano Maria Sonia; Chaler Eduardo; Maceiras Mercedes; Lazzatti Juan Manuel; Rivarola Marco A.; Belgorosky Alicia","item_type":"journalArticle","volume":"78","issue":"2","pages":"119-126","issn":"1663-2818","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L52171388&from=export"},"KQAYGE6Q":{"key":"KQAYGE6Q","record_id":"R-KQAYGE6Q","title":"Exploiting gene-environment interaction to detect adverse health effects of environmental chemicals on the next generation.","abstract":"There is increasing evidence from epidemiological studies that genetic susceptibilities may modify the teratogenic effects of toxic chemicals. However,  in contrast to tobacco smoke, few epidemiological studies have addressed  environmental chemicals, such as polychlorinated dibenzo-p-dioxins,  polychlorinated dibenzofurans and polychlorinated biphenyls in regard to genetic  susceptibility. Recent studies, including the Hokkaido Study of Environments and  Children's Health, have investigated the impacts of both environmental and  genetic factors on children's development. Several xenobiotic-metabolizing genes  have been reported to confer genetic susceptibility to low birth weight. These  genes seem to be influenced functionally by maternal smoking during pregnancy,  itself a significant risk factor. In our study, we found that birth weight was  significantly lower among infants born to smoking women having the specific AHR,  CYP1A1, GSTM1, CYP2E1 and NQO1 genotypes. When combinations of these genotypes  were considered, birth weight was even lower. On the other hand, congenital  anomalies such as hypospadias seemed to be caused by environmental factors in  conjunction with genetic predisposition as suggested by linkage in several  case-control studies reported to low birth weight. We have found an association  between maternal CYP1A1 genotype or low birth weight and the risk of hypospadias  irrespective of smoking. At the same time, birth weight was negatively correlated  with maternal blood concentrations of polychlorinated dibenzofurans. Further  studies should elucidate the impact of genetic factors on adverse effects of  exposures to dioxin-related chemicals.","doi":"10.1111/j.1742-7843.2007.00201.x","pmid":"","date":"2008","journal":"Basic and Clinical Pharmacology and Toxicology","authors":"Kishi Reiko; Sata Fumihiro; Yoshioka Eiji; Ban Susumu; Sasaki Seiko; Konishi Kanae; Washino Noriaki","item_type":"journalArticle","volume":"102","issue":"2","pages":"191-203","issn":"1742-7835","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L351143443&from=export"},"KQTMYXTA":{"key":"KQTMYXTA","record_id":"R-KQTMYXTA","title":"Preterm birth, low birth weight and risk of hypospadias: a meta-analysis","abstract":"Objective To investigate the association between preterm birth, low birth weight and the risk of hypospadias. Methods According to the search strategy of Cochranee Collaborative Network, the China National Knowledge Internet (CNKI), VIP, Wanfang, Pubmed, Cochranee and Embase were searched from the establishment of the database to April 2022. The literature on the relationship between preterm birth, low birth weight and the risk of hypospadias was included. Meta analysis was conducted on the relationship between preterm birth, low birth weight and the risk of hypospadias. Results A total of 13 articles were included, including cases from Asia, Europe, Australia and America. Newcastle-Ottawa Scale was used for evaluation, and the scores were all above 6. There were 10 articles on the relationship between preterm birth and the risk of hypospadias, all of which were case-control studies. Heterogeneity test I2= 46%, P = 0.05. There were 3 521 cases in the case group and 95 816 cases in the control group. Compared with the control group, preterm birth was a risk factor for hypospadias (OR; 2. 13, 95% CI; 1. 89 — 2. 41), and the difference was statistically significant (Z = 12. 21, P \u003c 0.01). There were 11 articles on the association between low birth weight and the risk of hypospadias, all of which were case-control studies. Heterogeneity test I2 =47%, P = 0.04. There were 2 460 cases in the case group and 94 260 cases in the control group. Compared with the control group, low birth weight was a risk factor for hypospadias (OR: 3. 29, 95% CI; 2. 57-4. 22), and the difference was statistically significant (Z = 9. 40, P \u003c 0.01). Conclusions Based on meta-analysis of published literature, preterm birth and low birth weight increase the risk of hypospadias. © 2023 Authors. All rights reserved.","doi":"10.3760/cma.j.cn431274-20220601-00526","pmid":"","date":"2023","journal":"Journal of Chinese Physician","authors":"Hu J.; Zhao Y.; Chen Y.; Zu J.; Wang Z.; Peng L.","item_type":"journalArticle","volume":"25","issue":"1","pages":"16-22and27","issn":"10081372 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85166778098?origin=resultslist"},"KV7A6AGG":{"key":"KV7A6AGG","record_id":"R-KV7A6AGG","title":"Major birth defects in the Brazilian side of the triple border: a population-based cross-sectional study.","abstract":"BACKGROUND: Major birth defects increase the risk of fetal death and pediatric hospitalization, which also impact on healthcare costs. Sociodemographic factors  can drastically affect reproductive health and be used to discriminate the  exposure to hidden risk factors. Foz do Iguassu is a Brazilian city located in  the triple-border region of Brazil / Paraguay / Argentina with high rates of  birth defects. However no study aimed to verify factors associated with this  incidence or preventive care is reported. The current work investigated the  prevalence of major birth defects and its association with maternal  sociodemographic factors in Foz do Iguassu. METHODS: In this population-based  cross-sectional study we used data of all live births occurred in Foz do Iguassu  from 2012 to 2017. The associated sociodemographic variables such as maternal  age, maternal education, maternal race, country of residence, maternal parity and  onset of prenatal care were analyzed. Each major birth defect was described  according to absolute and relative frequencies, Kruskal-Wallis and logistic  regression models were used to evaluate variables associated with selected birth  defects. RESULTS: The most prevalent major birth defects were Cleft Lip and/or  Palate (9.5/10,000), gastroschisis (6.93/10,000), spina bifida (5.53/10,000),  hydrocephalus (5.53/10,000), hypospadias (4.55/10,000), Down syndrome  (4.23/10,000), anencephaly (2.93/10,000), anorectal atresia / stenosis  (1.95/10,000), undetermined sex (1.95/10,000), esophageal atresia / stenosis with  or without fistula (1.63/10,000) and limb reduction defects (1.30/10,000).  Maternal age was associated with gastroschisis and Down syndrome. Only maternal  education up to 7 years was statistically associated with major birth defects  considering all other sociodemographic variables. CONCLUSION: Cleft Lip and/or  Palate and Gastroschisis prevalence were higher than those found in the  literature. This findings may suggest a distinct epidemiological behavior  regarding major birth defects in the region. The work opens new perspectives for  birth defects risk factors in the triple-border.","doi":"10.1186/s13690-020-00443-w","pmid":"32617160","date":"2020","journal":"Archives of public health = Archives belges de sante publique","authors":"de Souza Suzana; Nampo Fernando Kenji; Pestana Cezar Rangel","item_type":"journalArticle","volume":"78","issue":"","pages":"61","issn":"0778-7367 2049-3258","isbn":"","url":""},"KVSXWKCF":{"key":"KVSXWKCF","record_id":"R-KVSXWKCF","title":"Severe hypospadias and its association with maternal-placental factors","abstract":"The neonate born small for gestational age (SGA, birth weight \u003c10th centile) with severe hypospadias, and without the presence of other malformations, is a presentation which clinical geneticists are asked to assess. However, this combination is not well addressed in the literature. Epidemiological studies point to an increased incidence and severity of hypospadias in SGA infants, but leave open the possibility that the association is attributable to the population subset who have multiple congenital abnormalities or genetic syndromes. Epidemiological studies unselected for birth weight have also identified an association between hypospadias with some risk factors tied to SGA, including prematurity, preeclampsia, and placental insufficiency. This study was developed after being involved in the care of several boys with SGA and severe hypospadias who were premature, with gestational histories of maternal hypertension and oligohydramnios. No underlying syndromes, hormonal abnormalities, or contributory family histories could be found. We hypothesized that severe hypospadias may in some cases be causally related to maternal-placental factors rather than primary fetal abnormalities. A retrospective study of a cohort of singletons born SGA with unexplained hypospadias was conducted. We compared their gestational histories and hypospadias severities with those born at normal birth weights. The cohort with SGA had an increased ratio of severe to mild hypospadias. Further, within the cohort of SGA boys, there was a higher prevalence of prematurity, maternal hypertension, and oligohydramnios among those with severe vs mild hypospadias. Small sample sizes are limiting. (c) 2013 Wiley Periodicals, Inc.","doi":"10.1002/ajmg.a.36050","pmid":"","date":"2013","journal":"American Journal of Medical Genetics, Part A","authors":"Huisma F.; Thomas M.; Armstrong L.","item_type":"journalArticle","volume":"161","issue":"9","pages":"2183-2187","issn":"1552-4825","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L52718707&from=export"},"KXNFANA8":{"key":"KXNFANA8","record_id":"R-KXNFANA8","title":"Single Nucleotide Polymorphisms of HAAO and IRX6 Genes as Risk Factors for Hypospadias.","abstract":"Purpose:We evaluated the association of hypospadias and 17 susceptibility loci previously identified by a European genome-wide association study in a cohort of Japanese patients. We also examined the expression of candidate genes in male mouse embryos to determine the possible underlying mechanisms of this disease.Materials and Methods:We enrolled 169 Japanese patients (mean age at surgery 3.7 years) who underwent repair of hypospadias. Genotyping of 17 single nucleotide polymorphisms was performed using a multiplex polymerase chain reaction invader assay. We also performed in situ hybridization to determine whether candidate genes were expressed in the male genital tubercle during embryonic development of the external genitalia in mice.Results:Single nucleotide polymorphism rs3816183 of HAAO was significantly associated with susceptibility to hypospadias in general (p = 0.0019) and to anterior/middle hypospadias (p = 0.0283) and posterior hypospadias (p = 0.0226), while single nucleotide polymorphism rs6499755 of IRX6 showed an association with susceptibility to anterior/middle hypospadias (p = 0.0472). In mouse embryos there was no significant upregulation of Haao expression in the developing male external genitalia. Irx3 and Irx5, which are linked to Irx6 within the IrxB cluster, were expressed in the mesenchyme remote from the urethral plate epithelium during the critical embryonic period for masculinization. Irx6 was expressed in the ectodermal epithelium, demonstrating prominent dorsal ectodermal expression without expression in the ventral ectoderm adjacent to the urethral plate during the same period.Conclusions:Genetic variations of HAAO and IRX6 influence susceptibility to hypospadias in the Japanese population. Further research is needed to clarify the mechanism by which variations in these genes contribute to the pathogenesis of hypospadias. © 2019 by AMERICAN UROLOGICAL ASSOCIATION EDUCATION AND RESEARCH, INC.","doi":"10.1016/j.juro.2018.07.050","pmid":"","date":"2019","journal":"Journal of Urology","authors":"Kojima Yoshiyuki; Koguchi Tomoyuki; Mizuno Kentaro; Sato Yuichi; Hoshi Seiji; Hata Junya; Nishio Hidenori; Hashimoto Daiki; Matsushita Shoko; Suzuki Kentaro; Miyagawa Shinichi; Hui Chi Chung; Tanikawa Chizu; Murakami Yoshimori; Yamada Gen; Hayashi Yutaro; Matsuda Koichi","item_type":"journalArticle","volume":"201","issue":"2","pages":"386-392","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85060039798?origin=resultslist"},"KYBAQQ89":{"key":"KYBAQQ89","record_id":"R-KYBAQQ89","title":"尿道板切开卷管尿道成形术治疗尿道下裂的近期疗效及术后尿道瘘相关危险因素分析","abstract":"目的探讨尿道板切开卷管尿道成形术(tubularized incised plate, TIP)治疗尿道下裂的近期疗效及术后发生尿道瘘的危险因素。方法回顾性分析2018年12月至2020年1月在首都医科大学附属北京儿童医院泌尿外科初次行TIP手术治疗的尿道下裂患儿临床资料, 通过电子手术记录和电话随访收集患儿临床资料, 总结近期疗效, 并对影响尿道瘘发生的可能因素进行单因素分析, 选取单因素分析结果中有统计学意义的变量进行多因素Logistic回归分析。结果本研究共纳入126例尿道下裂患儿, 124例获随访, 2例失访, 平均随访时间20.2个月。患儿中位年龄24个月。不同尿道开口位置人数占比分别为:前型58.1%(72/124), 中间型29.8%(37/124), 后型12.1%(15/124)。术前存在不同程度阴茎下弯人数占比分别为:轻度29.8%(37/124), 中度54.8%(68/124), 重度15.3%(19/124)。约59.5%(22/37)的轻度阴茎下弯和33.8%(23/68)的中度阴茎下弯病例仅采用阴茎皮肤脱套, 重度阴茎下弯(19/19)病例均采用阴茎皮肤脱套和背侧白膜折叠的方法。手术后近期并发症发生率为26.6%, 其中尿道狭窄10例(10/124, 8.1%), 尿道瘘23例(23/124, 18.5%), 阴茎体瘘17例(17/124, 13.7%), 阴茎头裂开6例(6/124, 4.8%)。单因素分析发现, 年龄、术前阴茎下弯程度、新尿道覆盖物与TIP手术后尿道瘘之间无显著关联性, 阴茎头宽度小于14 mm、后型尿道下裂、皮肤脱套后阴茎下弯超过15°以及行背侧白膜折叠是TIP手术后尿道瘘的可疑危险因素(P0.05)。多因素分析显示, 阴茎头宽度小于14 mm是TIP术后尿道瘘的独立危险因素(P0.05)。结论 TIP手术治疗前型和中间型尿道下裂效果满意, 治疗后型尿道下裂尿道瘘的发生率高;阴茎头宽度越小, 皮肤脱套后阴茎下弯程度更重的患儿尿道瘘发生率更高。阴茎头宽度小于14 mm是TIP手术后尿道瘘的独立危险因素;TIP手术中利用Buck筋膜覆盖者尿道瘘的发生率更低, 但发生尿道狭窄的可能性更大。","doi":"10.3760/cma.j.cn101785-202202009-009","pmid":"","date":"2023","journal":"临床小儿外科杂志","authors":"周谦; 张潍平; 宋宏程; 孙宁; 田军; 李明磊; 屈彦超; 李宁; 梁海燕; 韩文文; 杨洋; 李振武; 王冠男","item_type":"journalArticle","volume":"22","issue":"12","pages":"1139-1145","issn":"1671-6353","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRbGN4ZXdrenoyMDIzMTIwMDkaCHJiNngyYTRh"},"KYUEUXZH":{"key":"KYUEUXZH","record_id":"R-KYUEUXZH","title":"Surprising X chromosomes: Unusual mosaicism","abstract":"Background: Among 46,XY individuals, androgen insensitivity syndrome (AIS) due to deleterious variants of the androgen receptor (AR) gene is one cause for a difference of sexual development (DSD). Typically, individuals with complete androgen insensitivity syndrome (CAIS) present with female external genitalia and palpable labial masses. Whereas most patients carry germline variants inherited in an X-linked manner, approximately 30% of patients manifest de novo variants. We describe an infant with phenotype-genotype incongruity associated with a variant in AR. Case Presentation: This patient was referred to endocrinology at the age of 3 weeks for evaluation of atypical genitalia. The exam showed bifid scrotum, bilateral descended testes, scrotal hypospadias with chordee, and 1 cm phallus. Initial studies showed normal random growth hormone, cortisol, and 17-hydroxyprogesterone levels. Chromosome analysis showed 46,XY karyotype; FISH confirmed presence of the SRY gene. A pelvic ultrasound revealed absence of any Mullerian structures. Additional studies obtained at 2 months of age showed LH 1.78 IU/L, FSH 0.45 IU/L, testosterone 282 ng/dl (9.8 nmol/L), and DHT 65 ng/dl (2.2 nmol/L). Due to the infant's undervirilization, whole exome sequencing was performed. A rare pathogenic variant in the AR gene, c2104C>T, predicted to result in amino acid substitution p.Leu702Phe (rs1555995851) was detected in 48% of the sequence reads, consistent with somatic mosaicism. Discussion: The initial evaluation of this patient excluded hypopituitarism and defects in steroidogenesis from consideration. This AR gene sequence variant has been previously confirmed to be associated with CAIS. In this patient, somatic mosaicism for a pathogenic AR variant likely explains the inconsistency between his partially virilized phenotype and the sequence variant predicted to cause CAIS. Somatic mosaicism for a DNA sequence variant, resulting from post-zygotic changes during the early stages of embryo development, is emerging as a significant contributor to DSD. Identification of mosaicism is important for management and will help the medical team and the family discuss sex of rearing. For patients with mosaicism for a disease-causing variant, the proportion of cells with a wild type AR is likely variable and may ultimately influence androgen responsiveness and the patient's phenotype during adolescence and adulthood. Virilization at puberty has been reported in males with somatic mosaicism of AR (JCEM 2005; 90:106). Our patient showed some response to a testosterone trial and will receive another trial course of higher dose testosterone.","doi":"10.1159/000518849","pmid":"","date":"2021","journal":"Hormone Research in Paediatrics","authors":"Zorkot Z.; Yatsenko S.; Garibaldi L.; Witchel S.","item_type":"journalArticle","volume":"94","issue":"SUPPL 1","pages":"383","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L637189296&from=export"},"KZAUZXRB":{"key":"KZAUZXRB","record_id":"R-KZAUZXRB","title":"儿童尿道下裂术后出现创伤后应激障碍的危险因素分析","abstract":"目的 分析儿童尿道下裂术后出现创伤后应激障碍的危险因素.方法 回顾性分析2022年1月-2024年12月在我院进行尿道下裂术治疗的80例患儿临床资料,术后3个月采用加州大学洛杉矶分校创伤后应激障碍反应指数(儿童修订版)(the University of California at Los Angeles Posttraumatic Stress Disorder Reaction Index for DSM-Ⅳ,UCLA PTSD-RI,Child Version)评估创伤后应激障碍的发生情况,依据结果将其分为创伤后应激障碍组(n=32)、无创伤后应激障碍组(n=48).比较两组基本资料(年龄、体质量指数、独生子女、单亲家庭、居住地、手术时间、住院时间、术后疼痛、并发症),采用单因素分析及多因素Logistic回归分析考察儿童尿道下裂术后出现创伤后应激障碍的影响因素.结果 创伤后应激障碍组单亲家庭、术后中度及重度疼痛以及术后并发症比率高于无创伤后应激障碍组(P\u003c0.05);经多因素Logistic回归分析证实,单亲家庭、术后中度及重度疼痛、有术后并发症均为儿童尿道下裂术后创伤后应激障碍的危险因素,P均\u003c0.05.结论 单亲家庭、术后中度及重度疼痛、有术后并发症均为儿童尿道下裂术后创伤后应激障碍的危险因素,临床治疗时可结合以上因素制定防治措施,降低尿道下裂术后创伤后应激障碍发生风险.","doi":"10.3969/j.issn.1673-2952.2026.03.065","pmid":"","date":"2026","journal":"国际精神病学杂志","authors":"张颖; 张大鹏; 么爽","item_type":"journalArticle","volume":"53","issue":"3","pages":"934-936,951","issn":"1673-2952","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORISZ3d5eC1qc2J4MjAyNjAzMDY1GghyYjZ4MmE0YQ%3D%3D"},"L9AUDBEI":{"key":"L9AUDBEI","record_id":"R-L9AUDBEI","title":"Bilateral male breast cancer with male potential hypogonadism","abstract":"Background: Male breast cancer is a comparatively rare disease, and simultaneous bilateral male breast cancer is considered to be an extremely rare event. Risk factors are said to be genetic factors and hormonal abnormalities due to obesity or testicular diseases. Case presentation: The patient was a 47-year-old Japanese male. His family had no history of female breast cancer. This patient also had hypospadias and hormonal examination indicated the presence of primary testicular potential hypogonadism, and these hormonal abnormalities seemed to be present since childhood or the fetal period. The bilateral breast cancer developed in this man at a comparatively young age, and histopathological studies of multiple sections showed that there was almost no normal epithelial cell in the ducts, while the ducts were almost completely filled with breast cancer cells. Conclusion: It is thought that male breast cancer is caused by an imbalance between estrogen and testosterone. We cannot rule out the possibility that the breast cancer developed due to the effect of the slight elevation of estrogen over a long period of time, but the actual causative factors in this patient were unable to be definitively identified. In the future, we hope to further elucidate the causes of male breast cancer. © 2007 Hirose et al; licensee BioMed Central Ltd.","doi":"10.1186/1477-7819-5-60","pmid":"","date":"2007","journal":"World Journal of Surgical Oncology","authors":"Hirose Y.; Sasa M.; Bando Y.; Hirose T.; Morimoto T.; Kurokawa Y.; Nagao T.; Tangoku A.","item_type":"journalArticle","volume":"5","issue":"","pages":"","issn":"14777819 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/34250766722?origin=resultslist"},"L9NUK7ZI":{"key":"L9NUK7ZI","record_id":"R-L9NUK7ZI","title":"What are the factors affecting glanular dehiscence after hypospadias surgery?","abstract":"Background: Glanular dehiscence (GD) is one of the main complications after hypospadias surgery. There is a limited number of publications regarding GD in the literature.\n   Objective: The aim of this work is to reveal the factors that affect GD after a literature review.\n   Evidence acquisition: A literature search for relevant articles was performed in database using the search term glans dehiscence without setting date range limit or any other limits. All articles related to GD after hypospadias surgery were included in this study. After collecting the information from full text articles, 71 articles were included in this systematic review. In these studies, localization of hypospadic meatus, type of surgery, and other clinical data which were thought to behave as risk factors for GD were obtained. Chi-Square test was used to evaluate the differences between the parameters, where p \u003c 0.05 was taken as statistically significant.\n   Results: After evaluating the 71 articles that met the inclusion criteria, 309 cases (3.48%) of GD after 8858 hypospadias repairs were obtained in this review. GD rates were found significantly high for proximal hypospadias (5%), two-stage hypospadia repairs (5%) and re-do hypospadias repair (8.75%) (p = 0.002, 0.022, and 0.004, respectively). Glans width \u003c 14 mm, urethral plate (UP) width \u003c 7 mm, hypospadias surgeries performed before 6 months of age and after puberty, and caudal block anesthesia increased the rate of GD.\n   Conclusions: The rate of GD increases after proximal, cripple and staged hypospadias surgeries, a glans width \u003c 15 mm and UP width \u003c 8 mm, postpubertal surgeries, and caudal anesthesia use during surgery. (C) 2021 AEU. Published by Elsevier Espana, S.L.U. All rights reserved.","doi":"10.1016/j.acuro.2020.11.014","pmid":"","date":"2022","journal":"Actas Urologicas Espanolas","authors":"Karabulut R.; Turkyilmaz Z.; Atan A.; Kaya C.; Sonmez K.","item_type":"journalArticle","volume":"46","issue":"1","pages":"4-15","issn":"02104806 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85116051197?origin=resultslist"},"L9ZH7XSW":{"key":"L9ZH7XSW","record_id":"R-L9ZH7XSW","title":"[Endocrine disruptors and hypospadias in Gran Canaria island (2012-2015)].","abstract":"OBJECTIVE: Hypospadias represents the most frequent male congenital malformation in children, with a prevalence of 1 in 200-300 new born or 4-6 in 1000 male new  born. Genetic and environmental factors play a strong role on developing this  virilization defect acting as endocrinal disruptors (ED). The objective of the  present study was to evaluate the environmental factors that may have influenced  the development oh hypospadias in children treated at the Maternal and Child  University Hospital od Las Palmas of Gran Canaria Island during the years  2012-2015. METHODS: The present study represents a retrospective analysis of  patients treated for hypospadias in the Maternal-Paediatric University Hospital  of Las Palmas of Gran Canaria during 4 years (2012 -2015) by the use of medical  records and telephone survey to families' patients. To perform the statistical  analysis of the data, the SPSS program was used in version 15.0. The level of  statistical significance was established for an error α = 0.05. The chi-square  test and Fisher's correction were applied if necessary to test the associations  between the qualitative variables. RESULTS: From 2012 to 2015, 128 patients were  treated; we could only follow 116 patients. If we analyse patients' distribution  throught those years we can resume that 33% of them were treated in 2012, 23% in  2013, 24% in 2014 and 20% in 2015. We analyse the study background of both  parents: 45.5% of mothers had primary studies, 37.5% had secundary studies, 15.2%  had university studies and 1.8% were students; 54.3% of fathers had primary  studies, 32.4% had secundary studies and 13.3% had university studies. We did not  found any statistically significant diference between the place of residence and  the study background both in mothers (p=0,262) and fathers (p=0,052). Within all  the patients followed, 78 had a clinical history of exposition to ED as a direct  family background. CONCLUSIONS: The chronical exposure to ED, very frequent in  our society, is a very important risk factor in the development of urologic  pathologies as hypospadias; for this reason, awareness measures and prevention in  social areas and workplace must be carried out to avoid unnecessary exposures.","doi":"","pmid":"30156217","date":"2018 Aug 29","journal":"Revista espanola de salud publica","authors":"Germani Micaela; Fiuza Pérez Maria Dolores; Sánchis Solera Luis; Hernández González Lourdes; García Hernández José Ángel","item_type":"journalArticle","volume":"92","issue":"","pages":"e201808055","issn":"2173-9110 1135-5727","isbn":"","url":""},"LE65FBYV":{"key":"LE65FBYV","record_id":"R-LE65FBYV","title":"NR5A1 is a novel disease gene for 46,XX testicular and ovotesticular disorders of development","abstract":"Background: While many causes of 46,XY disorders of sex development (DSD) have been elucidated, the mechanisms leading to 46,XX testicular or ovotesticular DSD are poorly understood. It has been hypothesized that both conditions may represent a phenotypic spectrum and that they might be caused by (different) mutations in the same genes. Methods: Whole exome sequencing was used to identify the molecular cause in ten unrelated patients with 46,XX (ovo)testicular DSD. Transcriptional activation of the variant of interest was assessed using luciferase assays and RNA-seq was performed on patient-derived lymphocytes. Immunohistochemistry was done on gonadal specimens for markers of gonadal development. Results: We identified a novel heterozygous NR5A1 variant C.274C>T p.(Arg92Trp) in three unrelated 46,XX (ovo)testicular DSD cases. This variant is absent in genomic databases and is predicted to be deleterious. The Arg92 residue is conserved up to zebrafish and located in the RGGR motif in the loop before the C-terminus helix in the conserved Ftz-Fl box. This domain was previously reported to be important for DNA binding specificity and stability. Structural remodeling indeed shows that Trp cannot be introduced without steric clashes. Immunohistochemistry confirmed SRY-independent SOX9 expression and absent FOXL2 in testicular parts of XX gonads and vice versa in ovarian regions. No consistent changes in transcriptional activation were seen. RNA-seq showed upregulation of MAMLD1, a direct target of NR5A1, that has already been associated with hypospadias and 46,XY DSD. Conclusions: Previously, loss-of-function mutations in NR5A1 were found in a spectrum of male undervirilization and premature ovarian insufficiency in 46,XX females. Here, a novel NR5A1 mutation was found in three unrelated cases with 46,XX testicular or ovotesticular DSD, an ultra-rare condition. We hypothesize that this variant results in upregulation of specific target genes, thereby triggering testicular differentiation in 46,XX individuals. We propose NR5A1 mutation p.(Arg92Trp) as a new cause for 46,XX (ovo)testicular DSD.","doi":"10.1159/000449142","pmid":"","date":"2016","journal":"Hormone Research in Paediatrics","authors":"Baetens D.; Stoop H.; Peelman F.; Todeschini A.-L.; Rosseel T.; Coppieters F.; Veitia R.; Looijenga L.; De Baere E.; Cools M.","item_type":"journalArticle","volume":"86","issue":"(Baetens D.; Rosseel T.; Coppieters F.; De Baere E.) Center for Medical Genetics, Ghent University, Ghent University Hospital, Ghent, Belgium","pages":"65","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L615914760&from=export"},"LH3F2BG9":{"key":"LH3F2BG9","record_id":"R-LH3F2BG9","title":"尿道下裂危险因素的病例对照研究","abstract":"目的 探讨尿道下裂病因。方法 采用以医院为基础的1:2配比的病例对照研究方法,以统一的调查表及调查方式对107倒尿道下裂及214例对照进行面对面问卷调查,应用SAS 6.12软件对所有调查因素进行单因素及多因素logistic回归分析。结果 胎儿尿道下裂的发生与母亲孕前自然流产史(OR=3.87,95％CI:1.60～9.39)、孕期发生先兆流产(OR=3.57,95％CI:1.31～9.64)、孕早期感冒伴发热(OR=7.63,95％CI:2.50～23.24)、孕中期用抗感染和/或解热止痛药(OR=16.46,95％CI;3.46～78.21)、父亲职业性接触农药(OR=3.70,95％CI:1.49～9.16)及胎儿低出生体重(OR=12.62,95％CI:2.97～53.67)呈正相关,与母亲孕早期增加蛋白质类营养(OR=0.33,95％CI:O.15～0.74)呈负相关。结论 母亲孕前自然流产史、孕期发生先兆流产、孕早期感冒伴发热、孕中期用抗感染和/或解热止痛药、父亲职业性接触农药、胎儿低出生体重等可能增加胎儿发生尿道下裂的危险,而母亲孕早期增加蛋白质类营养可能降低胎儿发生尿道下裂的危险。","doi":"","pmid":"","date":"2004","journal":"中华流行病学杂志","authors":"王金平; 王滨有","item_type":"journalArticle","volume":"","issue":"3","pages":"83-86","issn":"0254-6450","isbn":"","url":"https://kns.cnki.net/kcms2/article/abstract?v=qfSY-45OZzchSc8YALu1JMONd4_TIDqfRuj0H0kgAP0FwCZPMgoanqGVof04OkFg2dxvE5xKhso6OHJmkkbsh_fiQVuHvSC-pVTaMXSG4hwPLtWCLkgKsOssCTxMWEyAJsVPIYWw0gIVs2DtXTejiXBWDPT3UNFNfiMi3PqtOI2rAWVkjhMBdw==&uniplatform=NZKPT&language=CHS"},"LMAB8KJS":{"key":"LMAB8KJS","record_id":"R-LMAB8KJS","title":"Does the anogenital distance predict outcome of hypospadias repair?","abstract":"Purpose: The anogenital distance (AGD) is androgen action dependent. It is sexually dimorphic and seems to be shorter in androgen-action related diseases like hypospadias. In this study we sought to determine whether the AGD is predictive for surgical outcome in hypospadias repair. Material and Methods: Patients were collected prospectively. AGD was measured in OR prior to surgery by 2 surgeons (blinded, each 3 times). Outcome parameters were definded as: 1.) complications (fistula, breakdown, glans dehiscence, redo surgery) and 2.) need for staged repair. There were 208 prepubertal boys: 119 controls 2.38yrs (0.02-10.2) and 89 hypospadias (55 distal hypospadias 2.74yrs (0.07-9.67) and 34 proximal hypospadias 2.45yrs (0.58-9.76). Mean follow-up was 1.1yrs. Results: There was no difference in AGD in controls and mild hypospadias. Severe hypospadias had a significantly shorter AGD (p=0.003). AGD was significantly shorter in patients undergoing staged repair (37mm vs. 26mm, p=0.001). AGD was significantly shorter in patients who developed postoperative complications (38mm vs. 29mm, p=0.04). Conclusions: Shorter AGD predicts higher complication rate and the need for more extensive surgery. Hypothetically, a short AGD resembles impaired intra uterine androgen action (low androgens, androgen receptor problems, counteracting endocrine disruptors, and unknown genetic androgen interaction). These fetal androgen deficiencies may be reflected in hypospadias minor tissue quality resulting in delayed wound healing, inflammation and a higher complication rate or more difficult surgery resulting in staged repair.","doi":"10.1159/000501868","pmid":"","date":"2019","journal":"Hormone Research in Paediatrics","authors":"Springer A.; Riedl S.; Tonnhofer U.; Hiess M.; Metzelder M.; Hebenstreit D.","item_type":"journalArticle","volume":"91","issue":"(Springer A.; Tonnhofer U.; Metzelder M.) Department of Pediatric Surgery, Medical University Vienna, Vienna, Austria","pages":"476","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630604757&from=export"},"LZ9RSA5P":{"key":"LZ9RSA5P","record_id":"R-LZ9RSA5P","title":"Risk factors for failed urethrocutaneous fistula repair after transverse preputial island flap urethroplasty in pediatric hypospadias.","abstract":"OBJECTIVES: We review our experience in urethrocutaneous fistula (UCF) repair after transverse preputial island flap urethroplasty (Duckett) in pediatric  hypospadias to investigate the risk factors for unsuccessful outcome. METHODS:  Two hundred and nineteen UCFs repairs conducted in our center from January 2015  to December 2016 after Duckett technique were retrospectively reviewed and 182  had a follow-up for more than 6 months. The age of patients, size, localization  and numbers of UCFs, interval time of two operations, length of neourethra, times  of UCFs repairs, complications other than UCFs, hospital of primary surgery and  postoperative infection were analyzed as potential risk factors. Stratified  analysis and assessment of additive interaction were performed to have a better  understanding of the relation between the risk factors. Logistic regression  analysis was used for multivariate analysis. RESULTS: UCF repairs were succeeded  in 121 (66.5%) and failed in 61 (33.5%) at first operation. In the univariate  analysis, size and numbers of UCFs (P = 0.01 and P = 0.035, respectively),  interval time of two operations (P = 0.042) and hospital of primary surgery  (P = 0.02) were statistically related with the outcome. In the multivariate  analysis, UCF ≥ 2 (OR 2.71, 95%, CI 1.095-6.692, P = 0.031), size ≥ 2 mm (OR  2.45, 95% CI 1.267-4.757, P = 0.08) and primary surgery not at our hospital (OR  2.21, 95% CI 1.094-4.126, P = 0.026) were identified as independent risk factors  for unsuccessful outcome. In the stratified analysis, multiplicative interaction  between the 3 risk factors was not found. CONCLUSIONS: Our study suggested that  UCF repairs after transverse preputial island flap urethroplasty were easier to  fail if the UCF was ≥ 2 mm, the numbers of UCFs was ≥ 2, or the surgeon had less  experience. The age of patients, site of UCFs, interval time of two operations,  length of neourethra, times of UCFs repairs, complications other than UCF and  postoperative infection were not significantly related to the success rate of UCF  repair.","doi":"10.1007/s11255-017-1773-x","pmid":"","date":"2017","journal":"International Urology and Nephrology","authors":"Han Wenwen; Zhang Weiping; Sun Ning","item_type":"journalArticle","volume":"50","issue":"2","pages":"191-195","issn":"0301-1623","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDIzNzYzMTI0GghyYjZ4MmE0YQ%3D%3D"},"M22BN9G9":{"key":"M22BN9G9","record_id":"R-M22BN9G9","title":"In utero prednisone exposure affects genital development","abstract":"Purpose: The etiology of the worldwide incidence of hypospadias remains unexplained. Data from the Center for Disease Control suggest that maternal asthma exposure may be a risk factor. The development of the mouse and human urethra shows significant similarities, such as fusion of 2 epithelial edges, closure of a midline epithelial seam and subsequent cellular remodeling, to justify the use of the mouse as an experimental animal model. Prednisone may act as a weak androgen directly or alternatively lowering testosterone by hypothalamic suppression of gonadotropins. We describe the effects of prednisone on urethral formation in the mouse. Materials and Methods: The model comprised 10, 20 and 20 timed pregnant C57/6 mice exposed to 1,000, 200 and 100 mg/kg prednisone, respectively, on gestational days 12 through 18. The morphology of the genital tubercles of both sexes were examined on gestational day 19 using histological techniques and 3-dimensional computer reconstruction. Specific attention was focused on the developing urethral seam. Results: Microscopic serial analysis confirmed the presence of an arrest in seam formation in approximately 25% of male fetuses given supraphysiological doses of prednisone (1,000 mg/kg). In contrast, acceleration of urethral fold fusion and a longer urethral tube were observed in those males treated with 100 and 200 mg/kg prednisone. The female fetuses treated with the same dosages of prednisone did not show any change at the level of the urethral seam area or in the remainder of the genital tubercles. Conclusions: Supraphysiological doses of prednisone treatment has an inhibitory effect on urethral fold fusion leading to hypospadias whereas low doses accentuate urethra formation in male mouse fetuses. In mice lower doses do not cause hypospadias in the males or affect urethral formation in females.","doi":"10.1097/01.ju.0000139911.56346.1b","pmid":"","date":"2004","journal":"","authors":"Yucel S.; Desouza A.; Baskin L.S.; Duel B.","item_type":"conferencePaper","volume":"172","issue":"4 II","pages":"1725-1730","issn":"","isbn":"00225347 (ISSN)","url":"https://www.scopus.com/pages/publications/4544299831?origin=resultslist"},"MBQMZEGI":{"key":"MBQMZEGI","record_id":"R-MBQMZEGI","title":"Vascular dysfunction and increased cardiovascular risk in hypospadias","abstract":"Background: Hypogonadism has been associated with cardiovascular disease. However, little is known about the cardiovascular impact of hypogonadism during development. Using hypospadias as a surrogate of hypogonadism, we investigated whether hypospadias is associated with vascular dysfunction during childhood and whether it is a risk factor for adult cardiovascular disease. Methods: Our human study spanned molecular mechanistic to epidemiological investigations. Clinical vascular phenotyping (blood pressure, carotid intima-media thickness (CIMT), flow-mediated dilation, pulse wave velocity) was performed in 14 adolescents with hypospadias and 14 age-matched controls. Subcutaneous resistance arteries from penile skin from 27 young boys undergoing hypospadias repair and 37 age-matched controls were isolated and functional studies assessed by myography. Primary culture vascular smooth muscle cells (VSMCs) were used to assess: Rho kinase, redox signalling, nitric oxide (NO) and DNA damage. Systemic oxidative stress was assessed in plasma and urine (TBARS, 8-OHdG). Scottish linked hospital episode data identified 6,797 men with a history of hypospadias versus 8,073 controls matched for confounders. Results: In adolescents with hypospadias, systolic blood pressure and pulse pressure were significantly increased, in association with increased CIMT SDS (1.6 vs 1.2, p\u003c0.05). Resistance arteries from boys with hypospadias demonstrated increased vasoconstriction (Emax:137.9 vs 83.7, p\u003c0.001) and reduced endothelium-dependent (Emax:77.3.4 vs 14.6, p\u003c0.0001) and endothelium-independent vasorelaxation (Emax:39.5 vs 24.6, p\u003c0.0001). Hypercontractile responses were ameliorated by fasudil (Rho kinase inhibitor), NAC (ROS scavenger) and melittin (Nox5 inhibitor). Activation of pro-contractile signalling pathways (Rho kinase activity; myosin light chain phosphorylation) were increased in VSMCs from affected boys, associated with increased Nox5-induced ROS generation, oxidative stress and downregulation of NO and antioxidant pathways. Men with a history of hypospadias had a 3-fold higher risk of arrhythmia (OR [95% CI] 2.8[1.4-5.6], p\u003c0.001); 4-fold higher risk of hypertension (OR [95% CI] 4.2[1.5-11.9], p\u003c0.05) and 2-fold higher risk of heart failure (OR [95% CI] 1.9 [1.7-114.3], p\u003c0.05). Conclusions: Hypospadias is associated with vascular dysfunction during childhood and predisposes to hypertension and cardiovascular disease in adulthood. Underlying vascular mechanisms involve perturbed Rho kinase- and Nox5/ROS-dependent signalling. Our novel findings delineate molecular mechanisms of vascular injury in hypogonadism, and identify hypospadias as a cardiovascular risk factor in males.","doi":"10.1159/000518849","pmid":"","date":"2021","journal":"Hormone Research in Paediatrics","authors":"Lucas-Herald A.K.; Montezano A.C.; Alves-Lopes R.; Haddow L.; Alimussina M.; O'Toole S.; Flett M.; Lee B.; Basith Amjad S.; Steven M.; Brooksbank K.; McCallum L.; Delles C.; Padmanabhan S.; Ahmed S.F.; Touyz R.","item_type":"journalArticle","volume":"94","issue":"SUPPL 1","pages":"376-377","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L637189151&from=export"},"MEJP7WPS":{"key":"MEJP7WPS","record_id":"R-MEJP7WPS","title":"Congenital Abnormalities of the Male Reproductive System and Risk of Autism Spectrum Disorders","abstract":"Androgens have an extensive influence on brain development in regions of the brain that are relevant for autism spectrum disorder (ASD), yet their etiological involvement remains unclear. Hypospadias (abnormal positioning of the urethral opening) and cryptorchidism (undescended testes) are 2 relatively common male birth defects that are strongly associated with prenatal androgen deficiencies. Having either disorder is a proxy indicator of atypical gestational androgen exposure, yet the association between these disorders and autism has not been extensively studied. We analyzed male singleton live births (n = 224,598) occurring from January 1, 1999, through December 31, 2013, in a large Israeli health-care organization. Boys with autism, cryptorchidism, and hypospadias were identified via International Classification of Diseases, Ninth Revision, codes, with further verification of autism case status by review of medical records. In multivariable-adjusted analyses, the odds ratio for ASD among boys with either condition was 1.62 (95% confidence interval (CI): 1.44, 1.82). The odds ratio for boys with cryptorchidism only was 1.55 (95% CI: 1.34, 1.78), and that for boys with hypospadias only was 1.65 (95% CI: 1.38, 1.98). ASD risk was not elevated among unaffected brothers of hypospadias or cryptorchidism cases, despite familial aggregation of all 3 conditions, providing some indication for the possibility of pregnancy-specific risk factors driving the observed associations. Results suggest that in-utero hypoandrogenicity could play a role in ASD etiology. © The Author(s) 2018. Published by Oxford University Press on behalf of the Johns Hopkins Bloomberg School of Public Health. All rights reserved.","doi":"10.1093/aje/kwx367","pmid":"","date":"2018","journal":"American Journal of Epidemiology","authors":"Rotem R.S.; Chodick G.; Davidovitch M.; Hauser R.; Coull B.A.; Weisskopf M.G.","item_type":"journalArticle","volume":"187","issue":"4","pages":"656-663","issn":"00029262 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85045476590?origin=resultslist"},"METWIFBU":{"key":"METWIFBU","record_id":"R-METWIFBU","title":"Glans dehiscence after severe hypospadias repair. Is it a real complication? Clues from a study in post-pubertal patients","abstract":"Abstract Introduction Glans dehiscence (GD) is reportedly a common complication after proximal hypospadias repairs. However, the need for surgical correction is controversial. The aim of this study was to assess awareness, risk factors, and outcome of GD in post-pubertal patients. The agreement with surgeon assessment was also evaluated. Methods The design was retrospective. All consecutive patients treated for proximal hypospadias between 2000 and 2011 were included. The presence of GD was self-reported, and the participants could optionally upload a photograph for surgeon assessment. Cosmetic and functional outcomes were assessed by validated questionnaires (HOSE, PPPS, KINDL?, IIEF-5). Results were compared between patients with and without GD.Results Of 219 patients, 34 (16%) participated. Fourteen of them (41%) self-reported GD. Eighteen patients (8%) also uploaded a photograph and, in ten of them (56%), the surgeon noted the presence of GD with poor agreement [k?=???0.444 (95 CI ??0.856 to ??0.033)] with patient report. Patients self-reporting GD had had more frequently a penile curvature at diagnosis (12/14?=?86%, p?=?0.01), and had undergone a single-staged repair (100% vs. 65%, p?=?0.03). No difference was found in cosmetic and functional outcomes. Results were similar also comparing groups with and without GD as assessed by the surgeon.Conclusion GD was a common finding after severe hypospadias repair. It was more common in case of surgeon assessment with poor agreement between patients and surgeons. GD did not prove to have clear clinical implications. Therefore, in our opinion, surgical repair of GD should be recommended only on patients request.","doi":"10.1007/s00383-023-05387-0","pmid":"","date":"2023","journal":"Pediatric surgery international","authors":"Ludovica Durante; Filippo Ghidini; Francesco Panchieri; Eleonora Bovolenta; Vincenzo Bagnara; Ciro Esposito; Marco Castagnetti","item_type":"journalArticle","volume":"39","issue":"1","pages":"Article 101","issn":"0179-0358","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGE2MjM0NGU3OWRiYjAzOWQ3Mzk5YjNiNzE0NTc1NDA5GghyYjZ4MmE0YQ%3D%3D"},"MI3GXYPT":{"key":"MI3GXYPT","record_id":"R-MI3GXYPT","title":"Do vaginal spermicides cause birth defects?","abstract":"","doi":"","pmid":"12265919","date":"1981 Apr 16","journal":"Pediatric alert","authors":"","item_type":"journalArticle","volume":"6","issue":"8","pages":"1","issn":"0160-0184","isbn":"","url":""},"MR3JS99K":{"key":"MR3JS99K","record_id":"R-MR3JS99K","title":"尿道下裂患者术后抑郁情况及抑郁相关因素分析","abstract":"目的:分析尿道下裂患者术后抑郁症状的发生情况和相关影响因素。方法: 2015年1月至6月,选择1990年1月至1994年12月在福建医科大学附属漳州市医院行手术治疗的尿道下裂患者,并按1:1匹配同期年龄和心理健康的成年人。采用Zung氏抑郁自评量表和自制的心理调查表对纳入患者的抑郁情况进行调查,并对抑郁相关影响因素进行分析。结果:共纳入80例经手术治疗的尿道下裂患者和80例健康对照。两组男性第二性征发育均正常,双侧睾丸发育正常,测定血清睾酮水平无明显异常,术后阴茎长度、粗细与对照组比较均无明显差异。尿道下裂患者抑郁症状发生率为45.0%,而对照组仅为6.3%,其差异有统计学意义(χ2=6.632,P=0.01)。多元逐步回归分析结果显示,阴茎和阴囊外观满意度(F=16.210 3,P=0.001)、性生活满意度(F=4.621 2,P=0.036)和性功能(F=4.103 2,P=0.043)是影响尿道下裂患者术后抑郁症状的独立危险因素。结论:尿道下裂患者术后常发生抑郁症状,主要影响因素为阴茎和阴囊外观满意度、性生活满意度和性功能。","doi":"10.7507/1672-2531.20150207","pmid":"","date":"2015","journal":"中国循证医学杂志","authors":"杨明根; 郑周达; 许振强; 林海利; 庄志明; 张朝贤","item_type":"journalArticle","volume":"15","issue":"11","pages":"1254-1257","issn":"1672-2531","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemd4enl4MjAxNTExMDAzGghyYjZ4MmE0YQ%3D%3D"},"N8RUQQMA":{"key":"N8RUQQMA","record_id":"R-N8RUQQMA","title":"Microduplication of 3p25.3 and 4p23 regions in a patient with multiple congenital anomalies, congenital hypothyroidism and adrenogenital syndrome","abstract":"We report the case of a seven-year-old boy, unicogenised child, born at 33w, PN 1,540 Kg, (APGAR 8-10), hospitalized in neonatology unit for 30 days, invasive respiratory assistance was not necessary. At birth evidence of hypospadias with penile incurvation, oval fossa pervia, corpus callosum agenesis. Normal male karyotype. For positivity to screening for IC (in-situ normal thyroid), started L-Thyroxine therapy.When he was six the phenotype showed broad forehead, down-slant eyelid, bulbous nose tip with long filter, malarial hypoplasia, large auricles, no supplants, adrenarche, normal testicular volume, acceleration of growth rate, normal IQ. We started diagnostic procedure with confirmation of adrenogenital syndrome (double heterozygous V281L - R26W). At seven-year CMA test was performed with detection of microduplication region 3p25.3 about 546 Kb which partially involves the OMIM Diseasde gene causing ATP2B2 and a paternal segregation microduplication of the chromosome long arm 4, of the 4p23 region, extended about 181 Kb not involving OMIM Desease Causing genes. Both mutations to date are not assoc
