_b":false,"db_a":"CNKI","db_b":"SinoMed;万方","suggested_keep":"B","suggested_reason":"A得分4/B得分7","original_fields":{"pair_id":"D0328","key_a":"R2MYAZ9S","title_a":"尿道下裂发病相关危险因素的研究","date_a":"2004","DOI_a":"","key_b":"SEAF7BE6","title_b":"尿道下裂发病相关危险因素的研究","date_b":"2004","DOI_b":"10.3760/j:issn:1000-6702.2004.07.013","reason":"起始页或文章编号不同，保留复核"}},{"pair_id":"D0333","key_a":"R6XDDUAX","key_b":"SN8E87PY","bucket":"title","basis":"题名几乎相同+同年+同刊","similarity":1,"original_reason":"作者无法相互印证，保留复核","in555_a":false,"in555_b":false,"db_a":"万方","db_b":"Web of Science;万方;Scopus;PubMed","suggested_keep":"B","suggested_reason":"A得分4/B得分7","original_fields":{"pair_id":"D0333","key_a":"R6XDDUAX","title_a":"Hypospadias and Endocrine Disruption: Is There a Connection?","date_a":"2001","DOI_a":"","key_b":"SN8E87PY","title_b":"Hypospadias and endocrine disruption: Is there a connection?","date_b":"2001","DOI_b":"10.1289/ehp.011091175","reason":"作者无法相互印证，保留复核"}}],"records":{"276KRJLX":{"key":"276KRJLX","record_id":"R-276KRJLX","title":"Meeting report: Moving upstream - Evaluating adverse upstream end points for improved risk assessment and decision-making","abstract":"Background: Assessing adverse effects from environmental chemical exposure is integral to public health policies. Toxicology assays identifying early biological changes from chemical exposure are increasing our ability to evaluate links between early biological disturbances and subsequent overt downstream effects. A workshop was held to consider how the resulting data inform consideration of an \"adverse effect\" in the context of hazard identification and risk assessment. Objectives: Our objective here is to review what is known about the relationships between chemical exposure, early biological effects (upstream events), and later overt effects (downstream events) through three case studies (thyroid hormone disruption, antiandrogen effects, immune system disruption) and to consider how to evaluate hazard and risk when early biological effect data are available. Discussion: Each case study presents data on the toxicity pathways linking early biological perturbations with downstream overt effects. Case studies also emphasize several factors that can influence risk of overt disease as a result from early biological perturbations, including background chemical exposures, underlying individual biological processes, and disease susceptibility. Certain effects resulting from exposure during periods of sensitivity may be irreversible. A chemical can act through multiple modes of action, resulting in similar or different overt effects. Conclusions: For certain classes of early perturbations, sufficient information on the disease process is known, so hazard and quantitative risk assessment can proceed using information on upstream biological perturbations. Upstream data will support improved approaches for considering developmental stage, background exposures, disease status, and other factors important to assessing hazard and risk for the whole population.","doi":"10.1289/ehp.11516","pmid":"","date":"2008","journal":"Environmental Health Perspectives","authors":"Woodruff T.J.; Zeise L.; Axeirad D.A.; Guyton K.Z.; Janssen S.; Miller M.; Miller G.G.; Schwartz J.M.; Alexeeff G.; Anderson H.; Birnbaum L.; Bois F.; Cogliano V.J.; Crofton K.; Euling S.Y.; Foster P.M.D.; Germolec D.R.; Gray E.; Hattis D.B.; Kyle A.D.; Luebke R.W.; Luster M.I.; Portier C.; Rice D.C.; Solomon G.; Vandenberg J.; Zoeller R.T.","item_type":"journalArticle","volume":"116","issue":"11","pages":"1568-1575","issn":"0091-6765","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L354136821&from=export"},"297RZUWU":{"key":"297RZUWU","record_id":"R-297RZUWU","title":"Periconception Exposure to Air Pollution and Risk of Congenital Malformations.","abstract":"Objective: To evaluate the association between increased exposure to airborne fine particulate matter (PM                             2.5                             ) during the periconception period with risk of congenital anomalies. Study design: Using birth certificate data from the Ohio Department of Health (2006-2010) and PM                             2.5                              data from the US Environmental Protection Agency's 57 monitoring stations located throughout Ohio, the geographic coordinates of the mother's residence for each birth were linked to the nearest PM                             2.5                              monitoring station and monthly exposure averages were calculated. The association between congenital anomalies and increased PM                             2.5                              levels was estimated, with adjustment for coexistent risk factors. Results: After adjustment for coexisting risk factors, exposure to increased levels of PM                             2.5                              in the air during the periconception period was modestly associated with risk of congenital anomalies. Compared with other periconception exposure windows, increased exposure during the 1 month before conception was associated with the highest risk increase at lesser distances from monitoring stations. The strongest influences of PM                             2.5                              on individual malformations were found with abdominal wall defects and hypospadias, especially during the 1-month preconception. Conclusions: Increased exposure to PM                             2.5                              in the periconception period is associated with some modest risk increases for congenital malformations. The most susceptible time of exposure appears to be the 1 month before and after conception. Although the increased risk with PM                             2.5                              exposure is modest, the potential impact on a population basis is noteworthy because all pregnant women have some degree of exposure.                          © 2017 Elsevier Inc.","doi":"10.1016/j.jpeds.2017.09.076","pmid":"","date":"2018","journal":"Journal of Pediatrics","authors":"Ren Sheng; Haynes Erin; Hall Eric; Hossain Monir; Chen Aimin; Muglia Louis; Lu Long; DeFranco Emily","item_type":"journalArticle","volume":"193","issue":"","pages":"76-84.e6","issn":"00223476 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85037602446?origin=resultslist"},"2AV2NFDH":{"key":"2AV2NFDH","record_id":"R-2AV2NFDH","title":"FOXP1 Haploinsufficiency Contributes to the Development of Congenital Diaphragmatic Hernia.","abstract":"FOXP1 encodes a transcription factor involved in tissue regulation and cell-type-specific functions. Haploinsufficiency of FOXP1 is associated with a  neurodevelopmental disorder: autosomal dominant mental retardation with language  impairment with or without autistic features. More recently, heterozygous FOXP1  variants have also been shown to cause a variety of structural birth defects  including central nervous system (CNS) anomalies, congenital heart defects,  congenital anomalies of the kidney and urinary tract, cryptorchidism, and  hypospadias. In this report, we present a previously unpublished case of an  individual with congenital diaphragmatic hernia (CDH) who carries an  approximately 3.8 Mb deletion. Based on this deletion, and deletions previously  reported in two other individuals with CDH, we define a CDH critical region on  chromosome 3p13 that includes FOXP1 and four other protein-coding genes. We also  provide detailed clinical descriptions of two previously reported individuals  with CDH who carry de novo, pathogenic variants in FOXP1 that are predicted to  trigger nonsense-mediated mRNA decay. A subset of individuals with putatively  deleterious FOXP4 variants has also been shown to develop CDH. Since FOXP  proteins function as homo- or heterodimers and the homologs of FOXP1 and FOXP4  are expressed at the same time points in the embryonic mouse diaphragm, they may  function together as a dimer, or in parallel as homodimers, to regulate gene  expression during diaphragm development. Not all individuals with heterozygous,  loss-of-function changes in FOXP1 develop CDH. Hence, we conclude that FOXP1 acts  as a susceptibility factor that contributes to the development of CDH in  conjunction with other genetic, epigenetic, environmental, and/or stochastic  factors.","doi":"10.1055/s-0043-1767731","pmid":"38567173","date":"2024 Mar","journal":"Journal of pediatric genetics","authors":"Pendleton Katherine E.; Hernandez-Garcia Andres; Lyu Jennifer M.; Campbell Ian M.; Shaw Chad A.; Vogt Julie; High Frances A.; Donahoe Patricia K.; Chung Wendy K.; Scott Daryl A.","item_type":"journalArticle","volume":"13","issue":"1","pages":"29-34","issn":"2146-4596 2146-460X","isbn":"","url":""},"2MEKWCXX":{"key":"2MEKWCXX","record_id":"R-2MEKWCXX","title":"Teratogenic Effects of Antiepileptic Drugs: Implications for the Management of Epilepsy in Women of Childbearing Age","abstract":"Summary:Exposure to antiepileptic drug (AED) treatment in utero occurs in 1 of every 250 newborns. The absolute risk of major malformations in these infants is about 7–10%, ˜3–5% higher than in the general population. Specific risk factors include high maternal daily dosage or serum concentrations of AED, low folate levels, polytherapy, and generalized seizures during pregnancy. Adverse pregnancy outcomes, including congenital heart malformations, facial clefts, spina bifida aperta, hypospadias, growth retardation, and psychomotor and mental retardation, are associated with, although not necessarily caused by, AED exposure. Specific cognitive defects, hypertelorism, and nail hypoplasia can be causally related to specific AED exposures. To prevent teratogenic side effects, the prospective mother should be treated with AEDs only when absolutely necessary. Monotherapy with the AED that is most effective in the lowest possible daily dose (divided into at least two or three administrations) should be prescribed. High‐dose folate supplementation (4–5 mg/day) reduces the risk of a neural tube defect in a child whose sibling had such a defect, but its impact on the specific teratogenic risks of AEDs is unknown. A substantial proportion of fetal malformations may be secondarily prevented by prenatal diagnosis, consisting of a fetal structural ultrasound examination at weeks 18 and 20 of gestation and, with VPA or CBZ administration, an α1‐fetoprotein analysis of amniotic fluid at week 16. Determination of a specific defect prevention strategy depends largely on parental attitudes toward prenatal diagnosis and termination of pregnancy, which should be discussed before conception. The availability of many new AEDs, many of which will be used in polytherapy, will make prospective evaluation of large numbers of pregnancy outcome on a population basis even more important in","doi":"10.1111/j.1528-1157.1994.tb05952.x","pmid":"","date":"1994","journal":"Epilepsia","authors":"Dick Lindhout; Juliette G. C. Omtzigt","item_type":"journalArticle","volume":"35","issue":"1","pages":"19-28","issn":"0013-9580","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDNkZWFiZWMwYmRlNzhmZGFhMjM1OTI4N2UyODQyOTExGghyYjZ4MmE0YQ%3D%3D"},"2RBEGR7Z":{"key":"2RBEGR7Z","record_id":"R-2RBEGR7Z","title":"Letter to the Editor re: “Evaluating the utility of ChatGPT in enhancing parental education and clinical support in hypospadias care”","abstract":"","doi":"10.1016/j.jpurol.2026.105820","pmid":"","date":"2026","journal":"Journal of Pediatric Urology","authors":"Sivri I.; Ozden F.M.; Colak T.","item_type":"journalArticle","volume":"22","issue":"3","pages":"","issn":"14775131 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/105032225388?origin=resultslist"},"2RVHVM4L":{"key":"2RVHVM4L","record_id":"R-2RVHVM4L","title":"Editorial comment: Birth prevalence of hypospadias and hypospadias risk factors in newborn males in the United States from 1997 to 2012.","abstract":"","doi":"10.1016/j.jpurol.2018.11.010","pmid":"","date":"2019","journal":"Journal of Pediatric Urology","authors":"J.C. Routh","item_type":"journalArticle","volume":"15","issue":"1","pages":"103-104","issn":"14775131 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85059185404?origin=resultslist"},"2UVL2FQ4":{"key":"2UVL2FQ4","record_id":"R-2UVL2FQ4","title":"Association of reproductive disorders and male congenital anomalies with environmental exposure to endocrine active pesticides","abstract":"There is growing evidence that environmental exposure to pesticides may increase the risk of developing reproductive and developmental disorders. This study determined the prevalence and risk of developing gestational disorders and male congenital genitourinary malformations in areas with distinct exposure to pesticides, many of them with potential endocrine disrupting properties. A population-based case–control study was carried out on pregnant women and male children living in ten health districts of Andalusia classified as areas of high and low environmental exposure to pesticides according to agronomic criteria. The study population included 45,050 cases and 950,620 controls matched for age and health district. Data were collected from computerized hospital records between 1998 and 2005. Prevalence rates and risk of miscarriage, low birth weight, hypospadias, cryptorchidism and micropenis were significantly greater in areas with higher use of pesticides in relation to those with lower use, thus supporting and extending previous information. © 2017 Elsevier Inc.","doi":"10.1016/j.reprotox.2017.04.011","pmid":"","date":"2017","journal":"Reproductive Toxicology","authors":"González J.G.; Miranda M.I.V.; Mullor M.R.; Jerez A.F.H.; Carreño T.P.; Rodriguez R.A.","item_type":"journalArticle","volume":"71","issue":"","pages":"95-100","issn":"08906238 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85019137750?origin=resultslist"},"2WPV4QDC":{"key":"2WPV4QDC","record_id":"R-2WPV4QDC","title":"Risk factors of glan dehiscence after tubularized incised plate urethroplasty hypospadias repair","abstract":"Objective To explore the risk factors of glan dehiscence after TIP repairing in hypospadias children. Methods This retrospective study involved 77 consecutive hypospadias children undergoing TIP repair from November 2017 to September 2018. All patients were followed up for 6-15 months. The relevant clinical data collected included age, glan width, urethral plate width pre-incision, neourethra length, distance between meatus and corona, type of catheter and whether dorsal plication or not. Independent t test, chi-square test and logistic regression were performed for evaluating the risk factors of glan dehiscence. Results Glan dehiscence occurred in 10 (13. 0%) patients. Our result indicated significant associations existed between group with glan dehiscence and group without glan dehiscence with respects to glan width, distance between meatus and corona and type of catheter (all P\u003c0. 05). Conclusions Glan dehiscence is the most common complication after TIP hypospadias repair. Glan width, distance between meatus and corona and type of catheter were obviously correlated with the development of glan dehiscence. A more extensive glans mobilization with >4. 5 mm distance between meatus and corona and 6Fr catheter regardless of age helps to minimize the occurrence of glan dehiscence. © 2019 Chinese Medical Journals Publishing House Co.Ltd. All rights reserved.","doi":"10.3760/cma.j.issn.0253-3006.2019.11.002","pmid":"","date":"2019","journal":"Chinese Journal of Pediatric Surgery","authors":"Liu W.; Wu X.; Wang X.; Wu R.","item_type":"journalArticle","volume":"40","issue":"11","pages":"963-966","issn":"02533006 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85183097611?origin=resultslist"},"2X2CMG4L":{"key":"2X2CMG4L","record_id":"R-2X2CMG4L","title":"Meconium Concentrations of Pesticides and Risk of Hypospadias: A Case-Control Study in Brittany, France.","abstract":"BACKGROUND: Hypospadias is a male genital tract defect for which an increase in prevalence has been documented over the last few decades. A role for  environmental risk factors is suspected, including prenatal exposure to  pesticides. OBJECTIVES: To study the risk of hypospadias in association with  multiple pesticide measurements in meconium samples. METHODS: The Brittany  Registry of Congenital Anomalies (France) conducted a case-control study between  2012 and 2018. Cases were hypospadias, ascertained by a pediatrician and a  pediatric surgeon, excluding genetic conditions, following European Surveillance  of Congenital Anomalies guidelines (N = 69). Controls (N = 135) were two male  infants without congenital anomaly born after each case in the same maternity  unit. Mothers in the maternity units completed a self-administered questionnaire,  we collected medical data from hospital records, and medical staff collected  meconium samples. We performed chemical analysis of 38 pesticides (parent  compound and/or metabolite) by UHPLC/MS/MS following strict quality  assurance/quality control criteria and blind to case-control status. We carried  out logistic regression accounting for frequency-matching variables and major  risk factors. RESULTS: Among the 38 pesticides measured, 16 (42%) were never  detected in the meconium samples, 18 (47%) were in \u003c5% of samples, and 4 (11%) in  ≥5% of the samples. We observed an association between the detection of  fenitrothion in meconium and the risk of hypospadias (OR = 2.6 [1.0-6.3] with n  cases = 13, n controls = 21), but not the other pesticides. CONCLUSIONS: Our  small study provides a robust assessment of fetal exposure. Fenitrothion's  established antiandrogenic activities provide biologic plausibility for our  observations. Further studies are needed to confirm this hypothesis.","doi":"10.1097/EDE.0000000000001688","pmid":"","date":"2024","journal":"Epidemiology","authors":"Florence Rouget; Adèle Bihannic; Barbara Le Bot; Fabien Mercier; Erwann Gilles; Ronan Garlantezec; Luc Multigner; Sylvaine Cordier; Alexis Arnaud; Patrick Pladys; Cécile Chevrier","item_type":"journalArticle","volume":"35","issue":"2","pages":"185-195","issn":"1044-3983","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGQxZTM2NzIwNTFlZjQ4MWY0M2YxMmY5MThjOWU2MTRhGghyYjZ4MmE0YQ%3D%3D"},"2XLSBKDJ":{"key":"2XLSBKDJ","record_id":"R-2XLSBKDJ","title":"Repair of proximal hypospadias with single-stage (Duckett's method) or Bracka two-stage: a retrospective comparative cohort study.","abstract":"BACKGROUND: Surgical correction of proximal hypospadias is challenging. The complication rate of proximal hypospadias is still high, and the debate over its  optimal treatment is ongoing. Duckett's method is a classic non-staging  operation, and two-stage Bracka repair is an attractive alternative procedure.  Herein, we retrospectively analyzed the effects of two surgical techniques on  proximal hypospadias in order to reduce the complication rates of proximal  hypospadias, and analyzed the various risk factors that cause complications.  METHODS: This study retrospectively evaluated 94 consecutive patients who  underwent repair of penoscrotal or proximal defects between 2015 and 2019.  Patients were assigned to two groups: 46 patients were treated with Bracka and 48  with Duckett. Patient age at surgery, urethral meatus location, and postoperative  complications were recorded. One-way analysis of variance (ANOVA) was used to  analyze the length and curvature of the penis and the length of the urethral  defect. RESULTS: There was no significant difference between the two groups in  terms of age and type of hypospadias. In the Bracka group, there was 1 case  (2.2%) of meatal stenosis after the first stage, which was restored with ureteral  dilatation. After second-stage repair, a urethral fistula was noted in 4 cases  (8.7%) and strictures in 2 cases (4.3%). In the Duckett group, urethral fistulas  were noted in 8 cases (16.7%), strictures in 4 cases (8.3%), partial glans  dehiscence in 4 cases (8.3%), and diverticulum in 1 case (2.1%) postoperatively.  Compared with the Duckett group, the overall complication rate for Bracka repair  was lower (35.4% vs. 13%, P=0.016). In addition, compared with the Duckett group,  children with perineal hypospadias who were treated with the Bracka operation had  fewer postoperative complications (100% vs. 13%, P=0.015). Risk factor analysis  showed that the initial curvature of the penis, initial urethral defect, and  degree of penile curvature after skin degloving were not correlated with  complications. There was a significant correlation between urethral defects after  correction of the chordee and urethral fistulas (P=0.019). CONCLUSIONS: Compared  with the Duckett procedure, the Bracka two-stage repair may be a safer and more  reliable approach for proximal hypospadias in children. The Bracka two-stage  repair should be used for perineal hypospadias. The larger the urethral defect  after chordee correction, the greater the possibility of a postoperative urethral  fistula.","doi":"10.21037/tp-23-75","pmid":"37035394","date":"2023 Mar 31","journal":"Translational pediatrics","authors":"Wu Yong; Guan Yong; Wang Xin; Wang Cong; Ma Xiong; Guan Heyang","item_type":"journalArticle","volume":"12","issue":"3","pages":"387-395","issn":"2224-4344 2224-4336","isbn":"","url":""},"2XRX2EY4":{"key":"2XRX2EY4","record_id":"R-2XRX2EY4","title":"尿道下裂患儿临床特征及危险因素分析","abstract":"目的了解尿道下裂患儿临床特征,探究尿道下裂的致病危险因素,为尿道下裂病因学研究及高危人群的早期干预和治疗提供参考。方法回顾性分析2004年1月至2018年6月由宁夏医科大学总医院小儿外科收治的682例先天性尿道下裂患儿作为研究对象,其中单纯性尿道下裂481例(70. 53%),合并其他畸形201例(29. 47%)。对481例无合并症的先天性尿道下裂患儿及同期住院的500例无先天性尿道下裂患儿的父母进行问卷调查。结果 682例先天性尿道下裂患儿入院年龄(3. 75±2. 78)岁,城镇297例(43. 55%),乡村385例(56. 45%)。682例先天性尿道下裂患儿阴茎头型20例(2. 93%),冠状沟型119例(17. 45%),阴茎体型316例(46. 33%),阴茎阴囊型190例(27. 86%),阴囊型30例(4. 40%),会阴型7例(1. 03%)。201例合并其他畸形患儿中;合并1种畸形180例(89. 55%),合并2种畸形15例(7. 46%),合并3种畸形6例(2. 99%);合并泌尿生殖系统畸形170例(84. 58%)[其中隐睾畸形150例(88. 24%)],合并心血管系统畸形21例(10. 45%),合并肌肉骨骼系统畸形5例(2. 49%),合并其他畸形9例(4. 48%)。早产(OR=10. 60)、低出生体重(OR=3. 94)、母亲妊娠期高血压(OR=10. 15)、母亲孕期饮食缺乏鱼类(OR=2. 53)、父亲生活性接触化学污染物(OR=2. 79)是尿道下裂的致病危险因素。结论先天性尿道下裂患儿中,尿道下裂阴茎体型最常见,少部分患儿合并先天性畸形,以泌尿生殖系统畸形最为常见,尤其是隐睾畸形;早产、低出生体重、母亲妊娠期高血压、母亲孕期饮食缺乏鱼类、父亲生活性接触化学污染物是尿道下裂的致病危险因素。","doi":"10.3969/j.issn.1671-6353.2019.10.011","pmid":"","date":"2019","journal":"临床小儿外科杂志","authors":"柳琪; 单振潮; 梁仁章; 苏泽礼; 周雪鸿","item_type":"journalArticle","volume":"18","issue":"10","pages":"854-858","issn":"1671-6353","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRbGN4ZXdrenoyMDE5MTAwMTEaCHJiNngyYTRh"},"32CGZFCJ":{"key":"32CGZFCJ","record_id":"R-32CGZFCJ","title":"Primary gonadal dysgenesis in male 46,XY patients with NR5A1 variants predominantly affects sertoli cell function","abstract":"Background: Steroidogenic factor 1 (encoded by the NR5A1 gene) is a transcriptional regulator of genes involved in gonadal development and steroidogenesis. Mutations in NR5A1 are associated with a wide phenotypic spectrum in 46,XY individuals ranging from partial/complete gonadal dysgenesis or anorchia, ambiguous genitalia, hypospadias, to infertility. However, little is known about the longitudinal course of endocrine markers for Sertoli and Leydig cell function from infancy to adolescence in these patients. Objective: To investigate the Sertoli and Leydig cell function in 46,XY patients with an NR5A1 variant reared as males by longitudinal analyses of the Sertoli cell markers inhibin B and anti- Müllerian hormone, the gonadotropins FSH and LH as well as testosterone. Results: We retrospectively analyzed the laboratory results of six male 46,XY patients with NR5A1 variants. During mini-puberty, inhibin B levels were in the low or low normal range, but variable (median 91 pg/ml, range 55-172 pg/ml). From the age of 10 to 18 years, inhibin B levels strongly decreased in all patients (median 13 pg/ml, range 3-21 pg/ml). During adolescence, anti-Müllerian hormone levels were very low as well (median 0.46 ng/ml, range 0.14-1.2 ng/ml). 3 of 4 patients who were followed during adolescence had a strong rise of FSH from a median of 9.02 IU/l (range 8.8-49.9 IU/l) to 56.1 IU/l (range 27.1-77.2 IU/l). LH increased from a median of 2.41 IU/l (range 1.03-8.8 IU/l) to 14.9 IU/l (range 7.6-48.0 IU/l). During infancy, testosterone levels ranged from 0.03 μg/l to 1.87 μg/l (median 0.48 μg/l). Interestingly, despite elevated gonadotropin levels indicating gonadal dysfunction, testosterone levels spontaneously rose into adequate levels (median of maximal testosterone 4.75 μg/l, range 2.27-7.1 μg/l) during the course of puberty. Conclusion: Follow-up laboratory investigations may provide useful information on Sertoli and Leydig cell function in 46,XY individuals with NR5A1 variants. Primary gonadal dysgenesis in these patients is associated with hypergonadotropic hypogonadism and low Sertoli-cell markers, but spontaneous testosterone production during adolescence. Thus, Sertoli cell function seems to be more affected than Leydig cell function. More clinical studies are needed to better predict the future gonadal function including spermatogenesis and testosterone production, and to derive therapeutic implications for clinical practice.","doi":"10.1159/000492307","pmid":"","date":"2018","journal":"Hormone Research in Paediatrics","authors":"Hoppmann J.; Werner R.; Lunstedt R.; Birnbaum W.; Schwab O.; Marshall L.; Wunsch L.; Hiort O.","item_type":"journalArticle","volume":"90","issue":"(Hoppmann J.; Werner R.; Lunstedt R.; Birnbaum W.; Marshall L.; Hiort O.) Division of Paediatric Endocrinology and Diabetes, Department of Paediatrics and Adolescent Medicine, University of Lübeck, Lübeck, Germany","pages":"541-542","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L630605076&from=export"},"358Z9796":{"key":"358Z9796","record_id":"R-358Z9796","title":"Primary hypospadias repair outcomes: results from a retrospective cohort of 292 children.","abstract":"Purpose: Hypospadias surgery is challenging. Numerous techniques have been described with variable complication rates. The main objectives of our study were to evaluate the urethroplasty complication rate of primary hypospadias repair and to identify risk factors for complications. Methods: We retrospectively evaluated the outcomes of all patients who underwent primary hypospadias repair in our department between January 2012 and December 2020. Demographic, anatomical, operative, and postoperative data were reported. Univariate and multivariate logistic regression analyses were performed to identify variables associated with complications. Statistical significance was set at p \u003c 0.05. Results: Of 292 patients, 203 (69.5%) had distal hypospadias, 63 (21.6%) had mid-penile hypospadias, and 26 (8.9%) had proximal hypospadias. The mean age at the time of surgery was 22.8 months. Seventy-eight patients (26.7%) had urethroplasty complications. The rate of complications was higher for proximal hypospadias (57.7%), onlay island flap (44.4%), and Koyanagi (75%) procedures. The mean follow-up duration was 29 months. Two predictors of complications were identified by multivariate analysis: catheterization duration and urethroplasty technique. The reoperation rate was 30.5%. Conclusion: Urethroplasty complications frequently occur after primary hypospadias repair. The complication rate was higher in proximal hypospadias. Catheterization duration and surgical technique were significant predictors of complications. A longer and more standardized follow-up is needed for a better assessment of hypospadias repair outcomes. © The Author(s), under exclusive licence to Springer-Verlag GmbH Germany, part of Springer Nature 2024.","doi":"10.1007/s00345-024-04811-x","pmid":"","date":"2024","journal":"World journal of urology","authors":"O. Hild; A. Fotso Kamdem; N. Boulard; F. Auber; Y. Chaussy","item_type":"journalArticle","volume":"42","issue":"1","pages":"137","issn":"1433-8726","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L643749534&from=export"},"36IWVHCB":{"key":"36IWVHCB","record_id":"R-36IWVHCB","title":"Increasing Prevalence of Hypospadias Associated With Various Perinatal Risk Factors in Chinese Newborns COMMENT REPLY","abstract":"","doi":"10.1016/j.urology.2009.02.019","pmid":"","date":"2009 JUN","journal":"UROLOGY","authors":"Sun G","item_type":"journalArticle","volume":"73","issue":"6","pages":"1246-1246","issn":"0090-4295","isbn":"","url":""},"39WIZ6B2":{"key":"39WIZ6B2","record_id":"R-39WIZ6B2","title":"IP70-26 PREOPERATIVE NARROW MEATUS AS A PREDICTOR OF COMPLICATIONS AFTER HYPOSPADIAS REPAIR: A PROSPECTIVE STUDY","abstract":"INTRODUCTION AND OBJECTIVES: – Most studies assessing surgical outcomes in hypospadias focus on meatal location, chordee severity and urethral plate quality. However, the caliber of the native meatus before surgery—specifically whether it is narrow—has not been evaluated as a potential risk factor. This study aimed to determine whether a narrow preoperative meatus predicts meatal stenosis (MS) or other complications after primary hypospadias repair.METHODS: – A prospective study was conducted in boys undergoing single-stage hypospadias repair by the same surgical team. At the beginning of surgery, the meatus was defined as narrow if a 5-Fr feeding tube failed to pass easily; all others were classified as non-narrow. In narrow cases, a dorsal incision—similar to the tubularized incised plate (TIP) technique—was performed until free catheter passage was achieved. If a resistance point or dorsal ridge was encountered preventing smooth catheter advancement, the incision was extended proximally until the catheter could be inserted effortlessly. Postoperative MS was defined clinically when the meatus appeared stenotic at follow-up. Complications (urethrocutaneous fistula, dehiscence, and postoperative MS) were recorded at one year.RESULTS: – Of 100 children who underwent surgery, 32 (32%) had a narrow meatus at the start of the operation. These patients typically presented with a more distal meatus (p=0.011) (Table 1). At one-year follow-up, postoperative meatal MS was more frequent among children with preoperative narrowing (21.9% vs. 7.4%, p=0.033). No significant differences were observed in fistula or dehiscence rates. In regression analysis adjusting for meatal location and plate quality, preoperative narrow meatus remained an independent predictor of postoperative MS (OR 7.03, 95% CI 1.4–36.5, p=0.020).CONCLUSIONS: – A narrow meatus at hypospadias presentation was found in approximately one-third of cases—higher than previously reported. The described technique, emphasizing dorsal obstruction release, yielded outcomes comparable to cases without preoperative stenosis; however, the likelihood of postoperative MS remained higher in these patients. This finding may reflect inherent tissue characteristics, variations in surgical technique, or inconsistency in defining postoperative MS. Further studies are warranted to clarify these mechanisms and refine surgical strategies to prevent recurrent narrowing.Source of Funding: – None","doi":"10.1097/01.JU.0001191704.13236.7f.26","pmid":"","date":"2026","journal":"Journal of Urology","authors":"Itshak A.; Visman Y.; Neheman A.; Gildor O.S.","item_type":"journalArticle","volume":"","issue":"(Itshak A.) Kfar Saba, Israel","pages":"","issn":"1527-3792","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2045780478&from=export"},"3F4YBTC3":{"key":"3F4YBTC3","record_id":"R-3F4YBTC3","title":"Haplotype analysis of the estrogen receptor alpha gene in precocious puberty","abstract":"Background: Exposures to environmental endocrine disruptors (EEDs) are suspected to alter onset of puberty. Little is known, however about the role of genetic susceptibility to EEDs in this phenomenon. On the other hand, previous Japanese studies have suggested that the specific haplotype within a roughly 50 kb linkage disequilibrium (LD) block of the estrogen receptor alpha gene (ESR1) markedly raises the susceptibility to the development of cryptorchidism (CO) and hypospadias (HS) in response to estrogenic EEDs. Objective: To determine whether precocious puberty (PP) is associated with a specific ESR1 haplotype that mediate the estrogenic effects of EEDs. Subjects: 90 Italian female patients with idiopathic central precocious puberty (ICPP) who required GnRH agonist treatment, 56 Italian females with early pubertal development (EP) who did not require any treatment for preserved predicted height and 42 Italian normal control (NC) females. Intervention: After genotyping 5 SNPs (rs926779, rs3020364, rs6932902, rs3020371, rs3020375) covering the specific LD block of ESR1 identified in the previous study, haplotype analysis was performed. Results: The LD block was identified in the females with ICPP and EP and in the NC females. The frequencies of the specific haplotype within the LD block were similar between the females with PP and the NC females. No significant association was identified between the specific haplotype within the block and the phenotype. Conclusions: No significant association was identified between the specific ESR1 haplotype and PR However, in contrast to CO and HS which develop during the fetal life, PP becomes discernible in childhood and, therefore, could be influenced by multiple genetic and environmental factors. Furthermore, there may be ethnic difference between Japanese and Italian populations. Thus, the relevance of genetic susceptibility to estrogenic EEDs in the development of PP may remain obscure.","doi":"10.1159/000321348","pmid":"","date":"2010","journal":"Hormone Research in Paediatrics","authors":"Ogata T.; Rie Y.; Massart F.","item_type":"journalArticle","volume":"74","issue":"(Ogata T.; Rie Y.) National Research Institute for Child Health and Development, Department of Endocrinology and Metabolism, Tokyo, Japan","pages":"147","issn":"1663-2818","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L70462218&from=export"},"3HCET5RF":{"key":"3HCET5RF","record_id":"R-3HCET5RF","title":"Maternal inflammatory bowel disease and hypospadias in male offspring: a population-based study in Denmark.","abstract":"Background: The occurrence of inflammatory bowel disease (IBD) and hypospadias has been concurrently increasing, possibly through shared environmental risk factors such as endocrine disrupting compounds. Also, maternal IBD may disturb the normal development of the fetal reproductive tract. However, whether maternal IBD increases the risk of hypospadias in male offspring is unknown. We compared hypospadias risk in sons of mothers with and without IBD. Methods: We used Danish nationwide populationbased registries to conduct a longitudinal prevalence study including all live-born boys from 1979 through 2009. We computed HRs, as estimates of prevalence ratios (PRs), with 95% CIs for hypospadias, using Cox proportional hazards regression, while adjusting for measured confounding. Results: Among 966 038 live-born boys, 4688 (0.5%) had a mother with a history of IBD diagnosis before the relevant childbirth. Among the boys with maternal IBD, 36 (0.8%) were diagnosed with hypospadias any time after birth, whereas 6112 (0.6%) sons of mothers without IBD diagnosis had hypospadias (adjusted PR: 1.20, (95% CI 0.86 to 1.67). Adjusted PRs for maternal Crohn's disease and ulcerative colitis were 1.38 (95% CI 0.83 to 2.29) and 1.10 (95% CI 0.71 to 1.68), respectively. Analyses defining hypospadias diagnosis recorded \u003c6 months postpartum showed similar results. Conclusions: We found no convincing evidence of an association between maternal IBD and hypospadias. Copyright © 2016 by the BMJ Publishing Group Ltd & British Society of Gastroenterology. All rights reserved.","doi":"10.1136/bmjgast-2016-000121","pmid":"27933203","date":"2016","journal":"BMJ open gastroenterology","authors":"Andersen Ane Birgitte Telén; Ehrenstein Vera; Erichsen Rune; Frøslev Trine; Sørensen Henrik Toft","item_type":"journalArticle","volume":"3","issue":"1","pages":"e000121","issn":"2054-4774","isbn":"","url":"https://www.scopus.com/pages/publications/85050480764?origin=resultslist"},"3KGTZTND":{"key":"3KGTZTND","record_id":"R-3KGTZTND","title":"Children's health and the environment: A new agenda for prevention research","abstract":"Patterns of illness in American children have changed dramatically in this century. The ancient infectious diseases have largely been controlled. The major diseases confronting children now are chronic and disabling conditions termed the 'new pediatric morbidity' - asthma mortality has doubled; leukemia and brain cancer have increased in incidence; neurodevelopmental dysfunction is widespread; hypospadias incidence has doubled. Chemical toxicants in the environment as well as poverty, racism, and inequitable access to medical care are factors known and suspected to contribute to causation of these pediatric diseases. Children are at risk of exposure to over 15,000 high-production-volume synthetic chemicals, nearly all of them developed in the past 50 years. These chemicals are used widely in consumer products and are dispersed in the environment. More than half are untested for toxicity. Children appear uniquely vulnerable to chemical toxicants because of their disproportionately heavy exposures and their inherent biological susceptibility. To prevent disease of environmental origin in America's children, the Children's Environmental Health Network (CEHN) calls for a comprehensive, national, child-centered agenda. This agenda must recognize children's vulnerabilities to environmental toxicants. It must encompass a) a new prevention-oriented research focus; b) a new child-centered paradigm for health risk assessment and policy formulation; and c) a campaign to educate the public, health professionals, and policy makers that environmental disease is caused by preventable exposures and is therefore avoidable. To anchor the agenda, CEHN calls for long-term, stable investment and for creation of a national network of pediatric environmental health research and prevention centers.","doi":"10.1289/ehp.98106787","pmid":"","date":"1998","journal":"Environmental Health Perspectives","authors":"Landrigan P.J.; Carlson J.E.; Bearer C.F.; Cranmer J.S.; Bullard R.D.; Etzel R.A.; Groopman J.; McLachlan J.A.; Perera F.P.; Routt Reigart J.; Robison L.; Schell L.; Suk W.A.","item_type":"journalArticle","volume":"106","issue":"SUPPL. 3","pages":"787-794","issn":"0091-6765","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L28342317&from=export"},"3PSX7VW9":{"key":"3PSX7VW9","record_id":"R-3PSX7VW9","title":"A mixture of seven antiandrogens induces reproductive malformations in rats","abstract":"To date, regulatory agencies have not considered conducting cumulative risk assessments for mixtures of chemicals with diverse mechanisms of toxicity because it is assumed that the chemicals will act independently and the individual chemical doses are not additive. However, this assumption is not supported by new research addressing the joint effects of chemicals that disrupt reproductive tract development in the male rat by disrupting the androgen signalling pathway via diverse mechanisms of toxicity [i.e. androgen receptor (AR) antagonism in the reproductive tract vs. inhibition of androgen synthesis in the foetal testis]. In this study, pregnant rats were exposed to four dilutions of a mixture containing vinclozolin, procymidone, linuron, prochloraz, benzyl butyl phthalate, dibutyl phthalate and diethylhexyl phthalate during the period of sexual differentiation and male offspring were assessed for effects on hormone sensitive endpoints including: anogenital distance, infant areolae retention and reproductive tract tissue weights and malformations. The ratio of the chemicals in the mixture was based upon each chemical's ED50 for inducing reproductive tract malformations (hypospadias or epididymal agenesis). The observed responses from the mixture were compared with predicted responses generated with a toxic equivalency approach and models of dose addition, response addition or integrated addition. As hypothesized, we found that the mixture of chemicals that alter the androgen signalling pathway via diverse mechanisms disrupted male rat reproductive tract differentiation and induced malformations in a cumulative, dose-additive manner. The toxic equivalency and dose addition models provided the best fit to observed responses even though the chemicals do not act via a common cellular mechanism of action. The current regulatory framework for conducting cumulative risk assessments needs to consider the results, including those presented herein, which indicate that chemicals that disrupt foetal tissues during sexual differentiation act in a cumulative, dose-additive manner irrespective of the specific cellular mechanism of toxicity.","doi":"10.1111/j.1365-2605.2007.00859.x","pmid":"","date":"2008","journal":"","authors":"Rider C.V.; Furr J.; Wilson V.S.; Gray Jr. L.E.","item_type":"conferencePaper","volume":"31","issue":"2","pages":"249-262","issn":"","isbn":"13652605 (ISSN)","url":"https://www.scopus.com/pages/publications/40349110847?origin=resultslist"},"3VHY8SAG":{"key":"3VHY8SAG","record_id":"R-3VHY8SAG","title":"Melanosis of the urinary bladder.","abstract":"Melanosis bladder refers to the urothelium of the bladder appearing black and velvety, with microscopic evaluation describing melanin deposition. Risk factors,  pathogenesis and clinical implications are unknown because only sporadic cases  are reported in the literature, both with and without the presence of urinary  tract symptoms or malignancy. We report a case of melanosis bladder in a male  patient with voiding urinary symptoms and an untreated hypospadias.","doi":"10.1308/rcsann.2022.0013","pmid":"","date":"2023","journal":"Annals of the Royal College of Surgeons of England","authors":"H Ni Raghallaigh; A Pineda-Turner; K Mather; A Chetwood","item_type":"journalArticle","volume":"105","issue":"4","pages":"386-387","issn":"0035-8843","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDA3MTI2ODRkZTViMjJjOGYxYjcxZWZhMjY4MjIzY2U2GghyYjZ4MmE0YQ%3D%3D"},"475AHBDF":{"key":"475AHBDF","record_id":"R-475AHBDF","title":"Ventral oral mucosal onlay graft urethroplasty in nontraumatic bulbar urethral strictures: surgical technique and multivariable analysis of results in 214  patients.","abstract":"BACKGROUND: The ventral oral mucosal onlay graft is suggested in proximal bulbar strictures where the thick spongiosum provides excellent support to the graft.  Some technical steps used in this technique are currently under debate in the  literature. OBJECTIVE: To describe the surgical steps of this urethroplasty and  investigate predictive factors of success using a multivariable logistic  regression analysis. DESIGN, SETTING, AND PARTICIPANTS: This is a descriptive  observational retrospective study of 214 patients who underwent urethroplasty for  bulbar urethral strictures between May 1999 and November 2010 in a single  high-volume center. Study inclusion criteria were patients presenting  nontraumatic bulbar urethral strictures ranging from 1.3 cm to 6.8 cm in length.  Exclusion criteria were traumatic strictures, panurethral strictures, lichen  sclerosus, and failed hypospadias repair. SURGICAL PROCEDURE: The oral graft was  placed on the ventral bulbar urethral surface and pushed as proximally as  possible using dedicated instruments and surgical techniques. OUTCOME  MEASUREMENTS AND STATISTICAL ANALYSIS: The primary outcome measure was the  objective result, defined as the absence of stricture recurrence at follow-up.  The objective outcome was considered a failure when any postoperative  instrumentation was needed. Multivariable logistic regression analysis was  developed. All tests were two sided with a significance level set at 0.05.  RESULTS AND LIMITATIONS: Median follow-up was 54 mo. Of the 214 patients, 183  (85.5%) were successful and 31 (14.5%) were failures. The preoperative maximum  flow rate (Qmax) was a significant predictor of surgical outcome (odds ratio:  1.352; p = 0.001). Age, length, and type of stenosis, and previous treatment were  not significant predictors of surgical outcome (all p > 0.05). The limitation of  our survey is the absence of a subjective evaluation or the use of specific  tools, such as a questionnaire. CONCLUSIONS: Ventral oral graft urethroplasty  represents a valid option in nontraumatic bulbar strictures. Preoperative Qmax  may be predictive of urethroplasty failure.","doi":"10.1016/j.eururo.2013.05.046","pmid":"23759258","date":"2013 Sep","journal":"","authors":"Barbagli Guido; Montorsi Francesco; Guazzoni Giorgio; Larcher Alessandro; Fossati Nicola; Sansalone Salvatore; Romano Giuseppe; Buffi Nicolòmaria; Lazzeri Massimo","item_type":"videoRecording","volume":"64","issue":"","pages":"","issn":"","isbn":"","url":""},"47BGT67U":{"key":"47BGT67U","record_id":"R-47BGT67U","title":"Seven novel mutations in steroidogenic factor-1 (SF1/ NR5A1) in 46,XY DSD patients","abstract":"Background: Steroidogenic factor-1 (SF1/ NR5A1) is a nuclear receptor that plays a role in many aspects of reproductive development. Until now, around twenty different mutations have been described in humans. Objective and hypotheses: Our aim was to screening mutations in SF1 in large cohort of 46,XY DSD patients. Methods: We studied 83 patients with 46,XY DSD in which androgen production and androgen receptor defects were ruled out as well as 5alpha-reduc- tase 2 deficiency. All of them presented normal adrenal function and variable pattern of undervirilization ranging from almost female external genitalia to male phenotype with proximal hypospadias. The coding region of SF1 was PCR amplified and sequenced. Results: We found seven novel heterozygous mutations. Four of them were missense mutations: in exon 2, the G26E variant changes a non polar amino acid to acid; on exon 5, the W302C variant changes a non polar amino acid to neutral, in exon 7 del395E were found. The first two missense mutations result in probably damaged proteins when tested in the prediction site Poly- Phen. In exon 6, the L358P variant was found and in vitro studies disclosed a reduction of more than 70% in the transcriptional activity of Cyp11a1 and Cyp19. Three nonsense variants, the C247X in exon 4 and the Y404X and C412X within exon 7 were also found. All mutations are located in a highly- conserved amino acid residue. All described mutations were absent in 100 control males. Conclusions: Mutations in SF1 were found in heterozygous state in 8.3% of our cohort, indicating that SF1 dosage is critical for gonadal development. Our study described 7 novel mutations in SF1 gene confirming the considerable prevalence of SF1 defects in 46,XY DSD presenting with different degree of undervirilization.","doi":"10.1159/000321348","pmid":"","date":"2010","journal":"Hormone Research in Paediatrics","authors":"Machado A.Z.; Santos M.G.; Domenice S.; Lando V.S.; Brandao M.P.; Nishi M.N.; Costa E.E.M.F.; De- Souza B.F.; Lin L.; Achermann J.C.; Mendonca B.B.","item_type":"journalArticle","volume":"74","issue":"(Machado A.Z.; Domenice S.; Lando V.S.; Brandao M.P.; Nishi M.N.; Costa E.E.M.F.; Mendonca B.B.) Universidade de Sao Paulo, Unidade de Endocrinologia do Desenvolvimento, Laboratorio de Hormonios e Genetica Molecular - LIM 42, Sao Paulo, Brazil","pages":"113","issn":"1663-2818","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L70462102&from=export"},"47ZY5Z43":{"key":"47ZY5Z43","record_id":"R-47ZY5Z43","title":"Mutations in the NR5A1 gene in patients with 46,XY disorders of sex development (DSD): High frequency of familial multi-generational occurrence","abstract":"Background: Nuclear receptor SF1/NR5A1 regulates the transcription of genes involved in reproduction, steroidogenesis and male sexual differentiation. Mutations in humans cause gonadal dysgenesis with/without adrenal failure in both 46,XY and 46,XX individuals. Method: In a cohort of patients with familial 46,XY DSD, we identified 6 heterozygous NR5A1 mutations in 19 subjects from 5 unrelated families. We also identified a de novo heterozygous mutation in one patient with 46,XY DSD and no affected relatives. Results: Low ovarian reserve with preserved fertility was detected in affected females. Extreme within-family variability was found in 46,XY affected patients, with phenotypes ranging from severe fetal undervirilization, prompting female sex of rearing to spontaneous pubertal development and even preserved fertility. Mutational analysis revealed in the first family a W279X heterozygous mutation and an intronic deletion (g3314-3317delTCTC (IVS 4+8), and in the second a Y183X heterozygous mutation.These mutations had been previously reported. A novel R313H heterozygous variation was found in the third family, and a novel S303R was found in the fourth. A novel heterozygous R69H mutation was found in the only patient studied (46,XY DSD) from the last family, and a G77E de novo mutation in the sporadic case. All new mutations were predicted to affect protein function by prediction models (SIFT, Polyphen and MutationTaster). Conclusions: We emphasize the extreme phenotypic variability that can be observed even in siblings with the same mutation. As previously reported, we found spontaneous puberty in 46,XY individuals raised as males, and for the first time we report preserved fertility in one of these affected individuals. Individuals with heterozygous NR5A1 mutations and mild phenotypes, such as isolated hypospadias in 46, XY patients, compensated ovarian dysfunction and early menopause in 46,XX subjects, might easily go undetected. A careful family screening of 46,XY as well as 46,XX individuals is recommended whenever an index case is detected.","doi":"10.1159/000343182","pmid":"","date":"2012","journal":"Hormone Research in Paediatrics","authors":"Costanzo M.; Warman D.M.; Guercio G.; Ciaccio M.; De Dona V.; Marino R.; Ramirez P.; Garrido N.P.; Baquedano M.S.; Berensztein E.; Saraco N.I.; Chaler E.; Maceiras M.; Lazzati J.M.; Bailez M.; Ongaro L.; Rivarola M.A.; Belgorosky A.","item_type":"journalArticle","volume":"78","issue":"(Costanzo M.; Warman D.M.; Guercio G.; Ciaccio M.; De Dona V.; Marino R.; Ramirez P.; Garrido N.P.; Baquedano M.S.; Berensztein E.; Saraco N.I.; Chaler E.; Maceiras M.; Lazzati J.M.; Rivarola M.A.; Belgorosky A.) Hospital de Pediatria Juan P Garrahan, Endocrine Service, Buenos Aires, Argentina","pages":"122","issn":"1663-2818","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L70896396&from=export"},"4C5SN5PQ":{"key":"4C5SN5PQ","record_id":"R-4C5SN5PQ","title":"Methylphenidate in pregnancy: A multicenter, prospective, comparative, observational study","abstract":"Introduction: Methylphenidate is a central nervous system stimulant medicinally used in the treatment of attention-deficit disorder with or without hyperactivity (ADD/ADHD). Data on its use in human pregnancy are limited. The primary objective of the study was to evaluate the risk of major congenital anomalies after pregnancy exposure to methylphenidate for medical indications. Methods: In a prospective, comparative, multicenter observational study performed in 4 participating Teratology Information Services (in Jerusalem, Berlin, Newcastle upon Tyne, and Toronto) between 1996 and 2013, methylphenidateexposed pregnancies were compared with pregnancies counseled for nonteratogenic exposure (NTE) after matching by maternal age, gestational age, and year at initial contact. Results: 382 methylphenidate-exposed pregnancies (89.5% in the first trimester) were followed up. The overall rate of major congenital anomalies was similar between the groups (10/309 = 3.2% [methylphenidate] vs 13/358 = 3.6% [NTE], P = .780). The rates of major congenital anomalies (6/247 = 2.4% [methylphenidate] vs 12/358 = 3.4% [NTE], P = .511) and cardiovascular anomalies (2/247 = 0.8% [methylphenidate] vs 3/358 = 0.8% [NTE], P = .970) were also similar after exclusion of genetic or cytogenetic anomalies and limiting methylphenidate exposure to the period of organogenesis (weeks 4-13 after the last menstrual period). There was a higher rate of miscarriages and elective terminations of pregnancy in the methylphenidate group. Significant predictors for the miscarriages using Cox proportional hazards model were methylphenidate exposure (adjusted hazard ratio [HR] = 1.98; 95% CI, 1.23-3.20; P = .005) and past miscarriage (adjusted HR = 1.35; 95% CI, 1.18-1.55; P \u003c .001). Conclusions: The present study suggests that methylphenidate does not seem to increase the risk for major malformations. Further studies are required to establish its pregnancy safety and its possible association with miscarriages. © 2016 Physicians Postgraduate Press, Inc.","doi":"10.4088/JCP.15m10083","pmid":"","date":"2016","journal":"","authors":"Diav-Citrin O.; Shechtman S.; Arnon J.; Wajnberg R.; Borisch C.; Beck E.; Richardson J.L.; Bozzo P.; Nulman I.; Ornoy A.","item_type":"conferencePaper","volume":"77","issue":"9","pages":"1176-1181","issn":"","isbn":"01606689 (ISSN)","url":"https://www.scopus.com/pages/publications/84989300031?origin=resultslist"},"4I3QN3MM":{"key":"4I3QN3MM","record_id":"R-4I3QN3MM","title":"Editorial comment","abstract":"","doi":"10.1016/j.juro.2010.11.104","pmid":"","date":"2011","journal":"Journal of Urology","authors":"Grady R.","item_type":"journalArticle","volume":"185","issue":"4","pages":"1454","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/79952700089?origin=resultslist"},"4MICHSRZ":{"key":"4MICHSRZ","record_id":"R-4MICHSRZ","title":"Endocrine disruptors and congenital anomalies Desreguladores endócrinos e anomalias congênitas","abstract":"The specialized literature was reviewed concerning the suspected increasing secular trends in the frequency of female births, male genital congenital anomalies, abnormal sperm counts, and testicular cancer. Although no risk factors could be identified yet, the observed sex ratio decline during the last decades has been considered to be an effect of certain pollutants on normal hormone activity, and human reproductive development. Reported increasing trends in the frequencies of hypospadias and cryptorchidism are very difficult to be interpreted due to the large variability in the registered frequency of these malformations due to operational as well as biological reasons.Foi realizada revisão da literatura especializada, que diz respeito à suspeita de tendências seculares em aumento para os nascimentos femininos, as anomalias congênitas de genitais masculinos, contagens anormais de esperma e câncer testicular. Apesar de não terem ainda se identificado os fatores de risco envolvidos, o declínio da proporção de nascimentos masculinos nas últimas décadas tem sido considerado como um efeito de certos contaminantes sobre a atividade hormonal normal e o desenvolvimento reprodutivo. As tendências comunicadas para as freqüências crescentes observadas de hipospádias e criptorquidia são de difícil interpretação, sobretudo, em função da grande variabilidade na distribuição registrada destas malformações devido a motivos operacionais e biológicos.","doi":"10.1590/S0102-311X2002000200006","pmid":"","date":"2002","journal":"Cadernos de Saúde Pública","authors":"","item_type":"journalArticle","volume":"","issue":"","pages":"","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEERvYWowMDAwMDM1MDM3OTEaCHJiNngyYTRh"},"4MN37ESW":{"key":"4MN37ESW","record_id":"R-4MN37ESW","title":"Male reproductive health: Cause for concern?","abstract":"A substantial body of evidence has accumulated in recent years that human semen quality may be deteriorating. This has been associated with evidence of other changes in male reproductive health, including increases in congenital malformations and testicular cancer in humans, and similar problems in wildlife. Unfortunately, the evidence remains inconclusive. It has been suggested that these changes may be due to environmental xeno-oestrogens acting during development. Although there is now a large quantity of data indicating that this is a plausible hypothesis, evidence of causality, rather than association, remains to be provided. The potential importance of these changes for human health is considerable and urgent research is required to clarify the situation.","doi":"10.1046/j.1439-0272.2000.00388.x","pmid":"","date":"2000","journal":"","authors":"Irvine D.S.","item_type":"conferencePaper","volume":"32","issue":"4-5","pages":"195-208","issn":"","isbn":"03034569 (ISSN)","url":"https://www.scopus.com/pages/publications/0033802043?origin=resultslist"},"548YZAPJ":{"key":"548YZAPJ","record_id":"R-548YZAPJ","title":"A mixture of seven antiandrogens induces reproductive malformations in rats.","abstract":"To date, regulatory agencies have not considered conducting cumulative risk assessments for mixtures of chemicals with diverse mechanisms of toxicity because  it is assumed that the chemicals will act independently and the individual  chemical doses are not additive. However, this assumption is not supported by new  research addressing the joint effects of chemicals that disrupt reproductive  tract development in the male rat by disrupting the androgen signalling pathway  via diverse mechanisms of toxicity [i.e. androgen receptor (AR) antagonism in the  reproductive tract vs. inhibition of androgen synthesis in the foetal testis]. In  this study, pregnant rats were exposed to four dilutions of a mixture containing  vinclozolin, procymidone, linuron, prochloraz, benzyl butyl phthalate, dibutyl  phthalate and diethylhexyl phthalate during the period of sexual differentiation  and male offspring were assessed for effects on hormone sensitive endpoints  including: anogenital distance, infant areolae retention and reproductive tract  tissue weights and malformations. The ratio of the chemicals in the mixture was  based upon each chemical's ED(50) for inducing reproductive tract malformations  (hypospadias or epididymal agenesis). The observed responses from the mixture  were compared with predicted responses generated with a toxic equivalency  approach and models of dose addition, response addition or integrated addition.  As hypothesized, we found that the mixture of chemicals that alter the androgen  signalling pathway via diverse mechanisms disrupted male rat reproductive tract  differentiation and induced malformations in a cumulative, dose-additive manner.  The toxic equivalency and dose addition models provided the best fit to observed  responses even though the chemicals do not act via a common cellular mechanism of  action. The current regulatory framework for conducting cumulative risk  assessments needs to consider the results, including those presented herein,  which indicate that chemicals that disrupt foetal tissues during sexual  differentiation act in a cumulative, dose-additive manner irrespective of the  specific cellular mechanism of toxicity.","doi":"10.1111/j.1365-2605.2007.00859.x","pmid":"","date":"2008","journal":"International Journal of Andrology","authors":"Rider Cynthia V.; Furr Johnathan; Wilson Vickie S.; Gray L. Earl Jr","item_type":"journalArticle","volume":"31","issue":"2","pages":"249-262","issn":"0105-6263","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L351341384&from=export"},"55N95JHJ":{"key":"55N95JHJ","record_id":"R-55N95JHJ","title":"Correlation analysis of low birth weight and hypospadias in twins","abstract":"Objective To expolre the relationship between birth weight and the hypospadias in twins. Methods Retrospective analysis was conducted for 42 pairs of twins with hypospadias from January 2013 to January 2020. The twins’ birth weight were recorded. According to the location of urethral opening,hypospadias can be divided into 4 types: Type I is glans penis and coronary groove hypospadias, type H is penile hypospadias, type III is scrotal hypospadias, and type IV is perineal hypospadias. The whole blood samples of all twins were examined by whole exon sequencing and bioinformatics analysis The examination confirmed 23 pairs of monozygotic twins and 19 pairs of dizygotic twins. Results There were 54 cases of hypospadias in 42 pairs of twins,including 6 type I hypospadias,20 type E hypospadias,22 type HI hypospadias and 6 type IV hypospadi- as. Monozygotic twins were more likely to have hypospadias than dizygotic twins (OR = 6.5,95%C/;1.217 ~ 35. 124). The correlation analysis of low birth weight and hypospadias in twins showed that low birth weight was a risk factor for hypospadias (OR = 4. 124,95% Cl588 ~ 10. 710,P = 0. 004). The risk of hypospadias in low birth weight infants was 5. 885 times higher than that of normal weight infants (OR = 5. 885,95% CI\\ 1. 082 ~ 32. 014,P =0. 040), while the risk of hypospadias in extremely low birth weight infant was 3. 804 times higher (OR = 3.804,95% C/: 1. 406 -10. 293, P = 0. 009). Among the 13 pairs of discordant monozygotic twins, the birth weights of those with and without hypospadias were (1 805 ±437) g and (2 598 ±582) g respectively, and the difference was statistically significant (t = 3. 929, P = 0. 001). Low birth weight (OR = 25. 955, 95% C7;2. 069 ~325. 556, P = 0. 012) was a risk factor for hypospadias in discordant monozygotic twins. For the 17 pairs of discordant dizygotic twins, the birth weights of those with and without hypospadias were (2 077 ±677) g and (2 527 ± 478) g respectively with statistically significant difference (t =2.242,P = 0.032). Low birth weight (OR = 3.929,95%C7;1.041 ~ 13. 837,P = 0. 044) was a risk factor for hypospadias in discordant dizygotic twins. The use of progesterone during pregnancy did not increase the risk of hypospadias in twins (OR = 1.458,95% C7;0.572 to 3. 853,P =0.416). Conclusion The one with lower birth weight in monozygotic or dizygotic twins is more likely to develop hypospadias. © 2022, Science and Technology Association of Hunan Province. All rights reserved.","doi":"10.3760/cma.j.cn.101785-202010025-002","pmid":"","date":"2022","journal":"Journal of Clinical Pediatric Surgery","authors":"Defu L.; Yangyue H.; Ning S.; Weiping Z.; Hongcheng S.","item_type":"journalArticle","volume":"21","issue":"1","pages":"7-12","issn":"16716353 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85126654484?origin=resultslist"},"56CGBBXT":{"key":"56CGBBXT","record_id":"R-56CGBBXT","title":"Prevalence and risk factors of testicular microlithiasis in patients with hypospadias: a retrospective study","abstract":"Abstract Background It has been described that the incidence of testicular microlithiasis is high in several congenital disorders which may be associated with testicular impairment and infertility. Several reports have shown that a prepubertal or pubertal hormonal abnormality in the pituitary-gonadal axis was identified in some patients with hypospadias that is one of the most common disorders of sex development. However, exact prevalence or risk factors of testicular microlithiasis in patients with hypospadias have not reported so far. In the present study, to clarify the prevalence and risk factors of testicular microlithiasis in patients with hypospadias, a retrospective chart review was performed. Methods Children with hypospadias who underwent testicular ultrasonography between January 2010 and April 2016 were enrolled in the present study. Severity of hypospadias was divided into mild and severe. The prevalence and risk factors of testicular microlithiasis or classic testicular microlithiasis were examined. Results Of 121 children, mild and severe hypospadias were identified in 66 and 55, respectively. Sixteen children had undescended testis. Median age at ultrasonography evaluation was 1.7 years old. Testicular microlithiasis and classic testicular microlithiasis were documented in 17 children (14.0%) and 8 (6.6%), respectively. Logistic regression analysis revealed that presence of undescended testis was only a significant factor for testicular microlithiasis and classic testicular microlithiasis. The prevalence of testicular microlithiasis or classic testicular microlithiasis was significantly higher in children with undescended testis compared to those without undescended testis (testicular microlithiasis; 43.8% versus 9.5% (p = 0.002), classic testicular microlithiasis; 37.5% versus 1.9% (p \u003c 0.001). Conclusions The current study demonstrated that the presence of undescended testis was only a significant risk factor for testicular microlithiasis or classic testicular microlithiasis in patients with hypospadias. As co-existing undescended testis has been reported as a risk factor for testicular dysfunction among patients with hypospadias, the current findings suggest that testicular microlithiasis in children with hypospadias may be associated with impaired testicular function. Conversely, patients with isolated HS seem to have lower risks for testicular impairment. Further investigation with longer follow-up will be needed to clarify these findings.","doi":"10.1186/s12887-018-1151-6","pmid":"","date":"2018","journal":"BMC Pediatrics","authors":"","item_type":"journalArticle","volume":"18","issue":"1","pages":"1-6","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEERvYWowMDAwMDYzMDIwMjcaCHJiNngyYTRh"},"5SXW449M":{"key":"5SXW449M","record_id":"R-5SXW449M","title":"Occupational exposure to endocrine-disrupting chemicals and other parental risk factors in hypospadias and cryptorchidism development: a case-control study.","abstract":"Aim of the study: Endocrine-disrupting chemicals (EDCs) are exogenous agents that are capable of altering the endocrine system functions, including the regulation of developmental processes. The aim of this study was to investigate the association between EDC exposure and other parental factors in the etiology of hypospadias and cryptorchidism. Methods: A case–control study was conducted. Cases (n = 210) were infants aged between 6 months and 14 years diagnosed with hypospadias or cryptorchidism who attended the authors' hospital over a period of 18 months, and controls (n = 210) were infants within the same range of age and without any urological disorders who attended the outpatient clinic of the same hospital during the same time period. Their selection was independent of exposures. Data on parental occupational exposure to EDCs and other sociodemographic variables were collected through face-to-face interviews and systematically for both cases and controls. Crude and adjusted odds ratios (ORs) were estimated to control for confounding with their 95% confidence interval (CI) by means of logistic regressions. Specifically, three final models of a dichotomous outcome were constructed: one for cryptorchidism, one for hypospadias, and the third considering both malformations together. The Hosmer-Lemeshow test was used to assess the goodness of fit of the models. Their discriminatory accuracy (DA) was ascertained by estimating their areas under the receiver operating characteristic curves area under the curve (AUC) along with their 95% CI. Results: Associations were found between advanced maternal age (OR adjusted = 1.82; 95% CI: 1.14–2.92), mother's consumption of anti-abortives (OR = 5.40; 95% CI: 1.40–38.5) and other drugs (OR = 2.02; 95% CI: 1.31–3.16) during pregnancy, maternal and paternal occupational exposure to EDCs (OR = 4.08; 95% CI: 2.03–8.96 and OR = 3.90; 95% CI: 2.41–6.48, respectively), fathers smoking (OR = 2.0; 95% CI: 1.33–2.99), and fathers with urological disorders (OR = 2.31; 95% CI: 1.15–4.90). Maternal and paternal high educational level could be protective of cryptorchidism (OR = 0.47; 95% CI: 0.28–0.76 and OR = 0.63; 95% CI: 0.42–0.93, respectively). The DA of the models for the whole sample (AUC = 0.75; 95% CI: 0.70–0.79) for cryptorchidism (AUC = 0.76; 95% CI: 0.71–0.82) and for hypospadias (AUC = 0.75; 95% CI: 0.69–0.81) was moderately high. Conclusions: Advanced age, some parental occupational exposure to EDCs, some drug consumption, smoking, and the father's history of urological disorders may increase risk and predict the developments of these malformations. Studies with higher samples sizes are needed to assess associations between individual EDC occupational exposures and drugs and these malformations. [Table presented] © 2019 Journal of Pediatric Urology Company","doi":"10.1016/j.jpurol.2019.07.001","pmid":"","date":"2019","journal":"Journal of pediatric urology","authors":"Estors Sastre B.; Campillo Artero C.; Gonzalez Ruiz Y.; Fernandez Atuan R. L.; Bragagnini Rodriguez P.; Frontera Juan G.; Gracia Romero J.","item_type":"journalArticle","volume":"15","issue":"5","pages":"520","issn":"1477-5131","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGZiNmZiMzczMTNhMTJmNmMwMTA3NTM5OTYxNDg1Y2MyGghyYjZ4MmE0YQ%3D%3D"},"5Z7252WG":{"key":"5Z7252WG","record_id":"R-5Z7252WG","title":"Pollutants with androgen-disrupting potency","abstract":"In the 1980s observations of impaired fertility of animals living in aquatic ecosystems of highly industrialized regions were reported for the first time. In vivo and in vitro studies revealed that a chemical that impairs normal embryonic development and disrupts normal reproductive functions in adulthood is an \"endocrine disruptor\" (ED). First systematic data revealed that some EDs act through mimicking or antagonizing the physiological functions of estrogens. Later endocrine disrupting pathways were described which affect the signal cascade of the androgen receptor. We have learnt in the mean time that it is not always possible to attach each ED to a specific mode of action (estrogenic, anti-estrogenic, androgenic, antiandrogenic, or others). Today the ED discussion has reached man, whose genital tract possibly is affected by EDs (e.g. declining sperm counts, hypospadias, cryptorchism, testicular, and prostate cancer). The list of androgen-disrupting chemicals identified to date comprises chlorinated hydrocarbon insecticides like DDT, DDE, dieldrin, methoxychlor and lindan, fungicides currently used like vinclozolin and benomyl, and widely used herbicides like linuron, diuron and atrazin. Many EDs are industrial chemicals or pesticides of aromatic structure, but it is still not possible to predict their binding to the androgen receptor based on their chemical structure. The substances have low solubility in water and avidly bind to soils and sediments. If no degradation is possible, accumulation and long persistence in the environment is observed. Due to their lipophilic character persistent chemicals are accumulated in the adipose tissue of vertebrates. The risk evaluation of putative EDs has to regard the endocrine-disrupting activity as well as the fate in the environment (e.g. accumulation, chemical and microbial stability).","doi":"10.1002/1438-9312(200202)104:2\u003c124::AID-EJLT124>3.3.CO;2-K","pmid":"","date":"2002 FEB","journal":"EUROPEAN JOURNAL OF LIPID SCIENCE AND TECHNOLOGY","authors":"Daxenberger A","item_type":"journalArticle","volume":"104","issue":"2","pages":"124-130","issn":"1438-9312","isbn":"","url":""},"68PMLYST":{"key":"68PMLYST","record_id":"R-68PMLYST","title":"Risk factors of complications after urethroplasty in children with gender dysplasia and proximal hypospadias","abstract":"Objective To explore the risk factors of complications after urethroplasty in children with DSD (disorders of sex development) plus proximal hypospadias. Methods From January 2012 to January 2020, clinical data were retrospectively reviewed for 40 DSD children with concurrent proximal hypospadias admitted with a follow-up period of no less than 2 years. Age of an initial admission, type of DSD, preoperative comorbidities, surgical approaches of urethroplasty, length of urethroplasty, external masculinization score (EMS), preoperative use of hormone therapy and recent postoperative complications were recorded. The influencing factors of recent postoperative complications in DSD children with concurrent proximal hypospadias. Results The average age was 44(13 - 128) month. A total of 10 cases (10/40,25% ) of complications occurred,including urinary fistula (n = 1), urethral stricture (n = 1 ), urethral rupture (n = 1 ) and postoperative reflux epididymitis (n = 1). There was a statistically significant difference (P \u003c0. 05) in preoperative hormone therapy [ (2/10) vs. (19/30) ], EMS score[5.5(4,8)vs. 8(1,8)], and the presence of small penises[ (6/10)vs. (5/30) ] between the complication group and the non complication group, while there was no statistically significant difference preoperative hormone therapy, EMS and presence of a small penis are risk factors for the occurrence of short-term postoperative complications. © 2023, Science and Technology Association of Hunan Province. All rights reserved.","doi":"10.3760/cma.j.cn101785-202211056-010","pmid":"","date":"2023","journal":"Journal of Clinical Pediatric Surgery","authors":"Denghui W.; Mengjie C.; Xiaojiang H.; Xίangyang C.; Xiang Z.; Pengpeng L.; Yingzhong F.","item_type":"journalArticle","volume":"22","issue":"9","pages":"849-854","issn":"16716353 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85175191911?origin=resultslist"},"6UN2JD7F":{"key":"6UN2JD7F","record_id":"R-6UN2JD7F","title":"Impact of urethroplasty on erectile function: A retrospective multicenter analysis of the international index of erectile function score changes across different etiologies of urethral stricture","abstract":"Introduction & Objectives: Urethral stricture disease, characterized by urethral narrowing due to fibrotic scarring, affects both urinary and sexual health. While urethroplasty is the standard treatment method, its impact on erectile function is not yet fully investigated. This study examines changes in International Index of Erectile Function (IIEF) scores following urethroplasty across various stricture etiologies, identifies predictors of erectile function outcomes, and evaluates recovery patterns after surgery. Materials & Methods: This multicenter retrospective study analyzed 103 patients who underwent urethroplasty between 2017 and 2023. Preoperative and postoperative IIEF scores were assessed at 3 months and at either 6 or 12 months post-surgery. Stricture etiologies included pelvic fracture urethral injury, transurethral resection, catheterization, idiopathic causes, and hypospadias. The Wilcoxon signed-rank test and multivariate regression models were employed to evaluate changes in IIEF scores and to identify significant predictors. Results: Preoperative erectile function and patient age were significant predictors of postoperative outcomes, with younger patients and those with higher baseline IIEF scores demonstrating improved erectile function after surgery. Long-term outcomes (6 to 12 months) were notably poorer in patients with strictures involving both the penile and bulbar regions. Multivariate analysis indicated that higher preoperative IIEF scores and younger age were associated with better short-term (R2 = 0.562) and long-term outcomes (R2 = 0.507). Additionally, diabetes was linked to poorer erectile function outcomes at 3 months post-surgery. Conclusions: Patients who are younger and have higher baseline IIEF scores tend to experience more favorable erectile function outcomes after urethroplasty. However, complex strictures involving both the penile and bulbar regions negatively impact long-term results. Furthermore, diabetes is associated with reduced erectile function in the early postoperative period.","doi":"10.1016/j.eururo.2025.09.2800","pmid":"","date":"2025","journal":"European Urology","authors":"Frankiewicz M.; Białek Ł.; Rydzińska M.; Skrzypczyk M.; Pęksa R.; Folwarski M.; Kaftan A.; Kałużny A.; Matuszewski M.","item_type":"journalArticle","volume":"87","issue":"(Frankiewicz M.; Kaftan A.; Kałużny A.; Matuszewski M.) Medical University of Gdansk, Dept. of Urology, Gdańsk, Poland","pages":"S366","issn":"0302-2838","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L652152161&from=export"},"723CUFQR":{"key":"723CUFQR","record_id":"R-723CUFQR","title":"Editorial comments","abstract":"","doi":"10.1016/j.juro.2010.12.110","pmid":"","date":"2011","journal":"Journal of Urology","authors":"Braga L.H.","item_type":"journalArticle","volume":"185","issue":"5","pages":"1850-1851","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85047687588?origin=resultslist"},"7265Y8E8":{"key":"7265Y8E8","record_id":"R-7265Y8E8","title":"This month in pediatric urology","abstract":"","doi":"10.1016/j.juro.2013.12.017","pmid":"","date":"2014","journal":"Journal of Urology","authors":"Baskin L.S.","item_type":"journalArticle","volume":"191","issue":"3","pages":"573-574","issn":"00225347 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84893842932?origin=resultslist"},"7AHKS84A":{"key":"7AHKS84A","record_id":"R-7AHKS84A","title":"Using public databases, 'virtual controls' and geolocalization to search for environmental correlates of hypospadias","abstract":"Background: Incidence of hypospadias varies considerably across countries, ranging from 4 to 43 cases per 10,000 births. Environmental factors might explain these differences. The classical approach is to use case-control studies to identify these factors. However, this approach suffers from the unavoidable arbitrariness of the definition of controls, and of recall bias. Objective and hypotheses: To identify environmental markers of the place of birth of children with hypospadias. Method: 8766 patients were recruited by 15 surgical centers. Addresses at birth were geolocalized using ArcGIS 9.3.1. This was used to map the addresses of the patients i) with socioeconomic variables available from INSEE and anonymous public databases (spatial resolution: 1 km.) ii) with the land cover characteristics assessed with satellite imaging (resolution: 250 m, database: Corine Land Cover). Then 100 sets of 8766 matched virtual controls were chosen randomly on the map thanks to the pps software and provided the reference environmental values. Bonferroni correction for multiple comparison was used to assess test significance. Results: Overall, a significant positive association was found with urbanization. When restricted to the 2279 patients whose residence was > 10 km from their recruiting surgical center, more hypospadias were found in places close to non-irrigated arable lands, complex cultivation patterns, and broad-leaved forests. A residence close from vineyards was not found predictive of hypospadias. Conclusion: Few environmental correlations, none of which being associated with pesticides, were found with our approach, which relies on an objective and unbiased assessment of environmental exposures, but may still lack spatial and temporal resolution.","d
