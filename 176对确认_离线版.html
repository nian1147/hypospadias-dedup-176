  births. It is the result of arrested development of the urethra, foreskin, and  ventral surface of the penis where the urethral opening may be anywhere along the  shaft, within the scrotum, or in the perineum. The only treatment is surgery.  Thus, prevention is imperative. To accomplish this, it is necessary to determine  the etiology of hypospadias, the majority of which have been classified as  idiopathic. In this paper we briefly describe the normal development of the male  external genitalia and review the prevalence, etiology, risk factors, and  epidemiology of hypospadias. The majority of hypospadias are believed to have a  multifactorial etiology, although a small percentage do result from single gene  mutations. Recent findings suggest that some hypospadias could be the result of  disrupted gene expression. Discoveries about the antiandrogenic mechanisms of  action of some contemporary-use chemicals have provided new knowledge about the  organization and development of the urogenital system and may provide additional  insight into the etiology of hypospadias and direction for prevention.","doi":"10.1289/ehp.011091175","pmid":"","date":"2001","journal":"Environmental Health Perspectives","authors":"Baskin L. S.; Himes K.; Colborn T.","item_type":"journalArticle","volume":"109","issue":"11","pages":"1175-1183","issn":"00916765 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/0035199253?origin=resultslist"},"SXQLEL7S":{"key":"SXQLEL7S","record_id":"R-SXQLEL7S","title":"Endocrine disruptors and congenital anomalies","abstract":"The specialized literature was reviewed concerning the suspected increasing secular trends in the frequency of female births, male genital congenital anomalies, abnormal sperm counts, and testicular cancer. Although no risk factors could be identified yet, the observed sex ratio decline during the last decades has been considered to be an effect of certain pollutants on normal hormone activity, and human reproductive development. Reported increasing trends in the frequencies of hypospadias and cryptorchidism are very difficult to be interpreted due to the large variability in the registered frequency of these malformations due to operational as well as biological reasons.","doi":"10.1590/s0102-311x2002000200006","pmid":"","date":"2002","journal":"Cadernos de Saúde Pública","authors":"","item_type":"journalArticle","volume":"","issue":"","pages":"","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEERvYWowMDAwMDQxMjY5ODYaCHJiNngyYTRh"},"SZCQVC5D":{"key":"SZCQVC5D","record_id":"R-SZCQVC5D","title":"Periconception Exposure to Air Pollution and Risk of Congenital Malformations.","abstract":"To evaluate the association between increased exposure to airborne fine particulate matter (PM2.5) during the periconception period with risk of congenital anomalies.Using birth certificate data from the Ohio Department of Health (2006-2010) and PM2.5 data from the US Environmental Protection Agency's 57 monitoring stations located throughout Ohio, the geographic coordinates of the mother's residence for each birth were linked to the nearest PM2.5 monitoring station and monthly exposure averages were calculated. The association between congenital anomalies and increased PM2.5 levels was estimated, with adjustment for coexistent risk factors.After adjustment for coexisting risk factors, exposure to increased levels of PM2.5 in the air during the periconception period was modestly associated with risk of congenital anomalies. Compared with other periconception exposure windows, increased exposure during the 1 month before conception was associated with the highest risk increase at lesser distances from monitoring stations. The strongest influences of PM2.5 on individual malformations were found with abdominal wall defects and hypospadias, especially during the 1-month preconception.Increased exposure to PM2.5 in the periconception period is associated with some modest risk increases for congenital malformations. The most susceptible time of exposure appears to be the 1 month before and after conception. Although the increased risk with PM2.5 exposure is modest, the potential impact on a population basis is noteworthy because all pregnant women have some degree of exposure.","doi":"10.1016/j.jpeds.2017.09.076","pmid":"","date":"2017","journal":"The Journal of pediatrics","authors":"","item_type":"journalArticle","volume":"","issue":"Spec","pages":"","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISGlB1Ym1lZDIwMTcyMDE4MDIwNTA2MTMxMjg2GghyYjZ4MmE0YQ%3D%3D"},"T3MKVQDT":{"key":"T3MKVQDT","record_id":"R-T3MKVQDT","title":"The Impact of Perioperative and Operative Variables on Early Postoperative Complications Following Primary Hypospadias Repair","abstract":"Objective: To evaluate possible risk factors for complications following primary hypospadias repair relative to factors associated with timing of hypospadias repair in terms of case order, morning or afternoon scheduling, perioperative delays, and surgeon's daily work schedule as well as individual operative techniques. Methods: We retrospectively reviewed charts of 422 boys undergoing primary hypospadias repair with a sutured urethroplasty by 1 of 3 surgeons over a 10-year period and the surgeon's daily schedule. Results: The median age and IQR of the patients at time of operation was 0.79 (0.57) years, and median follow-up was 259 (664) days. A significant increase in the rate of any complication was noted with morning vs afternoon cases for the group overall with morning cases having a hazard 2.3 times higher than afternoon cases (P =.012). Additionally, there was a significant increase in hazard of complication with increasing difference in time between actual procedure duration vs scheduled duration, with hazard of complication increasing 5% for each increase of 15 minutes of surgical time (P =.043). Conclusion: A variety of previously identified potential risk factors for hypospadias complications were identified. Our analysis also demonstrated variability in level of risk of different factors between surgeons, reinforcing the utility of surgeons monitoring their own results in response to changes in technique. Novel potential risk factors for some surgeons identified in our study included an increased risk of complications when the hypospadias was done in the morning rather than the afternoon and when the procedure lasted longer than scheduled. © 2022 Elsevier Inc.","doi":"10.1016/j.urology.2022.08.002","pmid":"","date":"2022","journal":"Urology","authors":"Storm D.W.; Lockwood G.M.; Bonnett M.A.; Cooper B.J.; Harris L.M.; Cooper C.S.","item_type":"journalArticle","volume":"170","issue":"","pages":"184-188","issn":"0090-4295","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDE2NDJhODk1ODc4ZGU1MjZhNGQwMjc0ZDU0YzY2MzZkGghyYjZ4MmE0YQ%3D%3D"},"T8YUICYJ":{"key":"T8YUICYJ","record_id":"R-T8YUICYJ","title":"Analysis of risk factors for urethral fistula of hypospadias repair with tubularized incised plate urethroplasty","abstract":"Objective To evaluate the efficacy and risk factors of urethral fistula with tubularized incised plate urethroplasty (TIPU). Methods From December 2018 to January 2020, 126 children with hypospadias undergoing primary TIPU were consecutively recruited. General demographics and intraoperative data were recorded. Electronic surgical records were reviewed and telephone follow-ups conducted, including types and occurrence time of complications. Univariate analysis was conducted for potential risk factors of urethral fistula. Variables with statistical significance were selected for Logistic multivariate analysis. Results During a mean follow-up period of 20. 2 mouths, 2 cases were lost. Median age was 24 months. The position of urethral o-pening accounted for 58.1% of anterior type, 29. 8% of intermediate type and 12.1% of posterior type respec tively. The preoperative proportion of mild/moderate/severe penile curvature was 29. 8%, 54. 8% and 15. 3% respectively. Penile curvature was corrected by penile degloving and dorsal plication. And 59. 5% of children with mild penile curvature and 33. 8% of moderate penile curvature were corrected only by degloving while all cases of severe penile curvature managed by dorsal plication. The overall complication rate of TIP surgery was 26. 6%, including urethral stricture (n = 10, 8.1%), urethral fistula (n =23, 18.5%), penile fistula (n = 17, 13.7%) and penile head fissure (n = 6, 4. 8%). In univariate analysis, age, surgeon experiences or new urethra coverage had no correlation with postoperative urethral fistula. Urethral fistula was significantly higher in smaller glans, posterior hypospadias, severer penile curvature after degloving and chordee requiring dorsal plication. In multivariate analysis, glans width \u003c 14 mm were independent risk factors for postoperative urethral fistula with TIP. Conclusions TIPU has a satisfactory efficacy for anterior/mediate hypospadias. The incidence of u-rethral fistula for posterior hypospadias is high with a poor efficacy. Children with smaller glans or severer penile curvature after degloving have a higher incidence of urethral fistula and glans width \u003c 14 mm are independent risk factors for postoperative urethral fistula after TIPU. As compared to covering foreskin vascular pedicle, TIP surgery using Buck's fascia coverage has a lower incidence of urethral fistula. However, the incidence of urethral stricture is higher. The indications of TIP surgery should be strictly controlled for lowering the incidence of postoperative complications. © 2023, Science and Technology Association of Hunan Province. All rights reserved.","doi":"10.3760/cma.j.cn101785-202202009-009","pmid":"","date":"2023","journal":"Journal of Clinical Pediatric Surgery","authors":"Zhou Q.; Zhang W.; Song H.; Sun N.; Tian J.; Li M.; Qu Y.; Li N.; Liang H.; Han W.; Yang Y.; Li Z.; Wang G.","item_type":"journalArticle","volume":"22","issue":"12","pages":"1139-1145","issn":"16716353 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85183091934?origin=resultslist"},"TATRIR2I":{"key":"TATRIR2I","record_id":"R-TATRIR2I","title":"f Risk factors for failed urethrocutaneous fistula repair after transverse preputial island flap urethroplasty in pediatric hypospadias","abstract":"Objectives: We review our experience in urethrocutaneous fistula (UCF) repair after transverse preputial island flap urethroplasty (Duckett) in pediatric hypospadias to investigate the risk factors for unsuccessful outcome. Methods: Two hundred and nineteen UCFs repairs conducted in our center from January 2015 to December 2016 after Duckett technique were retrospectively reviewed and 182 had a follow-up for more than 6 months. The age of patients, size, localization and numbers of UCFs, interval time of two operations, length of neourethra, times of UCFs repairs, complications other than UCFs, hospital of primary surgery and postoperative infection were analyzed as potential risk factors. Stratified analysis and assessment of additive interaction were performed to have a better understanding of the relation between the risk factors. Logistic regression analysis was used for multivariate analysis. Results: UCF repairs were succeeded in 121 (66.5%) and failed in 61 (33.5%) at first operation. In the univariate analysis, size and numbers of UCFs (P = 0.01 and P = 0.035, respectively), interval time of two operations (P = 0.042) and hospital of primary surgery (P = 0.02) were statistically related with the outcome. In the multivariate analysis, UCF ≥ 2 (OR 2.71, 95%, CI 1.095–6.692, P = 0.031), size ≥ 2 mm (OR 2.45, 95% CI 1.267–4.757, P = 0.08) and primary surgery not at our hospital (OR 2.21, 95% CI 1.094–4.126, P = 0.026) were identified as independent risk factors for unsuccessful outcome. In the stratified analysis, multiplicative interaction between the 3 risk factors was not found. Conclusions: Our study suggested that UCF repairs after transverse preputial island flap urethroplasty were easier to fail if the UCF was ≥ 2 mm, the numbers of UCFs was ≥ 2, or the surgeon had less experience. The age of patients, site of UCFs, interval time of two operations, length of neourethra, times of UCFs repairs, complications other than UCF and postoperative infection were not significantly related to the success rate of UCF repair. © 2017, Springer Science+Business Media B.V., part of Springer Nature.","doi":"10.1007/s11255-017-1773-x","pmid":"","date":"2018","journal":"International urology and nephrology.","authors":"Han Wenwen; Zhang Weiping; Sun Ning","item_type":"journalArticle","volume":"50","issue":"2","pages":"191-195","issn":"0301-1623","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGM0YzdiYjU0NmJkZTkxYzVlODg1NzBlMTNkNjE1MWU4GghyYjZ4MmE0YQ%3D%3D"},"TEEUMLGD":{"key":"TEEUMLGD","record_id":"R-TEEUMLGD","title":"[Surgical management of the distal urethral stricture diseases].","abstract":"Objective: To evaluate the surgical methods for treating distal urethral stricture. Methods: The clinical data of 80 patients with distal urethral stricture in Beijing Jishuitan Hospital, Captial Medical University between January 2018 and December 2022 were retrospectively collected. Including male genital lichen sclerosus (MGLS) 33 cases, iatrogenic injury 25 cases, postoperative hypospadias 12 cases, and other causes such as trauma 10 cases. Among these cases, strictures involved the urethral meatus in 54 instances, of which 38 were treated with meatotomy (MO), 7 with penile skin flap urethroplasty (PSFU), and 9 with oral mucosa graft urethroplasty (OMGU). There were also 26 instances where strictures involved both the navicular fossa and meatus; one case underwent PSFU while 25 underwent OMGU. Based on different surgical methods used for treatment purposes we divided the patients into MO group, PSFU group and OMGU group. The age of the three groups was (48. 8 ± 20. 0) years, (53. 3 ±21.8) years and (44. 5 ± 16. 4) years. The mean ± SD body mass index (BMI) was (28. 6 ± 3.9) kg/m2, (29. 6 ±3.2) kg/m2 and (29. 2 ±4.8) kg/m2. The preoperative maximum flow rate was (5.8 ±2. 3) mL/s, (6.8 ±2.4) mL/s and (5.7 ± 3. 1) mL/s. Results:All the operations were successfully completed without Clavien HI or IV complications. The median length of strictures (measured intraoperatively) in the three groups were 1. 1 (1.0, 1.6), 1.5 (1.1, 2.0) and 4. 0 (2.5, 5.0) cm. The median operation time was 60. 0 (60. 0, 75.0), 85.0 (75.0, 112. 5) and 180. 0 (75.0, 330. 0) min. The median estimated blood loss was 5.0 (2. 0, 10. 0), 15.0 (5.0, 42. 5) and 180. 0 (135. 0, 216. 3) mL. The median postoperative hospital stay was 3. 5 (2.0, 5.0), 6. 5 (3.5, 7.0) and 7. 5 (7.0, 11.3) days. The median follow-up duration was 40. 0 (26. 3, 57. 3), 55.0 (18.8, 62. 8) and 52. 5 (30. 5, 64. 0) months. The median postoperative maximum flow rate was 18. 3 (15. 5, 19. 8), 19. 2 (16. 1,20. 1) and 17. 2 (14. 2, 19. 6) mL/s. Among the 38 patients with MO, 33 cases had normal urination without reintervention, and 5 cases experienced recurrent strictures and required regular urethral dilation. Among the 8 patients with PSFU, 7 cases had normal urination without reintervention, and one case developed a urinary fistula, for which intervention was recommended but the patient opted to maintain the status quo. Among the 34 patients with OMGU, 28 cases had normal urination without reintervention. There were 6 instances of stenosis recurrence, with 5 cases requiring regular urethral dilations and one case requiring reconstructive surgery. The overall success rate of operation was 85. 0%, and the reintervention rate was 15. 0%. Statistical analysis revealed significant differences in etiologies among the three groups (P = 0.002), as well as in stricture locations (P \u003c0. 001), length of strictures (P \u003c0. 001), operation time (P \u003c0. 001), estimated blood loss (P \u003c 0. 001) and postoperative hospital stays (P \u003c 0. 001). However, no significant differences were observed in terms of age, BMI, history of previous urethral stricture surgeries, preoperative maximum flow rate, follow-up duration, postoperative maximum flow rate and reintervention rate. Univariate and multivariate Logistic regression analyses indicated that a history of previous urethral stricture surgeries was a risk factor for postoperative reintervention (P =0. 026). Conclusion:MO and PSFU are primarily suitable for treating short-segment (《1.5 cm) distal penile urethral strictures, whereas OMGU is more appropriate for longer segment strictures. MO and OMGU can both be utilized in managing MGLS cases. PSFU and OMGU are more conducive to improving the appearance of the urethral meatus. The success rate of surgical management of distal penile urethral stricture is 85. 0%, 15. 0% of the patients still require surgical intervention after surgery, and having history of previous urethral stricture surgeries is a risk factor for postoperative reintervention. © 2024 Editorial Department of Journal of Peking University (Health Sciences). All rights reserved.","doi":"10.19723/j.issn.1671-167X.2024.06.021","pmid":"","date":"2024","journal":"Journal of Peking University (Health Sciences)","authors":"Wang Jie; Wang Jianwei; Xia Haizhui; Xu Xiao; Zhai Jianpo; He Feng; Huang Guanglin; Li Guizhong","item_type":"journalArticle","volume":"56","issue":"6","pages":"1075-1082","issn":"1671167X (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85213137477?origin=resultslist"},"TLLS6PU8":{"key":"TLLS6PU8","record_id":"R-TLLS6PU8","title":"Maternal inflammatory bowel disease and hypospadias in male offspring: a population-based study in Denmark.","abstract":"The occurrence of inflammatory bowel disease (IBD) and hypospadias has been concurrently increasing, possibly through shared environmental risk factors such as endocrine disrupting compounds. Also, maternal IBD may disturb the normal development of the fetal reproductive tract. However, whether maternal IBD increases the risk of hypospadias in male offspring is unknown. We compared hypospadias risk in sons of mothers with and without IBD.We used Danish nationwide population-based registries to conduct a longitudinal prevalence study including all live-born boys from 1979 through 2009. We computed HRs, as estimates of prevalence ratios (PRs), with 95% CIs for hypospadias, using Cox proportional hazards regression, while adjusting for measured confounding.Among 966 038 live-born boys, 4688 (0.5%) had a mother with a history of IBD diagnosis before the relevant childbirth. Among the boys with maternal IBD, 36 (0.8%) were diagnosed with hypospadias any time after birth, whereas 6112 (0.6%) sons of mothers without IBD diagnosis had hypospadias (adjusted PR: 1.20, (95% CI 0.86 to 1.67). Adjusted PRs for maternal Crohn's disease and ulcerative colitis were 1.38 (95% CI 0.83 to 2.29) and 1.10 (95% CI 0.71 to 1.68), respectively. Analyses defining hypospadias diagnosis recorded \u003c6 months postpartum showed similar results.We found no convincing evidence of an association between maternal IBD and hypospadias.","doi":"","pmid":"","date":"2016","journal":"BMJ open gastroenterology","authors":"","item_type":"journalArticle","volume":"","issue":"1","pages":"e000121","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISGlB1Ym1lZDIwMTYyMDE3MTAyNTA0NjM2Mjg4GghyYjZ4MmE0YQ%3D%3D"},"TM4J7EAF":{"key":"TM4J7EAF","record_id":"R-TM4J7EAF","title":"Comprehensive analysis of tubularized incised-plate urethroplasty in primary and re-operative hypospadias.","abstract":"OBJECTIVE: To retrospectively review our experience of the tubularized incised-plate (TIP) urethroplasty over the last 4 years. PATIENTS AND METHODS:  From 1998 to December 2001, 133 patients (mean age 7 years, sd 4, range 1-22),  had a TIP urethroplasty by one surgeon for primary (103) and re-operative (30)  hypospadias; the defects included 106 (79%) distal and mid-shaft, and 27 (21%)  posterior shaft. The neourethra was covered by a subcutaneous flap in 66 (50%)  patients or by corpus spongiosa (spongioplasty) in 31 (23%), with no cover in the  remaining 36 (27%). In the last 20 patients (15%) a modified meatoplasty was  used; the site and size of the new meatus was predetermined on the glans around a  suitable catheter before any incision. Urethral stents were not used after repair  in 39 (29%) patients, and regular meatal dilation was used only in patients with  voiding difficulty and obvious tendency to stenosis. The presence of  complications requiring re-operation and overall general appearance were  recorded. RESULTS: The mean (sd) follow-up was 10 (5) months; there were 24  complications in 20 patients (15%), including a small fistula in 12 (9%),  complete disruption of the repair in 4 (3%), meatal stenosis in seven (5%) and  neourethral stricture in one (0.8%). Complications were not significantly  different between primary and re-operative cases, and unaffected by the use of  the stents. On univariate analysis complications were significantly higher with  running than interrupted sutures, in repairs in the first 2 years of the study,  in patients with posterior hypospadias, and in those with no neourethral  coverage. However, the last two factors were the only significant independent  risk factors in a multivariate analysis. Regular urethral dilatation was  indicated in 43 patients (32%). Modified meatoplasty was associated with a  significantly lower requirement for regular dilatation (P \u003c 0.05) and no meatal  stenosis. In the 113 complication-free patients the operation gave an excellent  cosmetic appearance with a vertical slit meatus on the tip of conical glans in  110 (97%); there was slight meatal retraction in the remaining three patients.  CONCLUSION: The TIP repair is a reliable method for treating both distal and  proximal penile shaft hypospadias, is suitable for both primary and re-operative  cases, and is more versatile than other repairs. Covering the neourethra with a  flap or spongioplasty significantly improves the results. Regular urethral  dilatation is required in a third of patients but modified meatoplasty obviates  the need for regular dilatation and eliminates the risk of meatal stenosis.","doi":"10.1111/j.1464-410X.2004.04781.x","pmid":"15142164","date":"2004 May","journal":"BJU international","authors":"El-Sherbiny M. T.; Hafez A. T.; Dawaba M. S.; Shorrab A. A.; Bazeed M. A.","item_type":"journalArticle","volume":"93","issue":"7","pages":"1057-1061","issn":"1464-4096","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDQzMDY4MDU3M2VlMTg1YmEyZTZmMDA1OGJkMzFmNTRjGghyYjZ4MmE0YQ%3D%3D"},"TMDZPCBH":{"key":"TMDZPCBH","record_id":"R-TMDZPCBH","title":"EDCs and male urogenital cancers","abstract":"Male sex determination and sexual differentiation occur between 6–12 weeks of gestation. During the “male programming window” the fetal testes start to produce testosterone that initiates the development of the male reproductive tract. Exposure to endocrine disrupting chemicals (EDCs) able to mimic or disrupt steroid hormone actions may disrupt testicular development and adversely impact reproductive health at birth, during puberty and adulthood. The testicular dysgenesis syndrome (TDS) occurs as a result inhibition of androgen action on fetal development preceding Sertoli and Leydig cell dysfunction and may result from direct or epigenetic effects. Hypospadias, cryptorchidism and poor semen quality are elements of TDS, which may be considered a risk factor for testicular germ cell cancer (TGCC). Exposure to estrogen or estrogenic EDCs results in developmental estrogenization/estrogen imprinting in the rodent for prostate cancer (PCa). This can disrupt prostate histology by disorganization of the epithelium, prostatic intraepithelial neoplasia (PIN) lesions, in particular high-grade PIN (HGPIN) lesions which are precursors of prostatic adenocarcinoma. These defects persist throughout the lifespan of the animal and later in life estrogen exposure predispose development of cancer. Exposure of pregnant dams to vinclozolin, a competitive anti-androgen, and results in prominent, focal regions of inflammation in all exposed animals. The inflammation closely resembles human nonbacterial prostatitis that occurs in young men and evidence indicates that inflammation plays a central role in the development of PCa. In conclusion, in utero exposure to endocrine disrupters may predispose to the development of TDS, testicular cancer (TCa) and PCa and are illustrations of Developmental Origins of Health and Disease (DOHaD). © 2021 Elsevier Inc.","doi":"10.1016/bs.apha.2021.05.004","pmid":"","date":"2021","journal":"","authors":"Bornman M.S.; Aneck-Hahn N.H.; Vandenberg L.N.; Department of Environmental Health Sciences School of Public Health & Health Sciences, University of Massachusetts Amherst, Amherst, MA; Turgeon J.L.; Department of Internal Medicine Division of Endocrinology, Diabetes, and Metabolism, University of California Davis, Davis, CA; 34452696","item_type":"bookSection","volume":"92","issue":"","pages":"521-553","issn":"","isbn":"10543589 (ISSN); 978-012823466-2 (ISBN)","url":"https://www.scopus.com/pages/publications/85109730051?origin=resultslist"},"TPCK8KHF":{"key":"TPCK8KHF","record_id":"R-TPCK8KHF","title":"Epidemiologic features of male genital malformations and subtypes in Texas.","abstract":"Although distinct categories of male genital malformations share some common risk factors, few studies have systematically compared epidemiologic features across  phenotypes. We evaluated the relationship between several maternal and infant  characteristics and five categories of male genital malformations: second- or  third-degree hypospadias, hypospadias (regardless of degree), small penis,  cryptorchidism, and any male genital malformation. Data for 16,813 cases with  isolated male genital malformations and 1,945,841 male live births delivered from  1999 to 2008 were obtained from the Texas Birth Defects Registry. For each  phenotype category, 13 maternal and infant variables were assessed, and adjusted  prevalence ratios were estimated based on the same multivariable Poisson  regression model. A significant negative association was observed between  previous live births versus no previous live births and four phenotypes (e.g.,  adjusted prevalence ratio [aPR] for any male genital malformation: 0.78, 95%  confidence interval [CI]: 0.75-0.81). The prevalence of 4 of the phenotypes was  significantly higher among multiple versus singleton pregnancies (e.g., aPR for  any male genital malformation: 1.35, 95% CI: 1.25-1.47). We also observed  significant associations between multiple phenotypes and residential region at  delivery, delivery year, month of conception, and maternal age, race/ethnicity,  education, and birthplace, including significant associations for trends  (maternal age, maternal education, and birth year modeled ordinally). Our results  allow for comparison of characteristics across phenotypes and suggest that there  may be some common risk factors for multiple male genital malformations (e.g.,  characteristics related to maternal estrogen levels), while other risk factors  may be unique to specific defects.","doi":"10.1002/ajmg.a.36389","pmid":"","date":"2014","journal":"American journal of medical genetics, Part A","authors":"Agopian A. J.; Langlois Peter H.; Ramakrishnan Anushuya; Canfield Mark A.","item_type":"journalArticle","volume":"164A","issue":"4","pages":"943-949","issn":"1552-4825","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDE5MmJjNzVkNmI1ODAxNDFkNzJkYzg4OWRjNGQ5ZGMxGghyYjZ4MmE0YQ%3D%3D"},"TQN3CP94":{"key":"TQN3CP94","record_id":"R-TQN3CP94","title":"Measurement and correlates of ano-genital distance in healthy, newborn infants","abstract":"Ano-genital distance (AGD) is a sexually dimorphic trait that is a well established reproductive toxicity endpoint in animals. In male animals, a shortened AGD is associated with a variety of genital abnormalities including hypospadias and cryptorchidism. Consensus on the anatomical definition of AGD in humans remains to be established and few data exist on the determinants and normal variance in the general population. We implemented a standardized anthropometric protocol to measure AGD, ano-scrotal distance (ASD), and ano-fourchette distance (AFD) in 169 (82 male, 87 female) infants in the University of Washington newborn nursery in 2008. We collected data on the following characteristics: weight, length, and occipital head circumference, race and relevant gestational complications. Using linear regression modelling, we examined AGD/ASD/AFD for sexual dimorphism, normal population variance and predictors of the measurement in infants. The mean male and female AGD measurements were 52.0 mm (SD ± 5.5) and 37.2 mm (SD ± 3.7). The mean ASD and AFD were 23.0 mm (SD ± 3.8) and 15.1 mm (SD ± 2.9). Weight, length, occipital head circumference and gestational age were associated with AGD (p \u003c 0.05). Weight and length were the most important correlates to AGD. We confirmed previous findings that AGD is a sexually dimorphic measurement that is most strongly predicted by infant weight. The application of this measurement to clinically relevant outcomes remains to be explored in further depth. © 2010 European Academy of Andrology.","doi":"10.1111/j.1365-2605.2009.01044.x","pmid":"","date":"2010","journal":"","authors":"Sathyanarayana S.; Beard L.; Zhou C.; Grady R.","item_type":"conferencePaper","volume":"33","issue":"2","pages":"317-323","issn":"","isbn":"13652605 (ISSN)","url":"https://www.scopus.com/pages/publications/77949601467?origin=resultslist"},"TUMCEFWN":{"key":"TUMCEFWN","record_id":"R-TUMCEFWN","title":"Prevalence and risk factors for penile lesions/anomalies in a cohort of Brazilian men â‰¥ 40 years of age","abstract":"Purpose To report the prevalence and risk factors of penile lesions/anomalies in a Metropolitan Brazilian city. Materials and Methods All participants undergoing prostate cancer screening in the city of Curitiba were systematically examined to identify penile lesions including cutaneous mycosis, sexually transmitted diseases, penile cancer, meatal stenosis, hypospadias, and Peyronie's disease. Outcomes of interest included the prevalence and the relative risk and 95% confidence intervals of the lesions/anomalies according to age, school level, race, personal history of diabetes, arterial hypertension, nonspecific urethritis, and vasectomy. Results Balanoposthitis occurred in 11.8% of all participants, with an increased risk in those with diabetes (RR = 1.73), or past history of nonspecific urethritis (RR = 1.58); tinea of the penis was present in 0.2%; condyloma acuminata in 0.5%; herpes virus infection in 0.4%; urethral discharge in 0.2%; genital vitiligo in 0.7%, with an increased prevalence in non-white men (RR = 4.43), and in subjects with lower school level (RR = 7.24); phimosis in 0.5%, with a nearly 7-fold increased risk in diabetics; lichen sclerosus in 0.3%; stenosis of the external urethral meatus in 0.7%, with a higher prevalence in subjects with lichen sclerosus (RR = 214.9), and in those older than 60 years of age (RR = 3.57); hypospadia in 0.6%; fibrosis suggestive of Peyronie's disease in 0.9%, especially in men older than 60 years (RR = 4.59) and with diabetes (RR = 3.91); and penile cancer in 0.06%. Conclusion We estimated the prevalence and risk factors of commonly seen penile diseases in an adult cohort of Brazilian men.","doi":"10.1590/S1677-5538.IBJU.2013.01.08","pmid":"","date":"2013","journal":"International Brazilian Journal of Urology","authors":"","item_type":"journalArticle","volume":"","issue":"","pages":"","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEERvYWowMDAwMDQxNDkzMjQaCHJiNngyYTRh"},"U93XS9ID":{"key":"U93XS9ID","record_id":"R-U93XS9ID","title":"尿道下裂危险因素的病例对照研究","abstract":"目的:探讨尿道下裂病因。方法:采用以医院为基础的1:2配比的病例对照研究方法,以统一的调查表及调查方式对107例尿道下裂及214例对照进行面对面问卷调查,应用SAS6.12软件对所有调查因素进行单因素及多因素logistic回归分析。结果:胎儿尿道下裂的发生与母亲孕前自然流产史(OR=3.87,95% CI:1.60-9.39)、孕期发生先兆流产(OR=3.57,95% CI:1.31-9.64)、孕早期感冒伴发热(OR=7.63,95% CI:2.50-23.24)、孕中期用抗感染和/或解热止痛药(OR=16.46,95% CI:3.46-78.21)、父亲职业性接触农药(OR=3.70,95%CI:1.49-9.16)及胎儿低出生体重(OR=12.62,95% CI:2.97-53.67)呈正相关,与母亲孕早期增加蛋白质类营养(OR=0.33,95% CI:0.15-0.74)呈负相关。结论:母亲孕前自然流产史、孕期发生先兆流产、孕早期感冒伴发热、孕中期用抗感染和/或解热止痛药、父亲职业性接触农药、胎儿低出生体重等可能增加胎儿发生尿道下裂的危险,而母亲孕早期增加蛋白质类营养可能降低胎儿发生尿道下裂的危险。","doi":"10.3760/j.issn:0254-6450.2004.03.020","pmid":"","date":"2004","journal":"中华流行病学杂志","authors":"王金平; 王滨有","item_type":"journalArticle","volume":"25","issue":"3","pages":"261-264","issn":"0254-6450","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemhseGJ4MjAwNDAzMDIwGghyYjZ4MmE0YQ%3D%3D"},"UADXN7I9":{"key":"UADXN7I9","record_id":"R-UADXN7I9","title":"PD49-05 IDENTIFYING RISK FACTORS FOR MULTIPLE RE-DO REPAIRS IN HYPOSPADIAS PATIENTS WITH COMPLICATION: A SINGLE INSTITUTION REVIEW OF 806 PATIENTS","abstract":"","doi":"10.1097/01.JU.0001008752.72292.d7.05","pmid":"","date":"2024","journal":"The Journal of Urology","authors":"Karl F. Godlewski; Sameer Mittal; Nathan Hyacinthe; Katherine Fischer; Margaux Johnson; Jason Van Batavia; Dana Weiss; Arun Srinivasan; Aseem Shukla; Thomas Kolon; Mark Zaontz; Christopher Long","item_type":"journalArticle","volume":"211","issue":"5S","pages":"e1051","issn":"0022-5347","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISEXFrM2VfMDAwMDMxMjA5NTE3GghyYjZ4MmE0YQ%3D%3D"},"UCIKDL4G":{"key":"UCIKDL4G","record_id":"R-UCIKDL4G","title":"Rapid Genome Sequencing for Diagnosis of a Difference of Sex Development in the NICU","abstract":"Objectives Neonatal diagnostic workup for differences of sex development (DSD) can take weeks to months. Families may be advised to delay sex assignment while awaiting diagnostic information. We report a case of an infant with non-binary genitalia for whom rapid genome sequencing (rGS) was sent on day of life (DOL) 2 and revealed a specific diagnosis on DOL 18. Methods First-trimester cell-free DNA screening was risk-reducing and predicted male sex. Prenatal ultrasound identified non-binary genitalia and a dysplastic pulmonary valve. Postnatal exam revealed low-set ears, absent left thumb, and a right pelvic kidney. Genital exam was notable for a clitorophallic structure with ventral chordee, penoscrotal hypospadias, and mild transposition with rugated and hyperpigmented labioscrotal folds containing a palpable right testis. The left testis was palpated in the inguinal canal. No Müllerian structures were identified. A multidisciplinary team of endocrinology, urology, psychology, and genetics experts met with the family on DOL 2 to provide education on DSD, discuss sex of rearing, and plan diagnostic workup. Informed consent was provided by the patient's parents for publication of this case. Results Chromosome analysis confirmed 46,XY karyotype. rGS revealed a novel paternallyinherited heterozygous variant of uncertain significance (VUS) in DHX37 (c.1624G>A, p.Val542Met). DHX37 encodes a DNA helicase protein expressed in the developing testes. Variants have been reported in association with 46,XY DSD with wide phenotypic variability, so while the father is asymptomatic, the variant does likely explain the patient's presentation. Hormonal testing during mini-puberty revealed appropriate testicular function: LH 6.9 mIU/mL, testosterone 135.9 ng/dL, and anti-Müllerian hormone 61.7 ng/mL (reference range 37.2-345.67 ng/mL for male infant). Anticipatory guidance was provided using gender-neutral terminology to address gender development, hormonal function, and fertility. Parents thoughtfully delayed sex assignment until the infant was 5 weeks old, ultimately assigning a male sex of rearing, and have deferred hypospadias surgery to allow their child to participate in decisionmaking. An orchiopexy to reposition the left testis is planned. Conclusions rGS delivers more expedient results than traditional stepwise testing, may result in a higher diagnostic yield, and can inform decisions about sex of rearing for infants with DSD. We recommend consideration of early broad genetic testing when feasible.","doi":"10.1159/000531602","pmid":"","date":"2023","journal":"Hormone Research in Paediatrics","authors":"Whitehead J.; Weisman A.; Peter M.; Johnson E.; Chen D.; Baker J.","item_type":"journalArticle","volume":"96","issue":"(Whitehead J.; Weisman A.; Peter M.; Johnson E.; Chen D.; Baker J.) Lurie Children's Hospital of Chicago, Chicago, IL, United States","pages":"311-312","issn":"1663-2826","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L642576831&from=export"},"UD3P472I":{"key":"UD3P472I","record_id":"R-UD3P472I","title":"Maternal and paternal risk factors for cryptorchidism and hypospadias: a case-control study in newborn boys.","abstract":"Little is known on environmental risk factors for cryptorchidism and hypospadias, which are among the most frequent congenital abnormalities. The aim of our study  was to identify risk factors for cryptorchidism and hypospadias, with a focus on  potential endocrine disruptors in parental diet and occupation. In a case-control  study nested within a cohort of 8,698 male births, we compared 78 cryptorchidism  cases and 56 hypospadias cases with 313 controls. The participation rate was 85%  for cases and 68% for controls. Through interviews, information was collected on  pregnancy aspects and personal characteristics, lifestyle, occupation, and  dietary phytoestrogen intake of both parents. Occupational exposure to potential  endocrine disruptors was classified based on self-reported exposure and ratings  of occupational hygienists based on job descriptions. Our findings indicate that  paternal pesticide exposure was associated with cryptorchidism [odds ratio (OR) =  3.8; 95% confidence interval (95% CI), 1.1-13.4]. Smoking of the father was  associated with hypospadias (OR = 3.8; 95% CI, 1.8-8.2). Maternal occupational,  dietary, and lifestyle exposures were not associated with either abnormality.  Both abnormalities were associated with suboptimal maternal health, a lower  maternal education, and a Turkish origin of the parents. Being small for  gestational age was a risk factor for hypospadias, and preterm birth was a risk  factor for cryptorchidism. Because paternal pesticide exposure was significantly  associated with cryptorchidism and paternal smoking was associated with  hypospadias in male offspring, paternal exposure should be included in further  studies on cryptorchidism and hypospadias risk factors.","doi":"10.1289/ehp.7243","pmid":"","date":"2004","journal":"Environmental Health Perspectives","authors":"Frank H. Pierik; \"name\":\"Department of Public Health Erasmus MC, Rotterdam, the Netherlands\"; Alex Burdorf; James A. Deddens; Rikard E. Juttmann; \"name\":\"Department of Child Health Care Rotterdam Homecare Foundation, Rotterdam, the Netherlands\"; Rob F.A. Weber","item_type":"journalArticle","volume":"112","issue":"15","pages":"1570-1576","issn":"00916765 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/8744290902?origin=resultslist"},"UFF5NGTH":{"key":"UFF5NGTH","record_id":"R-UFF5NGTH","title":"IDENTIFYING RISK FACTORS FOR MULTIPLE RE-DO REPAIRS IN HYPOSPADIAS PATIENTS WITH COMPLICATION: A SINGLE INSTITUTION REVIEW OF 806 PATIENTS","abstract":"","doi":"10.1097/01.JU.0001008752.72292.d7.05","pmid":"","date":"2024 MAY","journal":"JOURNAL OF UROLOGY","authors":"Godlewski KF; Mittal S; Hyacinthe N; Fischer K; Johnson M; Van Batavia J; Weiss D; Srinivasan A; Shukla A; Kolon T; Zaontz M; Long C","item_type":"journalArticle","volume":"211","issue":"5S","pages":"","issn":"0022-5347 1527-3792","isbn":"","url":""},"URT8PMUR":{"key":"URT8PMUR","record_id":"R-URT8PMUR","title":"Risk factors affecting post-pubertal high serum follicle-stimulating hormone in patients with hypospadias.","abstract":"Purpose: The factors affecting spermatogenesis in adulthood in patients with hypospadias (HS) are not clearly understood. In the present study, risk factors affecting post-pubertal high serum follicle-stimulating hormone (FSH) were evaluated in patients with HS. Materials and methods: Among those with a history of HS surgery, patients in whom endocrinological evaluation regarding pituitary–gonadal axis was performed at 15 years of age or older between March 2004 and April 2018 were enrolled in the present study. High serum FSH was defined as greater than 10 mIU/ml. The severity of HS was divided into mild and severe. Factors affecting the post-pubertal high serum FSH were estimated. Results: Seventy-nine patients were included in the present study. The severity of HS was mild in 35 and severe in 44. History of undescended testis (UDT) was confirmed in 12. High serum FSH was detected in nine. On logistic regression model analysis, a history of UDT was the only significant factor for high serum FSH. The incidence of high serum FSH in patients with UDT was significantly higher than that in those without UDT (58.3% vs 7.5%, p \u003c 0.01). When stratified by severity of HS and the presence of UDT, high serum FSH was detected in 70% in patients with severe HS and UDT, whereas less than 10% in other groups. Conclusions: A history of UDT was a significant factor for post-pubertal high serum FSH in patients with HS. Accordingly, the presence of UDT may be a marker for impaired spermatogenesis in patients with HS, especially in severe cases. © 2019, The Author(s).","doi":"10.1007/s00345-019-02687-w","pmid":"","date":"2019","journal":"World Journal of Urology","authors":"Kimihiko Moriya; Michiko Nakamura; Masafumi Kon; Yoko Nishimura; Yukiko Kanno; Takeya Kitta; Nobuo Shinohara","item_type":"journalArticle","volume":"37","issue":"12","pages":"2795-2799","issn":"07244983 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85062631807?origin=resultslist"},"US2S9F36":{"key":"US2S9F36","record_id":"R-US2S9F36","title":"Initial experience with 'inverted U' staged buccal mucosa graft (bracka) for hypospadias repair","abstract":"Objective: To describe a modification of the Bracka procedure ('inverted U'), used to enlarge the graft and diminish the risk of graft contracture compromising the subsequent urethral reconstruction. Material and methods: Inverted U Bracka procedure was performed in 10 children in whom previous hypospadias correction had failed. The surgical steps are identical to the original Bracka procedure. The only modification is reconfiguration to enlarge the graft. Results: Significant contraction of the graft was not seen in any patient and the second stage was performed uneventfully. After the second surgery there were two complications: one fistula and one wound infection. Conclusion: In this preliminary study, the modification avoided significant contracture of the graft giving a more predictable size of the neourethra for the second-stage procedure. An amplified series is necessary to confirm this initial result. © 2008 Journal of Pediatric Urology Company.","doi":"10.1016/j.jpurol.2008.09.005","pmid":"","date":"2009","journal":"Journal of Pediatric Urology","authors":"Barroso Jr. U.; Macedo Jr. A.","item_type":"journalArticle","volume":"5","issue":"2","pages":"90-92","issn":"14775131 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/62549102437?origin=resultslist"},"USLNFKAH":{"key":"USLNFKAH","record_id":"R-USLNFKAH","title":"Medium- and long-term outcomes of tunneled labial mucosa tube grafts for the repair of primary severe hypospadias and failed hypospadias.","abstract":"OBJECTIVE: This study aimed to evaluate the medium and long-term outcomes of tunneled labial mucosa tube graft urethroplasty in the treatment of primary  severe hypospadias and failed hypospadias. METHODS: We retrospectively reviewed  the medical records of the patients who underwent tunneled labial mucosa tube  graft urethroplasty at a single center between 2007 and 2020. Data collected  included patient demographic, operative and post-operative characteristics. The  surgical procedure was performed in two stages. Binary logistic regression model  was used to identify risk factors for postoperative complication. RESULTS: A  total of 82 patients who were followed for at least 12 months were included in  this study. Among these, 56 patients received primary repair, while 26 had  previously undergone failed reconstruction. The mean age at surgery was 5.0  years. Postoperative urinary fistula occurred in 36 patients, with 24 requiring  surgical repair and 12 resolving spontaneously. Urethral stricture developed in  26 patients, with 20 undergoing surgical intervention and 6 managed with urethral  dilation. Preoperative surgical history was identified as an independent risk  factor for postoperative complications (p=0.015). CONCLUSIONS: Although the  complication rate associated with tunneled labial mucosa tube graft urethroplasty  is relatively high compared with other techniques, it remains a viable option for  patients with insufficient replacement materials, particularly for primary severe  hypospadias. For cases of failed hypospadias repair, this procedure should be  considered selectively based on patient-specific factors.","doi":"10.1136/wjps-2024-000976","pmid":"40046634","date":"2025","journal":"World journal of pediatric surgery","authors":"Wang Hengyou; Yan Xiang; Chen Guangjie; Tao Chang; Wu Dehua; Ru Wei; Tang Daxing","item_type":"journalArticle","volume":"8","issue":"1","pages":"e000976","issn":"2516-5410 2096-6938","isbn":"","url":""},"V297SPR3":{"key":"V297SPR3","record_id":"R-V297SPR3","title":"Proximal Hypospadias and Acquired Cryptorchidism: Incidence, Morphology and Potential Clinical Implications.","abstract":"PURPOSE: We identified the incidence of acquired cryptorchidism among patients with proximal and mid shaft hypospadias, predictors of acquired cryptorchidism,  and the prevalence of testis-epididymis nonfusion with ascended testes. We  hypothesized that proximal hypospadias would be associated with higher incidence  of acquired cryptorchidism than mid shaft hypospadias, and that ascended testes  would exhibit increased prevalence of testis-epididymis nonfusion similar to  anatomical findings in an undescended testis. MATERIALS AND METHODS: A  retrospective cohort study of patients who underwent primary proximal and mid  shaft hypospadias repair from 2010 to 2016 was conducted. Clinical and operative  notes were reviewed. Patients with congenitally undescended testes or differences  of sex development were excluded. RESULTS: A total of 175 patients were  identified. Those with proximal hypospadias (14/104, 13%) were more likely than  those with mid shaft hypospadias (1/71, 1%) to develop acquired cryptorchidism  (p=0.04). Among proximal hypospadias patients, increased risk of acquired  cryptorchidism was associated with pre-term birth (p \u003c0.01) and penoscrotal  transposition (p=0.01) but not with testis position on initial examination (p  >0.99). In the 14 proximal hypospadias patients with acquired cryptorchidism, 21  ascended testes underwent orchiopexy. Operative notes adequately described  testis-epididymis anatomy for 8/21 ascended testes. Testis-epididymis nonfusion  was described in 6/8 ascended testes. CONCLUSIONS: Risk of acquired  cryptorchidism is increased among patients with proximal hypospadias. Operative  notes revealed a high rate of epididymal nonfusion with ascended testes,  suggesting these testes morphologically resemble undescended testes. Close  followup of testis position is needed in these patients, and the threshold to  perform orchiopexy may need to be lower in select patients.","doi":"10.1097/JU.0000000000001944","pmid":"34251872","date":"2021 Nov","journal":"The Journal of urology","authors":"D'Oro Anthony; Rosoklija Ilina; Yerkes Elizabeth B.; Lindgren Bruce W.; Rychlik Karen; Cheng Earl Y.","item_type":"journalArticle","volume":"206","issue":"5","pages":"1291-1299","issn":"1527-3792 0022-5347","isbn":"","url":""},"V7NLFZN7":{"key":"V7NLFZN7","record_id":"R-V7NLFZN7","title":"Preliminary experience with the use of acellular collagen matrix in redo surgery for urethrocutaneous fistula.","abstract":"OBJECTIVE To show that splinting of the urethral repair with acellular collagen matrix is a safe and useful adjunct in the procedure to manage complex urethrocutaneous fistula. Urethrocutaneous fistula is one of the most common complications of hypospadias surgery. Management of persistent urethrocutaneous fistula is challenging because it is complicated by a lack of or poor quality of tissues at the site of repair.\n   METHODS Between 2006 and 2011, 12 boys underwent urethrocutaneous fistula repair (10) or redo urethroplasty (2) using acellular collagen matrix by a single surgeon. Mean age was 6.8 years (range 3.1-14.8); median follow-up was 2.5 years (range 0.4-3.8). Urethrocutaneous fistula was closed and acellular collagen matrix was used as a splint. All the patients were assessed by an independent observer; all boys were successfully treated with no further recurrence of fistula.\n   RESULTS On palpation, the previous site of the acellular collagen matrix implant was soft and subtle, revealing healthy underlying tissues. Cosmetic outcome was excellent in all patients, with no signs of scarring or tethering. All patients had a single good urinary stream. Uroflows were within normal range of age-matched standardized nomograms with nonobstructive bell-shaped curves. One boy had late wound infection, which healed with debridement, but had no recurrence of fistula.\n   CONCLUSION Splinting of the urethral repair with acellular collagen matrix in redo surgery is safe and is a useful adjunct that effectively prevents further recurrence of complications such as urethrocutaneous fistula. UROLOGY 80: 1156-1160, 2012. (C) 2012 Elsevier Inc.","doi":"10.1016/j.urology.2012.06.058","pmid":"","date":"2012","journal":"Urology","authors":"Springer Alexander; Subramaniam Ramnath","item_type":"journalArticle","volume":"80","issue":"5","pages":"1156-1160","issn":"15279995 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84868198045?origin=resultslist"},"V9WELWKG":{"key":"V9WELWKG","record_id":"R-V9WELWKG","title":"尿道板离断尿道成形术后尿道狭窄危险因素分析","abstract":"目的探讨并分析尿道板离断尿道成形术矫治尿道下裂后出现尿道狭窄的危险因素, 寻求更合适的手术策略。方法回顾性分析2008年2月至2017年10月在浙江大学医学院附属儿童医院泌尿外科行尿道板离断尿道成形术治疗初发尿道下裂患儿资料共429例。患儿手术年龄0.3～17.5岁, 平均年龄2.9岁。阴茎阴囊型349例(81.4%), 会阴型80例(18.6%)。高年资医生主刀340例(79.3%), 低年资医生主刀89例(20.7%)。行Duckett术式269例(62.7%), 行分期带蒂皮瓣尿道成形术式98例(22.8%), 行分期隧道式口腔黏膜卷管尿道成形术式62例(14.5%)。结果术后随访14～125个月, 中位随访时间64个月。不同年资医生在手术年龄、尿道下裂类型及手术策略的选择上均存在较大差异。术后出现尿道并发症共173例(40.3%), 其中尿道狭窄57例(13.3%)。低年资医生组中, Duckett术的尿道狭窄发生率为23.1%, 分期带蒂皮瓣尿道成形术后尿道狭窄发生率为5.6%;相较于Duckett术式, 分期带蒂皮瓣尿道成形术具有更低的术后尿道狭窄风险(OR 0.185, 95%CI 0.038～0.902, P0.05)。高年资医生组中, Duckett术的尿道狭窄发生率为10.1%, 分期带蒂皮瓣尿道成形术的尿道狭窄发生率为8.1%, 分期隧道式口腔黏膜卷管尿道成形术后尿道狭窄发生率为24.6%;相较于Duckett术式, 分期隧道式口腔黏膜卷管尿道成形术具有更高的术后尿道狭窄风险(OR 2.726, 95%CI 1.185～6.268, P0.05), 分期带蒂皮瓣尿道成形术无明显优势。各组中手术年龄、尿道下裂类型与术后尿道狭窄均无关。结论需尿道板离断的重度尿道下裂的术式选择需按照医生经验而定。分期带蒂皮瓣尿道成形术适合于缺乏经验的低年资医生, 但对于有经验的高年资医生而言并无显著优势。","doi":"10.3760/cma.j.issn.0253-3006.2019.11.005","pmid":"","date":"2019","journal":"中华小儿外科杂志","authors":"茹伟; 徐哲明; 沈一丁; 王恒友; 诸林峰; 唐达星","item_type":"journalArticle","volume":"40","issue":"11","pages":"976-980","issn":"0253-3006","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORINeHJ3azIwMTkxMTAwNRoIcmI2eDJhNGE%3D"},"VA3L4JM5":{"key":"VA3L4JM5","record_id":"R-VA3L4JM5","title":"Letter to the Editor re: “Evaluating the utility of ChatGPT in enhancing parental education and clinical support in hypospadias care”","abstract":"","doi":"10.1016/j.jpurol.2026.105724","pmid":"","date":"2026","journal":"Journal of Pediatric Urology","authors":"Giudice L.; Granieri S.; Galassi S.; De Santis S.; Pastore E.P.","item_type":"journalArticle","volume":"22","issue":"2","pages":"","issn":"1873-4898","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L2042709183&from=export"},"VB7828TT":{"key":"VB7828TT","record_id":"R-VB7828TT","title":"Initial experience with 'inverted U' staged buccal mucosa graft (bracka) for hypospadias repair.","abstract":"Objective: To describe a modification of the Bracka procedure ('inverted U'), used to enlarge the graft and diminish the risk of graft contracture compromising the subsequent urethral reconstruction.\n   Material and methods: Inverted U Bracka procedure was performed in 10 children in whom previous hypospadias correction had failed. The surgical steps are identical to the original Bracka procedure. The only modification is reconfiguration to enlarge the graft.\n   Results: Significant contraction of the graft was not seen in any patient and the second stage was performed uneventfully. After the second surgery there were two complications: one fistula and one wound infection.\n   Conclusion: In this preliminary study, the modification avoided significant contracture of the graft giving a more predictable size of the neourethra for the second-stage procedure. An amplified series is necessary to confirm this initial result. (C) 2008 Journal of Pediatric Urology Company. Published by Elsevier Ltd. All rights reserved.","doi":"10.1016/j.jpurol.2008.09.005","pmid":"18996051","date":"2009 Apr","journal":"Journal of pediatric urology","authors":"Barroso Ubirajara Jr; Macedo Antonio Jr","item_type":"journalArticle","volume":"5","issue":"2","pages":"90-92","issn":"1873-4898 1477-5131","isbn":"","url":""},"VC2VV68B":{"key":"VC2VV68B","record_id":"R-VC2VV68B","title":"Melanosis of the urinary bladder","abstract":"Melanosis bladder refers to the urothelium of the bladder appearing black and velvety, with microscopic evaluation describing melanin deposition. Risk factors, pathogenesis and clinical implications are unknown because only sporadic cases are reported in the literature, both with and without the presence of urinary tract symptoms or malignancy. We report a case of melanosis bladder in a male patient with voiding urinary symptoms and an untreated hypospadias. © 2023 Royal College of Surgeons of England. All rights reserved.","doi":"10.1308/rcsann.2022.0013","pmid":"","date":"2023","journal":"Annals of the Royal College of Surgeons of England","authors":"Raghallaigh H.N.; Pineda-Turner A.; Mather K.; Chetwood A.","item_type":"journalArticle","volume":"105","issue":"4","pages":"387-388","issn":"00358843 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85151574321?origin=resultslist"},"VEHDD7LN":{"key":"VEHDD7LN","record_id":"R-VEHDD7LN","title":"Genital Anomalies and Risk for Testicular Cancer in Danish Men","abstract":"In a cohort of Danish boys characterized by (1) being born between 1941 and 1957, (2) having attended schools in a defined area of Denmark, and (3) having a school health record available, 183 were registered in the Danish Cancer Registry with testicular cancer diagnosed before January I, 1985. We selected 366 age- and sex-matched controls from the same cohort. Using information recorded by school physicians, we performed logistic regression analyses to estimate the relative risks (RR) associated with various genital anomalies.We found the risk for testicular cancer to be raised for men with a history of cryptorchidism [RR = 5.2; 95&percnt; confidence interval (CI) = 2.1&ndash;13.0], inguinal hernia (RR = 1.8; 95&percnt; CI = 0.9&ndash;3.7), hypospadias (RR = 4.2; 95&percnt; CI = 0.4&ndash;42.7), and hydrocele (RR = 2.4; 95&percnt; CI = 0.6&ndash;9.0). We observed no decrease in the risk associated with cryptorchidism after correction of the maldescent in early childhood. The RR of testicular cancer in the contralateral, normally descended testis in unilateral cryptorchid men was increased to 3.6. The results add to the growing evidence for a common causal factor for both testicular cancer and cryptorchidism and support the findings from other studies of associations between other genital anomalies involving the closure of the processus vaginalis and the risk of testicular cancer.","doi":"","pmid":"","date":"1996","journal":"Epidemiology","authors":"Anne; Prener Gerda; Engholm Ole","item_type":"journalArticle","volume":"7","issue":"1","pages":"14-19","issn":"1044-3983","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIGM3NmJkODlhN2U0NTRlNWI3OWM3NTMxMDk3MTFkODAzGghyYjZ4MmE0YQ%3D%3D"},"VF3I6Q8P":{"key":"VF3I6Q8P","record_id":"R-VF3I6Q8P","title":"Methylphenidate in pregnancy: A multicenter, prospective, comparative, observational study","abstract":"Introduction: Methylphenidate is a central nervous system stimulant medicinally used in the treatment of attention-deficit disorder with or without hyperactivity (ADD/ADHD). Data on its use in human pregnancy are limited. The primary objective of the study was to evaluate the risk of major congenital anomalies after pregnancy exposure to methylphenidate for medical indications. Methods: In a prospective, comparative, multicenter observational study performed in 4 participating Teratology Information Services (in Jerusalem, Berlin, Newcastle upon Tyne, and Toronto) between 1996 and 2013, methylphenidateexposed pregnancies were compared with pregnancies counseled for nonteratogenic exposure (NTE) after matching by maternal age, gestational age, and year at initial contact. Results: 382 methylphenidate-exposed pregnancies (89.5% in the first trimester) were followed up. The overall rate of major congenital anomalies was similar between the groups (10/309 = 3.2% [methylphenidate] vs 13/358 = 3.6% [NTE], P = .780). The rates of major congenital anomalies (6/247 = 2.4% [methylphenidate] vs 12/358 = 3.4% [NTE], P = .511) and cardiovascular anomalies (2/247 = 0.8% [methylphenidate] vs 3/358 = 0.8% [NTE], P = .970) were also similar after exclusion of genetic or cytogenetic anomalies and limiting methylphenidate exposure to the period of organogenesis (weeks 4-13 after the last menstrual period). There was a higher rate of miscarriages and elective terminations of pregnancy in the methylphenidate group. Significant predictors for the miscarriages using Cox proportional hazards model were methylphenidate exposure (adjusted hazard ratio [HR] = 1.98; 95% CI, 1.23-3.20; P = .005) and past miscarriage (adjusted HR = 1.35; 95% CI, 1.18-1.55; P \u003c .001). Conclusions: The present study suggests that methylphenidate does not seem to increase the risk for major malformations. Further studies are required to establish its pregnancy safety and its possible association with miscarriages.","doi":"10.4088/JCP.15m10083","pmid":"","date":"2016","journal":"Journal of Clinical Psychiatry","authors":"Diav-Citrin O.; Shechtman S.; Arnon J.; Wajnberg R.; Borisch C.; Beck E.; Richardson J.L.; Bozzo P.; Nulman I.; Ornoy A.","item_type":"journalArticle","volume":"77","issue":"9","pages":"1176-1181","issn":"0160-6689","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L612499136&from=export"},"VGFJ8Z9M":{"key":"VGFJ8Z9M","record_id":"R-VGFJ8Z9M","title":"尿道下裂的影响因素分析","abstract":"目的 探讨尿道下裂的影响因素.方法 选取2015年9月—2016年9月在郑州大学第三附属医院出生或就诊的尿道下裂患儿220例作为病例组,同期选取健康新生儿或非泌尿生殖系统疾病患儿220例作为对照组,采用多因素Logistic回归分析的方法,分析尿道下裂及Ⅰ、 Ⅱ 、 Ⅲ 、 Ⅳ 型尿道下裂的危险因素.结果 多因素Logistic回归分析显示,尿道下裂的危险因素有不足月、胎儿生长受限、母亲居住地为农村、母亲妊娠年龄、母亲初次生产、母亲孕期吸烟与被动吸烟、母亲孕期服用孕激素、母亲孕期发生上呼吸道感染及发热、母亲孕早期高温暴露,保护因素有母亲孕早期补充蛋白质(P\u003c0.05).Ⅰ型尿道下裂的危险因素有母亲妊娠年龄,保护因素有母亲孕早期补充蛋白质(P\u003c0.05).Ⅱ 型尿道下裂的危险因素有不足月、胎儿生长受限、母亲居住地为农村、母亲初次生产、母亲孕期吸烟与被动吸烟,保护因素有母亲孕早期补充蛋白质(P\u003c0.05).Ⅲ 型尿道下裂的危险因素有不足月、胎儿生长受限、母亲居住地为农村、母亲初次生产、母亲孕期吸烟与被动吸烟,保护因素有母亲孕早期补充蛋白质(P\u003c0.05).Ⅳ 型尿道下裂的危险因素有母亲孕期吸烟与被动吸烟、母亲孕期服用孕激素(P\u003c0.05).结论 不同类型尿道下裂受多种因素影响,母亲孕期应避免不良生活习惯、少用激素类药物,孕早期补充蛋白质对预防胎儿发生尿道下裂有重要意义.","doi":"10.3969/j.issn.1007-9572.2017.00.218","pmid":"","date":"2018","journal":"中国全科医学","authors":"封全灵; 王文娟","item_type":"journalArticle","volume":"21","issue":"3","pages":"289-295","issn":"1007-9572","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIPemdxa3l4MjAxODAzMDEwGghyYjZ4MmE0YQ%3D%3D"},"VHY9CH67":{"key":"VHY9CH67","record_id":"R-VHY9CH67","title":"Association between SNP12 in estrogen receptor α gene and hypospadias: a systematic review and meta-analysis.","abstract":"To investigate the association between single nucleotide polymorphism 12 in estrogen receptor α gene and hypospadias, four databases (PubMed, Web of Science, Embase and Cochrane Library) were electronically searched by 2nd November 2015. Finally, four studies were included for our meta-analysis, involving 1379 cases and 1648 controls. A quality assessment was performed using the Newcastle–Ottawa Scale of case–control study. Meta-analysis and publication bias measuring were all done by Stata 12.0. No significant publication bias (PBegg = 0.296, PEgger = 0.161) was found. Overall, there was statistically significant association for recessive genetic model (AA vs. GA + GG: OR 3.45, 95 % CI [1.89, 6.30], P = 0.038). Moreover, the positive result was confirmed using trial sequential analysis even only three original studies. For allele model, there was also statistically significant association (allele A vs. G: OR 1.43, 95 % CI [1.23, 1.67], P = 0.034). Meanwhile, A allele as a risk factor turned out to be true positive by trial sequential analysis. In a word, this meta-analysis suggested that the single nucleotide polymorphism 12 definitely increase the risk of hypospadias. © 2016, The Author(s).","doi":"10.1186/s40064-016-2288-0","pmid":"","date":"2016","journal":"SpringerPlus","authors":"Deng Changkai; Dai Rong; Li Xuliang; Liu Feng","item_type":"journalArticle","volume":"5","issue":"1","pages":"587","issn":"21931801 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/84969916304?origin=resultslist"},"VLVBD9F6":{"key":"VLVBD9F6","record_id":"R-VLVBD9F6","title":"DSD: Variations in sex development and in gender identity: Long-term outcome of early surgical intervention for hypospadias; What happens at Puberty?","abstract":"Hypospadias (HS) is one of the most common congenital anomalies in male children. The goal of HS surgery is reconstructing the urethra to the tip of the glans and straightening the penis. Successful HS surgery ensures a cosmetic penile appearance, voiding in the standing position and unhampered sexual function in adulthood. Despite great surgical interest in short-term results, there are only a few studies regarding the long-term outcome. In this lecture, I will present a long term outcome of HS surgery, focusing on the cosmetic and endocrinological outcome at puberty from our long-term outcome study. As a first study, to clarify the cosmetic and sexual outcome, a questionnaire was mailed to HS patients and control subjects at 18 years old or older. This study demonstrated that although their sexual behavior was not different from that in control subjects, HS patients had a higher rate of dissatisfaction with smaller penile size. Following the outcome of the questionnaire study, actual penile length of HS patients was evaluated. As a result, while the severity of HS and endocrinological abnormality at post-pubertal evaluation were factors affecting penile size, penile length in patients with severe HS was shorter even in cases without endocrinological abnormality. These results suggest that severe HS is not only a disorder of urethral development, but also a disorder of penile development. A multifactorial etiology is considered to be involved in the genesis of HS. Among them, androgen actions have an important role for urethral development during fetal period. Several studies have shown a prepubertal hormonal abnormality in patients with HS from the endocrinological viewpoint. However, reports of hormonal status in HS patients at puberty are scarce. Therefore, we retrospectively reviewed endocrinological status at puberty. Endocrinological abnormality was identified in patients with mild as well as severe HS. While severity of HS did not affected the incidence of high serum FSH, history of the undescended testis was a risk factor for high serum FSH at post-pubertal evaluation. In conclusion, penile size, which is most dissatisfied issue from the patients' view point at puberty, is affected by severity of HS. In addition, history of undescended testis is an important issue from the endocrinological view point, especially on reproductive function. Since both testicular descent and urethral formation are influenced by androgen action, coexistence of these pathology would be a severe form in the spectrum of male genital anomaly form the reproductive view point.","doi":"10.1186/s13633-017-0054-x","pmid":"","date":"2017","journal":"International Journal of Pediatric Endocrinology","authors":"Moriya K.","item_type":"journalArticle","volume":"2017","issue":"(Moriya K.) Department of Renal and Genitourinary Surgery, Hokkaido University, Japan","pages":"","issn":"1687-9856","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L620748889&from=export"},"VN2KTI8J":{"key":"VN2KTI8J","record_id":"R-VN2KTI8J","title":"尿道下裂横裁带蒂包皮岛状皮瓣尿道成形术后近期并发症的危险因素分析","abstract":"目的:探讨尿道下裂横裁带蒂包皮岛状皮瓣尿道成形术(Duckett术式)后发生近期并发症的危险因素，以期提高尿道下裂的治疗效果。方法:回顾性分析2018年12月至2019年12月首都医科大学附属北京儿童医院收治的首诊尿道下裂且手术方式为Duckett术式、分期Duckett术式或Duckett+Duplay术式患儿的临床资料以及近期随访结果，收集术后近期尿道瘘、尿道狭窄、尿道憩室等并发症情况。采用Logistic回归分析术后并发症的影响因素。结果:符合病例纳入标准的患儿共220例，按实施手术方式的不同分为：Duckett术式组172例，Duckett+Duplay术式组20例，分期Duckett术式组28例。三组平均随访时间19个月，获随访208例，随访率94.5%。发生并发症103例(103/208，49.5%)，其中尿道瘘58例(58/103，27.9%)、尿道狭窄29例(29/103，13.9%)、尿道憩室样扩张34例(34/103.16.3%)、阴茎下弯复发/残留3例(3/103，1.4%)。对Duckett术式组进行单因素分析发现，尿道缺损长度( P＝0.048)、横裁带蒂包皮岛状皮瓣长度( P＝0.034)、矫正阴茎下弯后尿道开口位置( P＝0.027)是Duckett术式术后并发症的影响因素。而手术时年龄、阴茎长度、阴茎头长度及宽度、包皮形态、皮瓣平整度及弹性、包皮浅层血管分布与术后并发症无关( P>0.05)。多因素Logistic回归分析结果显示，尿道缺损长度( OR＝1.858，95% CI：1.053~3.277)是Duckett术式术后并发症的独立影响因素( P＝0.032)。 结论:重度尿道下裂手术治疗难度大，术后并发症发生率高。尿道缺损长度是Duckett术式发生并发症的重要影响因素。当尿道下裂患者阴茎条件差时，可行分期手术，以降低手术难度以及术后并发症发生率。","doi":"10.3760/cma.j.cn.101785-202107006-004","pmid":"","date":"2022","journal":"临床小儿外科杂志","authors":"方一圩; 宋宏程; 孙宁; 张潍平; 田军; 李明磊; 李宁; 屈彦超; 韩文文; 杨洋; 梁海燕; 王冠男; 李振武","item_type":"journalArticle","volume":"21","issue":"1","pages":"18-23","issn":"1671-6353","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiBQZXJpb2RpY2FsQ0hJU29scjkyMDI2MDkxNTE0MjIxORIRbGN4ZXdrenoyMDIyMDEwMDQaCHJiNngyYTRh"},"VPXSMEXG":{"key":"VPXSMEXG","record_id":"R-VPXSMEXG","title":"The association between prenatal exposure to dichlorodiphenyltrichloroethane(DDT) or polychlorinated biphenyls (PCBs) and the risk of congenital anomalies: A meta analysis","abstract":"Objective To systematically review the association between prenatal exposure to dichlorodiphenyltrichloroethane (DDT) or polychlorinated biphenyls (PCBs) and the risk of congenital anomalies. Methods PubMed, EMbase, WanFang Data, VIP and CNKI databases were electronically searched to collect casecontrol studies on the relationship between prenatal exposure to DDT or PCBs and congenital anomalies from inception to February 2017. Two reviewers independently screened literature, extracted data and assessed the risk of bias of included studies, then, meta-analysis was performed by using Stata 13.0 software. Results A total of 14 studies involving 2 238 infants with defect and 2 335 infants without defect were included. The results of meta-analysis showed that: the prenatal exposure to high level of DDT increased the incidence of cryptorchidism (OR=1.12, 95% CI 1.09 to 1.15, P\u003c0.001). However, DDT exposure had no correlation to hypospadias and neural tube defects. The associations between prenatal exposure to PCBs and cryptorchidism, hypospadias, neural tube defects were not discovered. Conclusion Prenatal exposure to high levels of DDT may be a risk factor for cryptorchidism. Due to limited quality and quantity of the included studies, more high-quality studies are needed to verify above conclusion. © 2018, West China University of Medical Science. All rights reserved.","doi":"10.7507/1672-2531.201707129","pmid":"","date":"2018","journal":"Chinese Journal of Evidence-Based Medicine","authors":"Lin Y.; Zhang X.; He J.; Zhao B.; Lai Z.; Zhao Z.; Yu X.; Chen J.; Lin X.; Su Y.; Liu G.","item_type":"journalArticle","volume":"18","issue":"4","pages":"365-372","issn":"16722531 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85050775247?origin=resultslist"},"VQ3NFV7Q":{"key":"VQ3NFV7Q","record_id":"R-VQ3NFV7Q","title":"Risk factors for postoperative complications of hypospadias: a multi-center clinical trial","abstract":"Objective To analyze the anatomical data of multi-center hypospadias and postoperative follow-up results to grasp the current status of diagnosing and treating hypospadias in China and examine the influencing factors of postoperative complications of hypospadias. Methods From December 2018 to December 2019, clinical data were reviewed for children with hypospadias hospitalized with complete follow-up data at 15 children's medical centers. Surgical options and influencing factors of postoperative complications were examined. In univariate analysis, Mann-Whitney U test was utilized for comparing measurement data not in a normal distribution and Chi-square test for processing counting data. The influencing single factors of P\u003c0.05 were included for multivariate Logistic analysis and OR value and 95% CI calculated. Area under the curve (AUC) of receiver operating characteristic curve (ROC) was utilized for testing the capability of urethral defect length for distinguishing postoperative complications of hypospadias. Optimal critical value was determined according to the Youden index. Results A total of 1011 cases fulfilled the criteria of admission and discharge. According to Barcat classification, the clinical types were distal (n; 248), intermediate (n; 214) and proximal (n; 549). In tubularized incised plate urethroplasty (TIP) group, 336 cases developed 84 complications with a complication rate of 25.0% (84/336), including urethral fistula (15. 8%, 53/336), urethral stricture (8. 6%, 29/336) and urethral diverticulum (0. 9%, 3/336). Penile head width, plate width of urethral scaphoid fossa and plate width after longitudinal incision were the risk factors for postoperative complications of TIP; Operative age, penile length, penile head length, urethra defect length and flatness/elasticity of urethral plate were not the risk factors. Multivariate Logistic analysis indicated that urethral plate width after longitudinal incision (OR; 0. 836»95% CI; 0.742-0.942) and penile head width (OR; 0. 851, 95%CI:0. 749-0. 965) were independent risk factors for postoperative complications of TIP (P; 0.003, P; 0.012). According to the ROC curve of urethral plate width after longitudinal incision (AUC; 0. 649, P\u003c0.001), there was a critical value of 11.5 mm for maximal Yoden index. For ROC curve of penile head width (AUC; 0. 630, P\u003c0.001), there was a critical value of 15. 5 mm. In transverse preputial island flap urethroplasty (Duckett) group, there were 192 complications (51. 2%, 192/375), 130 urethral fistula (34. 7%, 130/375), 52 urethral stricture (13. 9%, 52/375) and 54 urethral diverticular dilation (14. 4%, 54/375). Univariate analysis showed that length of urethra defect, length of skin island flap, number of curvature under penis and elasticity/smoothness of prepuce flap were the risk factors for complications after Duckett operation. However, age, penile length, penile head length/width, prepuce shape and superficial vascular distribution were not risk factors for complications post-Duckett. Multivariate Logistic analysis revealed that length of skin island flap (OR; 3. 506, 95% CI: 2. 258-5. 442, P\u003c0.001) was an independent risk factor for complications post-Duckett. For ROC curve of length of skin island flap (AUC; 0. 709, P\u003c0.001), there was a critical value of 3. 35 cm. Conclusions Different types of hypospadias should be operated in individualized ways. The width of urethral plate and penile head are risk factors for postoperative complications of TIP. And length of skin island flap is a risk factor for complications post-Duckett. © Chinese Journal of Pediatric Surgery. All rights reserved.","doi":"10.3760/cma.j.cn421158-20211108-00540","pmid":"","date":"2023","journal":"Chinese Journal of Pediatric Surgery","authors":"Fang Y.; Sorig H.; Sun N.; Zhang W.; Tang Y.; Wang X.; Huang L.; Zeng L.; Yang Y.; Liu X.; Chao M.; Zhang Y.; Ma H.; Liu H.; Zhang J.; Kang L.; Zhang X.; Meng Q.; Li S.; Xie J.; Zhou X.; Li N.; Chen C.; Su C.; He D.; Liu X.; Wu W.; Tang J.; Xie H.; Wu M.; Guan Y.; Wang X.","item_type":"journalArticle","volume":"44","issue":"4","pages":"329-337","issn":"02533006 (ISSN)","isbn":"","url":"https://www.scopus.com/pages/publications/85167724070?origin=resultslist"},"VV5TV7IF":{"key":"VV5TV7IF","record_id":"R-VV5TV7IF","title":"Psychosocial Adjustment, Health-Related Quality of Life, and Psychosexual Development of Boys with Hypospadias: A Systematic Review","abstract":"Objective A systematic review of studies on psychosocial adjustment, HRQoL (health-related quality of life), and psychosexual development of boys with hypospadias. Methods Research was conducted on several online bibliographic databases. Articles were selected on the basis of predefined criteria. Methodological quality was assessed by two independent reviewers who applied a standardized checklist. When possible, data analyses were performed by calculating effect sizes. Results Thirteen studies met the criteria for inclusion, whose methodological standard ranged from low to high quality. None of them has focused on HRQoL. Findings with regard to psychosocial and psychosexual adjustment were inconsistent, though they clearly showed that boys with hypospadias suffer from negative genital appraisal and sexual inhibitions. Overall, medical factors exerted a rather small influence. Psychosocial risk factors have hardly been examined so far. Conclusions The identification of psychosocial risk factors in methodologically sound studies is necessary to guarantee a comprehensive treatment for boys with hypospadias.","doi":"10.1093/jpepsy/jsm098","pmid":"","date":"2007","journal":"Journal of Pediatric Psychology","authors":"","item_type":"journalArticle","volume":"","issue":"","pages":"","issn":"","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISFEhpZ2hXaXJlMDAwMDA1NzQ2Mzk5GghyYjZ4MmE0YQ%3D%3D"},"VVWXMS5Z":{"key":"VVWXMS5Z","record_id":"R-VVWXMS5Z","title":"Preliminary Experience With the Use of Acellular Collagen Matrix in Redo Surgery for Urethrocutaneous Fistula","abstract":"To show that splinting of the urethral repair with acellular collagen matrix is a safe and useful adjunct in the procedure to manage complex urethrocutaneous fistula. Urethrocutaneous fistula is one of the most common complications of hypospadias surgery. Management of persistent urethrocutaneous fistula is challenging because it is complicated by a lack of or poor quality of tissues at the site of repair.Between 2006 and 2011, 12 boys underwent urethrocutaneous fistula repair (10) or redo urethroplasty (2) using acellular collagen matrix by a single surgeon. Mean age was 6.8 years (range 3.1-14-8); median follow-up was 2.5 years (range 0.4-3.8). Urethrocutaneous fistula was closed and acellular collagen matrix was used as a splint. All the patients were assessed by an independent observer; all boys were successfully treated with no further recurrence of fistula. On palpation, the previous site of the acellular collagen matrix implant was soft and subtle, revealihg healthy underlying tissues. Cosmetic outcome was excellent in all patients, with no signs of scarring or tethering. All patients had a single good urinary stream. Uroflows were within normal range of age-matched standardized nomograms with nonobstructive bell-shaped curves. One boy had late wound infection, which healed with debridement, but had no recurrence of fistula.Splinting of the urethral repair with acellular collagen matrix in redo surgery is safe and is a useful adjunct that effectively prevents further recurrence of complications such as urethrocutaneous fistula.","doi":"","pmid":"","date":"2012","journal":"Urology","authors":"Alexer Springer Ramnath Subramaniam","item_type":"journalArticle","volume":"80","issue":"5","pages":"1156-1159","issn":"0090-4295","isbn":"","url":"https://d.wanfangdata.com.cn/periodical/CiRQZXJpb2RpY2FsRU5HTmV3U29scjlTMjAyNjA5MTUxNDMwMzISIDA3Y2FjOWZmNjgyMjdmZjc0NWJmMDNkMjZlNDQyMDNlGghyYjZ4MmE0YQ%3D%3D"},"W29KIGG4":{"key":"W29KIGG4","record_id":"R-W29KIGG4","title":"In utero prednisone exposure affects genital development.","abstract":"PURPOSE: The etiology of the worldwide incidence of hypospadias remains unexplained. Data from the Center for Disease Control suggest that maternal  asthma exposure may be a risk factor. The development of the mouse and human  urethra shows significant similarities, such as fusion of 2 epithelial edges,  closure of a midline epithelial seam and subsequent cellular remodeling, to  justify the use of the mouse as an experimental animal model. Prednisone may act  as a weak androgen directly or alternatively lowering testosterone by  hypothalamic suppression of gonadotropins. We describe the effects of prednisone  on urethral formation in the mouse. MATERIALS AND METHODS: The model comprised  10, 20 and 20 timed pregnant C57/6 mice exposed to 1,000, 200 and 100 mg/kg  prednisone, respectively, on gestational days 12 through 18. The morphology of  the genital tubercles of both sexes were examined on gestational day 19 using  histological techniques and 3-dimensional computer reconstruction. Specific  attention was focused on the developing urethral seam. RESULTS: Microscopic  serial analysis confirmed the presence of an arrest in seam formation in  approximately 25% of male fetuses given supraphysiological doses of prednisone  (1,000 mg/kg). In contrast, acceleration of urethral fold fusion and a longer  urethral tube were observed in those males treated with 100 and 200 mg/kg  prednisone. The female fetuses treated with the same dosages of prednisone did  not show any change at the level of the urethral seam area or in the remainder of  the genital tubercles. CONCLUSIONS: Supraphysiological doses of prednisone  treatment has an inhibitory effect on urethral fold fusion leading to hypospadias  whereas low doses accentuate urethra formation in male mouse fetuses. In mice  lower doses do not cause hypospadias in the males or affect urethral formation in  females.","doi":"10.1097/01.ju.0000139911.56346.1b","pmid":"","date":"2004","journal":"Journal of Urology","authors":"Yucel S.; Desouza A.; Baskin L.S.; Duel B.","item_type":"journalArticle","volume":"172","issue":"4 II","pages":"1725-1730","issn":"0022-5347","isbn":"","url":"https://www-embase-com-443.webvpn.cams.cn/search/results?subaction=viewrecord&id=L39245029&from=export"},"W3VK25HH":{"key":"W3VK25HH","record_id":"R-W3VK25HH","title":"尿道缺损长度对一期Duckett术后并发症发生的预测价值研究及分期手术时机
